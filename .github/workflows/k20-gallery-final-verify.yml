name: Keshavarz20 Gallery Final Verify

on:
  push:
    branches: [main]
    paths:
      - 'gallery-final-verify-ops/*.json'

permissions:
  contents: write

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_gallery_final_verify.py
      - name: Verify Woo gallery arrays
        run: python scripts/k20_gallery_final_verify.py
      - name: Commit verification evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gallery-meta-rescue/woo-verified.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record final gallery Woo verification"
          for attempt in 1 2 3; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
