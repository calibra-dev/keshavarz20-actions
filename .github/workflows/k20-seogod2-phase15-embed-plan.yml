name: K20 SEO God2 Phase15 Embed Plan

on:
  push:
    branches: [main]
    paths:
      - 'phase15-embed-plan-ops/*.json'

permissions:
  contents: write

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/k20_phase15_embed_plan.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase15-publication-results/embed-plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "seo god2 phase15: record watch-page embed plan"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
