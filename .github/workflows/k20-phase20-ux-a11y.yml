name: K20 Phase 20 UX A11y Live Gate

on:
  push:
    branches: [main]
    paths:
      - 'phase20-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase20-ux-a11y-live
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Lighthouse
        run: npm install -g lighthouse
      - name: Resolve live targets
        shell: python
        run: |
          import json
          feed=json.load(open('phase19-results/product-discovery-readiness-feed-persisted.json',encoding='utf-8'))
          product=next((p.get('canonical_url') for p in feed.get('products',[]) if p.get('canonical_url')), 'https://keshavarz20.com/product/')
          targets={
            'home':'https://keshavarz20.com/',
            'product':product,
            'pipe-guide':'https://keshavarz20.com/polyethylene-pipe-size-flow-pressure-guide/',
            'filter-selector':'https://keshavarz20.com/irrigation-filter-selector/',
            'fittings-selector':'https://keshavarz20.com/irrigation-fittings-compatibility-selector/'
          }
          json.dump(targets,open('/tmp/phase20-targets.json','w'),ensure_ascii=False,indent=2)
      - name: Run mobile accessibility render audits
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/phase20-lh
          python - <<'PY' >/tmp/phase20-targets.tsv
          import json
          for k,v in json.load(open('/tmp/phase20-targets.json')).items(): print(k+'\t'+v)
          PY
          while IFS=$'\t' read -r name url; do
            lighthouse "$url" \
              --quiet \
              --output=json \
              --output-path="/tmp/phase20-lh/${name}.json" \
              --only-categories=accessibility \
              --form-factor=mobile \
              --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          done </tmp/phase20-targets.tsv
      - name: Build acceptance evidence and issue manifest
        shell: python
        run: |
          import json,re,html,urllib.request,datetime,os
          from html.parser import HTMLParser
          targets=json.load(open('/tmp/phase20-targets.json'))
          audit_ids=['html-has-lang','document-title','image-alt','button-name','link-name','label','heading-order','landmark-one-main','content-width']
          pages=[]; issues=[]
          class P(HTMLParser):
            def __init__(self):
              super().__init__(); self.h1=0; self.main=0; self.html_attrs={}; self.text=[]; self._h1=False
            def handle_starttag(self,tag,attrs):
              a=dict(attrs)
              if tag=='html': self.html_attrs=a
              if tag=='h1': self.h1+=1; self._h1=True
              if tag=='main' or a.get('role')=='main': self.main+=1
            def handle_endtag(self,tag):
              if tag=='h1': self._h1=False
            def handle_data(self,d): self.text.append(d)
          for name,url in targets.items():
            lh=json.load(open('/tmp/phase20-lh/'+name+'.json'))
            audits={k:{'score':lh.get('audits',{}).get(k,{}).get('score'),'title':lh.get('audits',{}).get(k,{}).get('title')} for k in audit_ids}
            acc=lh.get('categories',{}).get('accessibility',{}).get('score')
            final=lh.get('finalDisplayedUrl') or lh.get('finalUrl') or url
            raw=''; status=None; err=None
            try:
              req=urllib.request.Request(final,headers={'User-Agent':'K20-Phase20-Audit/1.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                status=r.status; raw=r.read().decode('utf-8','replace')
            except Exception as e: err=str(e)
            p=P(); p.feed(raw)
            text=' '.join(x.strip() for x in p.text if x.strip())
            semantics={'h1_count':p.h1,'main_landmarks':p.main,'html_lang':p.html_attrs.get('lang'),'html_dir':p.html_attrs.get('dir'),'raw_text_chars':len(text)}
            key=None
            if name=='product':
              key={
                'price_text_present': bool(re.search(r'تومان|ریال|price',text,re.I)),
                'buy_cta_present': bool(re.search(r'افزودن.{0,20}سبد|خرید|پیش.?فاکتور|استعلام',text,re.I)),
                'stock_text_present': bool(re.search(r'موجود|ناموجود|در انبار|اتمام موجودی',text,re.I)),
                'sku_text_present': bool(re.search(r'SKU|شناسه|کد محصول',text,re.I))
              }
            page={'name':name,'url':url,'final_url':final,'http_status':status,'fetch_error':err,'accessibility_score':acc,'audits':audits,'semantics':semantics,'product_key_data':key}
            pages.append(page)
            if acc is None or acc < 1:
              failed=[k for k,v in audits.items() if v.get('score') not in (1,None)]
              issues.append({'page':name,'severity':'P1','issue':'Automated accessibility score below 1.0','evidence':{'score':acc,'failed_audits':failed}})
            if audits.get('content-width',{}).get('score') not in (1,None): issues.append({'page':name,'severity':'P1','issue':'Mobile content-width/overflow audit failed','evidence':audits.get('content-width')})
            if name=='home' and (p.h1!=1 or p.main<1): issues.append({'page':name,'severity':'P1','issue':'Homepage semantic H1/main gate failed','evidence':semantics})
            if not p.html_attrs.get('lang'): issues.append({'page':name,'severity':'P1','issue':'HTML lang missing','evidence':semantics})
            if len(text)<500: issues.append({'page':name,'severity':'P2','issue':'Server-rendered/no-JS meaningful-content gate failed','evidence':{'raw_text_chars':len(text)}})
            if name=='product' and not all([key['price_text_present'],key['buy_cta_present'],key['stock_text_present']]): issues.append({'page':name,'severity':'P1','issue':'Key product decision data/CTA not all visible in server HTML','evidence':key})
          acceptance={
            'all_live_fetches_ok':all(p['http_status'] and 200<=p['http_status']<400 for p in pages),
            'automated_accessibility_full_score':all(p['accessibility_score']==1 for p in pages),
            'mobile_content_width_pass':all(p['audits']['content-width']['score'] in (1,None) for p in pages),
            'homepage_single_h1_and_main':next(p for p in pages if p['name']=='home')['semantics']['h1_count']==1 and next(p for p in pages if p['name']=='home')['semantics']['main_landmarks']>=1,
            'semantic_language_present':all(bool(p['semantics']['html_lang']) for p in pages),
            'server_rendered_decision_content':all(p['semantics']['raw_text_chars']>=500 for p in pages),
            'product_key_data_visible':all(next(p for p in pages if p['name']=='product')['product_key_data'][k] for k in ['price_text_present','buy_cta_present','stock_text_present'])
          }
          status='PASS' if all(acceptance.values()) else 'PARTIAL'
          out={'phase':20,'title':'UX/CRO/Accessibility/Agent Usability','generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'run_id':os.getenv('GITHUB_RUN_ID'),'commit_sha':os.getenv('GITHUB_SHA'),'status':status,'target':'WCAG 2.2 AA + mobile RTL + agent-readable decision path','acceptance':acceptance,'pages':pages,'issue_manifest':issues,'site_mutations':0,'theme_code_mutations':0,'commerce_mutations':0,'note':'Live mobile browser-rendered Lighthouse accessibility audit plus server-rendered semantic/agent checks. No theme/plugin mutation is performed by this gate.'}
          os.makedirs('phase20-results',exist_ok=True)
          json.dump(out,open('phase20-results/ux-a11y-live-latest.json','w'),ensure_ascii=False,indent=2)
          with open('phase20-results/ux-a11y-issue-manifest.md','w',encoding='utf-8') as f:
            f.write('# Phase 20 UX / A11y issue manifest\n\nStatus: **'+status+'**\n\n')
            if not issues: f.write('No blocking issue detected by the automated live gate.\n')
            for i,x in enumerate(issues,1): f.write(f"{i}. **{x['severity']} — {x['page']}**: {x['issue']}\n   Evidence: `{json.dumps(x['evidence'],ensure_ascii=False)}`\n")
            f.write('\nNo site/theme mutation was performed by this audit.\n')
          print(json.dumps({'status':status,'acceptance':acceptance,'issue_count':len(issues)},ensure_ascii=False,indent=2))
      - name: Persist Phase 20 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase20-results/ux-a11y-live-latest.json phase20-results/ux-a11y-issue-manifest.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase20: record live UX accessibility gate"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
