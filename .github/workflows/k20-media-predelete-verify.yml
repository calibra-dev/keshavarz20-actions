name: Keshavarz20 Media Pre-delete Verify

on:
  push:
    branches: [main]
    paths:
      - 'media-predelete-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-media-predelete-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate verifier
        run: python -m py_compile scripts/k20_media_predelete_verify.py
      - name: Build read-only pre-delete manifest
        run: python scripts/k20_media_predelete_verify.py
      - name: Commit sanitized manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media-predelete-results/manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record pre-delete verification manifest"
          git pull --rebase origin main
          git push origin HEAD:main
