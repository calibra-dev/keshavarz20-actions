name: K20 Page Revision Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/page-revisions/*.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Inspect page revisions read-only
        shell: pwsh
        run: |
          $before='${{ github.event.before }}';$current='${{ github.sha }}';$zero='0000000000000000000000000000000000000000'
          if($before -and $before-ne$zero){$changed=@(git diff --name-only $before $current -- 'diagnostics/page-revisions/*.json')}else{$changed=@(git show --pretty='' --name-only $current -- 'diagnostics/page-revisions/*.json')}
          $changed=@($changed|Where-Object{$_ -match '^diagnostics/page-revisions/.+\.json$'}|Sort-Object -Unique)
          if($changed.Count-eq0){throw 'No revision diagnostic request found.'}
          foreach($path in $changed){$name=[IO.Path]::GetFileNameWithoutExtension($path);& ./scripts/Invoke-K20PageRevisionDiagnostic.ps1 -RequestPath $path -OutputPath "results/page-revisions-$name.json"}
      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/page-revisions-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record page revision diagnostic"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0 || sleep 2; done
          exit 1
