name: K20 Phase 20 WPVibe Option Readonly

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/phase20-wpvibe-option/*.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Read exact option fragment
        shell: python
        run: |
          import base64,json,os,subprocess,urllib.request
          files=subprocess.check_output(['git','diff','--name-only','HEAD^','HEAD','--','diagnostics/phase20-wpvibe-option/*.json'],text=True).splitlines()
          files=[x for x in files if x.endswith('.json')]
          if len(files)!=1: raise SystemExit(f'Expected one request, got {files}')
          req=json.load(open(files[0],encoding='utf-8'))
          option=str(req.get('option_name') or '')
          pattern=str(req.get('pattern') or '')
          if option!='theme_mods_irankala' or not pattern or len(pattern)>200:
              raise SystemExit('Request outside bounded Phase20 option read.')
          base=os.environ['WP_BASE_URL'].rstrip('/')
          token=base64.b64encode((os.environ['WP_USERNAME']+':'+os.environ['WP_APP_PASSWORD']).encode()).decode()
          body=json.dumps({
            'target_type':'option',
            'option_name':option,
            'pattern':pattern,
            'case_sensitive':False,
            'max_results':20
          }).encode()
          q=urllib.request.Request(base+'/wp-json/wpvibe/v1/content/search',data=body,method='POST',headers={
            'Authorization':'Basic '+token,'Accept':'application/json','Content-Type':'application/json','User-Agent':'K20-Phase20-Option-Readonly/1.0'
          })
          try:
            with urllib.request.urlopen(q,timeout=90) as r:
              raw=r.read().decode('utf-8','replace'); status=r.status
          except Exception as e:
            raw=getattr(e,'read',lambda:b'')().decode('utf-8','replace') if hasattr(e,'read') else ''
            status=int(getattr(e,'code',0) or 0)
          try: data=json.loads(raw) if raw else {}
          except Exception: data={'raw_preview':raw[:1500]}
          out={'phase':20,'mode':'read-only','http_status':status,'option_name':option,'pattern':pattern,'response':data,'site_mutations':0}
          os.makedirs('phase20-results',exist_ok=True)
          open('phase20-results/wpvibe-option-readonly-latest.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2)+'\n')
          print(json.dumps({'http_status':status,'response_keys':list(data) if isinstance(data,dict) else []},ensure_ascii=False))
      - name: Persist bounded result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase20-results/wpvibe-option-readonly-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase20: record bounded WPVibe option read"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
