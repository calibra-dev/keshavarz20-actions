name: K20 GrowthOS Phase 1 Technical Retrieval

on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase1-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-growthos-phase1-v2
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate
        run: python -m py_compile scripts/k20_sitewide_crawl_audit.py
      - name: Run deep technical retrieval audit
        run: python scripts/k20_sitewide_crawl_audit.py
      - name: Persist dedicated GrowthOS Phase 1 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p growthos-phase1-results
          cp sitewide-media-results/crawl-audit.json growthos-phase1-results/technical-retrieval-index-control.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase1-results/technical-retrieval-index-control.json
          git restore --worktree sitewide-media-results/crawl-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase1: record technical retrieval evidence"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1
