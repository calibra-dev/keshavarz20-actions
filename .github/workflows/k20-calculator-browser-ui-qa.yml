name: K20 Calculator Browser UI QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-browser-ui-qa.yml']
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then
            echo "Chrome not found"
            exit 2
          fi
          python3 -m pip install --quiet websocket-client
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars \
            --remote-debugging-port=9222 --remote-allow-origins='*' \
            --user-data-dir=/tmp/k20-chrome --window-size=390,844 \
            'https://keshavarz20.com/drip-tape-length-fittings-calculator/' >/tmp/chrome.log 2>&1 &
          CHROME_PID=$!
          trap 'kill $CHROME_PID >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request,websocket,datetime,pathlib
          deadline=time.time()+30
          targets=None
          while time.time()<deadline:
              try:
                  targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                  if targets: break
              except Exception:
                  pass
              time.sleep(1)
          if not targets:
              raise SystemExit('No CDP target')
          target=next((t for t in targets if 'keshavarz20.com' in t.get('url','')),targets[0])
          ws=websocket.create_connection(target['webSocketDebuggerUrl'],timeout=15)
          time.sleep(10)
          expr=r'''(()=>{
            const b=document.getElementById('k20-basket-items');
            const home=document.querySelector('.bottom-nav .nav-item:nth-of-type(1) .nav-icon svg');
            const cart=document.querySelector('.bottom-nav .nav-item:nth-of-type(2) .nav-icon svg');
            const info=(el)=>{if(!el)return null;const cs=getComputedStyle(el),r=el.getBoundingClientRect();return{display:cs.display,visibility:cs.visibility,opacity:cs.opacity,width:r.width,height:r.height,inline:el.getAttribute('style')}};
            const body=(document.body.innerText||'');
            return {
              basket_exists:!!b,
              basket_children:b?b.children.length:null,
              basket_text:b?(b.innerText||'').slice(0,2500):null,
              basket_html:b?b.innerHTML.slice(0,5000):null,
              home_svg:info(home),
              cart_svg:info(cart),
              raw_visible:{
                use_strict:body.includes('use strict'),
                FAQPage:body.includes('FAQPage'),
                GrowthOSMeasurement:body.includes('GrowthOSMeasurement'),
                growthos_decision_flow:body.includes('growthos-decision-flow')
              },
              readyState:document.readyState,
              url:location.href,
              repairFlag:!!window.__k20BasketRuntimeRepairV1,
              basketDataType:typeof window.K20TapeBasketData,
              basketProductCount:(window.K20TapeBasketData && window.K20TapeBasketData.products)?Object.keys(window.K20TapeBasketData.products).length:null,
              webmcpFlag:typeof window.__k20WebMCPPhase13,
              scriptHasRepair:[...document.scripts].some(function(s){return (s.textContent||'').indexOf('__k20BasketRuntimeRepairV1')!==-1;})
            };
          })()'''
          msg={'id':1,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True}}
          ws.send(json.dumps(msg))
          while True:
              row=json.loads(ws.recv())
              if row.get('id')==1:
                  break
          ws.close()
          value=row['result']['result'].get('value') or {}
          value['checked_at_utc']=datetime.datetime.now(datetime.timezone.utc).isoformat()
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path('diagnostics/k20-calculator-browser-ui-qa-v2.json').write_text(json.dumps(value,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/k20-calculator-browser-ui-qa-v2.json
          git commit -m 'qa: capture calculator browser UI state v2'
          git pull --rebase origin main
          git push

# rerun after basket fallback patch

# rerun with basket runtime flags
