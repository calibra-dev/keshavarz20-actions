name: K20 SEO God1 Phase10 Flow QA
on:
  push:
    branches: [main]
    paths:
      - 'seo-god1-ops/phase10-flow-qa-*.json'
      - 'scripts/k20_seogod1_phase10_flow_qa.py'
      - '.github/workflows/k20-seogod1-phase10-flow-qa.yml'
permissions:
  contents: write
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python scripts/k20_seogod1_phase10_flow_qa.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f seo-god1-results/phase10-flow-qa.json
          git commit -m 'seo-god1: record phase10 flow QA' || exit 0
          git pull --rebase origin main
          git push origin main
