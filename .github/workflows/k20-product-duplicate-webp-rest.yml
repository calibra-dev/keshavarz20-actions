name: Keshavarz20 Duplicate Product WebP REST Rescue

on:
  push:
    branches: [main]
    paths:
      - 'duplicate-webp-rest-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-duplicate-product-webp-rest
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: python -m py_compile scripts/k20_product_duplicate_webp_rest.py
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: REST upload and preserve duplicate positions
        run: python scripts/k20_product_duplicate_webp_rest.py
      - name: Commit sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f duplicate-webp-rest-results/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record REST duplicate WebP rescue result"
          git pull --rebase origin main
          git push origin HEAD:main
