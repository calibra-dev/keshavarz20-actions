name: K20 Phase 18 Article Publisher E2E

on:
  push:
    branches: [main]
    paths:
      - 'phase18-article-publisher-e2e-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase18-article-publisher-e2e
  cancel-in-progress: false

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install Persian cover font
        run: |
          sudo apt-get update
          sudo apt-get install -y fonts-noto-core
          fc-match "Noto Sans Arabic"
      - name: Install article dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily-agri-articles/requirements.txt
      - name: Compile current article publisher chain and E2E
        run: |
          python -m py_compile daily-agri-articles/publish_queue.py daily-agri-articles/publish_queue_v2.py daily-agri-articles/publish_queue_v3.py daily-agri-articles/publish_queue_v4.py daily-agri-articles/publish_queue_v5.py daily-agri-articles/publish_queue_v6.py
          python -m py_compile scripts/k20_phase18_article_publisher_e2e.py
      - name: Run temporary draft readback cleanup E2E
        run: python scripts/k20_phase18_article_publisher_e2e.py phase18-results/article-publisher-e2e-latest.json
      - name: Persist sanitized E2E evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f phase18-results/article-publisher-e2e-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase18 v2: record article publisher E2E"
          git push origin HEAD:main
