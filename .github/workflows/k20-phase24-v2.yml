name: Phase 24 AI Citation Measurement v3

on:
  push:
    branches: [main]
    paths:
      - 'phase24/**'
      - 'phase24-ops/**'
      - 'phase20-results/final-closure-latest.json'
      - 'phase21-results/authority-network-latest.json'
      - 'phase22-results/acceptance-latest.json'
      - 'phase23-results/acceptance-latest.json'
      - 'tests/test_phase24_v3.py'
      - '.github/workflows/k20-phase24-v2.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase24-ai-citation-measurement-v3
  cancel-in-progress: true

jobs:
  verify-measurement-control-plane:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 24 v3
        run: |
          python -m py_compile phase24/measurement_v3.py
          python -m unittest tests.test_phase24_v3 -v
          python phase24/measurement_v3.py \
            --output phase24-results/measurement-v3-latest.json \
            --queue-output phase24-results/remaining-direct-surface-queue-v3.json
      - name: Build final acceptance
        shell: python
        run: |
          import datetime as dt, json, os, pathlib
          m=json.load(open("phase24-results/measurement-v3-latest.json",encoding="utf-8"))
          k=m.get("direct_surface_kpis") or {}
          q=m.get("remaining_external_capture") or {}
          out={
            "phase":24,
            "title":"AI Citation Experimentation & Influence Measurement",
            "version":"phase24-ai-citation-measurement-v3",
            "generated_at_utc":dt.datetime.now(dt.timezone.utc).isoformat(),
            "run_id":os.getenv("GITHUB_RUN_ID"),
            "commit_sha":os.getenv("GITHUB_SHA"),
            "status":m.get("status"),
            "control_plane_complete":m.get("control_plane_complete"),
            "full_direct_surface_measurement_complete":m.get("full_direct_surface_measurement_complete"),
            "check_count":m.get("check_count"),
            "passed_checks":m.get("passed_checks"),
            "failed_checks":m.get("failed_checks"),
            "direct_observation_count":k.get("direct_observation_count"),
            "observed_prompt_coverage":k.get("observed_prompt_coverage"),
            "citation_rate":k.get("citation_rate"),
            "brand_mention_rate":k.get("brand_mention_rate"),
            "cited_page_coverage":k.get("cited_page_coverage"),
            "remaining_external_capture":q,
            "site_mutations":0,
            "commerce_mutations":0,
            "fabricated_observations":0,
            "completion_basis":"Current dependency stack and a validated 200-prompt measurement control plane are complete. Full direct-surface measurement remains incomplete until all 200 prompts have DIRECT_SURFACE_CAPTURE evidence; missing captures are preserved as backlog rather than inferred or fabricated."
          }
          pathlib.Path("phase24-results/acceptance-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          if m.get("failed_checks"):
            raise SystemExit(2)
          print(json.dumps(out,ensure_ascii=False))
      - name: Persist Phase 24 v3 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f \
            phase24-results/measurement-v3-latest.json \
            phase24-results/remaining-direct-surface-queue-v3.json \
            phase24-results/acceptance-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase24: record v3 AI citation measurement acceptance"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
