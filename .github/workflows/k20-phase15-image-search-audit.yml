name: K20 Phase 15 Image Search Audit

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/phase15-image-search/*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase15-image-search-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Validate audit script
        run: python -m py_compile scripts/k20_phase15_image_search_audit.py

      - name: Run bounded live image audit
        shell: bash
        run: |
          set -euo pipefail
          mapfile -t files < <(git diff --name-only HEAD^ HEAD -- 'diagnostics/phase15-image-search/*.json' | sed '/^$/d')
          if [ "${#files[@]}" -ne 1 ]; then
            echo "Expected one phase15 image-search request, found ${#files[@]}" >&2
            exit 1
          fi
          mkdir -p phase15-image-results
          base="$(basename "${files[0]}" .json)"
          python scripts/k20_phase15_image_search_audit.py "${files[0]}" "phase15-image-results/${base}.json"

      - name: Commit audit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase15-image-results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase15: record image search audit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
