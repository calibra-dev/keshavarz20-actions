name: Keshavarz20 Bridge v3 Package

on:
  push:
    branches: [main]
    paths:
      - 'plugins/k20-bridge-v3/**'
      - '.github/workflows/k20-bridge-v3-package.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Lint PHP
        run: php -l plugins/k20-bridge-v3/k20-bridge-v3.php

      - name: Guard against arbitrary execution primitives
        shell: bash
        run: |
          set -euo pipefail
          if grep -En '\b(eval|exec|shell_exec|system|passthru|proc_open|popen)[[:space:]]*\(' plugins/k20-bridge-v3/k20-bridge-v3.php; then
            echo "Forbidden execution primitive found."
            exit 1
          fi

      - name: Build installable ZIP
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/k20-bridge-v3
          cp plugins/k20-bridge-v3/k20-bridge-v3.php dist/k20-bridge-v3/
          cp plugins/k20-bridge-v3/README.md dist/k20-bridge-v3/
          cd dist
          zip -qr k20-bridge-v3.0.0.zip k20-bridge-v3
          sha256sum k20-bridge-v3.0.0.zip > k20-bridge-v3.0.0.sha256

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: k20-bridge-v3.0.0
          path: |
            dist/k20-bridge-v3.0.0.zip
            dist/k20-bridge-v3.0.0.sha256
          if-no-files-found: error
          retention-days: 30
