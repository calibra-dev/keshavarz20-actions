name: Keshavarz20 Question Scheduler Control

on:
  push:
    branches: [main]
    paths:
      - 'scheduler-control/*.json'
  schedule:
    - cron: '2,12,22,32,42,52 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: k20-question-scheduler-control
  cancel-in-progress: false

jobs:
  control:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Watch and recover continuous question scheduler
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          wf="k20-question-scheduler.yml"
          force=0

          # Manual/push recovery also re-registers GitHub's schedule metadata.
          # Scheduled watchdog runs only ensure the workflow remains enabled.
          if [[ "${GITHUB_EVENT_NAME}" != "schedule" ]]; then
            force=1
            gh api --method PUT "repos/$repo/actions/workflows/$wf/disable"
            gh api --method PUT "repos/$repo/actions/workflows/$wf/enable"
          else
            gh api --method PUT "repos/$repo/actions/workflows/$wf/enable"
          fi

          gh api "repos/$repo/actions/workflows/$wf" --jq '{id,name,path,state,updated_at}'
          runs="$(gh api "repos/$repo/actions/workflows/$wf/runs?per_page=20")"
          now_epoch="$(date -u +%s)"
          in_progress="$(jq '[.workflow_runs[] | select(.status == "in_progress")] | length' <<<"$runs")"
          fresh_queued="$(jq --argjson now "$now_epoch" '[.workflow_runs[] | select(.status == "queued") | select(($now - (.created_at | fromdateiso8601)) < 1200)] | length' <<<"$runs")"
          stale_queued_ids="$(jq -r --argjson now "$now_epoch" '.workflow_runs[] | select(.status == "queued") | select(($now - (.created_at | fromdateiso8601)) >= 1200) | .id' <<<"$runs")"
          last_created="$(jq -r '.workflow_runs[0].created_at // ""' <<<"$runs")"
          age=999999
          if [[ -n "$last_created" ]]; then
            age="$(python - "$last_created" <<'PY'
          import datetime as dt, sys
          stamp=dt.datetime.fromisoformat(sys.argv[1].replace('Z','+00:00'))
          print(max(0,int((dt.datetime.now(dt.timezone.utc)-stamp).total_seconds())))
          PY
            )"
          fi

          echo "scheduler-in-progress=$in_progress"
          echo "scheduler-fresh-queued=$fresh_queued"
          echo "scheduler-last-run-age-seconds=$age"

          # A queued run with no job for 20 minutes is not a healthy heartbeat.
          # Cancel it so it cannot block the concurrency group forever.
          if [[ -n "$stale_queued_ids" ]]; then
            while read -r run_id; do
              [[ -z "$run_id" ]] && continue
              if gh api --method POST "repos/$repo/actions/runs/$run_id/cancel" >/dev/null 2>&1; then
                echo "watchdog-cancelled-stale-queued=$run_id"
              else
                echo "watchdog-cancel-stale-queued-failed=$run_id"
              fi
            done <<<"$stale_queued_ids"
            sleep 3
          fi

          # Never fork while a real scheduler job is executing or while a fresh
          # queued run is still within the normal GitHub start window.
          if (( in_progress > 0 )); then
            echo "watchdog-dispatch=skipped-in-progress"
            exit 0
          fi
          if (( fresh_queued > 0 )); then
            echo "watchdog-dispatch=skipped-fresh-queue"
            exit 0
          fi

          # On manual/push recovery, dispatch immediately after stale cleanup.
          # On scheduled watchdog ticks, only recover a chain stale for 20m.
          if [[ "$force" != "1" ]] && (( age < 1200 )) && [[ -z "$stale_queued_ids" ]]; then
            echo "watchdog-dispatch=skipped-recent-run"
            exit 0
          fi

          gh api --method POST "repos/$repo/actions/workflows/$wf/dispatches" -f ref=main
          if [[ -n "$stale_queued_ids" ]]; then
            echo "watchdog-dispatch=recovered-stale-queue"
          elif [[ "$force" == "1" ]]; then
            echo "watchdog-dispatch=forced-recovery"
          else
            echo "watchdog-dispatch=recovered-stale-chain"
          fi
