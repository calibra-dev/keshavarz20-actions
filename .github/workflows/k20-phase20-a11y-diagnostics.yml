name: K20 Phase 20 A11y Diagnostics

on:
  push:
    branches: [main]
    paths:
      - 'phase20-diagnostic-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase20-a11y-diagnostics
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Install Lighthouse
        run: npm install -g lighthouse
      - name: Resolve targets and run audits
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json
          feed=json.load(open('phase19-results/product-discovery-readiness-feed-persisted.json',encoding='utf-8'))
          product=next((p.get('canonical_url') for p in feed.get('products',[]) if p.get('canonical_url')), 'https://keshavarz20.com/product/')
          targets={
            'home':'https://keshavarz20.com/',
            'product':product,
            'pipe-guide':'https://keshavarz20.com/polyethylene-pipe-size-flow-pressure-guide/',
            'filter-selector':'https://keshavarz20.com/irrigation-filter-selector/',
            'fittings-selector':'https://keshavarz20.com/irrigation-fittings-compatibility-selector/'
          }
          json.dump(targets,open('/tmp/phase20-targets.json','w'),ensure_ascii=False,indent=2)
          PY
          mkdir -p /tmp/lh
          python - <<'PY' >/tmp/targets.tsv
          import json
          for k,v in json.load(open('/tmp/phase20-targets.json')).items():
              print(k+'\t'+v)
          PY
          while IFS=$'\t' read -r name url; do
            lighthouse "$url" --quiet --output=json --output-path="/tmp/lh/${name}.json" --only-categories=accessibility --form-factor=mobile --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage"
          done </tmp/targets.tsv
      - name: Extract exact failing nodes
        shell: python
        run: |
          import json, os, datetime, urllib.request, re
          targets=json.load(open('/tmp/phase20-targets.json'))
          audit_ids=['button-name','link-name','heading-order']
          out={
            'phase':20,
            'type':'a11y_diagnostics',
            'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'run_id':os.getenv('GITHUB_RUN_ID'),
            'pages':{},
            'site_mutations':0
          }
          for name,url in targets.items():
              lh=json.load(open('/tmp/lh/'+name+'.json'))
              page={'score':lh.get('categories',{}).get('accessibility',{}).get('score'),'audits':{}}
              for aid in audit_ids:
                  a=lh.get('audits',{}).get(aid,{})
                  rows=[]
                  for item in (a.get('details',{}) or {}).get('items',[]) or []:
                      node=item.get('node') or {}
                      rows.append({
                          'selector':node.get('selector'),
                          'nodeLabel':node.get('nodeLabel'),
                          'snippet':node.get('snippet'),
                          'explanation':node.get('explanation'),
                          'subItems':item.get('subItems')
                      })
                  page['audits'][aid]={'score':a.get('score'),'title':a.get('title'),'items':rows}
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'K20-Phase20-Diagnostic/1.0'})
                  raw=urllib.request.urlopen(req,timeout=30).read().decode('utf-8','replace')
                  h1s=re.findall(r'<h1\b[^>]*>(.*?)</h1>',raw,re.I|re.S)
                  clean=[]
                  for h in h1s:
                      t=re.sub(r'<[^>]+>',' ',h)
                      t=re.sub(r'\s+',' ',t).strip()
                      clean.append(t[:500])
                  page['server_h1_texts']=clean
              except Exception as e:
                  page['server_h1_error']=str(e)
              out['pages'][name]=page
          os.makedirs('phase20-results',exist_ok=True)
          json.dump(out,open('phase20-results/a11y-diagnostics-latest.json','w'),ensure_ascii=False,indent=2)
          print(json.dumps(out,ensure_ascii=False,indent=2))
      - name: Persist diagnostics
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase20-results/a11y-diagnostics-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase20: record exact a11y failing nodes"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
