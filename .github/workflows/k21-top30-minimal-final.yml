name: K21 Top30 Minimal Non-Video Final

on:
  push:
    branches: [main]
    paths:
      - 'k21-top30-minimal-ops/*.json'

permissions:
  contents: write

jobs:
  final:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - name: Fresh PIM and compatibility
        run: python scripts/k20_phase3_top30_pim.py
      - name: Fresh schema/feed parity
        run: python scripts/k20_phase3_page_schema_feed_parity_fast.py
      - name: Fresh discovery draft
        run: python scripts/k21_openai_feed_draft.py
      - name: Fresh AI readiness
        run: python scripts/k21_ai_product_readiness.py
      - name: Final 30 report
        run: python scripts/k21_top30_final_report.py
      - name: Persist fresh results
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k21-min && mkdir -p /tmp/k21-min/phase3-results /tmp/k21-min/geo-aeo-results /tmp/k21-min/k21-top30-results
          cp phase3-results/top30-pim.json phase3-results/compatibility-graph.json phase3-results/top30-remediation.json phase3-results/top30-product-feed.json phase3-results/page-schema-feed-parity.json /tmp/k21-min/phase3-results/
          cp geo-aeo-results/k21-openai-discovery-feed-draft.json geo-aeo-results/k21-openai-discovery-valid.jsonl geo-aeo-results/k21-ai-product-readiness.json geo-aeo-results/k21-ai-product-backlog.json /tmp/k21-min/geo-aeo-results/
          cp k21-top30-results/final-top30-scores.json k21-top30-results/final-top30-scores.md /tmp/k21-min/k21-top30-results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/k21-min/phase3-results/* phase3-results/
          cp -r /tmp/k21-min/geo-aeo-results/* geo-aeo-results/
          cp -r /tmp/k21-min/k21-top30-results/* k21-top30-results/
          git add -f phase3-results/top30-pim.json phase3-results/compatibility-graph.json phase3-results/top30-remediation.json phase3-results/top30-product-feed.json phase3-results/page-schema-feed-parity.json geo-aeo-results/k21-openai-discovery-feed-draft.json geo-aeo-results/k21-openai-discovery-valid.jsonl geo-aeo-results/k21-ai-product-readiness.json geo-aeo-results/k21-ai-product-backlog.json k21-top30-results/final-top30-scores.json k21-top30-results/final-top30-scores.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k21: record minimal final Top30 non-video readiness"
          git push origin HEAD:main
