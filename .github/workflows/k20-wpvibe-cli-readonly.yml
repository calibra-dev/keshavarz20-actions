name: K20 WPVibe CLI Readonly

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/wpvibe-cli-readonly/*.json'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Execute allow-listed read-only WP CLI request
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $reqPath=(git show --pretty='' --name-only '${{ github.sha }}' -- 'diagnostics/wpvibe-cli-readonly/*.json' | Select-Object -First 1)
          if([string]::IsNullOrWhiteSpace($reqPath)){throw 'No request file found.'}
          $req=Get-Content -Raw -LiteralPath $reqPath | ConvertFrom-Json -Depth 10
          $command=[string]$req.command
          if($command -notmatch '^option get [A-Za-z0-9_.:-]+$'){throw 'Only option get <key> is allowed.'}
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json';'Content-Type'='application/json'}
          $payload=[ordered]@{command=$command;confirm_write=$false}|ConvertTo-Json -Compress
          $r=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/cli/run" -Headers $headers -Method POST -Body $payload -TimeoutSec 180
          $dir=Join-Path $env:RUNNER_TEMP 'k20-wpvibe-cli-readonly';New-Item -ItemType Directory -Force $dir|Out-Null
          $r|ConvertTo-Json -Depth 20|Set-Content -LiteralPath (Join-Path $dir 'result.json') -Encoding utf8
          Write-Host 'WPVIBE_CLI_READONLY_OK'
      - name: Upload private result
        uses: actions/upload-artifact@v4
        with:
          name: k20-wpvibe-cli-readonly
          path: ${{ runner.temp }}/k20-wpvibe-cli-readonly/result.json
          retention-days: 3
