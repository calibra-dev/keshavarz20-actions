name: K20 Brand Assignment Probe
on:
  push:
    branches: [main]
    paths: ['brand-assignment-ops/probe-*.json']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - run: python scripts/k20_brand_assignment_probe.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f brand-assignment-results/probe.json
          git commit -m "brand assignment: record Woo brand endpoint probe" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
