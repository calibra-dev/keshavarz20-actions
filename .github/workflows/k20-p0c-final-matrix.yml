name: K20 P0-C Final Matrix

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/p0c-final/*.json'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - name: Validate organization and product schema across required page types
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/k20-p0c-final"
          mkdir -p "$out"
          python3 - "$out/result.json" <<'PY'
          import json, sys, urllib.request
          from html import unescape
          from html.parser import HTMLParser

          result_path=sys.argv[1]
          ORG='https://keshavarz20.com/#organization'
          pages=[
            {'kind':'home','url':'https://keshavarz20.com/'},
            {'kind':'product','id':135383,'url':'https://keshavarz20.com/product/%d8%b1%d8%a7%d8%a8%d8%b7-%d9%85%d8%b3%d8%a7%d9%88%db%8c-%d8%a2%d8%a8%d9%84%d9%88%d9%84%d9%87-110-%d9%85%db%8c%d9%84%db%8c%d9%85%d8%aa%d8%b1/','woo_toman':3696000,'availability':'https://schema.org/InStock'},
            {'kind':'product','id':140856,'url':'https://keshavarz20.com/product/%da%a9%d8%a7-%db%b6%db%b0-%d8%a7%db%8c%da%a9%d8%b3-%da%af%d8%b1%db%8c%d9%86/','woo_toman':1100000,'availability':'https://schema.org/InStock'},
            {'kind':'product','id':135000,'url':'https://keshavarz20.com/product/%d8%b3%d9%87-%d8%b1%d8%a7%d9%87-%d9%85%d8%a7%d8%af%d9%87-%d9%86%da%af%db%8c%d9%86-90-%d9%85%db%8c%d9%84%db%8c%d9%85%d8%aa%d8%b1-%d9%be%d9%84%db%8c-%d8%a7%d8%aa%db%8c%d9%84%d9%86/','woo_toman':2664000,'availability':'https://schema.org/InStock'},
            {'kind':'product','id':135629,'url':'https://keshavarz20.com/product/%d8%b3%d9%87-%d8%b1%d8%a7%d9%87-%db%8c%da%a9%d8%b3%d8%b1-%d9%86%d8%b1-%d9%be%d9%84%db%8c-%d8%b1%d9%88%d8%af110-%d9%85%db%8c%d9%84%db%8c%d9%85%d8%aa%d8%b1-%d9%be%d9%84%db%8c-%d8%a7%d8%aa%db%8c/','woo_toman':4893000,'availability':'https://schema.org/OutOfStock'},
            {'kind':'product','id':140014,'url':'https://keshavarz20.com/product/%d9%84%d9%88%d9%84%d9%87-%d8%a8%d8%a7%d8%b1%d8%a7%d9%86%db%8c-%d9%85%d9%87-%d9%be%d8%a7%d8%b4-%d8%a2%d8%b3%d8%a7%db%8c%d8%b4-%d8%a2%d8%b0%d8%b1%d8%a8%d8%a7%db%8c%d8%ac%d8%a7%d9%86-%db%b1%db%b0%db%b0/','woo_toman':1662500,'availability':'https://schema.org/InStock'},
            {'kind':'category','url':'https://keshavarz20.com/product-category/agricultural-equipment-supplies/polyethylene-fittings/'},
            {'kind':'category','url':'https://keshavarz20.com/product-category/agricultural-equipment-supplies/irrigation-equipment/drip-irrigation/'},
            {'kind':'article','url':'https://keshavarz20.com/polyethylene-pipe-pressure-loss-leak-burst-troubleshooting/'},
            {'kind':'article','url':'https://keshavarz20.com/layflat-hose-fittings-installation-guide/'},
          ]

          class P(HTMLParser):
            def __init__(self): super().__init__(); self.on=False; self.buf=[]; self.blocks=[]
            def handle_starttag(self,tag,attrs):
              if tag.lower()=='script' and (dict(attrs).get('type') or '').lower()=='application/ld+json': self.on=True; self.buf=[]
            def handle_endtag(self,tag):
              if tag.lower()=='script' and self.on: self.blocks.append(''.join(self.buf)); self.on=False; self.buf=[]
            def handle_data(self,data):
              if self.on: self.buf.append(data)

          def walk(o):
            if isinstance(o,dict):
              yield o
              for v in o.values(): yield from walk(v)
            elif isinstance(o,list):
              for v in o: yield from walk(v)

          def typed(nodes,t):
            out=[]
            for n in nodes:
              x=n.get('@type'); xs=x if isinstance(x,list) else [x]
              if t in xs: out.append(n)
            return out

          rows=[]; failed=False
          for page in pages:
            req=urllib.request.Request(page['url'],headers={'User-Agent':'K20-P0C-Final/2026-09-17','Cache-Control':'no-cache'})
            try:
              with urllib.request.urlopen(req,timeout=90) as r:
                status=r.status; html=r.read().decode('utf-8','replace')
            except Exception as e:
              rows.append({**page,'pass':False,'error':str(e)}); failed=True; continue
            p=P(); p.feed(html); parsed=[]; parse_errors=[]
            for i,raw in enumerate(p.blocks):
              try: parsed.append(json.loads(unescape(raw)))
              except Exception as e: parse_errors.append({'block':i,'error':str(e)})
            nodes=[n for b in parsed for n in walk(b) if isinstance(n,dict)]
            orgs=typed(nodes,'Organization'); products=typed(nodes,'Product'); offers=typed(nodes,'Offer')
            no_logo=[o for o in orgs if not o.get('logo')]
            row={**page,'http':status,'jsonld_blocks':len(p.blocks),'parse_errors':parse_errors,
                 'organization_count':len(orgs),'organization_without_logo_count':len(no_logo),
                 'product_count':len(products),'offer_count':len(offers)}
            ok=(status==200 and not parse_errors and len(orgs)==1 and len(no_logo)==0)
            if page['kind']=='product':
              offer=offers[0] if len(offers)==1 else {}
              product=products[0] if len(products)==1 else {}
              expected_price=str(page['woo_toman']*10)
              actual_price=str(offer.get('price',''))
              row.update({
                'seller':offer.get('seller'),'price':offer.get('price'),'priceCurrency':offer.get('priceCurrency'),
                'availability_schema':offer.get('availability'),'expected_irr_price':expected_price,
                'aggregateRating_present':bool(product.get('aggregateRating')),
                'review_present':bool(product.get('review')),
              })
              ok = ok and len(products)==1 and len(offers)==1
              ok = ok and offer.get('seller')=={'@id':ORG}
              ok = ok and offer.get('priceCurrency')=='IRR'
              ok = ok and actual_price==expected_price
              ok = ok and offer.get('availability')==page['availability']
              # Site-wide readback immediately before this run found zero approved product ratings.
              ok = ok and not product.get('aggregateRating') and not product.get('review')
            row['pass']=bool(ok); rows.append(row); failed=failed or not ok

          result={'canonical_organization':ORG,'required_sample_counts':{'home':1,'product':5,'category':2,'article':2},'rows':rows,'pass':not failed}
          print(json.dumps(result,ensure_ascii=False,indent=2))
          with open(result_path,'w',encoding='utf-8') as f: json.dump(result,f,ensure_ascii=False,indent=2)
          if failed: raise SystemExit(1)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-p0c-final-matrix
          path: ${{ runner.temp }}/k20-p0c-final/result.json
          retention-days: 14
