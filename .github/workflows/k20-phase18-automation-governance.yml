name: K20 Phase 18 Automation Governance

on:
  push:
    branches: [main]
    paths:
      - 'phase18-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase18-automation-governance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install news dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily-agri-news/requirements.txt
      - name: Compile governed engines
        run: |
          python -m py_compile daily-agri-news/publish_queue.py daily-agri-news/publish_queue_v2.py
          python -m py_compile daily-agri-articles/publish_queue.py daily-agri-articles/publish_queue_v2.py daily-agri-articles/publish_queue_v3.py
          python -m py_compile question-engine/engine_v18.py
          python -m py_compile scripts/k20_phase18_news_read_probe.py scripts/k20_phase18_automation_governance.py
      - name: Test live read-only news duplicate path
        run: python scripts/k20_phase18_news_read_probe.py phase18-results/news-read-probe.json
      - name: Validate Phase 18 acceptance
        run: python scripts/k20_phase18_automation_governance.py phase18-results/automation-governance-latest.json
      - name: Persist acceptance evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase18-results/news-read-probe.json phase18-results/automation-governance-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase18: record automation governance acceptance"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
