name: K20 Schema Source Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/schema-source/*.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch live product JSON-LD and summarize entities
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/k20-schema-source"
          mkdir -p "$out"
          url='https://keshavarz20.com/product/%d8%b1%d8%a7%d8%a8%d8%b7-%d9%85%d8%b3%d8%a7%d9%88%db%8c-%d8%a2%d8%a8%d9%84%d9%88%d9%84%d9%87-110-%d9%85%db%8c%d9%84%db%8c%d9%85%d8%aa%d8%b1/'
          html="$out/product.html"
          code=$(curl -L -sS --compressed --max-time 90 -A 'K20-Schema-Source/2026-09-17' -o "$html" -w '%{http_code}' "$url")
          test "$code" = '200'
          python3 - "$html" "$out/result.json" <<'PY'
          import json, re, sys
          from html import unescape
          from html.parser import HTMLParser

          html_path, result_path = sys.argv[1:3]

          class LDParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.in_ld = False
                  self.buf = []
                  self.blocks = []
              def handle_starttag(self, tag, attrs):
                  if tag.lower() == 'script':
                      a = dict(attrs)
                      if (a.get('type') or '').lower() == 'application/ld+json':
                          self.in_ld = True
                          self.buf = []
              def handle_endtag(self, tag):
                  if tag.lower() == 'script' and self.in_ld:
                      self.blocks.append(''.join(self.buf).strip())
                      self.in_ld = False
                      self.buf = []
              def handle_data(self, data):
                  if self.in_ld:
                      self.buf.append(data)

          text = open(html_path, 'r', encoding='utf-8', errors='replace').read()
          p = LDParser(); p.feed(text)
          parsed = []
          errors = []
          for i, raw in enumerate(p.blocks):
              try:
                  parsed.append(json.loads(unescape(raw)))
              except Exception as e:
                  errors.append({'index': i, 'error': str(e), 'prefix': raw[:180]})

          def walk(obj, path='$'):
              if isinstance(obj, dict):
                  yield path, obj
                  for k, v in obj.items():
                      yield from walk(v, path + '.' + str(k))
              elif isinstance(obj, list):
                  for i, v in enumerate(obj):
                      yield from walk(v, path + f'[{i}]')

          entities = []
          for bi, block in enumerate(parsed):
              for path, node in walk(block, f'$block[{bi}]'):
                  t = node.get('@type') if isinstance(node, dict) else None
                  types = t if isinstance(t, list) else ([t] if t else [])
                  if any(x in ('Product','Offer','Organization','OnlineStore') for x in types):
                      row = {
                          'path': path,
                          'types': types,
                          'id': node.get('@id'),
                          'name': node.get('name'),
                          'url': node.get('url'),
                          'has_logo': 'logo' in node,
                          'logo': node.get('logo'),
                          'keys': sorted(node.keys()),
                      }
                      if 'seller' in node:
                          row['seller'] = node.get('seller')
                      if 'offers' in node:
                          offers = node.get('offers')
                          if isinstance(offers, dict):
                              row['offers_summary'] = {'type': offers.get('@type'), 'seller': offers.get('seller'), 'keys': sorted(offers.keys())}
                          elif isinstance(offers, list):
                              row['offers_summary'] = [
                                  {'type': x.get('@type'), 'seller': x.get('seller'), 'keys': sorted(x.keys())}
                                  for x in offers if isinstance(x, dict)
                              ]
                      entities.append(row)

          result = {
              'jsonld_block_count': len(p.blocks),
              'parse_errors': errors,
              'entity_count': len(entities),
              'entities': entities,
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          with open(result_path, 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-schema-source-diagnostic
          path: ${{ runner.temp }}/k20-schema-source/result.json
          retention-days: 14
