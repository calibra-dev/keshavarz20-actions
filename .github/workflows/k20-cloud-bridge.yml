name: Keshavarz20 Cloud Bridge

on:
  push:
    branches: [main]
    paths:
      - 'bridge-cloud-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: keshavarz20-cloud-bridge
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Execute public-safe bridge requests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($name in 'WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required repository secret: $name"
            }
          }

          $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $requests = @()

          if ($event.commits) {
            $requests = @(
              $event.commits | ForEach-Object { @($_.added) + @($_.modified) } |
              Where-Object { $_ -and $_.StartsWith('bridge-cloud-ops/') -and $_.EndsWith('.json') } |
              Sort-Object -Unique
            )
          }

          if ($requests.Count -eq 0 -and $env:GITHUB_EVENT_NAME -eq 'push') {
            $changed = @(& git diff --name-only HEAD^ HEAD -- 'bridge-cloud-ops/*.json')
            if ($LASTEXITCODE -eq 0) {
              $requests = @(
                $changed |
                Where-Object { $_ -and $_.StartsWith('bridge-cloud-ops/') -and $_.EndsWith('.json') } |
                Sort-Object -Unique
              )
            }
          }

          if ($requests.Count -eq 0) {
            Write-Host 'No changed JSON request files detected.'
            exit 0
          }

          $base = $env:WP_BASE_URL.TrimEnd('/')
          $endpoint = "$base/wp-json/keshavarz20-ops/v2/execute"
          $authText = "$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($authText))
          $headers = @{ Authorization = "Basic $auth"; Accept = 'application/json' }

          New-Item -ItemType Directory -Force 'bridge-cloud-results' | Out-Null

          foreach ($req in $requests) {
            $name = [IO.Path]::GetFileNameWithoutExtension($req)
            $json = Get-Content -Raw -LiteralPath $req

            $status = 0
            $ok = $false
            $responseKeys = @()
            $capabilities = @()

            try {
              $response = Invoke-WebRequest `
                -Uri $endpoint `
                -Method Post `
                -Headers $headers `
                -ContentType 'application/json; charset=utf-8' `
                -Body ([Text.Encoding]::UTF8.GetBytes($json)) `
                -TimeoutSec 180

              $status = [int]$response.StatusCode
              $ok = ($status -ge 200 -and $status -lt 300)

              if ($response.Content) {
                try {
                  $parsed = $response.Content | ConvertFrom-Json
                  $responseKeys = @($parsed.PSObject.Properties.Name | Sort-Object -Unique)
                  foreach ($candidate in 'capabilities','operations','allowed_operations') {
                    $prop = $parsed.PSObject.Properties[$candidate]
                    if ($prop -and $prop.Value) {
                      $capabilities += @($prop.Value | ForEach-Object { [string]$_ })
                    }
                  }
                  $capabilities = @($capabilities | Where-Object { $_ -and $_.Length -le 80 } | Sort-Object -Unique)
                } catch {}
              }
            }
            catch {
              if ($_.Exception.Response) {
                try { $status = [int]$_.Exception.Response.StatusCode } catch { $status = 0 }
              }
            }

            $result = [ordered]@{
              processed_at_utc = [DateTime]::UtcNow.ToString('o')
              runner = 'github-hosted-ubuntu'
              request_file = $req
              http_code = $status
              ok = $ok
              response_keys = $responseKeys
              capabilities = $capabilities
            } | ConvertTo-Json -Depth 4

            Set-Content -LiteralPath "bridge-cloud-results/$name.json" -Value $result -Encoding utf8

            Write-Host "Bridge request $req -> HTTP $status"

            if (-not $ok) {
              throw "Bridge request failed with HTTP $status"
            }
          }

      - name: Commit sanitized bridge results
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d bridge-cloud-results ] || [ -z "$(find bridge-cloud-results -type f -name '*.json' -print -quit)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bridge-cloud-results/*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ops: record sanitized cloud bridge result"
          git push
