name: Keshavarz20 Direct Content Structure Probe

on:
  push:
    branches: [main]
    paths:
      - 'direct-content-structure-probe-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-direct-content-structure-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_direct_content_structure_probe.py
      - name: Probe direct content structure read-only
        run: python scripts/k20_direct_content_structure_probe.py
      - name: Commit sanitized probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-media-results/direct-structure-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record direct content structure probe"
          git pull --rebase origin main
          git push origin HEAD:main
