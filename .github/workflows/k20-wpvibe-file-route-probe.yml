name: K20 WPVibe File Route Schema Probe

on:
  push:
    branches: [main]
    paths:
      - 'phase7-ops/wpvibe-file-route-*.json'
      - 'scripts/k20_wpvibe_file_route_probe.py'
      - '.github/workflows/k20-wpvibe-file-route-probe.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/k20_wpvibe_file_route_probe.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/wpvibe-file-route-schema.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record wpvibe file route schema"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
