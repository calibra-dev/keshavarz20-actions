name: K20 Phase 7 Home Heavy Image Preflight
on:
  push:
    branches: [main]
    paths: ['phase7-home-preflight-ops/*.json']
permissions:
  contents: write
jobs:
  preflight:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - run: python scripts/k20_phase7_home_heavy_preflight.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/home-heavy-preflight.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record homepage heavy-image preflight"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
