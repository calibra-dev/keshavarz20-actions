name: K20 Product Cookie Cache A-B

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/product-cookie-cache-ab/*.json'

permissions:
  contents: read

concurrency:
  group: k20-product-cookie-cache-ab
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Compare anonymous product cache with and without recently-viewed cookie
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          current='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'

          if [ -n "$before" ] && [ "$before" != "$zero" ]; then
            mapfile -t requests < <(git diff --name-only "$before" "$current" -- 'diagnostics/product-cookie-cache-ab/*.json' | sed '/^$/d' | sort -u)
          else
            mapfile -t requests < <(git show --pretty= --name-only "$current" -- 'diagnostics/product-cookie-cache-ab/*.json' | sed '/^$/d' | sort -u)
          fi

          if [ "${#requests[@]}" -ne 1 ]; then
            echo "Expected exactly one request, found ${#requests[@]}" >&2
            exit 1
          fi

          request="${requests[0]}"
          url="$(jq -r '.url' "$request")"
          product_id="$(jq -r '.product_id' "$request")"
          unrelated_id="$(jq -r '.unrelated_product_id // 1' "$request")"

          out="$RUNNER_TEMP/k20-product-cookie-cache-ab"
          mkdir -p "$out"

          run_variant() {
            local name="$1"
            local cookie="$2"
            for seq in 1 2 3; do
              local h="$out/${name}-${seq}.headers.txt"
              local cookie_args=()
              if [ -n "$cookie" ]; then
                cookie_args=(-H "Cookie: $cookie")
              else
                cookie_args=(-H 'Cookie:')
              fi

              timing="$(curl -L -sS --max-time 45 -A 'K20-Product-Cookie-Probe/2026-09-22' "${cookie_args[@]}" -H 'Accept-Encoding: gzip, br' -D "$h" -o /dev/null -w '%{http_code}|%{http_version}|%{remote_ip}|%{time_starttransfer}|%{time_total}|%{size_download}|%{num_redirects}' "$url")"
              cache="$(grep -i '^x-litespeed-cache:' "$h" | tail -n 1 | tr -d '\r' | cut -d: -f2- | xargs || true)"
              ctl="$(grep -i '^x-litespeed-cache-control:' "$h" | tail -n 1 | tr -d '\r' | cut -d: -f2- | xargs || true)"
              httpcache="$(grep -i '^cache-control:' "$h" | tail -n 1 | tr -d '\r' | cut -d: -f2- | xargs || true)"
              setcookie="$(grep -i '^set-cookie:' "$h" | tr -d '\r' | grep -i 'woocommerce_recently_viewed' | tail -n 1 | cut -d: -f2- | xargs || true)"
              printf 'K20COOKIE variant=%s seq=%s timing=%s ls_cache=%q ls_ctl=%q cache_control=%q recently_viewed_set_cookie=%q\n' "$name" "$seq" "$timing" "$cache" "$ctl" "$httpcache" "$setcookie"
            done
          }

          run_variant clean ""
          run_variant same_product "woocommerce_recently_viewed=$product_id"
          run_variant unrelated_product "woocommerce_recently_viewed=$unrelated_id"

      - name: Upload raw headers
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-product-cookie-cache-ab
          path: ${{ runner.temp }}/k20-product-cookie-cache-ab/
          if-no-files-found: warn
          retention-days: 7
