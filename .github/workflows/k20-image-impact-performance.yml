name: Keshavarz20 Image Impact Performance Test

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/image-impact/*.json'

permissions:
  contents: write

concurrency:
  group: k20-image-impact-performance
  cancel-in-progress: false

jobs:
  measure:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          current='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          if [[ -n "$before" && "$before" != "$zero" ]]; then
            mapfile -t files < <(git diff --name-only "$before" "$current" -- 'diagnostics/image-impact/*.json' | sed '/^$/d' | sort -u)
          else
            mapfile -t files < <(git show --pretty= --name-only "$current" -- 'diagnostics/image-impact/*.json' | sed '/^$/d' | sort -u)
          fi
          if [[ "${#files[@]}" -ne 1 ]]; then
            echo "Expected one image-impact request, found ${#files[@]}" >&2
            exit 1
          fi
          echo "request=${files[0]}" >> "$GITHUB_OUTPUT"
          base="$(basename "${files[0]}" .json)"
          echo "result=diagnostics/image-impact-results/${base}-result.json" >> "$GITHUB_OUTPUT"

      - name: Install Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          npm install --global lighthouse
          lighthouse --version

      - name: Measure public pages
        shell: bash
        env:
          REQUEST: ${{ steps.req.outputs.request }}
          RESULT: ${{ steps.req.outputs.result }}
        run: |
          set -euo pipefail
          mkdir -p "$(dirname "$RESULT")" "$RUNNER_TEMP/k20-image-impact"
          lh_version="$(lighthouse --version | tail -n 1)"
          jq -n --arg tested_at "$(date -u +%Y-%m-%dT%H:%M:%SZ)" --arg lh "$lh_version" \
            '{tested_at_utc:$tested_at,lighthouse_version:$lh,targets:[]}' > "$RESULT"

          while IFS= read -r target; do
            name="$(jq -r '.name' <<<"$target")"
            url="$(jq -r '.url' <<<"$target")"
            do_lh="$(jq -r '.lighthouse // false' <<<"$target")"
            work="$RUNNER_TEMP/k20-image-impact/$name"
            mkdir -p "$work"
            samples='[]'

            for seq in 1 2 3 4 5; do
              hdr="$work/curl-$seq.headers"
              metrics="$(curl -L -sS --max-time 60 -A 'K20-Image-Impact/2026-09-17' -H 'Cookie:' -H 'Accept-Encoding: gzip, br' -D "$hdr" -o /dev/null -w '%{http_code}|%{time_starttransfer}|%{time_total}|%{size_download}|%{num_redirects}' "$url")"
              IFS='|' read -r code ttfb total bytes redirects <<<"$metrics"
              cache="$(grep -i '^x-litespeed-cache:' "$hdr" | tail -n 1 | tr -d '\r' | cut -d: -f2- | xargs || true)"
              cachectl="$(grep -i '^x-litespeed-cache-control:' "$hdr" | tail -n 1 | tr -d '\r' | cut -d: -f2- | xargs || true)"
              row="$(jq -n --argjson seq "$seq" --argjson code "$code" --argjson ttfb "$ttfb" --argjson total "$total" --argjson bytes "$bytes" --argjson redirects "$redirects" --arg cache "$cache" --arg cachectl "$cachectl" '{seq:$seq,http_code:$code,ttfb_s:$ttfb,total_s:$total,html_bytes:$bytes,redirects:$redirects,litespeed_cache:$cache,litespeed_cache_control:$cachectl}')"
              samples="$(jq --argjson row "$row" '. + [$row]' <<<"$samples")"
            done

            lh_runs='[]'
            if [[ "$do_lh" == "true" ]]; then
              for seq in 1 2; do
                report="$work/lh-$seq.json"
                lighthouse "$url" --quiet --chrome-flags='--headless --no-sandbox --disable-dev-shm-usage' --only-categories=performance --output=json --output-path="$report"
                row="$(jq -c --argjson seq "$seq" '{seq:$seq,performance_score:(.categories.performance.score*100),fcp_s:(.audits["first-contentful-paint"].numericValue/1000),lcp_s:(.audits["largest-contentful-paint"].numericValue/1000),speed_index_s:(.audits["speed-index"].numericValue/1000),tbt_ms:.audits["total-blocking-time"].numericValue,cls:.audits["cumulative-layout-shift"].numericValue,total_bytes:.audits["total-byte-weight"].numericValue,image_bytes:([.audits["resource-summary"].details.items[]? | select((.resourceType|ascii_downcase)=="image") | .transferSize] | add // 0),request_count:(.audits["network-requests"].details.items | length),lcp_element:(.audits["largest-contentful-paint-element"].details.items[0].items[0].node.snippet // .audits["largest-contentful-paint-element"].details.items[0].node.snippet // null),lcp_element_path:(.audits["largest-contentful-paint-element"].details.items[0].items[0].node.path // .audits["largest-contentful-paint-element"].details.items[0].node.path // null),largest_images:([.audits["network-requests"].details.items[]? | select((.resourceType|ascii_downcase)=="image") | {url,transferSize,resourceSize,priority}] | sort_by(.transferSize) | reverse | .[:5])}' "$report")"
                lh_runs="$(jq --argjson row "$row" '. + [$row]' <<<"$lh_runs")"
              done
            fi

            obj="$(jq -n --arg name "$name" --arg url "$url" --argjson curl "$samples" --argjson lh "$lh_runs" '{name:$name,url:$url,curl_samples:$curl,lighthouse_runs:$lh}')"
            tmp="$(mktemp)"
            jq --argjson obj "$obj" '.targets += [$obj]' "$RESULT" > "$tmp"
            mv "$tmp" "$RESULT"
          done < <(jq -c '.targets[]' "$REQUEST")

          cat "$RESULT"

      - name: Commit sanitized result
        shell: bash
        env:
          RESULT: ${{ steps.req.outputs.result }}
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f "$RESULT"
          git commit -m 'perf: record image-impact measurement'
          git pull --rebase origin main
          git push origin HEAD:main
