name: K20 WPVibe Authorization Preflight Readonly

on:
  push:
    branches: [main]
    paths:
      - 'wpvibe-preflight-ops/*.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Probe WPVibe authorization preflight safely
        shell: python
        run: |
          import json, os, requests
          from pathlib import Path
          base=os.environ["WP_BASE_URL"].rstrip("/")
          s=requests.Session()
          s.auth=(os.environ["WP_USERNAME"],os.environ["WP_APP_PASSWORD"])
          s.headers.update({"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"k20-wpvibe-preflight-readonly/1.0"})
          out={"read_only":True,"site":base}

          idx=s.get(base+"/wp-json/",timeout=60)
          data=idx.json() if idx.ok else {}
          route=(data.get("routes",{}) if isinstance(data,dict) else {}).get("/wpvibe/v1/authorize/preflight",{})
          eps=[]
          for ep in route.get("endpoints",[]) if isinstance(route,dict) else []:
              args={}
              for k,v in (ep.get("args") or {}).items():
                  args[k]={"required":v.get("required"),"type":v.get("type")}
              eps.append({"methods":ep.get("methods"),"args":args})
          out["route_schema"]={"methods":route.get("methods") if isinstance(route,dict) else None,"endpoints":eps}

          r=s.get(base+"/wp-json/wpvibe/v1/authorize/preflight",timeout=60)
          out["http"]=r.status_code
          out["content_type"]=r.headers.get("Content-Type")
          try:
              body=r.json()
          except Exception:
              body=None
          if isinstance(body,dict):
              out["response_keys"]=sorted(body.keys())[:30]
              out["code"]=body.get("code")
              out["message"]=str(body.get("message") or "")[:240]
              safe={}
              for k,v in body.items():
                  lk=str(k).lower()
                  if any(x in lk for x in ["password","token","secret","nonce","credential","auth","key"]):
                      continue
                  if isinstance(v,(str,int,float,bool)) or v is None:
                      safe[k]=v
              out["safe_scalars"]=safe
          Path("wpvibe-connectivity-results").mkdir(exist_ok=True)
          Path("wpvibe-connectivity-results/authorize-preflight.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps({"http":out.get("http"),"code":out.get("code"),"message":out.get("message"),"response_keys":out.get("response_keys")},ensure_ascii=False))
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f wpvibe-connectivity-results/authorize-preflight.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record WPVibe authorization preflight"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
