name: Keshavarz20 Surgical Media Parent Field Fix

on:
  push:
    branches: [main]
    paths:
      - 'repo-fix-ops/media-parent-field-*.json'

permissions:
  contents: write

concurrency:
  group: k20-media-parent-field-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Patch only WordPress media parent field reads
        shell: python
        run: |
          import pathlib, py_compile
          fixes = {
              pathlib.Path('scripts/k20_sitewide_media_inventory_v3.py'): [
                  ("'_fields': 'id,parent,source_url,mime_type,alt_text',", "'_fields': 'id,post,source_url,mime_type,alt_text',"),
                  ("'parent': norm_id(row.get('parent')),", "'parent': norm_id(row.get('post')),")
              ],
              pathlib.Path('scripts/k20_content_media_inventory.py'): [
                  ("'_fields': 'id,parent,source_url,mime_type,alt_text',", "'_fields': 'id,post,source_url,mime_type,alt_text',"),
                  ("'parent': int(row.get('parent') or 0),", "'parent': int(row.get('post') or 0),")
              ],
          }
          for path, replacements in fixes.items():
              text = path.read_text(encoding='utf-8')
              for old, new in replacements:
                  count = text.count(old)
                  if count != 1:
                      raise SystemExit(f'{path}: expected exactly one match for {old!r}, found {count}')
                  text = text.replace(old, new, 1)
              path.write_text(text, encoding='utf-8')
              py_compile.compile(str(path), doraise=True)
          print('Patched and compiled both inventory scanners.')
      - name: Commit surgical scanner fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add scripts/k20_sitewide_media_inventory_v3.py scripts/k20_content_media_inventory.py
          git diff --cached --check
          git commit -m "media: read attachment parent from REST post field"
          git pull --rebase origin main
          git push origin HEAD:main
