name: K20 GrowthOS Phase 16 Editorial Trust
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase16-ops/*.json'
      - 'growthos-phase16-input/*.json'
      - 'automation-policy/editorial-trust-2026.json'
      - 'scripts/k20_growthos_phase16_editorial_trust.py'
      - 'daily-agri-articles/SCHEDULED_TASK_PROMPT.md'
      - 'daily-agri-articles/README.md'
      - 'daily-agri-articles/publish_queue_v2.py'
      - 'daily-agri-news/SCHEDULED_TASK_PROMPT.md'
      - 'daily-agri-news/README.md'
      - 'daily-agri-news/publish_queue_v2.py'
      - '.github/workflows/k20-growthos-phase16-editorial-trust.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase16-editorial-trust
  cancel-in-progress: true
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_growthos_phase16_editorial_trust.py daily-agri-articles/publish_queue_v2.py daily-agri-news/publish_queue_v2.py
      - run: python scripts/k20_growthos_phase16_editorial_trust.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase16-results/summary.json growthos-phase16-results/editorial-contract-audit.json growthos-phase16-results/post-trust-audit.json growthos-phase16-results/legacy-backlog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase16: record editorial trust audit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
