name: Keshavarz20 Sitewide Media Autopilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'sitewide-media-autopilot/config.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: k20-sitewide-media-autopilot
  cancel-in-progress: false

jobs:
  cycle:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Validate Python
        run: python -m py_compile scripts/k20_sitewide_phase1_autopilot_v2.py

      - name: Install WebP encoder
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Process next guarded sitewide phase1 image batch
        shell: bash
        run: |
          set -euo pipefail
          for attempt in 1 2; do
            if python scripts/k20_sitewide_phase1_autopilot_v2.py; then
              exit 0
            fi
            if [ "$attempt" -lt 2 ]; then sleep 10; fi
          done
          exit 1

      - name: Commit checkpoint and sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sitewide-media-autopilot/state.json sitewide-media-autopilot-results/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: checkpoint sitewide phase1 run ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Queue next guarded cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f sitewide-media-autopilot/state.json ]; then exit 0; fi
          status=$(python -c "import json; print(json.load(open('sitewide-media-autopilot/state.json')).get('status',''))")
          self_chain=$(python -c "import json; print(str(json.load(open('sitewide-media-autopilot/config.json')).get('self_chain', False)).lower())")
          echo "Sitewide phase1 status: $status self_chain=$self_chain"
          if [ "$status" != "running" ] || [ "$self_chain" != "true" ]; then exit 0; fi
          code=$(curl -sS -o /tmp/k20-sitewide-dispatch.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/k20-sitewide-media-autopilot.yml/dispatches" \
            -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then
            cat /tmp/k20-sitewide-dispatch.txt || true
            exit 1
          fi

      - name: Fail visibly on safety halt
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f sitewide-media-autopilot/state.json ]; then exit 0; fi
          status=$(python -c "import json; print(json.load(open('sitewide-media-autopilot/state.json')).get('status',''))")
          if [ "$status" = "halted" ]; then exit 1; fi
