name: K20 Phase16 Live Paragraph Proof
on:
  push:
    branches: [main]
    paths:
      - 'scripts/k20_phase16_live_paragraph_proof.py'
      - '.github/workflows/k20-phase16-live-paragraph-proof.yml'
jobs:
  proof:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_phase16_live_paragraph_proof.py
      - run: python scripts/k20_phase16_live_paragraph_proof.py
