name: K20 Post Repair Error Stack Verify
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-post-repair-error-stack.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Install Playwright
        run: |
          python3 -m pip install --quiet playwright
          python3 -m playwright install chromium
      - name: Capture page error stacks
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import asyncio, json
          from pathlib import Path
          from playwright.async_api import async_playwright

          async def main():
              out={}
              async with async_playwright() as p:
                  browser=await p.chromium.launch()
                  ctx=await browser.new_context(
                      viewport={'width':390,'height':844},
                      user_agent='Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36',
                      locale='fa-IR'
                  )
                  page=await ctx.new_page()
                  errors=[]
                  page.on('pageerror',lambda exc: errors.append({
                      'message':str(exc),
                      'stack':getattr(exc,'stack',None)
                  }))
                  await page.goto('https://keshavarz20.com/drip-tape-length-fittings-calculator/',wait_until='networkidle',timeout=90000)
                  await page.wait_for_timeout(1200)
                  out['pageErrors']=errors
                  out['visibleRaw']=await page.evaluate("""() => {
                    const t=document.body.innerText||'';
                    return {
                      FAQPage:t.includes('FAQPage'),
                      GrowthOSMeasurementV1:t.includes('GrowthOSMeasurementV1'),
                      useStrict:t.includes('use strict')
                    };
                  }""")
                  await browser.close()
              Path('diagnostics').mkdir(exist_ok=True)
              Path('diagnostics/k20-post-repair-error-stack.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          asyncio.run(main())
          PY
      - name: Commit verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/k20-post-repair-error-stack.json
          git commit -m 'verify: capture calculator browser error stacks' || exit 0
          git pull --rebase origin main
          git push
