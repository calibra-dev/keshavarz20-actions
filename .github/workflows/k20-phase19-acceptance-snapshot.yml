name: K20 Phase 19 Acceptance Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'phase19-acceptance-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase19-acceptance-snapshot
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate Phase 19 v3 from persisted full-catalog and fresh run evidence
        run: |
          python -m py_compile scripts/k20_phase19_agentic_readiness.py
          python scripts/k20_phase19_agentic_readiness.py phase19-results/agentic-readiness-latest.json phase19-results/product-discovery-readiness-feed.json
      - name: Refresh canonical persisted acceptance snapshot
        run: |
          python - <<'PY'
          import json
          from pathlib import Path
          result=json.loads(Path("phase19-results/agentic-readiness-latest.json").read_text(encoding="utf-8"))
          projection=json.loads(Path("phase19-results/product-discovery-readiness-feed.json").read_text(encoding="utf-8"))
          out={
            "phase":19,
            "version":result.get("version"),
            "status":result.get("status"),
            "generated_at_utc":result.get("generated_at_utc"),
            "check_count":result.get("check_count"),
            "passed_checks":result.get("passed_checks"),
            "failed_checks":result.get("failed_checks"),
            "readiness":result.get("readiness"),
            "acceptance":result.get("acceptance"),
            "fresh_upstream_refresh_evidence":result.get("fresh_upstream_refresh_evidence"),
            "projection_status":projection.get("status"),
            "external_submission":False,
            "site_mutations":0,
            "price_stock_mutations":0,
            "payment_checkout_mutations":0,
            "secret_values_persisted":False
          }
          Path("phase19-results/acceptance-persisted-evidence.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          PY
      - name: Persist final Phase 19 v3 acceptance
        shell: bash
        run: |
          set -euo pipefail
          files=(
            phase19-results/agentic-readiness-latest.json
            phase19-results/product-discovery-readiness-feed.json
            phase19-results/acceptance-persisted-evidence.json
          )
          tmp="$(mktemp -d)"
          for file in "${files[@]}"; do
            mkdir -p "$tmp/$(dirname "$file")"
            cp "$file" "$tmp/$file"
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          for attempt in 1 2 3 4 5; do
            git fetch origin main
            git reset --hard origin/main
            for file in "${files[@]}"; do
              mkdir -p "$(dirname "$file")"
              cp "$tmp/$file" "$file"
            done
            git add -f "${files[@]}"
            if git diff --cached --quiet; then exit 0; fi
            git commit -m "phase19 v3: record final full catalog acceptance"
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
