name: K20 Phase 19 Acceptance Snapshot

on:
  push:
    branches: [main]
    paths:
      - 'phase19-acceptance-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase19-acceptance-snapshot
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Validate persisted parity PIM and protocol gates
        run: |
          python -m py_compile scripts/k20_phase19_agentic_readiness.py
          python scripts/k20_phase19_agentic_readiness.py phase19-results/acceptance-persisted-evidence.json phase19-results/product-discovery-readiness-feed-persisted.json
      - name: Persist acceptance snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase19-results/acceptance-persisted-evidence.json phase19-results/product-discovery-readiness-feed-persisted.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase19: record acceptance from persisted parity evidence"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
