name: K20 Calculator CSS Fingerprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-calculator-css-fingerprint.yml'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import requests,re,json,pathlib
          files={
            'irk_woocommerce':'https://keshavarz20.com/wp-content/litespeed/css/7e0c89866ae4250b859a08a1e4310da4.css?ver=a8667',
            'mega_theme_icon':'https://keshavarz20.com/wp-content/litespeed/css/62bccd5cbc3fa81af8e3db4ca4b9cbd8.css?ver=dc04d',
            'irk_common':'https://keshavarz20.com/wp-content/litespeed/css/9c13dae17cf8ea20906a1f183d051600.css?ver=846ee'
          }
          keys=['woocommerce','mini-cart','cart','header','mobile','menu','mega','icon','account','checkout','product','modal','offcanvas','footer','bottom','sticky','login','digits']
          out={}
          for name,url in files.items():
              t=requests.get(url,timeout=30,headers={'User-Agent':'Mozilla/5.0'}).text
              sels=re.findall(r'([^{}]{1,300})\{',t)
              out[name]={
                  'url':url,'chars':len(t),
                  'keyword_counts':{k:len(re.findall(re.escape(k),t,re.I)) for k in keys},
                  'sample_selectors':[re.sub(r'\s+',' ',s).strip() for s in sels[:80]]
              }
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path('diagnostics/calculator-css-fingerprint.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-css-fingerprint.json
          git commit -m "diag: fingerprint calculator CSS bundles" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
