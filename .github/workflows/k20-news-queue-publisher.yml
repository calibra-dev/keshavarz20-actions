name: Keshavarz20 ChatGPT Pro News Queue Publisher

on:
  push:
    branches: [main]
    paths:
      - 'daily-agri-news/queue/*.json'
  pull_request:
    paths:
      - '.github/workflows/k20-news-queue-publisher.yml'
      - 'automation-policy/**'
      - 'daily-agri-news/**'
  workflow_dispatch:
    inputs:
      queue_file:
        description: 'Path to a queue JSON file'
        required: true
        default: 'daily-agri-news/queue/manual.json'

permissions:
  contents: read

concurrency:
  group: k20-news-queue-publisher
  cancel-in-progress: false

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile publishers
        run: |
          python -m py_compile daily-agri-news/publish_queue.py
          python -m py_compile daily-agri-news/publish_queue_v2.py

  publish-draft:
    if: github.event_name != 'pull_request'
    needs: static-check
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      TZ: Asia/Tehran
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      K20_NEWS_CATEGORY_ID: '839'
      K20_NEWS_CATEGORY_NAME: 'کشاورزی'

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily-agri-news/requirements.txt

      - name: Install publisher dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily-agri-news/requirements.txt

      - name: Compile publishers
        run: |
          python -m py_compile daily-agri-news/publish_queue.py
          python -m py_compile daily-agri-news/publish_queue_v2.py

      - name: Validate WordPress secrets
        shell: bash
        run: |
          set -euo pipefail
          for name in WP_BASE_URL WP_USERNAME WP_APP_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing repository secret::$name is empty or unavailable"
              exit 2
            fi
          done

      - name: Resolve queue files
        id: queue
        shell: bash
        env:
          MANUAL_FILE: ${{ inputs.queue_file }}
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            case "$MANUAL_FILE" in
              daily-agri-news/queue/*.json) ;;
              *)
                echo "::error::Routing guard: news publisher accepts only daily-agri-news/queue/*.json"
                exit 4
                ;;
            esac
            printf '%s\n' "$MANUAL_FILE" > /tmp/k20-queue-files.txt
          else
            git diff-tree --no-commit-id --name-only -r HEAD -- 'daily-agri-news/queue/*.json' > /tmp/k20-queue-files.txt
          fi

          if [ ! -s /tmp/k20-queue-files.txt ]; then
            echo 'No queue JSON file found in this change.'
            exit 0
          fi

          echo 'Queue files:'
          cat /tmp/k20-queue-files.txt

      - name: Publish queued drafts
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -s /tmp/k20-queue-files.txt ]; then
            exit 0
          fi
          while IFS= read -r file; do
            [ -n "$file" ] || continue
            if [ ! -f "$file" ]; then
              echo "::error::Queue file not found: $file"
              exit 3
            fi
            echo "Publishing queue with SEO God evidence validator: $file"
            python daily-agri-news/publish_queue_v2.py "$file"
          done < /tmp/k20-queue-files.txt

      - name: Write job summary
        if: always()
        shell: bash
        run: |
          if [ -f daily-agri-news/output/queue-summary.md ]; then
            cat daily-agri-news/output/queue-summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Keshavarz20 scheduled news publisher' >> "$GITHUB_STEP_SUMMARY"
            echo 'No publisher summary was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi

      - name: Upload sanitized result
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-news-queue-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            daily-agri-news/output/queue-result.json
            daily-agri-news/output/queue-summary.md
            daily-agri-news/output/featured-news.webp
