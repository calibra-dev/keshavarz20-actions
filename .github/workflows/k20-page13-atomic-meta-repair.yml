name: K20 Page13 Atomic Elementor Meta Repair

on:
  push:
    branches: [main]
    paths:
      - 'page13-atomic-repair-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-page13-atomic-meta-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply SHA-locked atomic meta replacement and verify
        shell: python
        run: |
          import base64
          import hashlib
          import html
          import json
          import os
          import pathlib
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request

          EXPECTED_PAGE_ID = 13
          EXPECTED_SHA = '411d1c0bb3ac6038a4effd4758984f99836c72b3864588cd539880d8ff1fb344'
          EXPECTED_AFTER_SHA = 'ad88a9e43d4045e482939e0aa7c32ebc1c7285c5f7e0cc211754a757025e2592'
          EXPECTED_LENGTH = 28690
          EXPECTED_ROOT_KEYS = {'elType','elements','id','isInner','settings'}
          PHRASE = 'شرایط مرجوعی، مغایرت کالا و پیگیری بار در کشاورز بیست'
          REFUND_PATH = '/refund_returns/'
          PRODUCT_PATH = '/product/%d8%b4%db%8c%d8%b1-%d9%be%d8%b1%d9%88%d8%a7%d9%86%d9%87-%d8%a7%db%8c-%d9%be%d9%84%db%8c%d9%85%d8%b1%db%8c-%d8%a8%d8%a7-%d8%af%d8%b3%d8%aa%d9%87-%d9%81%d9%84%d8%b2%db%8c-%d9%88%db%8c%d8%b3%d9%be-3/'

          for key in ('WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'):
              if not os.environ.get(key,'').strip():
                  raise SystemExit(f'Missing required secret: {key}')

          changed = subprocess.check_output([
              'git','show','--pretty=','--name-only','HEAD','--','page13-atomic-repair-ops/*.json'
          ], text=True).splitlines()
          requests = sorted({p.strip() for p in changed if p.strip().startswith('page13-atomic-repair-ops/') and p.strip().endswith('.json')})
          if len(requests) != 1:
              raise SystemExit(f'Expected exactly one repair request, found {len(requests)}')
          request_path = requests[0]
          request = json.loads(pathlib.Path(request_path).read_text(encoding='utf-8'))
          if request.get('action') != 'repair_elementor_root_array_atomic':
              raise SystemExit('Unexpected repair action')
          if int(request.get('id',0)) != EXPECTED_PAGE_ID:
              raise SystemExit('Repair is hard-limited to Page 13')
          if request.get('confirm_root_only') is not True:
              raise SystemExit('confirm_root_only=true is required')
          if str(request.get('expected_sha256') or '').lower() != EXPECTED_SHA:
              raise SystemExit('Unexpected expected_sha256')
          if str(request.get('expected_after_sha256') or '').lower() != EXPECTED_AFTER_SHA:
              raise SystemExit('Unexpected expected_after_sha256')

          def sha256_text(value):
              return hashlib.sha256(value.encode('utf-8')).hexdigest()

          def http_json(url, method='GET', body=None, headers=None, timeout=180):
              h = dict(headers or {})
              data = None
              if body is not None:
                  data = json.dumps(body, ensure_ascii=False, separators=(',',':')).encode('utf-8')
                  h['Content-Type'] = 'application/json; charset=utf-8'
              req = urllib.request.Request(url, data=data, method=method, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read().decode('utf-8','replace')
                      try:
                          payload = json.loads(raw) if raw.strip() else None
                      except Exception:
                          payload = {'non_json_body_length': len(raw)}
                      return int(r.status), payload
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8','replace')
                  try:
                      payload = json.loads(raw) if raw.strip() else None
                  except Exception:
                      payload = {'non_json_body_length': len(raw)}
                  return int(e.code), payload

          def http_text(url, headers=None, timeout=180):
              req = urllib.request.Request(url, method='GET', headers=dict(headers or {}))
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return int(r.status), r.read().decode('utf-8','replace')
              except urllib.error.HTTPError as e:
                  return int(e.code), e.read().decode('utf-8','replace')

          def safe_response_summary(payload):
              if not isinstance(payload, dict):
                  return {'type': type(payload).__name__}
              out = {'keys': sorted(str(k) for k in payload.keys())}
              for key in ('ok','success','replacements','replacement_count','count','status','target'):
                  value = payload.get(key)
                  if isinstance(value,(str,int,float,bool)) or value is None:
                      if key in payload:
                          out[key] = value
              message = payload.get('message')
              if isinstance(message,str):
                  out['message'] = message[:300]
              code = payload.get('code')
              if isinstance(code,str):
                  out['code'] = code[:120]
              return out

          def markup_counts(text):
              return {
                  'total_h1': len(re.findall(r'(?is)<h1\\b[^>]*>', text)),
                  'target_h1': len(re.findall(r'(?is)<h1\\b[^>]*>\\s*' + re.escape(PHRASE) + r'\\s*</h1>', text)),
                  'target_h2': len(re.findall(r'(?is)<h2\\b[^>]*>\\s*' + re.escape(PHRASE) + r'\\s*</h2>', text)),
              }

          base = os.environ['WP_BASE_URL'].rstrip('/')
          auth = base64.b64encode(f"{os.environ['WP_USERNAME']}:{os.environ['WP_APP_PASSWORD']}".encode('utf-8')).decode('ascii')
          auth_headers = {'Authorization':'Basic '+auth,'Accept':'application/json','Cache-Control':'no-cache'}
          selective = base + '/wp-json/wp/v2/pages/13?context=edit&_fields=id,slug,status,modified_gmt,meta'
          edit_url = base + '/wp-json/wpvibe/v1/content/edit'

          result = {
              'ok': False,
              'p0': 'OPEN',
              'action': 'repair_elementor_root_array_atomic',
              'page_id': 13,
              'request_file': request_path,
              'prewrite_guard': {},
              'atomic_edit': {},
              'readback': {},
              'cache': {},
              'refund_live': {},
              'product_live': {},
              'executed_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
          }
          pathlib.Path('results').mkdir(exist_ok=True)
          out_path = pathlib.Path('results') / (pathlib.Path(request_path).stem + '.json')

          def save_result():
              out_path.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')

          # PRE-WRITE exact state guard.
          code, page = http_json(selective, headers=auth_headers)
          if code != 200 or not isinstance(page, dict):
              result['prewrite_guard'] = {'passed':False,'http_status':code,'reason':'selective_read_failed'}
              save_result(); raise SystemExit(0)
          before = (page.get('meta') or {}).get('_elementor_data')
          if not isinstance(before,str):
              result['prewrite_guard'] = {'passed':False,'http_status':code,'reason':'elementor_meta_missing'}
              save_result(); raise SystemExit(0)
          try:
              parsed = json.loads(before)
              json_valid = True
          except Exception:
              parsed = None; json_valid = False
          before_sha = sha256_text(before)
          counts = {
              'target_h1': before.count(f'<h1>{PHRASE}</h1>'),
              'target_h2': before.count(f'<h2>{PHRASE}</h2>'),
              'css_h1': before.count('.k20-hero h1'),
              'css_h2': before.count('.k20-hero h2'),
          }
          guard_pass = all([
              before_sha == EXPECTED_SHA,
              len(before) == EXPECTED_LENGTH,
              json_valid,
              isinstance(parsed,dict),
              set(parsed.keys()) == EXPECTED_ROOT_KEYS,
              counts['target_h1'] == 0,
              counts['target_h2'] == 1,
              counts['css_h1'] == 0,
              counts['css_h2'] == 2,
          ])
          result['prewrite_guard'] = {
              'passed':guard_pass,'http_status':code,'slug':page.get('slug'),'page_status':page.get('status'),
              'elementor_length':len(before),'elementor_sha256':before_sha,'json_valid':json_valid,
              'root_type':'object' if isinstance(parsed,dict) else 'other','root_keys':sorted(parsed.keys()) if isinstance(parsed,dict) else [],**counts
          }
          if not guard_pass:
              save_result(); raise SystemExit(0)

          # Construct exact wrapper; preserve every byte inside the current object.
          after = '[' + before + ']'
          after_sha = sha256_text(after)
          try:
              after_parsed = json.loads(after)
          except Exception:
              after_parsed = None
          construction_pass = all([
              after_sha == EXPECTED_AFTER_SHA,
              len(after) == EXPECTED_LENGTH + 2,
              isinstance(after_parsed,list),
              len(after_parsed) == 1,
              isinstance(after_parsed[0],dict),
              after_parsed[0] == parsed,
              after[1:-1] == before,
              sha256_text(after[1:-1]) == before_sha,
          ])
          if not construction_pass:
              result['atomic_edit'] = {'attempted':False,'reason':'construction_guard_failed','after_sha256':after_sha,'after_length':len(after)}
              save_result(); raise SystemExit(0)

          # ONE atomic match-once replacement of the entire meta value through the installed WPVibe content edit route.
          edit_body = {
              'target_type':'meta',
              'post_id':13,
              'meta_key':'_elementor_data',
              'old_content':before,
              'new_content':after,
              'replace_all':False,
              'whole_word':False,
          }
          edit_code, edit_payload = http_json(edit_url, method='POST', body=edit_body, headers=auth_headers)
          result['atomic_edit'] = {
              'attempted':True,'http_status':edit_code,'response':safe_response_summary(edit_payload),
              'before_sha256':before_sha,'after_sha256':after_sha,'before_length':len(before),'after_length':len(after),
              'internal_bytes_preserved':True,
          }

          # Exact authoritative readback.
          rb_code, rb_page = http_json(selective, headers=auth_headers)
          stored = (rb_page.get('meta') or {}).get('_elementor_data') if rb_code == 200 and isinstance(rb_page,dict) else None
          stored_sha = sha256_text(stored) if isinstance(stored,str) else ''
          root_type = ''
          root_length = 0
          inner_sha = ''
          rb_counts = {'target_h1':0,'target_h2':0,'css_h1':0,'css_h2':0}
          if isinstance(stored,str):
              try:
                  decoded = json.loads(stored)
                  root_type = 'array' if isinstance(decoded,list) else 'object' if isinstance(decoded,dict) else 'other'
                  root_length = len(decoded) if isinstance(decoded,list) else 1 if isinstance(decoded,dict) else 0
              except Exception:
                  decoded = None
              if stored.startswith('[') and stored.endswith(']'):
                  inner_sha = sha256_text(stored[1:-1])
              rb_counts = {
                  'target_h1': stored.count(f'<h1>{PHRASE}</h1>'),
                  'target_h2': stored.count(f'<h2>{PHRASE}</h2>'),
                  'css_h1': stored.count('.k20-hero h1'),
                  'css_h2': stored.count('.k20-hero h2'),
              }
          readback_pass = all([
              rb_code == 200,
              isinstance(stored,str),
              stored == after,
              stored_sha == EXPECTED_AFTER_SHA,
              root_type == 'array',
              root_length == 1,
              inner_sha == EXPECTED_SHA,
              rb_counts['target_h1'] == 0,
              rb_counts['target_h2'] == 1,
              rb_counts['css_h1'] == 0,
              rb_counts['css_h2'] == 2,
          ])
          result['readback'] = {
              'passed':readback_pass,'http_status':rb_code,'stored_sha256':stored_sha,'expected_sha256':EXPECTED_AFTER_SHA,
              'root_type':root_type,'root_length':root_length,'inner_sha256':inner_sha,'expected_inner_sha256':EXPECTED_SHA,**rb_counts
          }
          if not readback_pass:
              save_result(); raise SystemExit(0)

          # Clear generated Elementor cache only after exact persistence is proven.
          cache_req = urllib.request.Request(base + '/wp-json/elementor/v1/cache', method='DELETE', headers=auth_headers)
          try:
              with urllib.request.urlopen(cache_req, timeout=180) as r:
                  cache_status = int(r.status)
          except urllib.error.HTTPError as e:
              cache_status = int(e.code)
          result['cache'] = {'http_status':cache_status,'ok':200 <= cache_status < 300}
          if not result['cache']['ok']:
              save_result(); raise SystemExit(0)

          time.sleep(3)
          live_headers = {'Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'K20-Page13-Atomic-Repair/1.0'}
          stamp = str(int(time.time()))
          refund_code, refund_html = http_text(base + REFUND_PATH + '?k20verify=' + stamp, headers=live_headers)
          refund_counts = markup_counts(refund_html)
          refund_pass = refund_code == 200 and refund_counts == {'total_h1':1,'target_h1':0,'target_h2':1}
          result['refund_live'] = {'passed':refund_pass,'http_status':refund_code,**refund_counts}

          product_code, product_html = http_text(base + PRODUCT_PATH + '?k20verify=' + stamp, headers=live_headers)
          product_counts = markup_counts(product_html)
          product_pass = product_code == 200 and product_counts['total_h1'] == 1 and product_counts['target_h1'] == 0 and product_counts['target_h2'] >= 1
          result['product_live'] = {'passed':product_pass,'http_status':product_code,**product_counts}

          result['ok'] = bool(readback_pass and result['cache']['ok'] and refund_pass and product_pass)
          result['p0'] = 'CLOSED/PASS' if result['ok'] else 'OPEN/VERIFY_FAILED'
          save_result()
          print('PAGE13_ATOMIC_REPAIR_RESULT', result['p0'])

      - name: Commit sanitized repair evidence
        shell: bash
        if: always()
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record Page 13 atomic Elementor meta repair"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Enforce P0 closure criteria
        shell: python
        run: |
          import json, pathlib, subprocess
          paths = subprocess.check_output(['git','show','--pretty=','--name-only','HEAD','--','results/*.json'], text=True).splitlines()
          candidates = [p for p in paths if p.startswith('results/20260916-page13-atomic-meta-repair-') and p.endswith('.json')]
          if not candidates:
              candidates = sorted(str(p) for p in pathlib.Path('results').glob('20260916-page13-atomic-meta-repair-*.json'))
          if not candidates:
              raise SystemExit('Repair result not found')
          data = json.loads(pathlib.Path(candidates[-1]).read_text(encoding='utf-8-sig'))
          if data.get('ok') is not True or data.get('p0') != 'CLOSED/PASS':
              raise SystemExit('P0 closure criteria not met; inspect committed result')
          print('P0_CLOSED_PASS')
