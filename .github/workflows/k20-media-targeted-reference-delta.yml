name: Keshavarz20 Media Targeted Reference Delta

on:
  push:
    branches: [main]
    paths:
      - 'media-reference-delta-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-media-targeted-reference-delta
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate targeted verifier
        run: python -m py_compile scripts/k20_media_targeted_reference_delta.py
      - name: Verify current references only for remaining candidates
        run: python scripts/k20_media_targeted_reference_delta.py
      - name: Commit guarded zero-reference manifest
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f ops/media/unused-media-zero-ref-current25-20260917.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record targeted current zero-reference manifest"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
