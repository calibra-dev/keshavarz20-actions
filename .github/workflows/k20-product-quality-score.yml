name: K20 Product Quality Score

on:
  push:
    branches: [main]
    paths:
      - 'phase2-pqs-ops/*.json'
  workflow_dispatch:
  schedule:
    - cron: '20 3 * * 1'

permissions:
  contents: write

concurrency:
  group: k20-product-quality-score
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - run: python scripts/k20_product_quality_score.py phase2-results/product-quality-score.json
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-results/product-quality-score.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase2: record product quality scores"
          git pull --rebase origin main
          git push origin main
