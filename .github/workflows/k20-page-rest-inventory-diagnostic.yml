name: Keshavarz20 Page REST Inventory Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'page-rest-diagnostic-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-page-rest-inventory-diagnostic
  cancel-in-progress: false

jobs:
  diagnostic:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Validate Python
        run: python -m py_compile scripts/k20_page_rest_inventory_diagnostic.py
      - name: Run read-only page REST diagnostic
        run: python scripts/k20_page_rest_inventory_diagnostic.py
      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-media-results/page-rest-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record page REST inventory diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
