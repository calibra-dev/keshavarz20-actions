name: Keshavarz20 Product Image Inventory

on:
  push:
    branches: [main]
    paths:
      - 'product-image-inventory-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-product-image-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build sanitized product-image inventory
        shell: python
        run: |
          import base64, json, os, pathlib, subprocess, time, urllib.parse, urllib.request, urllib.error
          for key in ('WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'):
              if not os.environ.get(key,'').strip(): raise SystemExit(f'Missing secret {key}')
          def changed():
              for cmd in (["git","diff","--name-only","HEAD^","HEAD","--","product-image-inventory-ops/*.json"],["git","show","--pretty=","--name-only","HEAD","--","product-image-inventory-ops/*.json"]):
                  p=sorted({x.strip() for x in subprocess.check_output(cmd,text=True).splitlines() if x.strip().startswith('product-image-inventory-ops/') and x.strip().endswith('.json')})
                  if p:return p
              return []
          reqs=changed()
          if not reqs: raise SystemExit('No inventory request')
          base=os.environ['WP_BASE_URL'].rstrip('/'); user=os.environ['WP_USERNAME']; pw=os.environ['WP_APP_PASSWORD']
          auth=base64.b64encode(f'{user}:{pw}'.encode()).decode(); headers={'Authorization':'Basic '+auth,'Accept':'application/json','User-Agent':'K20-Product-Image-Inventory/1.0'}
          outdir=pathlib.Path('product-image-inventory-results'); outdir.mkdir(parents=True,exist_ok=True)
          def get(url):
              r=urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=180); return int(r.status),json.loads(r.read().decode('utf-8','replace')),dict(r.headers)
          for rp in reqs:
              q=json.loads(pathlib.Path(rp).read_text(encoding='utf-8'))
              if q.get('action')!='product_image.inventory': raise SystemExit('Unsupported action')
              status=str(q.get('status','publish')); max_pages=max(1,min(50,int(q.get('max_pages',20))))
              rows=[]; products=0; pages=0
              for page in range(1,max_pages+1):
                  params=urllib.parse.urlencode({'per_page':100,'page':page,'status':status,'orderby':'id','order':'asc','_fields':'id,name,slug,status,images'})
                  try: code,data,h=get(f'{base}/wp-json/wc/v3/products?{params}')
                  except urllib.error.HTTPError as e:
                      if e.code==400 and page>1: break
                      raise
                  if not (200<=code<300): raise SystemExit(f'Woo read failed page={page} http={code}')
                  if not data: break
                  pages+=1; products+=len(data)
                  for p in data:
                      for pos,img in enumerate(p.get('images') or []):
                          src=str(img.get('src') or ''); low=urllib.parse.urlsplit(src).path.lower()
                          if not low.endswith(('.jpg','.jpeg','.png')): continue
                          aid=int(img.get('id') or 0)
                          if aid<=0: continue
                          rows.append({'product_id':int(p['id']),'product_name':str(p.get('name') or ''),'product_slug':str(p.get('slug') or ''),'attachment_id':aid,'position':pos,'primary':pos==0,'src':src,'alt':str(img.get('alt') or '')})
                  total_pages=int(h.get('X-WP-TotalPages') or h.get('x-wp-totalpages') or 0)
                  if total_pages and page>=total_pages: break
                  if len(data)<100: break
              distinct=sorted({x['attachment_id'] for x in rows}); primary=sum(1 for x in rows if x['primary'])
              result={'action':'product_image.inventory','executed_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime()),'status':status,'pages_read':pages,'products_read':products,'jpeg_png_refs':len(rows),'distinct_attachment_ids':len(distinct),'primary_refs':primary,'items':rows}
              out=outdir/(pathlib.Path(rp).stem+'.json'); out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8'); print(f'Recorded {out}: products={products} refs={len(rows)} distinct={len(distinct)}')

      - name: Commit sanitized inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f product-image-inventory-results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record product image inventory"
          git pull --rebase origin main
          git push origin HEAD:main
