name: K21 Top30 Content Remediation Plan

on:
  push:
    branches: [main]
    paths:
      - 'k21-top30-ops/content-batch*.json'

permissions:
  contents: write

concurrency:
  group: k21-top30-content-plan
  cancel-in-progress: false

jobs:
  generate-bridge-requests:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Generate product and SEO requests
        run: python scripts/k21_top30_content_plan.py
      - name: Commit generated Bridge v3 requests and manifest
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k21-bridge-ops /tmp/k21-results
          cp bridge-v3-ops/20260923-k21-top30-*.json /tmp/k21-bridge-ops/
          cp k21-top30-results/top30-content-plan.json /tmp/k21-results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p bridge-v3-ops k21-top30-results
          cp /tmp/k21-bridge-ops/*.json bridge-v3-ops/
          cp /tmp/k21-results/top30-content-plan.json k21-top30-results/
          git add -f bridge-v3-ops/20260923-k21-top30-*.json k21-top30-results/top30-content-plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k21: queue human-written Top30 product and SEO remediation"
          git push origin HEAD:main
