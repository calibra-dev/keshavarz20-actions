name: K20 Phase 18 News CLI Lifecycle

on:
  push:
    branches: [main]
    paths:
      - 'phase18-news-lifecycle-ops/*.json'
      - 'scripts/k20_phase18_news_cli_lifecycle.py'
      - '.github/workflows/k20-phase18-news-cli-lifecycle.yml'

permissions:
  contents: write

concurrency:
  group: k20-phase18-news-cli-lifecycle
  cancel-in-progress: false

jobs:
  lifecycle:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - name: Create, read back, trash and verify a temporary news draft
        run: python scripts/k20_phase18_news_cli_lifecycle.py phase18-results/news-cli-lifecycle-latest.json
      - name: Persist sanitized lifecycle evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase18-results/news-cli-lifecycle-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase18: record news CLI lifecycle"
          git pull --rebase origin main
          git push origin HEAD:main
