name: K20 Elementor Route Discovery

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/wp-routes/*.json'

permissions:
  contents: write

concurrency:
  group: k20-elementor-route-discovery
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate route probe
        run: python -m py_compile scripts/k20_elementor_route_discovery.py
      - name: Discover Elementor REST routes read-only
        run: python scripts/k20_elementor_route_discovery.py
      - name: Commit sanitized route inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/wp-routes-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record sanitized Elementor route discovery"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0 || sleep 2; done
          exit 1
