name: K20 Gallery Product Creator Publish

on:
  push:
    branches: [main]
    paths:
      - 'engine-gallery-product-creator/approvals/*.json'

permissions:
  contents: write

concurrency:
  group: engine-gallery-product-creator-publish
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install publisher dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Resolve explicit approval
        id: approval
        shell: bash
        run: |
          set -euo pipefail
          approval=$(git diff --name-only HEAD^ HEAD -- 'engine-gallery-product-creator/approvals/*.json' | tail -n 1)
          test -n "$approval"
          echo "path=$approval" >> "$GITHUB_OUTPUT"
          batch=$(python -c "import json;print(json.load(open('$approval',encoding='utf-8'))['batch_id'])")
          echo "batch=$batch" >> "$GITHUB_OUTPUT"

      - name: Revalidate preview before any write
        shell: bash
        run: python engine-gallery-product-creator/scripts/validate_preview.py "${{ steps.approval.outputs.batch }}"

      - name: Publish only the explicitly approved hashes
        shell: bash
        run: python engine-gallery-product-creator/scripts/publish_approved.py "${{ steps.approval.outputs.path }}"

      - name: Commit verified publish evidence
        shell: bash
        run: |
          set -euo pipefail
          batch='${{ steps.approval.outputs.batch }}'
          test -f "engine-gallery-product-creator/publish-results/$batch.json"
          cp "engine-gallery-product-creator/publish-results/$batch.json" /tmp/publish-result.json
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git fetch origin main
          git reset --hard origin/main
          mkdir -p engine-gallery-product-creator/publish-results
          cp /tmp/publish-result.json "engine-gallery-product-creator/publish-results/$batch.json"
          git add "engine-gallery-product-creator/publish-results/$batch.json"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "engine-gallery-product-creator: record publish $batch"
          for i in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            sleep $((i*2))
          done
          exit 1
