name: K20 Wave1 Rendered DOM A11y Ownership

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/wave1-rendered-dom-a11y/*.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Resolve request
        id: req
        shell: bash
        run: |
          set -euo pipefail
          before='\${{ github.event.before }}'
          current='\${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          if [[ -n "$before" && "$before" != "$zero" ]]; then
            mapfile -t files < <(git diff --name-only "$before" "$current" -- 'diagnostics/wave1-rendered-dom-a11y/*.json' | sed '/^$/d' | sort -u)
          else
            mapfile -t files < <(git show --pretty= --name-only "$current" -- 'diagnostics/wave1-rendered-dom-a11y/*.json' | sed '/^$/d' | sort -u)
          fi
          [[ "\${#files[@]}" -eq 1 ]] || { echo "expected one request"; exit 1; }
          echo "request=\${files[0]}" >> "$GITHUB_OUTPUT"
          echo "result=diagnostics/wave1-rendered-dom-a11y-results/$(basename "\${files[0]}" .json)-result.json" >> "$GITHUB_OUTPUT"
      - name: Install parser
        run: python -m pip install --disable-pip-version-check --quiet beautifulsoup4
      - name: Dump rendered DOM and extract ownership
        shell: bash
        env:
          REQUEST: \${{ steps.req.outputs.request }}
          RESULT: \${{ steps.req.outputs.result }}
        run: |
          set -euo pipefail
          chrome="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser)"
          url="$(jq -r '.url' "$REQUEST")"
          "$chrome" --headless --no-sandbox --disable-gpu --disable-dev-shm-usage --virtual-time-budget=12000 --dump-dom "$url" > /tmp/dom.html 2>/tmp/chrome.err
          python - <<'PY'
          import os,json,hashlib,datetime
          from bs4 import BeautifulSoup
          req=json.load(open(os.environ['REQUEST'],encoding='utf-8'))
          html=open('/tmp/dom.html',encoding='utf-8',errors='replace').read()
          soup=BeautifulSoup(html,'html.parser')
          rows=[]
          def image_info(a):
              out=[]
              for img in a.find_all('img'):
                  out.append({
                      'src':img.get('src'),
                      'data_src':img.get('data-src'),
                      'srcset':img.get('srcset'),
                      'data_srcset':img.get('data-srcset'),
                      'alt':img.get('alt'),
                      'class':img.get('class')
                  })
              return out
          selectors=[
              ('login-register','a.login-register'),
              ('owl-link','.owl-stage a'),
              ('ads-item','a.ads-item'),
          ]
          for kind,sel in selectors:
              for i,a in enumerate(soup.select(sel)):
                  text=' '.join(a.stripped_strings)
                  rows.append({
                      'kind':kind,
                      'index':i,
                      'href':a.get('href'),
                      'class':a.get('class'),
                      'aria_label':a.get('aria-label'),
                      'title':a.get('title'),
                      'text':text[:300],
                      'images':image_info(a),
                      'outer_sha256':hashlib.sha256(str(a).encode()).hexdigest()
                  })
          dots=[]
          for i,b in enumerate(soup.select('button.owl-dot')):
              dots.append({
                  'index':i,
                  'aria_label':b.get('aria-label'),
                  'title':b.get('title'),
                  'text':' '.join(b.stripped_strings)[:200],
                  'class':b.get('class')
              })
          out={
            'mode':'read-only',
            'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'url':req.get('url'),
            'dom_bytes':len(html.encode()),
            'login_register':[x for x in rows if x['kind']=='login-register'],
            'owl_links':[x for x in rows if x['kind']=='owl-link'],
            'ads_items':[x for x in rows if x['kind']=='ads-item'],
            'owl_dots':dots,
            'summary':{
                'login_register':sum(1 for x in rows if x['kind']=='login-register'),
                'owl_links':sum(1 for x in rows if x['kind']=='owl-link'),
                'ads_items':sum(1 for x in rows if x['kind']=='ads-item'),
                'owl_dots':len(dots),
                'links_without_accessible_text':sum(1 for x in rows if not x['aria_label'] and not x['title'] and not x['text'] and not any((im.get('alt') or '').strip() for im in x['images'])),
                'dots_without_name':sum(1 for x in dots if not x['aria_label'] and not x['title'] and not x['text'])
            },
            'site_mutations':0
          }
          os.makedirs(os.path.dirname(os.environ['RESULT']),exist_ok=True)
          json.dump(out,open(os.environ['RESULT'],'w',encoding='utf-8'),ensure_ascii=False,indent=2)
          print(json.dumps(out['summary'],ensure_ascii=False))
          PY
      - name: Persist sanitized result
        shell: bash
        env:
          RESULT: \${{ steps.req.outputs.result }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$RESULT"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'wave1: record rendered DOM a11y ownership'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
