name: K20 WPVibe WPContent List Readonly

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/wpvibe-wpcontent-list/*.json'

permissions:
  contents: write

concurrency:
  group: k20-wpvibe-wpcontent-list-readonly
  cancel-in-progress: false

jobs:
  list:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: List wp-content path read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $before='${{ github.event.before }}'; $current='${{ github.sha }}'; $zero='0000000000000000000000000000000000000000'
          if($before -and $before -ne $zero){ $files=@(git diff --name-only $before $current -- 'diagnostics/wpvibe-wpcontent-list/*.json') }
          else { $files=@(git show --pretty='' --name-only $current -- 'diagnostics/wpvibe-wpcontent-list/*.json') }
          $reqPath=@($files | Where-Object { $_ -match '^diagnostics/wpvibe-wpcontent-list/.+\.json$' } | Sort-Object -Unique | Select-Object -First 1)
          if(-not $reqPath){ throw 'No request file found.' }
          $req=Get-Content -Raw -LiteralPath $reqPath | ConvertFrom-Json -Depth 10
          $directory=[string]$req.directory
          if([string]::IsNullOrWhiteSpace($directory)){ throw 'directory is required' }
          if($directory -match '\.\.' -or $directory -match '^(uploads|upgrade|cache)(/|$)'){ throw 'Unsafe directory scope.' }
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json'}
          $enc=[uri]::EscapeDataString($directory)
          $uri="$base/wp-json/wpvibe/v1/file/list?scope=wp-content&directory=$enc"
          $r=Invoke-RestMethod -Uri $uri -Headers $headers -Method GET -TimeoutSec 180
          $name=[IO.Path]::GetFileNameWithoutExtension($reqPath)
          New-Item -ItemType Directory -Force 'results' | Out-Null
          [ordered]@{mode='read-only';directory=$directory;response=$r}|ConvertTo-Json -Depth 30|Set-Content -LiteralPath "results/wpvibe-wpcontent-list-$name.json" -Encoding utf8
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/wpvibe-wpcontent-list-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase3: record wp-content plugin listing"
          git pull --rebase origin main
          git push origin HEAD:main
