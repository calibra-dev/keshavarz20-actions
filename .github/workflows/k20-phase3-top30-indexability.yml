name: K20 Phase 3 Top30 Indexability

on:
  push:
    branches: [main]
    paths:
      - 'phase3-index-ops/*.json'
  workflow_dispatch:
  schedule:
    - cron: '0 2 * * 1'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - run: python scripts/k20_phase3_top30_indexability.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase3-results/top30-indexability.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase3: record Top30 technical indexability"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
