name: K20 GrowthOS Phase 3 Policy Schema Audit
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase3-policy-ops/*.json'
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase3-policy-schema
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile scripts/k20_growthos_phase3_policy_schema.py
      - run: python scripts/k20_growthos_phase3_policy_schema.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/policy-schema-audit.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record shipping return schema audit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
