name: K20 Refund Elementor Raw Meta Probe

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/refund-elementor-raw/*.json'

permissions:
  contents: write

concurrency:
  group: k20-refund-elementor-raw-meta-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate probe
        run: python -m py_compile scripts/k20_refund_elementor_raw_meta_probe.py
      - name: Inspect Page 13 Elementor raw meta read-only
        run: python scripts/k20_refund_elementor_raw_meta_probe.py
      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/refund-elementor-raw-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record sanitized refund Elementor raw-meta probe"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0 || sleep 2; done
          exit 1
