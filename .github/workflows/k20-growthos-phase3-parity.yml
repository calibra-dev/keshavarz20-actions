name: K20 GrowthOS Phase 3 HTML Schema Feed Parity

on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase3-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-growthos-phase3-parity
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Validate
        run: python -m py_compile scripts/k20_growthos_phase3_parity.py
      - name: Audit live HTML Schema and Woo API parity
        run: python scripts/k20_growthos_phase3_parity.py
      - name: Commit sanitized parity evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/html-schema-feed-parity.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase3: record HTML schema feed parity"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
