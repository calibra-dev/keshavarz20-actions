name: K20 Resolve Product Slug Once

on:
  push:
    branches: [main]
    paths:
      - 'ops-resolve/product-slugs-20260914.json'

permissions:
  contents: write

jobs:
  resolve:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Resolve exact product slugs via WooCommerce REST
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($n in 'WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))) { throw "Missing required secret: $n" }
          }
          $req = Get-Content -Raw 'ops-resolve/product-slugs-20260914.json' | ConvertFrom-Json
          $base = $env:WP_BASE_URL.TrimEnd('/')
          $authText = "$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($authText))
          $headers = @{ Authorization = "Basic $auth"; Accept = 'application/json' }
          $out = @()
          foreach ($slug in @($req.slugs)) {
            $enc = [Uri]::EscapeDataString([string]$slug)
            $uri = "$base/wp-json/wc/v3/products?slug=$enc&status=any&per_page=10"
            $items = @(Invoke-RestMethod -Uri $uri -Method Get -Headers $headers -TimeoutSec 90)
            if ($items.Count -ne 1) { throw "Expected exactly 1 product for slug [$slug], got $($items.Count)" }
            $p = $items[0]
            $out += [ordered]@{
              id = $p.id
              name = $p.name
              slug = $p.slug
              status = $p.status
              sku = $p.sku
              stock_status = $p.stock_status
              stock_quantity = $p.stock_quantity
              manage_stock = $p.manage_stock
              modified_gmt = $p.date_modified_gmt
              categories = @($p.categories | ForEach-Object { [ordered]@{ id=$_.id; name=$_.name; slug=$_.slug } })
              tags = @($p.tags | ForEach-Object { [ordered]@{ id=$_.id; name=$_.name; slug=$_.slug } })
              images = @($p.images | ForEach-Object { [ordered]@{ id=$_.id; name=$_.name; alt=$_.alt } })
              permalink = $p.permalink
            }
          }
          $record = [ordered]@{ ok=$true; executed_at_utc=[DateTime]::UtcNow.ToString('o'); action='product.resolve_by_slug'; results=$out }
          $json = $record | ConvertTo-Json -Depth 20
          $path = 'ops-resolve-results/product-slugs-20260914.json'
          $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($json))
          $api = "https://api.github.com/repos/${{ github.repository }}/contents/$path"
          $ghHeaders = @{ Authorization="Bearer $env:GH_TOKEN"; Accept='application/vnd.github+json'; 'X-GitHub-Api-Version'='2022-11-28'; 'User-Agent'='k20-slug-resolver' }
          $existingSha = $null
          try { $existing = Invoke-RestMethod -Uri "${api}?ref=main" -Headers $ghHeaders -Method Get -TimeoutSec 60; $existingSha=$existing.sha } catch { if (-not ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404)) { throw } }
          $body = [ordered]@{ message='ops: record one-time product slug resolution'; content=$encoded; branch='main' }
          if ($existingSha) { $body.sha = $existingSha }
          Invoke-RestMethod -Uri $api -Headers $ghHeaders -Method Put -ContentType 'application/json' -Body ($body | ConvertTo-Json -Depth 10) -TimeoutSec 60 | Out-Null
          Write-Host 'K20_SLUG_RESOLVE_OK'
