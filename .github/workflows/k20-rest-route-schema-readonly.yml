name: K20 REST Route Schema Readonly

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/rest-route-schema/*.json'

permissions:
  contents: read

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Inspect exact REST route schemas read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $reqPath=(git show --pretty='' --name-only '${{ github.sha }}' -- 'diagnostics/rest-route-schema/*.json' | Select-Object -First 1)
          if([string]::IsNullOrWhiteSpace($reqPath)){throw 'No request file found.'}
          $req=Get-Content -Raw -LiteralPath $reqPath|ConvertFrom-Json -Depth 10
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json'}
          $index=Invoke-RestMethod -Uri "$base/wp-json/" -Headers $headers -Method GET -TimeoutSec 180
          $out=@()
          foreach($route in @($req.routes)){
            $p=$index.routes.PSObject.Properties[[string]$route]
            if($null -eq $p){$out+=,[pscustomobject]@{route=[string]$route;found=$false};continue}
            $out+=,[pscustomobject]@{route=[string]$route;found=$true;definition=$p.Value}
          }
          $dir=Join-Path $env:RUNNER_TEMP 'k20-route-schema';New-Item -ItemType Directory -Force $dir|Out-Null
          [ordered]@{mode='read-only';routes=$out}|ConvertTo-Json -Depth 30|Set-Content -LiteralPath (Join-Path $dir 'schema.json') -Encoding utf8
      - name: Upload private schema artifact
        uses: actions/upload-artifact@v4
        with:
          name: k20-rest-route-schema
          path: ${{ runner.temp }}/k20-route-schema/schema.json
          retention-days: 3
