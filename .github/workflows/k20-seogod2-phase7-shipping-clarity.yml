name: SEO God2 Phase 7 Shipping Clarity

on:
  push:
    branches: [main]
    paths:
      - 'seo-god2-phase7-ops/*.json'
      - 'scripts/k20_seogod2_phase7_shipping_clarity.py'
      - 'tests/test_seogod2_phase7_shipping_clarity.py'
      - 'seo-god2/phase7-shipping-truth-20260930.json'
      - '.github/workflows/k20-seogod2-phase7-shipping-clarity.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-seogod2-phase7-shipping-clarity
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/k20_seogod2_phase7_shipping_clarity.py
      - name: Safety tests
        run: python -m unittest tests.test_seogod2_phase7_shipping_clarity -v
      - name: Build Phase 7 plan
        run: python scripts/k20_seogod2_phase7_shipping_clarity.py
      - name: Acceptance gate
        shell: python
        run: |
          import json
          from pathlib import Path
          r=json.loads(Path("seo-god2/phase7-shipping-clarity-plan-20260930.json").read_text(encoding="utf-8"))
          assert r["status"] == "PASS_SHIPPING_TRUTH_LOCKED"
          assert r["scope"]["tier_a_products"] == 20
          p=r["canonical_policy"]
          assert p["allowed_methods"] == ["باربری","تیپاکس"]
          assert p["shipping_charge"].startswith("پس‌کرایه")
          assert p["free_shipping"] is False
          assert p["local_pickup"] is False
          assert p["fixed_delivery_promise"] is False
          g=r["guardrails"]
          assert g["fixed_shipping_price_allowed"] is False
          assert g["fixed_delivery_days_allowed"] is False
          assert g["per_sku_carrier_guarantee_allowed"] is False
          print("PHASE7_PLAN_ACCEPTANCE_OK")
      - name: Commit Phase 7 plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seo-god2/phase7-shipping-clarity-plan-20260930.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "seo god2 phase7: record shipping clarity plan"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
