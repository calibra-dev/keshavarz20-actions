name: K20 Site HTTP Recheck
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-site-http-recheck.yml']
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 4
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 0 }
      - shell: bash
        run: |
          set -euo pipefail
          code=$(curl -L -sS -o /tmp/p -w '%{http_code}' --max-time 20 'https://keshavarz20.com/catalog/?recheck=1' || true)
          mkdir -p diagnostics
          python3 - "$code" <<'PY'
          import sys,json,pathlib
          body=pathlib.Path('/tmp/p').read_text(errors='replace') if pathlib.Path('/tmp/p').exists() else ''
          out={'status':sys.argv[1],'head':body[:500]}
          pathlib.Path('diagnostics/k20-site-http-recheck.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          print(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/k20-site-http-recheck.json
          git commit -m 'diag: recheck site HTTP' || true
          git pull --rebase origin main || true
          git push || true
