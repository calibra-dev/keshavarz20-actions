name: K20 SEO God1 Phase07 Discovery Audit
on:
  push:
    branches: [main]
    paths:
      - 'seo-god1-ops/phase07-*.json'
      - 'scripts/k20_seogod1_phase7_audit.py'
      - '.github/workflows/k20-seogod1-phase7-audit.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-seogod1-phase7-audit
  cancel-in-progress: false
jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python scripts/k20_seogod1_phase7_audit.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f seo-god1-results/phase07-discovery-live-audit.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'seo-god1: record phase07 discovery audit'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
