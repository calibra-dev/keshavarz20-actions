name: K20 Phase 20 Site Context Read

on:
  push:
    branches: [main]
    paths:
      - 'phase20-context-ops/*.json'

permissions:
  contents: write

jobs:
  read-context:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Read WordPress front-page and active-theme context
        shell: python
        run: |
          import os,json,base64,urllib.request,datetime
          base=os.environ['WP_BASE_URL'].rstrip('/')
          token=base64.b64encode((os.environ['WP_USERNAME']+':'+os.environ['WP_APP_PASSWORD']).encode()).decode()
          headers={'Authorization':'Basic '+token,'Accept':'application/json','User-Agent':'K20-Phase20-Context/1.1'}
          def get(path):
              req=urllib.request.Request(base+path,headers=headers)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return json.load(r)
          settings=get('/wp-json/wp/v2/settings')
          out={
            'phase':20,
            'type':'site_context_read',
            'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'show_on_front':settings.get('show_on_front'),
            'page_on_front':settings.get('page_on_front'),
            'page_for_posts':settings.get('page_for_posts'),
            'site_title':settings.get('title'),
            'site_mutations':0
          }
          try:
              themes=get('/wp-json/wp/v2/themes?status=active&context=edit')
              out['active_themes']=[]
              for x in themes:
                  name=x.get('name')
                  if isinstance(name,dict):
                      name=name.get('rendered') or name.get('raw')
                  out['active_themes'].append({
                      'stylesheet':x.get('stylesheet'),
                      'template':x.get('template'),
                      'name':name,
                      'version':x.get('version'),
                      'status':x.get('status')
                  })
          except Exception as e:
              out['theme_read_error']=str(e)
          os.makedirs('phase20-results',exist_ok=True)
          json.dump(out,open('phase20-results/site-context-latest.json','w'),ensure_ascii=False,indent=2)
      - name: Persist context
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase20-results/site-context-latest.json
          git commit -m "phase20: record WordPress site context" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
