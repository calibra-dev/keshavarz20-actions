name: K20 WPVibe Draft File Search Readonly

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/wpvibe-file-search/*.json'

permissions:
  contents: read

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Search draft theme read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $reqPath=(git show --pretty='' --name-only '${{ github.sha }}' -- 'diagnostics/wpvibe-file-search/*.json' | Select-Object -First 1)
          if([string]::IsNullOrWhiteSpace($reqPath)){throw 'No request file found.'}
          $req=Get-Content -Raw -LiteralPath $reqPath | ConvertFrom-Json -Depth 10
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json';'Content-Type'='application/json'}
          $results=@()
          foreach($pattern in @($req.patterns)){
            $body=[ordered]@{pattern=[string]$pattern;case_sensitive=$false;max_results=50}|ConvertTo-Json -Compress
            try{
              $r=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/file/search" -Headers $headers -Method POST -Body $body -TimeoutSec 180
              $results+=,[pscustomobject]@{pattern=[string]$pattern;ok=$true;result=$r}
            }catch{
              $results+=,[pscustomobject]@{pattern=[string]$pattern;ok=$false;error=$_.Exception.Message}
            }
          }
          $dir=Join-Path $env:RUNNER_TEMP 'k20-wpvibe-file-search';New-Item -ItemType Directory -Force $dir|Out-Null
          [ordered]@{mode='read-only';results=$results}|ConvertTo-Json -Depth 30|Set-Content -LiteralPath (Join-Path $dir 'search.json') -Encoding utf8
          Write-Host "WPVIBE_FILE_SEARCH_OK patterns=$($results.Count)"
      - name: Upload private diagnostic artifact
        uses: actions/upload-artifact@v4
        with:
          name: k20-wpvibe-file-search
          path: ${{ runner.temp }}/k20-wpvibe-file-search/search.json
          retention-days: 3
