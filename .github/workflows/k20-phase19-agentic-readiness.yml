name: K20 Phase 19 Feed API Agentic Readiness

on:
  push:
    branches: [main]
    paths:
      - 'phase19-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase19-agentic-readiness
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: python -m pip install requests
      - name: Compile full-catalog readiness chain
        run: |
          python -m py_compile scripts/k20_growthos_phase11_chatgpt_search.py
          python -m py_compile scripts/k20_growthos_phase12_merchant_ucp.py
          python -m py_compile scripts/k20_growthos_phase14_gs1.py
          python -m py_compile scripts/k20_growthos_phase15_entity_os.py
          python -m py_compile scripts/k20_phase19_agentic_readiness.py
      - name: Refresh Phase 11 full catalog and OpenAI readiness
        run: python scripts/k20_growthos_phase11_chatgpt_search.py
      - name: Refresh Phase 12 Merchant and UCP policy readiness
        run: python scripts/k20_growthos_phase12_merchant_ucp.py
      - name: Refresh Phase 14 identifier truth
        run: python scripts/k20_growthos_phase14_gs1.py
      - name: Refresh Phase 15 brand and seller truth
        run: python scripts/k20_growthos_phase15_entity_os.py
      - name: Record rolling upstream refresh evidence
        env:
          GITHUB_RUN_ID_VALUE: ${{ github.run_id }}
        run: |
          python - <<'PY'
          import json, os
          from datetime import datetime, timezone
          from pathlib import Path
          def load(p):
              return json.loads(Path(p).read_text(encoding="utf-8"))
          p11=load("growthos-phase11-results/summary.json")
          p12=load("growthos-phase12-results/summary.json")
          p14=load("growthos-phase14-results/summary.json")
          p15=load("growthos-phase15-results/summary.json")
          out={
            "phase":19,
            "version":"phase19-v2-upstream-refresh-evidence",
            "source_run_id":int(os.environ["GITHUB_RUN_ID_VALUE"]),
            "observed_from_successful_steps":True,
            "observed_at_utc":datetime.now(timezone.utc).isoformat(),
            "phase11":{
              "status":p11.get("status"),
              "candidate_rows":p11.get("openai_feed_candidate_rows"),
              "ready_rows":p11.get("openai_feed_ready_rows"),
              "ready_percent":p11.get("openai_feed_ready_percent"),
              "direct_feed_submitted":p11.get("direct_feed_submitted"),
              "direct_feed_partner_access_proven":p11.get("direct_feed_partner_access_proven")
            },
            "phase12":{
              "status":p12.get("status"),
              "candidate_rows":p12.get("merchant_candidate_rows"),
              "ready_rows":p12.get("merchant_basic_ready_rows"),
              "merchant_submission_attempted":p12.get("merchant_center_submission_attempted"),
              "fake_country_or_address_used":p12.get("fake_country_or_address_used"),
              "ucp_public_profile_published":p12.get("ucp_public_profile_published"),
              "ucp_live_adapter_claimed":p12.get("ucp_live_adapter_claimed")
            },
            "phase14":{
              "status":p14.get("status"),
              "published_products":p14.get("published_products"),
              "source_verified_gtins":p14.get("source_verified_gtins"),
              "gtins_fabricated":p14.get("gtins_fabricated"),
              "skus_promoted_to_gtin":p14.get("skus_promoted_to_gtin")
            },
            "phase15":{
              "status":p15.get("status"),
              "published_products":p15.get("published_products"),
              "source_verified_truth_brand_products":p15.get("source_verified_truth_brand_products"),
              "products_without_woo_brand":p15.get("products_without_woo_brand"),
              "brand_truth_mismatches":p15.get("brand_truth_mismatches"),
              "identity_fields_fabricated":p15.get("identity_fields_fabricated"),
              "sameAs_links_fabricated":p15.get("sameAs_links_fabricated"),
              "glns_fabricated":p15.get("glns_fabricated"),
              "seller_entity_found":p15.get("seller_entity_found"),
              "seller_name_consistent":p15.get("seller_name_consistent")
            }
          }
          Path("phase19-results/upstream-refresh-latest.json").write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Validate Phase 19 v2 full catalog readiness
        run: |
          python scripts/k20_phase19_agentic_readiness.py phase19-results/agentic-readiness-latest.json phase19-results/product-discovery-readiness-feed.json             phase19-results/upstream-refresh-latest.json
      - name: Persist sanitized read-only evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             growthos-phase11-results/chatgpt-search-crawl-audit.json             growthos-phase11-results/openai-product-feed-readiness.json             growthos-phase11-results/summary.json             growthos-phase12-results/merchant-field-map.json             growthos-phase12-results/ucp-readiness-contract.json             growthos-phase12-results/summary.json             growthos-phase14-results/digital-link-contract.json             growthos-phase14-results/identifier-registry.json             growthos-phase14-results/summary.json             growthos-phase15-results/brand-entity-registry.json             growthos-phase15-results/entity-graph.json             growthos-phase15-results/entity-parity-audit.json             growthos-phase15-results/seller-entity-registry.json             growthos-phase15-results/summary.json             phase19-results/agentic-readiness-latest.json             phase19-results/product-discovery-readiness-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase19 v2: record full catalog agentic readiness"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
