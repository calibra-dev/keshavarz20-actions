name: K20 Phase 19 Feed API Agentic Readiness

on:
  push:
    branches: [main]
    paths:
      - 'phase19-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase19-agentic-readiness
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install dependencies
        run: python -m pip install requests
      - name: Refresh live page schema feed parity
        run: python scripts/k20_phase3_page_schema_feed_parity.py
      - name: Refresh canonical PIM read model
        run: python scripts/k20_phase9_canonical_pim.py
      - name: Validate agentic readiness without external submission
        run: |
          python -m py_compile scripts/k20_phase19_agentic_readiness.py
          python scripts/k20_phase19_agentic_readiness.py phase19-results/agentic-readiness-latest.json phase19-results/product-discovery-readiness-feed.json
      - name: Persist fresh read-only evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase3-results/top30-product-feed.json phase3-results/page-schema-feed-parity.json phase9-results/canonical-pim.json phase9-results/acceptance.json phase19-results/agentic-readiness-latest.json phase19-results/product-discovery-readiness-feed.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase19: record fresh feed API agentic readiness"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
