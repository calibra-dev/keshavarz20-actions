name: GrowthOS Membership Value Draft QA
on:
  push:
    branches: [main]
    paths:
      - 'growthos-membership/**'
      - 'tests/test_membership_value_snippet.py'
      - '.github/workflows/k20-membership-value-draft-qa.yml'
  workflow_dispatch:
permissions:
  contents: read
jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python tests/test_membership_value_snippet.py
