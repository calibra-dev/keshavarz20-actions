name: K20 GrowthOS Phase 9 Readback
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase9-readback-ops/*.json'
      - 'scripts/k20_growthos_phase9_readback.py'
      - '.github/workflows/k20-growthos-phase9-readback.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase9-readback
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_growthos_phase9_readback.py
      - run: python scripts/k20_growthos_phase9_readback.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase9-results/independent-readback.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase9: record independent readback"
          git pull --rebase origin main
          git push origin main
