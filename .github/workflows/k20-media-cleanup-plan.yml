name: Keshavarz20 Media Cleanup Plan

on:
  push:
    branches: [main]
    paths:
      - 'media-cleanup-plan-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-media-cleanup-plan
  cancel-in-progress: false

jobs:
  plan:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_media_cleanup_plan.py
      - name: Build fail-closed cleanup plan
        run: python scripts/k20_media_cleanup_plan.py
      - name: Commit sanitized plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media-cleanup-plan/plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record zero-reference cleanup plan"
          git pull --rebase origin main
          git push origin HEAD:main
