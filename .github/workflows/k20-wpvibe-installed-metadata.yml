name: K20 WPVibe Installed Metadata Readonly

on:
  push:
    branches: [main]
    paths:
      - 'wpvibe-metadata-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-wpvibe-metadata-readonly
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Inspect WPVibe plugin metadata and REST route surface
        shell: python
        run: |
          import json, os, requests
          from pathlib import Path
          base=os.environ["WP_BASE_URL"].rstrip("/")
          s=requests.Session()
          s.auth=(os.environ["WP_USERNAME"],os.environ["WP_APP_PASSWORD"])
          s.headers.update({"Accept":"application/json","Cache-Control":"no-cache","User-Agent":"k20-wpvibe-metadata-readonly/1.0"})
          out={"read_only":True,"site":base}
          r=s.get(base+"/wp-json/",timeout=60)
          out["rest_index_http"]=r.status_code
          data=r.json() if r.ok else {}
          routes=data.get("routes",{}) if isinstance(data,dict) else {}
          clean={}
          for path,meta in routes.items():
              if "wpvibe" in path.lower():
                  clean[path]={
                      "namespace":meta.get("namespace"),
                      "methods":meta.get("methods"),
                  }
          out["wpvibe_route_count"]=len(clean)
          out["wpvibe_routes"]=clean
          pr=s.get(base+"/wp-json/wp/v2/plugins",params={"search":"wpvibe"},timeout=60)
          out["plugins_http"]=pr.status_code
          plugins=[]
          if pr.ok:
              pdata=pr.json()
              if isinstance(pdata,list):
                  for p in pdata:
                      text=(str(p.get("plugin",""))+" "+str(p.get("name",""))).lower()
                      if "wpvibe" in text or "vibe-ai" in text:
                          plugins.append({
                              "plugin":p.get("plugin"),
                              "status":p.get("status"),
                              "version":p.get("version"),
                              "name":p.get("name"),
                          })
          out["wpvibe_plugins"]=plugins
          Path("wpvibe-connectivity-results").mkdir(exist_ok=True)
          Path("wpvibe-connectivity-results/installed-metadata.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps({"ok":True,"wpvibe_route_count":len(clean),"plugins_http":pr.status_code,"plugin_matches":len(plugins)}))
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f wpvibe-connectivity-results/installed-metadata.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record installed WPVibe metadata"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
