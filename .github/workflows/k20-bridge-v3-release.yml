name: Keshavarz20 Bridge v3.3.32 Release

on:
  push:
    branches: [main]
    paths:
      - 'plugins/k20-bridge-v3/**'
      - '.github/workflows/k20-bridge-v3-release.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-bridge-v3.3.32-release
  cancel-in-progress: false

jobs:
  release:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4

      - name: Validate version
        shell: bash
        run: |
          set -euo pipefail
          grep -q 'Version: 3.3.32' plugins/k20-bridge-v3/k20-bridge-v3.php
          python - <<'PY'
          import json
          m=json.load(open('plugins/k20-bridge-v3/update-manifest.json'))
          assert m['version']=='3.3.32'
          PY

      - name: PHP syntax validation
        shell: bash
        run: |
          set -euo pipefail
          find plugins/k20-bridge-v3 -type f -name '*.php' -print0 | xargs -0 -n1 php -l

      - name: Build release package
        shell: bash
        run: |
          set -euo pipefail
          rm -rf dist
          mkdir -p dist/k20-bridge-v3
          cp -R plugins/k20-bridge-v3/. dist/k20-bridge-v3/
          cd dist
          zip -qr k20-bridge-v3.3.32.zip k20-bridge-v3
          sha256sum k20-bridge-v3.3.32.zip > k20-bridge-v3.3.32.sha256

      - name: Publish or refresh release assets
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view v3.3.32 >/dev/null 2>&1; then
            gh release upload v3.3.32 dist/k20-bridge-v3.3.32.zip dist/k20-bridge-v3.3.32.sha256 --clobber
          else
            gh release create v3.3.32               dist/k20-bridge-v3.3.32.zip               dist/k20-bridge-v3.3.32.sha256               --title 'Keshavarz20 Bridge v3.3.32'               --notes 'Guarded K20 Bridge v3.3: direct chat-asset relay, product/post image binding, secure draft-only snippet code operations, guarded code inspection, rollback, approval, jobs, observability and self-update.'
          fi