name: K20 Phase 3 Calculator Featured Optimize

on:
  push:
    branches: [main]
    paths:
      - 'phase3-calculator-media-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase3-calculator-featured-optimize
  cancel-in-progress: false

jobs:
  optimize:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Optimize calculator featured image with guarded readback
        shell: python
        run: |
          import base64, hashlib, io, json, math, os, pathlib, subprocess, urllib.error, urllib.parse, urllib.request
          from PIL import Image, ImageChops, ImageOps

          ALLOWED_POST_ID = 143698
          EXPECTED_OLD_MEDIA_ID = 144847
          EXPECTED_SLUG = 'drip-tape-length-fittings-calculator'

          def changed_request():
              cmds = [
                  ['git','diff','--name-only','HEAD^','HEAD','--','phase3-calculator-media-ops/*.json'],
                  ['git','show','--pretty=','--name-only','HEAD','--','phase3-calculator-media-ops/*.json'],
              ]
              for cmd in cmds:
                  xs=[x.strip() for x in subprocess.check_output(cmd,text=True).splitlines() if x.strip().startswith('phase3-calculator-media-ops/') and x.strip().endswith('.json')]
                  if xs:
                      return sorted(set(xs))[0]
              raise SystemExit('No calculator media request found')

          rp=changed_request()
          req=json.loads(pathlib.Path(rp).read_text(encoding='utf-8'))
          apply=req.get('apply') is True
          max_width=int(req.get('max_width',1200))
          quality=int(req.get('quality',80))
          min_psnr=float(req.get('min_psnr',36.0))
          max_output_bytes=int(req.get('max_output_bytes',350000))
          if not (768 <= max_width <= 1400): raise SystemExit('max_width out of guarded range')
          if not (75 <= quality <= 88): raise SystemExit('quality out of guarded range')
          if not (34.0 <= min_psnr <= 50.0): raise SystemExit('min_psnr out of guarded range')
          if not (100000 <= max_output_bytes <= 600000): raise SystemExit('max_output_bytes out of guarded range')

          base=os.environ['WP_BASE_URL'].rstrip('/')
          user=os.environ['WP_USERNAME']; password=os.environ['WP_APP_PASSWORD']
          auth=base64.b64encode(f'{user}:{password}'.encode()).decode()
          common={'Authorization':'Basic '+auth,'Accept':'application/json','User-Agent':'K20-Calculator-Featured-Optimize/1.0'}

          def qurl(url):
              p=urllib.parse.urlsplit(url)
              return urllib.parse.urlunsplit((p.scheme,p.netloc,urllib.parse.quote(urllib.parse.unquote(p.path),safe='/%'),p.query,p.fragment))

          def api(method,path,body=None,content_type='application/json; charset=utf-8',extra_headers=None):
              headers=dict(common)
              if extra_headers: headers.update(extra_headers)
              data=None
              if body is not None:
                  if isinstance(body,(bytes,bytearray)): data=bytes(body)
                  else: data=json.dumps(body,ensure_ascii=False,separators=(',',':')).encode()
                  headers['Content-Type']=content_type
              request=urllib.request.Request(qurl(base+path),data=data,method=method,headers=headers)
              try:
                  with urllib.request.urlopen(request,timeout=180) as r:
                      raw=r.read()
                      ct=str(r.headers.get('Content-Type') or '')
                      obj=json.loads(raw.decode('utf-8','replace')) if raw and 'json' in ct else raw
                      return int(r.status),obj
              except urllib.error.HTTPError as e:
                  raw=e.read().decode('utf-8','replace')
                  try: obj=json.loads(raw)
                  except Exception: obj={'raw':raw[:1000]}
                  return int(e.code),obj

          pc,post=api('GET',f'/wp-json/wp/v2/posts/{ALLOWED_POST_ID}?context=edit')
          if pc != 200: raise SystemExit(f'post read failed http={pc}')
          if str(post.get('slug')) != EXPECTED_SLUG: raise SystemExit('post slug mismatch')
          current_featured=int(post.get('featured_media') or 0)
          if current_featured != EXPECTED_OLD_MEDIA_ID:
              raise SystemExit(f'featured media changed unexpectedly: {current_featured}')

          mc,media=api('GET',f'/wp-json/wp/v2/media/{EXPECTED_OLD_MEDIA_ID}?context=edit')
          if mc != 200: raise SystemExit(f'media read failed http={mc}')
          src=str(media.get('source_url') or '')
          mime=str(media.get('mime_type') or '').lower()
          alt=str(media.get('alt_text') or '')
          title=(media.get('title') or {}).get('raw') if isinstance(media.get('title'),dict) else str(media.get('title') or '')
          if mime not in ('image/webp','image/png','image/jpeg'): raise SystemExit(f'unsupported media type {mime}')
          if not src: raise SystemExit('source URL missing')

          fetch=urllib.request.Request(qurl(src),headers={'User-Agent':'K20-Calculator-Featured-Optimize/1.0'})
          with urllib.request.urlopen(fetch,timeout=180) as r:
              original=r.read()
          im=ImageOps.exif_transpose(Image.open(io.BytesIO(original))); im.load()
          ow,oh=im.size
          if ow < 700 or oh < 350: raise SystemExit('source dimensions unexpectedly small')
          if ow > max_width:
              nh=max(1,round(oh*(max_width/ow)))
              resized=im.resize((max_width,nh),Image.Resampling.LANCZOS)
          else:
              resized=im.copy()
          if 'A' in resized.getbands():
              rgba=resized.convert('RGBA'); bg=Image.new('RGBA',rgba.size,(255,255,255,255)); bg.alpha_composite(rgba); enc=bg.convert('RGB')
          else:
              enc=resized.convert('RGB')
          out=io.BytesIO(); enc.save(out,format='WEBP',quality=quality,method=6)
          data=out.getvalue()
          dec=Image.open(io.BytesIO(data)); dec.load(); dec=dec.convert('RGB')
          ref=enc.convert('RGB')
          diff=ImageChops.difference(ref,dec)
          hist=diff.histogram(); sq=0.0
          for i,count in enumerate(hist):
              v=i%256; sq += count*(v*v)
          mse=sq/float(ref.size[0]*ref.size[1]*3)
          psnr=99.0 if mse<=0 else 20.0*math.log10(255.0/math.sqrt(mse))
          if psnr < min_psnr: raise SystemExit(f'PSNR {psnr:.2f} below guard {min_psnr}')
          if len(data) > max_output_bytes: raise SystemExit(f'candidate {len(data)} exceeds max_output_bytes={max_output_bytes}')

          result={
              'mode':'apply' if apply else 'dry-run',
              'post_id':ALLOWED_POST_ID,
              'post_slug':EXPECTED_SLUG,
              'old_featured_media':EXPECTED_OLD_MEDIA_ID,
              'source_url':src,
              'source_mime':mime,
              'source_width':ow,
              'source_height':oh,
              'source_bytes':len(original),
              'candidate_width':enc.size[0],
              'candidate_height':enc.size[1],
              'quality':quality,
              'candidate_bytes':len(data),
              'saving_pct_vs_full':round((1-len(data)/float(len(original)))*100,2),
              'psnr_db':round(psnr,2),
              'candidate_sha256':hashlib.sha256(data).hexdigest(),
              'applied':False,
              'site_mutations':0,
          }

          new_id=None
          try:
              if apply:
                  filename='k20-calculator-featured-optimized-1200.webp'
                  uc,uploaded=api(
                      'POST','/wp-json/wp/v2/media',
                      data,
                      'image/webp',
                      {'Content-Disposition':f'attachment; filename="{filename}"'}
                  )
                  if uc not in (200,201) or not isinstance(uploaded,dict): raise RuntimeError(f'upload failed http={uc}')
                  new_id=int(uploaded.get('id') or 0)
                  if new_id < 1: raise RuntimeError('new media id missing')
                  meta={'title':title or 'ماشین حساب نوار تیپ','alt_text':alt or 'محاسبه متراژ نوار تیپ، تعداد رول و اتصالات آبیاری','caption':'','description':'تصویر شاخص بهینه‌شده ماشین حساب نوار تیپ کشاورز بیست'}
                  sc,_=api('POST',f'/wp-json/wp/v2/media/{new_id}',meta)
                  if sc not in (200,201): raise RuntimeError(f'media metadata update failed http={sc}')
                  uc2,_=api('POST',f'/wp-json/wp/v2/posts/{ALLOWED_POST_ID}',{'featured_media':new_id})
                  if uc2 not in (200,201): raise RuntimeError(f'post featured update failed http={uc2}')
                  rc,rb=api('GET',f'/wp-json/wp/v2/posts/{ALLOWED_POST_ID}?context=edit')
                  if rc != 200 or int(rb.get('featured_media') or 0) != new_id: raise RuntimeError('post readback failed')
                  mrc,mrb=api('GET',f'/wp-json/wp/v2/media/{new_id}?context=edit')
                  if mrc != 200: raise RuntimeError('new media readback failed')
                  details=mrb.get('media_details') or {}
                  sizes=details.get('sizes') or {}
                  result.update({
                      'new_featured_media':new_id,
                      'new_source_url':mrb.get('source_url'),
                      'new_width':details.get('width'),
                      'new_height':details.get('height'),
                      'new_filesize':details.get('filesize'),
                      'generated_768':sizes.get('medium_large'),
                      'readback_featured_media':int(rb.get('featured_media') or 0),
                      'applied':True,
                      'site_mutations':2,
                  })
              pathlib.Path('phase3-results').mkdir(exist_ok=True)
              outpath=pathlib.Path('phase3-results')/('calculator-featured-optimize-'+pathlib.Path(rp).stem+'.json')
              outpath.write_text(json.dumps(result,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
              print('CALCULATOR_FEATURED_OPTIMIZE',json.dumps(result,ensure_ascii=False))
          except Exception as exc:
              if new_id:
                  try:
                      api('POST',f'/wp-json/wp/v2/posts/{ALLOWED_POST_ID}',{'featured_media':EXPECTED_OLD_MEDIA_ID})
                      api('DELETE',f'/wp-json/wp/v2/media/{new_id}?force=true')
                  except Exception:
                      pass
              raise

      - name: Commit sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase3-results/calculator-featured-optimize-*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase3: record calculator featured optimization"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
