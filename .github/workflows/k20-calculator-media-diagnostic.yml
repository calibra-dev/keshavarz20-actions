name: K20 Calculator Media Diagnostic
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-calculator-media-diagnostic.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import json,re,urllib.request,html,os
          base='https://keshavarz20.com'
          ua={'User-Agent':'Mozilla/5.0'}
          def get(url):
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read().decode('utf-8','replace')
          page_url=base+'/drip-tape-length-fittings-calculator/'
          src=get(page_url)
          out={'page_url':page_url,'html_bytes':len(src.encode())}
          m=re.search(r'<img[^>]+class="[^"]*k20-calculator-lcp[^"]*"[^>]*>',src,re.I)
          if not m:
              m=re.search(r'<figure[^>]*class="[^"]*post-img[^"]*"[^>]*>.*?<img[^>]*>',src,re.I|re.S)
          tag=m.group(0) if m else ''
          out['lcp_tag']=tag[:5000]
          attrs={}
          for k in ['src','srcset','sizes','width','height','loading','fetchpriority','decoding','alt']:
              mm=re.search(r'\b'+k+r'="([^"]*)"',tag,re.I)
              if mm: attrs[k]=html.unescape(mm.group(1))
          out['lcp_attrs']=attrs
          from html.parser import HTMLParser
          class AssetParser(HTMLParser):
              def __init__(self):
                  super().__init__()
                  self.tags=[]
              def handle_starttag(self, tagname, attrs_list):
                  if tagname not in ('link','script'):
                      return
                  attrs=dict(attrs_list)
                  url=attrs.get('href') or attrs.get('src')
                  if not url:
                      return
                  self.tags.append({
                      'tagname':tagname,
                      'id':attrs.get('id'),
                      'rel':attrs.get('rel'),
                      'url':html.unescape(url),
                      'attrs':attrs
                  })
          ap=AssetParser()
          ap.feed(src)
          out['asset_tags']=ap.tags
          post=None
          for typ in ['posts','pages']:
              try:
                  raw=get(base+f'/wp-json/wp/v2/{typ}/143698?_fields=id,type,featured_media,link')
                  row=json.loads(raw)
                  if isinstance(row,dict) and row.get('id')==143698:
                      post=row; out['post_type']=typ; break
              except Exception as e:
                  out[f'{typ}_error']=str(e)
          out['post']=post
          if post and post.get('featured_media'):
              mid=post['featured_media']
              try:
                  media=json.loads(get(base+f'/wp-json/wp/v2/media/{mid}?_fields=id,source_url,mime_type,media_details,alt_text,caption'))
                  out['media']=media
              except Exception as e:
                  out['media_error']=str(e)
          os.makedirs('diagnostics',exist_ok=True)
          open('diagnostics/calculator-media-diagnostic.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-media-diagnostic.json
          git commit -m "diag: record calculator media details" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

