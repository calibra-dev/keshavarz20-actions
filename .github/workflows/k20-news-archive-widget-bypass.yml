name: K20 News Archive Widget Safe Bypass

on:
  push:
    branches: [main]
    paths:
      - 'news-archive-widget-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-news-archive-widget-safe-bypass
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply guarded page-only bypass with automatic rollback
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, subprocess, time, urllib.error, urllib.request

          PAGE_ID = 141755
          EXPECTED_BEFORE_SHA = '2934f5005e27945994860bbe5c0e9538e6f6efb9fb50b033260a6e07c3465e5e'
          EXPECTED_BEFORE_LENGTH = 811
          EXPECTED_WIDGET_ID = '892f086'
          EXPECTED_WIDGET_TYPE = 'irk-archive-posts'
          MARKER = 'no-products.svg'
          MAX_PROBE_SECONDS = 20

          for key in ('WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'):
              if not os.environ.get(key,'').strip():
                  raise SystemExit(f'Missing required secret: {key}')

          changed = subprocess.check_output(['git','show','--pretty=','--name-only','HEAD','--','news-archive-widget-ops/*.json'], text=True).splitlines()
          reqs = sorted({p.strip() for p in changed if p.strip().startswith('news-archive-widget-ops/') and p.strip().endswith('.json')})
          if len(reqs) != 1:
              raise SystemExit(f'Expected exactly one request, found {len(reqs)}')
          request_path = reqs[0]
          request = json.loads(pathlib.Path(request_path).read_text(encoding='utf-8'))
          if request.get('action') != 'bypass_news_archive_widget_atomic' or int(request.get('id',0)) != PAGE_ID:
              raise SystemExit('Unexpected action or page id')
          if str(request.get('expected_sha256','')).lower() != EXPECTED_BEFORE_SHA:
              raise SystemExit('Unexpected expected_sha256')
          if request.get('auto_rollback_on_failed_verification') is not True:
              raise SystemExit('auto_rollback_on_failed_verification=true is required')

          base = os.environ['WP_BASE_URL'].rstrip('/')
          auth = base64.b64encode(f"{os.environ['WP_USERNAME']}:{os.environ['WP_APP_PASSWORD']}".encode()).decode()
          auth_headers = {'Authorization':'Basic '+auth,'Accept':'application/json','Cache-Control':'no-cache'}
          selective = f'{base}/wp-json/wp/v2/pages/{PAGE_ID}?context=edit&_fields=id,slug,status,link,modified_gmt,content,meta'
          edit_url = base + '/wp-json/wpvibe/v1/content/edit'

          def sha(s): return hashlib.sha256(s.encode('utf-8')).hexdigest()

          def http_json(url, method='GET', body=None, timeout=120):
              data = None
              headers = dict(auth_headers)
              if body is not None:
                  data = json.dumps(body, ensure_ascii=False, separators=(',',':')).encode('utf-8')
                  headers['Content-Type'] = 'application/json; charset=utf-8'
              req = urllib.request.Request(url, data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read().decode('utf-8','replace')
                      return int(r.status), json.loads(raw) if raw.strip() else None
              except urllib.error.HTTPError as e:
                  raw = e.read().decode('utf-8','replace')
                  try: payload = json.loads(raw) if raw.strip() else None
                  except Exception: payload = {'body_length':len(raw)}
                  return int(e.code), payload

          def read_page():
              code, page = http_json(selective)
              if code != 200 or not isinstance(page, dict):
                  raise RuntimeError(f'page read failed status={code}')
              return page

          def write_exact(old, new):
              body = {
                  'target_type':'meta','post_id':PAGE_ID,'meta_key':'_elementor_data',
                  'old_content':old,'new_content':new,'replace_all':False,'whole_word':False,
              }
              return http_json(edit_url, method='POST', body=body)

          def probe(url):
              started = time.monotonic()
              req = urllib.request.Request(url, method='GET', headers={
                  'User-Agent':'K20-News-Widget-Verify/2026-09-17',
                  'Cache-Control':'no-cache','Pragma':'no-cache','Accept-Encoding':'identity'
              })
              try:
                  with urllib.request.urlopen(req, timeout=MAX_PROBE_SECONDS) as r:
                      body = r.read().decode('utf-8','replace')
                      elapsed = round(time.monotonic()-started,3)
                      return {'ok': int(r.status)==200 and elapsed < MAX_PROBE_SECONDS,
                              'status':int(r.status),'seconds':elapsed,'bytes':len(body.encode('utf-8')),
                              'marker_count':body.count(MARKER)}
              except Exception as e:
                  return {'ok':False,'status':0,'seconds':round(time.monotonic()-started,3),'bytes':0,'marker_count':0,'error':str(e)[:300]}

          result = {
              'ok':False,'action':'bypass_news_archive_widget_atomic','page_id':PAGE_ID,
              'request_file':request_path,'prewrite':{},'write':{},'readback':{},'verification':{},
              'rollback':{'attempted':False},'final_state':'unknown',
              'executed_at_utc':time.strftime('%Y-%m-%dT%H:%M:%SZ',time.gmtime())
          }
          pathlib.Path('results').mkdir(exist_ok=True)
          out = pathlib.Path('results')/(pathlib.Path(request_path).stem+'.json')
          def save(): out.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')

          page = read_page()
          before = (page.get('meta') or {}).get('_elementor_data')
          raw_content = ((page.get('content') or {}).get('raw') or '')
          if not isinstance(before,str):
              result['prewrite']={'passed':False,'reason':'elementor_data_missing'}; save(); raise SystemExit(0)
          try: parsed = json.loads(before)
          except Exception: parsed = None
          widget = None
          if isinstance(parsed,list) and len(parsed)==1:
              try: widget = parsed[0]['elements'][0]['elements'][0]
              except Exception: widget = None
          guard = all([
              len(before)==EXPECTED_BEFORE_LENGTH, sha(before)==EXPECTED_BEFORE_SHA,
              isinstance(widget,dict), widget.get('id')==EXPECTED_WIDGET_ID,
              widget.get('widgetType')==EXPECTED_WIDGET_TYPE,
              MARKER in raw_content,
          ])
          result['prewrite']={
              'passed':guard,'page_status':page.get('status'),'slug':page.get('slug'),
              'before_length':len(before),'before_sha256':sha(before),'widget_id':widget.get('id') if isinstance(widget,dict) else None,
              'widget_type':widget.get('widgetType') if isinstance(widget,dict) else None,'fallback_bytes':len(raw_content.encode('utf-8'))
          }
          if not guard:
              result['final_state']='unchanged_guard_failed'; save(); raise SystemExit(0)

          # Preserve the exact Elementor section/column/widget IDs; replace only the expensive custom widget implementation.
          after_obj = json.loads(before)
          target = after_obj[0]['elements'][0]['elements'][0]
          target['widgetType'] = 'html'
          target['settings'] = {'html': raw_content}
          after = json.dumps(after_obj, ensure_ascii=False, separators=(',',':'))
          if EXPECTED_WIDGET_TYPE in after or target.get('id') != EXPECTED_WIDGET_ID or MARKER not in after:
              result['write']={'attempted':False,'reason':'construction_guard_failed'}; result['final_state']='unchanged'; save(); raise SystemExit(0)

          code, payload = write_exact(before, after)
          result['write']={'attempted':True,'http_status':code,'after_length':len(after),'after_sha256':sha(after)}
          rb = read_page()
          stored = (rb.get('meta') or {}).get('_elementor_data')
          readback_ok = isinstance(stored,str) and stored == after
          result['readback']={'passed':readback_ok,'stored_length':len(stored) if isinstance(stored,str) else 0,
                              'stored_sha256':sha(stored) if isinstance(stored,str) else ''}

          token = str(int(time.time()*1000))
          canonical = str(rb.get('link') or page.get('link') or '').rstrip('/') + '/?k20newsfix=' + token
          pageid = base + f'/?page_id={PAGE_ID}&k20newsfix=' + token
          p1 = probe(canonical) if readback_ok else {'ok':False,'error':'readback_failed'}
          p2 = probe(pageid) if readback_ok else {'ok':False,'error':'readback_failed'}
          verify_ok = readback_ok and p1.get('ok') and p2.get('ok') and p1.get('marker_count',0)>0 and p2.get('marker_count',0)>0
          result['verification']={'canonical':p1,'page_id':p2,'passed':bool(verify_ok)}

          if verify_ok:
              result['ok']=True
              result['final_state']='static_fallback_widget_active'
              save(); raise SystemExit(0)

          # Any failed verification restores the byte-identical original Elementor payload.
          result['rollback']['attempted']=True
          try:
              rcode, rpayload = write_exact(after, before)
              final_page = read_page()
              final_meta = (final_page.get('meta') or {}).get('_elementor_data')
              rollback_ok = isinstance(final_meta,str) and final_meta == before
              result['rollback'].update({'http_status':rcode,'passed':rollback_ok,
                                         'restored_sha256':sha(final_meta) if isinstance(final_meta,str) else ''})
              result['final_state']='original_restored' if rollback_ok else 'rollback_failed'
          except Exception as e:
              result['rollback'].update({'passed':False,'error':str(e)[:300]})
              result['final_state']='rollback_exception'
          save()

      - name: Commit sanitized operation result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*news-archive-widget*.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record news archive widget bypass result"
          git pull --rebase origin main
          git push origin main
