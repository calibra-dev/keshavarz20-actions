name: K20 Published Trashed Slug Audit

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/published-trashed-slug/*.json'

permissions:
  contents: read

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Audit published product slugs ending in __trashed
        shell: bash
        run: |
          set -euo pipefail
          : "${WP_BASE_URL:?missing WP_BASE_URL}"
          : "${WP_USERNAME:?missing WP_USERNAME}"
          : "${WP_APP_PASSWORD:?missing WP_APP_PASSWORD}"

          base="${WP_BASE_URL%/}"
          auth="${WP_USERNAME}:${WP_APP_PASSWORD}"
          out="$RUNNER_TEMP/k20-published-trashed-slug"
          mkdir -p "$out"
          published_ndjson="$out/published.ndjson"
          bad_ndjson="$out/bad.ndjson"
          rows_ndjson="$out/rows.ndjson"
          : > "$published_ndjson"
          : > "$bad_ndjson"
          : > "$rows_ndjson"

          for page in $(seq 1 100); do
            batch="$out/published-page-${page}.json"
            code=$(curl -sS --compressed --max-time 120 \
              --user "$auth" \
              --get \
              --data-urlencode 'status=publish' \
              --data-urlencode 'per_page=100' \
              --data-urlencode "page=$page" \
              --data-urlencode '_fields=id,name,slug,status,permalink,date_modified_gmt' \
              -o "$batch" -w '%{http_code}' \
              "$base/wp-json/wc/v3/products")
            if [[ "$code" == "400" ]]; then break; fi
            if [[ "$code" != "200" ]]; then
              echo "Unexpected WooCommerce HTTP $code on publish page $page" >&2
              cat "$batch" >&2 || true
              exit 1
            fi
            count=$(jq 'length' "$batch")
            if [[ "$count" -eq 0 ]]; then break; fi
            jq -c '.[]' "$batch" >> "$published_ndjson"
            if [[ "$count" -lt 100 ]]; then break; fi
          done

          published_count=$(wc -l < "$published_ndjson" | tr -d ' ')
          jq -c 'select((.slug // "") | endswith("__trashed"))' "$published_ndjson" > "$bad_ndjson"
          bad_count=$(wc -l < "$bad_ndjson" | tr -d ' ')

          while IFS= read -r row; do
            [[ -z "$row" ]] && continue
            id=$(jq -r '.id' <<<"$row")
            dirty=$(jq -r '.slug' <<<"$row")
            clean="${dirty%__trashed}"
            collisions_json="$out/collisions-${id}.json"
            code=$(curl -sS --compressed --max-time 120 \
              --user "$auth" \
              --get \
              --data-urlencode 'status=any' \
              --data-urlencode 'per_page=100' \
              --data-urlencode "slug=$clean" \
              --data-urlencode '_fields=id,name,slug,status,permalink,date_modified_gmt' \
              -o "$collisions_json" -w '%{http_code}' \
              "$base/wp-json/wc/v3/products")
            if [[ "$code" != "200" ]]; then
              echo "Collision lookup failed for product $id with HTTP $code" >&2
              cat "$collisions_json" >&2 || true
              exit 1
            fi
            collisions=$(jq --argjson id "$id" '[.[] | select(.id != $id)]' "$collisions_json")
            collision_count=$(jq 'length' <<<"$collisions")
            jq -n \
              --argjson product "$row" \
              --arg clean "$clean" \
              --argjson collision_count "$collision_count" \
              --argjson collisions "$collisions" \
              '{id:$product.id,name:$product.name,status:$product.status,dirty_slug:$product.slug,clean_slug:$clean,collision_count:$collision_count,collisions:$collisions,permalink:$product.permalink,modified_gmt:$product.date_modified_gmt}' \
              >> "$rows_ndjson"
          done < "$bad_ndjson"

          if [[ -s "$rows_ndjson" ]]; then
            items=$(jq -s '.' "$rows_ndjson")
          else
            items='[]'
          fi
          collision_free_count=$(jq '[.[] | select(.collision_count == 0)] | length' <<<"$items")
          collision_count=$(jq '[.[] | select(.collision_count > 0)] | length' <<<"$items")

          result="$out/result.json"
          jq -n \
            --arg generated_utc "$(date -u +%Y-%m-%dT%H:%M:%SZ)" \
            --argjson published_products_scanned "$published_count" \
            --argjson published_trashed_slug_count "$bad_count" \
            --argjson collision_free_count "$collision_free_count" \
            --argjson collision_count "$collision_count" \
            --arg collision_scope 'WooCommerce status=any exact-slug lookup per dirty published product' \
            --argjson items "$items" \
            '{generated_utc:$generated_utc,published_products_scanned:$published_products_scanned,published_trashed_slug_count:$published_trashed_slug_count,collision_free_count:$collision_free_count,collision_count:$collision_count,collision_scope:$collision_scope,items:$items}' \
            > "$result"

          echo 'K20_TRASHED_SLUG_AUDIT_BEGIN'
          cat "$result"
          echo 'K20_TRASHED_SLUG_AUDIT_END'

      - name: Upload evidence
        uses: actions/upload-artifact@v4
        with:
          name: k20-published-trashed-slug-audit
          path: ${{ runner.temp }}/k20-published-trashed-slug/result.json
          retention-days: 14
