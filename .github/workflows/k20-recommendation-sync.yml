name: K20 Recommendation Sync

on:
  push:
    branches: [main]
    paths:
      - 'recommendation-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-recommendation-sync
  cancel-in-progress: true

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Execute recommendation requests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          foreach ($name in 'WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) {
              throw "Missing required repository secret: $name"
            }
          }

          $before = '${{ github.event.before }}'
          $current = '${{ github.sha }}'
          $zero = '0000000000000000000000000000000000000000'

          if ($before -and $before -ne $zero) {
            $changed = @(git diff --name-only $before $current -- 'recommendation-ops/*.json')
          } else {
            $changed = @(git show --pretty='' --name-only $current -- 'recommendation-ops/*.json')
          }

          $changed = @($changed | Where-Object { $_ -match '^recommendation-ops/.+\.json$' } | Sort-Object -Unique)
          if ($changed.Count -eq 0) { throw 'No recommendation request JSON found in triggering commit.' }

          foreach ($requestPath in $changed) {
            $name = [IO.Path]::GetFileNameWithoutExtension($requestPath)
            $localOutput = Join-Path $env:RUNNER_TEMP "$name.result.json"

            & ./scripts/Invoke-K20RecommendationSync.ps1 -RequestPath $requestPath -OutputPath $localOutput
            if ($LASTEXITCODE -ne 0) { throw "Recommendation sync failed for $requestPath" }

            New-Item -ItemType Directory -Force 'results' | Out-Null
            Copy-Item -LiteralPath $localOutput -Destination "results/recommendation-$name.json" -Force
          }

      - name: Commit sanitized recommendation results
        shell: bash
        run: |
          set -euo pipefail
          if [ -z "$(find results -maxdepth 1 -type f -name 'recommendation-*.json' -print -quit 2>/dev/null)" ]; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/recommendation-*.json
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "ops: record recommendation sync result"
          git pull --rebase origin main
          git push origin main
