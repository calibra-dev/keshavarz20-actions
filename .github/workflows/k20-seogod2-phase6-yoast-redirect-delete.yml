name: SEO God2 Phase 6 Delete Exact Yoast Redirect

on:
  push:
    branches: [main]
    paths:
      - 'seo-god2-phase6-yoast-redirect-delete-ops/*.json'

permissions:
  contents: write

jobs:
  delete-exact:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests
      - name: Delete only the verified wrong Yoast redirect
        shell: python
        run: |
          import json, os, pathlib, requests
          base=os.environ['WP_BASE_URL'].rstrip('/')
          auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])

          origin='product/%da%a9%d9%84%d8%b3%db%8c%d9%85-%da%a9%d8%b1%d8%a7%d9%be-%d8%a7%db%8c%da%a9%d8%b3-%da%af%d8%b1%db%8c%d9%86'
          target='product/%d9%be%d9%84%db%8c-%d8%a7%d8%b3-%d8%a7%db%8c%da%a9%d8%b3-%da%af%d8%b1%db%8c%d9%86-20-%d9%84%db%8c%d8%aa%d8%b1%db%8c'
          expected={'origin':origin,'target':target,'type':301,'format':'plain'}

          list_url=base+'/wp-json/yoast/v1/redirects/list'
          before=requests.get(list_url,auth=auth,timeout=60); before.raise_for_status()
          data=before.json()
          redirects=data.get('redirects') if isinstance(data,dict) else None
          if isinstance(redirects,dict):
            rows=list(redirects.values())
          elif isinstance(redirects,list):
            rows=redirects
          else:
            raise RuntimeError('Unexpected Yoast redirects payload shape')
          exact=[r for r in rows if isinstance(r,dict) and all(r.get(k)==v for k,v in expected.items())]
          if len(exact)!=1:
            raise RuntimeError(f'Expected exactly one wrong redirect, found {len(exact)}')

          delete_url=base+'/wp-json/yoast/v1/redirects/delete'
          payload={'origin':origin,'target':target,'type':'301','format':'plain','ignore_warning':False}
          deleted=requests.post(delete_url,json=payload,auth=auth,timeout=60)
          try:
            delete_body=deleted.json()
          except Exception:
            delete_body={'raw_text':deleted.text[:2000]}
          if deleted.status_code < 200 or deleted.status_code >= 300:
            raise RuntimeError('Yoast delete failed: '+str(deleted.status_code)+' '+json.dumps(delete_body,ensure_ascii=False)[:1200])

          after=requests.get(list_url,auth=auth,timeout=60); after.raise_for_status()
          ad=after.json(); redirects2=ad.get('redirects') if isinstance(ad,dict) else None
          rows2=list(redirects2.values()) if isinstance(redirects2,dict) else (redirects2 if isinstance(redirects2,list) else [])
          exact_after=[r for r in rows2 if isinstance(r,dict) and all(r.get(k)==v for k,v in expected.items())]

          old_origin='product/%d9%87%d8%a7%d8%b1%d8%af-%da%a9%d8%a7%d9%84%db%8c-%da%a9%d8%b1%d8%a7%d9%be-%d8%a7%db%8c%da%a9%d8%b3-%da%af%d8%b1%db%8c%d9%86'
          correct_target=origin
          preserved=[r for r in rows2 if isinstance(r,dict) and r.get('origin')==old_origin and r.get('target')==correct_target]
          if len(preserved)!=1:
            raise RuntimeError('Expected legacy Hard Calicrop -> current Calicrop redirect was not preserved')

          public_url=base+'/'+origin+'/'
          chk=requests.get(public_url,allow_redirects=False,timeout=60,headers={'User-Agent':'K20Phase6RedirectVerify/1.0','Cache-Control':'no-cache','Pragma':'no-cache'})
          wrong_location=(chk.headers.get('Location') or '').lower().find('20-%d9%84%db%8c%d8%aa%d8%b1%db%8c')>=0
          if wrong_location:
            raise RuntimeError('Public URL still redirects to wrong Polys product')

          out={
            'status':'PASS' if not exact_after else 'NO_CHANGE',
            'deleted_redirect':expected,
            'delete_http_status':deleted.status_code,
            'delete_response':delete_body,
            'exact_wrong_redirect_remaining':len(exact_after),
            'legacy_correct_redirect_preserved':True,
            'public_check_status':chk.status_code,
            'public_check_location':chk.headers.get('Location'),
            'public_x_redirect_by':chk.headers.get('X-Redirect-By')
          }
          pathlib.Path('seo-god2').mkdir(exist_ok=True)
          pathlib.Path('seo-god2/phase6-140816-yoast-redirect-delete.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          if exact_after:
            raise RuntimeError('Wrong redirect still present after delete; response was recorded')
      - name: Commit verified deletion receipt
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seo-god2/phase6-140816-yoast-redirect-delete.json
          git diff --cached --quiet && exit 0
          git commit -m "seo god2 phase6: record verified Yoast redirect deletion"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
