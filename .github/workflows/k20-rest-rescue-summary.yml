name: Keshavarz20 REST Rescue Summary

on:
  push:
    branches: [main]
    paths:
      - 'media-rest-rescue-summary-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-rest-rescue-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build read-only rescue summary
        run: python scripts/k20_rest_rescue_summary.py
      - name: Commit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media-rest-rescue/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record REST rescue tail summary"
          git pull --rebase origin main
          git push origin HEAD:main
