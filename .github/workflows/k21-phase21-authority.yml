name: Phase 21 Iran Authority Network

on:
  push:
    branches: [main]
    paths:
      - 'phase21/**'
      - 'phase21-results/**'
      - 'phase21-ops/**'
      - 'phase17/evidence-cards.json'
      - 'phase9-results/canonical-pim.json'
      - 'growth-os/intent-registry.json'
      - 'growthos-phase10-results/measurement-dashboard.json'
      - 'growthos-phase14-results/summary.json'
      - 'growthos-phase15-results/summary.json'
      - 'growthos-phase16-results/summary.json'
      - 'phase19-results/agentic-readiness-latest.json'
      - 'phase19-results/currency-mapping-acceptance.json'
      - 'phase20-results/final-closure-latest.json'
      - 'brand-remediation-results/diagnostic-latest.json'
      - 'question-engine-results/*-status.json'
      - 'tests/test_phase21_authority.py'
      - '.github/workflows/k21-phase21-authority.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: phase21-iran-authority-v3
  cancel-in-progress: true

jobs:
  verify-authority-network:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 21 source graph
        run: |
          python -m py_compile phase21/authority_registry.py
          python phase21/authority_registry.py --check
          python -m unittest tests.test_phase21_authority -v
      - name: Persist Phase 21 v3 acceptance evidence
        run: |
          python phase21/authority_registry.py \
            --write phase21-results/authority-network-latest.json \
            --write-question-classification phase21-results/question-evidence-classification-latest.json
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase21-results/authority-network-latest.json phase21-results/question-evidence-classification-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase21: record v3 Iran authority acceptance"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
