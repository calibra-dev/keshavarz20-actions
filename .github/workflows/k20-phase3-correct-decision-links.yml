name: K20 Phase 3 Correct Decision Links

on:
  push:
    branches: [main]
    paths:
      - 'phase3-correct-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  correct:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - run: python scripts/k20_phase3_correct_decision_links.py
      - name: Apply corrective requests through guarded gateway
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem requests -Filter '20260918-phase3-decision-links-*-v2.json' | Sort-Object Name)
          New-Item -ItemType Directory -Force results | Out-Null
          foreach($f in $files){
            $name=[IO.Path]::GetFileNameWithoutExtension($f.Name)
            $out=Join-Path $env:RUNNER_TEMP "$name.result.json"
            & ./scripts/Invoke-K20SiteGateway.ps1 -RequestPath $f.FullName -OutputPath $out
            if(-not (Test-Path -LiteralPath $out)){ throw "Missing result for $($f.Name)" }
            Copy-Item $out "results/$name.json" -Force
          }
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add requests/20260918-phase3-decision-links-*-v2.json results/20260918-phase3-decision-links-*-v2.json
          git add -f phase3-results/decision-link-corrective-manifest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase3: correct family-specific decision links"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
