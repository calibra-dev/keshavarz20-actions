name: Keshavarz20 Gallery Meta Woo Apply

on:
  push:
    branches: [main]
    paths:
      - 'gallery-meta-woo-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-gallery-meta-woo-apply
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_gallery_meta_woo_apply.py
      - name: Apply exact allow-listed gallery meta with rollback guards
        run: python scripts/k20_gallery_meta_woo_apply.py
      - name: Commit sanitized apply evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gallery-meta-rescue/woo-apply.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          for attempt in 1 2 3; do
            git commit -m "media: record guarded gallery meta Woo apply" || true
            if git pull --rebase origin main && git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
