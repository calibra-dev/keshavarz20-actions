name: K20 Phase 7 Response Cookie Probe
on:
  push:
    branches: [main]
    paths:
      - 'phase7-cache-probe-ops/*.json'
permissions:
  contents: write
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Probe anonymous response cache and cookie headers
        shell: python
        run: |
          import json, re, time, urllib.request, urllib.error
          targets = [
            ("home", "https://keshavarz20.com/"),
            ("product", "https://keshavarz20.com/product/%d8%b4%db%8c%d8%b1%d8%aa%d9%88%d9%be%db%8c-%d8%aa%da%a9-%d8%b6%d8%b1%d8%a8-%d8%af%d8%b3%d8%aa%d9%87-%d9%81%d9%84%d8%b2%db%8c-%d9%88%db%8c%d8%b3%d9%be%d8%a7%d8%b1-2-%d8%a7%db%8c%d9%86%da%86-63-%d9%85/"),
            ("calculator", "https://keshavarz20.com/drip-tape-length-fittings-calculator/"),
            ("category", "https://keshavarz20.com/product-category/%d9%86%d9%88%d8%a7%d8%b1-%d8%aa%db%8c%d9%be/")
          ]
          out={"mode":"read-only","tested_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),"targets":[]}
          for label,url in targets:
            item={"label":label,"url":url,"attempts":[]}
            for attempt in range(1,4):
              req=urllib.request.Request(url, headers={
                "User-Agent":"Mozilla/5.0 K20-Phase7-Readonly-Probe",
                "Accept":"text/html,application/xhtml+xml"
              }, method="GET")
              started=time.time()
              try:
                with urllib.request.urlopen(req, timeout=60) as r:
                  status=r.status
                  headers=r.headers
                  r.read(1)
              except urllib.error.HTTPError as e:
                status=e.code; headers=e.headers
              elapsed=round(time.time()-started,3)
              setcookies=headers.get_all("Set-Cookie") or []
              names=[]
              for raw in setcookies:
                m=re.match(r"\s*([^=;\s]+)=", raw)
                if m and m.group(1) not in names:
                  names.append(m.group(1))
              def h(name):
                v=headers.get(name)
                return v if v else None
              item["attempts"].append({
                "attempt":attempt,
                "status":status,
                "seconds":elapsed,
                "x_litespeed_cache":h("X-LiteSpeed-Cache"),
                "x_litespeed_cache_control":h("X-LiteSpeed-Cache-Control"),
                "cache_control":h("Cache-Control"),
                "vary":h("Vary"),
                "cookie_names":names
              })
              time.sleep(1)
            out["targets"].append(item)
          import os
          os.makedirs("phase7-results", exist_ok=True)
          with open("phase7-results/response-cookie-probe.json","w",encoding="utf-8") as f:
            json.dump(out,f,ensure_ascii=False,indent=2)
      - name: Commit sanitized probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/response-cookie-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record response cookie probe"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
