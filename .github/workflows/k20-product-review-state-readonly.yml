name: K20 Product Review State Readonly

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/product-review-state/*.json'

permissions:
  contents: write

concurrency:
  group: k20-product-review-state-readonly
  cancel-in-progress: false

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Read WooCommerce review state only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $before='${{ github.event.before }}'; $current='${{ github.sha }}'; $zero='0000000000000000000000000000000000000000'
          if($before -and $before -ne $zero){ $files=@(git diff --name-only $before $current -- 'diagnostics/product-review-state/*.json') }
          else { $files=@(git show --pretty='' --name-only $current -- 'diagnostics/product-review-state/*.json') }
          $reqPath=@($files | Where-Object { $_ -match '^diagnostics/product-review-state/.+\.json$' } | Sort-Object -Unique)
          if($reqPath.Count -ne 1){ throw "Expected exactly one request, found $($reqPath.Count)" }
          $req=Get-Content -Raw -LiteralPath $reqPath[0] | ConvertFrom-Json
          $id=[int]$req.id
          if($id -lt 1){ throw 'Positive product id required.' }
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json'}
          $p=Invoke-RestMethod -Uri "$base/wp-json/wc/v3/products/$id" -Headers $headers -Method GET -TimeoutSec 180
          $out=[ordered]@{
            mode='read-only'
            id=[int]$p.id
            status=[string]$p.status
            reviews_allowed=[bool]$p.reviews_allowed
            date_modified_gmt=[string]$p.date_modified_gmt
          }
          New-Item -ItemType Directory -Force 'results' | Out-Null
          $name=[IO.Path]::GetFileNameWithoutExtension($reqPath[0])
          $out | ConvertTo-Json -Depth 5 | Set-Content -LiteralPath "results/product-review-state-$name.json" -Encoding utf8
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/product-review-state-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "wave1: record product review state"
          git pull --rebase origin main
          git push origin HEAD:main
