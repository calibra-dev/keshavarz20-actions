name: K20 Catalog V2 Browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-catalog-v2-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          test -n "$CHROME"
          python3 -m pip install --quiet websocket-client
          mkdir -p diagnostics
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --remote-debugging-port=9222 --remote-allow-origins='*'             --user-data-dir=/tmp/k20-catalog-chrome --window-size=1536,1024             about:blank >/tmp/k20-catalog-chrome.log 2>&1 &
          PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request,websocket,pathlib,datetime,os,base64
          deadline=time.time()+25
          targets=None
          while time.time()<deadline:
              try:
                  targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                  if targets: break
              except Exception:
                  pass
              time.sleep(1)
          if not targets: raise SystemExit('No CDP target')
          target=next((t for t in targets if t.get('type')=='page'),targets[0])
          ws=websocket.create_connection(target['webSocketDebuggerUrl'],timeout=20)
          ident=0
          def cmd(method,params=None):
              global ident
              ident+=1
              ws.send(json.dumps({'id':ident,'method':method,'params':params or {}}))
              while True:
                  row=json.loads(ws.recv())
                  if row.get('id')==ident:return row
          def raw(expr):
              row=cmd('Runtime.evaluate',{'expression':expr,'returnByValue':True})
              res=row.get('result',{})
              if 'exceptionDetails' in res:
                  return {'exception':res['exceptionDetails'].get('text'),'description':res.get('result',{}).get('description')}
              return res.get('result',{}).get('value')
          def obj(expr):
              v=raw("JSON.stringify("+expr+")")
              if isinstance(v,str):
                  try:return json.loads(v)
                  except Exception:return {'raw':v}
              return v
          cmd('Page.enable');cmd('Runtime.enable')
          cmd('Page.navigate',{'url':'https://keshavarz20.com/catalog/'})
          time.sleep(12)
          desktop=obj(r'''(function(){
            const root=document.getElementById('k20CatalogV2');
            const cards=[...document.querySelectorAll('#k20ProductSource ul.products li.product')];
            const s=[...document.querySelectorAll('script')].find(x=>(x.textContent||'').includes('__K20CatalogV2'));
            return {
              href:location.href,title:document.title,readyState:document.readyState,
              rootExists:!!root,productCount:cards.length,
              visibleCount:cards.filter(x=>getComputedStyle(x).display!=='none').length,
              scriptReadyType:typeof window.__K20CatalogV2,
              scriptReady:window.__K20CatalogV2||null,
              scriptFound:!!s,scriptType:s?s.getAttribute('type'):null,
              scriptNoDefer:s?s.getAttribute('data-no-defer'):null,
              scriptSrc:s?s.getAttribute('src'):null,scriptDataSrc:s?s.getAttribute('data-src'):null,
              bodyText:(document.body?.innerText||'').slice(0,500),
              horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              headerWidth:document.querySelector('.k20-header')?.getBoundingClientRect().width||0,
              stageWidth:document.querySelector('.k20-stage')?.getBoundingClientRect().width||0,
              appWidth:document.getElementById('k20AppShell')?.getBoundingClientRect().width||0
            };
          })()''')
          first=raw("(document.querySelector('#k20ProductSource .woocommerce-loop-product__title')?.textContent||'').trim()") or ''
          term=next((x for x in first.split() if len(x)>2),first)
          raw("(function(){const i=document.getElementById('k20TopSearch');if(!i)return false;i.value="+json.dumps(term,ensure_ascii=False)+";i.dispatchEvent(new Event('input',{bubbles:true}));return true;})()")
          time.sleep(.5)
          desktop['searchTerm']=term
          desktop['visibleAfterSearch']=raw("[...document.querySelectorAll('#k20ProductSource ul.products li.product')].filter(x=>getComputedStyle(x).display!=='none').length")
          # Desktop screenshot for visual evidence
          shot=cmd('Page.captureScreenshot',{'format':'png','captureBeyondViewport':False}).get('result',{}).get('data')
          if shot: pathlib.Path('diagnostics/k20-catalog-v2-desktop.png').write_bytes(base64.b64decode(shot))
          # Mobile fresh navigation after emulation
          cmd('Emulation.setDeviceMetricsOverride',{'width':390,'height':844,'deviceScaleFactor':1,'mobile':True})
          cmd('Page.navigate',{'url':'https://keshavarz20.com/catalog/'})
          time.sleep(10)
          mobile=obj(r'''(function(){
            const b=document.getElementById('k20MobileFilter');
            const p=document.getElementById('k20FilterPanel');
            return {
              href:location.href,width:innerWidth,rootExists:!!document.getElementById('k20CatalogV2'),
              productCount:document.querySelectorAll('#k20ProductSource ul.products li.product').length,
              scriptReadyType:typeof window.__K20CatalogV2,
              filterButtonVisible:!!b && getComputedStyle(b).display!=='none',
              filterPanelOpen:!!p && p.classList.contains('open'),
              horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
              appShellWidth:document.getElementById('k20AppShell')?.getBoundingClientRect().width||0
            };
          })()''')
          mobile['clickCall']=raw("(function(){const b=document.getElementById('k20MobileFilter');if(!b)return 'missing';b.click();return 'clicked';})()")
          time.sleep(.4)
          mobile['filterPanelOpenAfterClick']=raw("document.getElementById('k20FilterPanel')?.classList.contains('open')||false")
          mobile['backdropOpenAfterClick']=raw("document.getElementById('k20FilterBackdrop')?.classList.contains('open')||false")
          shot=cmd('Page.captureScreenshot',{'format':'png','captureBeyondViewport':False}).get('result',{}).get('data')
          if shot: pathlib.Path('diagnostics/k20-catalog-v2-mobile.png').write_bytes(base64.b64decode(shot))
          ws.close()
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'url':'https://keshavarz20.com/catalog/','desktop':desktop,'mobile':mobile}
          out['pass']=bool(
            isinstance(desktop,dict) and desktop.get('rootExists') and desktop.get('productCount',0)>0 and
            desktop.get('scriptReadyType')=='object' and desktop.get('scriptNoDefer')=='1' and
            desktop.get('horizontalOverflow',999)<=4 and desktop.get('visibleAfterSearch',999)<desktop.get('visibleCount',0) and
            isinstance(mobile,dict) and mobile.get('rootExists') and mobile.get('filterButtonVisible') and
            mobile.get('filterPanelOpenAfterClick') and mobile.get('backdropOpenAfterClick') and
            mobile.get('productCount',0)>0 and mobile.get('horizontalOverflow',999)<=4 and
            350 <= mobile.get('appShellWidth',0) <= 390
          )
          path=pathlib.Path('diagnostics')/('k20-catalog-v2-browser-qa-'+os.environ.get('GITHUB_RUN_ID','run')+'.json')
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['pass']: raise SystemExit(3)
          PY
      - shell: bash
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/k20-catalog-v2-browser-qa-*.json diagnostics/k20-catalog-v2-desktop.png diagnostics/k20-catalog-v2-mobile.png 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: record catalog v2 browser state'
          git pull --rebase origin main
          git push origin main
