name: K20 Catalog V2 Browser QA

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-catalog-v2-browser-qa.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          CHROME="$(command -v google-chrome || command -v google-chrome-stable || command -v chromium || command -v chromium-browser || true)"
          if [ -z "$CHROME" ]; then echo "Chrome not found"; exit 2; fi
          python3 -m pip install --quiet websocket-client
          mkdir -p diagnostics
          "$CHROME" --headless=new --no-sandbox --disable-gpu --hide-scrollbars             --remote-debugging-port=9222 --remote-allow-origins='*'             --user-data-dir=/tmp/k20-catalog-chrome --window-size=1536,1024             'https://keshavarz20.com/catalog/?k20qa=2' >/tmp/k20-catalog-chrome.log 2>&1 &
          PID=$!
          trap 'kill $PID >/dev/null 2>&1 || true' EXIT
          python3 - <<'PY'
          import json,time,urllib.request,websocket,pathlib,datetime
          deadline=time.time()+35
          targets=None
          while time.time()<deadline:
              try:
                  targets=json.load(urllib.request.urlopen('http://127.0.0.1:9222/json',timeout=2))
                  if targets: break
              except Exception:
                  pass
              time.sleep(1)
          if not targets: raise SystemExit('No CDP target')
          target=next((t for t in targets if 'keshavarz20.com/catalog' in t.get('url','')),targets[0])
          ws=websocket.create_connection(target['webSocketDebuggerUrl'],timeout=20)
          def eval_raw(expr, ident):
              ws.send(json.dumps({'id':ident,'method':'Runtime.evaluate','params':{'expression':expr,'returnByValue':True}}))
              while True:
                  row=json.loads(ws.recv())
                  if row.get('id')==ident:
                      res=row.get('result',{})
                      if 'exceptionDetails' in res:
                          return {'__exception__':res['exceptionDetails'].get('text'),'description':res.get('result',{}).get('description')}
                      return res.get('result',{}).get('value')
          def eval_json(expr, ident):
              v=eval_raw("JSON.stringify("+expr+")",ident)
              if isinstance(v,str):
                  try:return json.loads(v)
                  except Exception:return {'raw':v}
              return v
          time.sleep(8)
          desktop=eval_json(r'''({
            readyState:document.readyState,
            rootExists:!!document.querySelector('#k20CatalogV2'),
            productCount:document.querySelectorAll('#k20ProductSource ul.products li.product').length,
            visibleCount:[...document.querySelectorAll('#k20ProductSource ul.products li.product')].filter(x=>getComputedStyle(x).display!=='none').length,
            scriptReadyType:typeof window.__K20CatalogV2,
            scriptReady:window.__K20CatalogV2||null,
            scriptMarkerCount:[...document.scripts].filter(s=>(s.textContent||'').includes('__K20CatalogV2')).length,
            shortcodeVisible:(document.body.innerText||'').includes('[products limit='),
            pageErrorText:(document.body.innerText||'').includes('دریافت محصولات با خطا'),
            horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
            headerWidth:document.querySelector('.k20-header')?.getBoundingClientRect().width||0,
            stageWidth:document.querySelector('.k20-stage')?.getBoundingClientRect().width||0,
            appWidth:document.querySelector('#k20AppShell')?.getBoundingClientRect().width||0
          })''',1)
          first_title=eval_raw("(document.querySelector('#k20ProductSource .woocommerce-loop-product__title')?.textContent||'').trim()",2) or ''
          term=next((x for x in first_title.split() if len(x)>2),first_title)
          eval_raw("(function(){const i=document.querySelector('#k20TopSearch');if(!i)return false;i.value="+json.dumps(term,ensure_ascii=False)+";i.dispatchEvent(new Event('input',{bubbles:true}));return true;})()",3)
          time.sleep(.6)
          desktop['searchTerm']=term
          desktop['visibleAfterSearch']=eval_raw("[...document.querySelectorAll('#k20ProductSource ul.products li.product')].filter(x=>getComputedStyle(x).display!=='none').length",4)
          eval_raw("(function(){const i=document.querySelector('#k20TopSearch');if(i){i.value='';i.dispatchEvent(new Event('input',{bubbles:true}));}return true;})()",5)
          ws.send(json.dumps({'id':6,'method':'Emulation.setDeviceMetricsOverride','params':{'width':390,'height':844,'deviceScaleFactor':1,'mobile':True}}))
          while True:
              row=json.loads(ws.recv())
              if row.get('id')==6: break
          time.sleep(1)
          pre_mobile=eval_json(r'''({
            width:innerWidth,
            rootExists:!!document.querySelector('#k20CatalogV2'),
            productCount:document.querySelectorAll('#k20ProductSource ul.products li.product').length,
            filterButtonVisible:!!document.querySelector('#k20MobileFilter') && getComputedStyle(document.querySelector('#k20MobileFilter')).display!=='none',
            panelClass:document.querySelector('#k20FilterPanel')?.className||'',
            horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth,
            appShellWidth:document.querySelector('#k20AppShell')?.getBoundingClientRect().width||0
          })''',7)
          click_result=eval_raw("(function(){const b=document.querySelector('#k20MobileFilter');if(!b)return 'missing';b.click();return 'clicked';})()",8)
          time.sleep(.5)
          post_mobile=eval_json(r'''({
            filterPanelOpen:document.querySelector('#k20FilterPanel')?.classList.contains('open')||false,
            backdropOpen:document.querySelector('#k20FilterBackdrop')?.classList.contains('open')||false,
            horizontalOverflow:document.documentElement.scrollWidth-document.documentElement.clientWidth
          })''',9)
          mobile={**(pre_mobile or {}),**(post_mobile or {}),'clickCall':click_result}
          ws.close()
          out={'checked_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),'url':'https://keshavarz20.com/catalog/','desktop':desktop,'mobile':mobile}
          out['pass']=bool(
              isinstance(desktop,dict) and desktop.get('rootExists') and desktop.get('productCount',0)>0 and
              desktop.get('visibleCount',0)>0 and desktop.get('scriptReadyType')=='object' and
              desktop.get('scriptMarkerCount',0)>0 and not desktop.get('shortcodeVisible') and
              not desktop.get('pageErrorText') and desktop.get('horizontalOverflow',999)<=4 and
              desktop.get('visibleAfterSearch') is not None and
              isinstance(mobile,dict) and mobile.get('filterButtonVisible') and mobile.get('filterPanelOpen') and
              mobile.get('backdropOpen') and mobile.get('productCount',0)>0 and mobile.get('horizontalOverflow',999)<=4 and
              350 <= mobile.get('appShellWidth',0) <= 390
          )
          pathlib.Path('diagnostics/k20-catalog-v2-browser-qa.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False,indent=2))
          if not out['pass']: raise SystemExit(3)
          PY
      - shell: bash
        if: always()
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/k20-catalog-v2-browser-qa.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'qa: record catalog v2 browser state'
          git pull --rebase origin main
          git push origin main
