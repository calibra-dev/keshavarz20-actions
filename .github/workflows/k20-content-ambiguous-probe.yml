name: Keshavarz20 Content Ambiguous Mapping Probe

on:
  push:
    branches: [main]
    paths:
      - 'content-ambiguous-probe-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-content-ambiguous-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_content_ambiguous_probe.py
      - name: Probe ambiguous direct mappings read-only
        run: python scripts/k20_content_ambiguous_probe.py
      - name: Commit sanitized probe evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-media-results/ambiguous-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record ambiguous direct mapping probe"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
