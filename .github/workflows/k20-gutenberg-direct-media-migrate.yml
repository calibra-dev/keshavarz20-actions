name: Keshavarz20 Gutenberg Direct Media Migration

on:
  push:
    branches: [main]
    paths:
      - 'direct-content-migrate-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-gutenberg-direct-media-migrate
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_gutenberg_direct_media_migrate.py
      - name: Migrate guarded Gutenberg media reference
        run: python scripts/k20_gutenberg_direct_media_migrate.py
      - name: Commit sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-media-results/*-migration.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record guarded Gutenberg media migration"
          git pull --rebase origin main
          git push origin HEAD:main
