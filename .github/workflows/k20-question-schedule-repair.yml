name: Keshavarz20 Question Schedule Repair

on:
  push:
    branches: [main]
    paths:
      - 'question-engine-ops/schedule-repair-*.json'
  workflow_dispatch:

permissions:
  contents: read
  actions: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Inspect and enable question schedules
        shell: bash
        run: |
          set -euo pipefail
          repo="${GITHUB_REPOSITORY}"
          for wf in k20-customer-question-engine.yml k20-question-scheduler.yml; do
            echo "=== $wf BEFORE ==="
            gh api "repos/$repo/actions/workflows/$wf" --jq '{id,name,path,state}'
            gh api --method PUT "repos/$repo/actions/workflows/$wf/enable"
            echo "=== $wf AFTER ==="
            gh api "repos/$repo/actions/workflows/$wf" --jq '{id,name,path,state}'
          done
          echo "=== RECENT SCHEDULE RUNS ==="
          gh api "repos/$repo/actions/runs?event=schedule&per_page=20" --jq '.workflow_runs[] | {id,name,path,event,status,conclusion,created_at}'
