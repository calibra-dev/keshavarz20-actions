name: Keshavarz20 Local WebP Migration

on:
  push:
    branches: [main]
    paths:
      - 'local-webp-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-local-webp
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install local WebP encoder
        run: python -m pip install --disable-pip-version-check --quiet pillow

      - name: Convert, upload, verify, and migrate product image references
        shell: python
        run: |
          import base64
          import io
          import json
          import math
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.parse
          import urllib.request
          import xmlrpc.client

          from PIL import Image, ImageChops, ImageOps

          for key in ("WP_BASE_URL", "WP_USERNAME", "WP_APP_PASSWORD"):
              if not os.environ.get(key, "").strip():
                  raise SystemExit(f"Missing required repository secret: {key}")

          def changed_requests():
              commands = [
                  ["git", "diff", "--name-only", "HEAD^", "HEAD", "--", "local-webp-ops/*.json"],
                  ["git", "show", "--pretty=", "--name-only", "HEAD", "--", "local-webp-ops/*.json"],
              ]
              for cmd in commands:
                  out = subprocess.check_output(cmd, text=True).splitlines()
                  paths = sorted({p.strip() for p in out if p.strip().startswith("local-webp-ops/") and p.strip().endswith(".json")})
                  if paths:
                      return paths
              return []

          requests = changed_requests()
          if not requests:
              raise SystemExit("No local WebP request JSON found")

          base = os.environ["WP_BASE_URL"].rstrip("/")
          username = os.environ["WP_USERNAME"]
          app_password = os.environ["WP_APP_PASSWORD"]
          auth = base64.b64encode(f"{username}:{app_password}".encode()).decode()
          bridge_url = base + "/wp-json/keshavarz20-ops/v2/execute"
          xmlrpc_url = base + "/xmlrpc.php"
          server = xmlrpc.client.ServerProxy(xmlrpc_url, allow_none=True, use_builtin_types=True)
          results_dir = pathlib.Path("local-webp-results")
          results_dir.mkdir(parents=True, exist_ok=True)

          def ascii_url(url):
              parts = urllib.parse.urlsplit(url)
              path = urllib.parse.quote(urllib.parse.unquote(parts.path), safe="/%")
              return urllib.parse.urlunsplit((parts.scheme, parts.netloc, path, parts.query, parts.fragment))

          def api_json(method, url, body=None):
              headers = {"Authorization": "Basic " + auth, "Accept": "application/json", "User-Agent": "K20-Local-WebP/1.0"}
              data = None
              if body is not None:
                  data = json.dumps(body, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                  headers["Content-Type"] = "application/json; charset=utf-8"
              req = urllib.request.Request(ascii_url(url), data=data, method=method, headers=headers)
              try:
                  with urllib.request.urlopen(req, timeout=180) as r:
                      raw = r.read().decode("utf-8", "replace")
                      return int(r.status), json.loads(raw) if raw else {}
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"raw": raw[:1000]}
                  return int(e.code), parsed

          def bridge_inspect(attachment_id):
              payload = json.dumps({"mode":"inspect","resource":"attachment","id":int(attachment_id),"changes":{}}, separators=(",", ":")).encode()
              req = urllib.request.Request(
                  bridge_url,
                  data=payload,
                  method="POST",
                  headers={"Authorization": "Basic " + auth, "Content-Type":"application/json; charset=utf-8", "Accept":"application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=120) as r:
                      return int(r.status), json.loads(r.read().decode("utf-8", "replace"))
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(raw)
                  except Exception:
                      parsed = {"raw": raw[:1000]}
                  return int(e.code), parsed
              except Exception as e:
                  return 0, {"code":"transport_error","message":str(e)}

          def fetch_bytes(url):
              req = urllib.request.Request(ascii_url(url), headers={"User-Agent":"K20-Local-WebP/1.0"})
              with urllib.request.urlopen(req, timeout=180) as r:
                  return r.read(), str(r.headers.get("Content-Type") or "")

          def head_url(url):
              req = urllib.request.Request(ascii_url(url), method="HEAD", headers={"User-Agent":"K20-Local-WebP/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      return {"status":int(r.status), "bytes":int(r.headers.get("Content-Length") or 0), "content_type":str(r.headers.get("Content-Type") or "")}
              except urllib.error.HTTPError as e:
                  return {"status":int(e.code), "bytes":0, "content_type":str(e.headers.get("Content-Type") or "")}
              except Exception:
                  return {"status":0, "bytes":0, "content_type":""}

          def flatten_rgb(img):
              if "A" in img.getbands():
                  rgba = img.convert("RGBA")
                  bg = Image.new("RGBA", rgba.size, (255,255,255,255))
                  bg.alpha_composite(rgba)
                  return bg.convert("RGB")
              return img.convert("RGB")

          def psnr(a, b):
              aa = flatten_rgb(a)
              bb = flatten_rgb(b)
              diff = ImageChops.difference(aa, bb)
              hist = diff.histogram()
              sq = 0.0
              for i, count in enumerate(hist):
                  v = i % 256
                  sq += count * (v * v)
              mse = sq / float(aa.size[0] * aa.size[1] * 3)
              if mse <= 0:
                  return 99.0
              return 20.0 * math.log10(255.0 / math.sqrt(mse))

          def encode_webp(original_bytes, mime_type, quality, min_psnr):
              src = Image.open(io.BytesIO(original_bytes))
              src = ImageOps.exif_transpose(src)
              src.load()
              width, height = src.size
              has_alpha = "A" in src.getbands()
              colors = None
              try:
                  colors = src.convert("RGBA" if has_alpha else "RGB").getcolors(maxcolors=512)
              except Exception:
                  colors = None
              line_art = mime_type == "image/png" and (has_alpha or colors is not None)
              attempts = []
              qualities = [quality, min(92, quality + 4), min(95, quality + 7)]
              seen = set()
              for q in qualities:
                  if q in seen:
                      continue
                  seen.add(q)
                  out = io.BytesIO()
                  kwargs = {"format":"WEBP", "method":6, "quality":int(q)}
                  if src.info.get("icc_profile"):
                      kwargs["icc_profile"] = src.info.get("icc_profile")
                  if src.info.get("exif"):
                      kwargs["exif"] = src.info.get("exif")
                  src.save(out, **kwargs)
                  data = out.getvalue()
                  decoded = Image.open(io.BytesIO(data)); decoded.load()
                  score = psnr(src, decoded)
                  attempts.append({"mode":f"lossy-q{q}", "bytes":len(data), "psnr":round(score,2)})
                  if score >= min_psnr:
                      return data, width, height, round(score,2), f"lossy-q{q}", attempts
              if line_art:
                  out = io.BytesIO()
                  kwargs = {"format":"WEBP", "method":6, "lossless":True}
                  if src.info.get("icc_profile"):
                      kwargs["icc_profile"] = src.info.get("icc_profile")
                  src.save(out, **kwargs)
                  data = out.getvalue()
                  attempts.append({"mode":"lossless", "bytes":len(data), "psnr":99.0})
                  return data, width, height, 99.0, "lossless", attempts
              raise RuntimeError(f"Could not reach minimum PSNR {min_psnr}")

          def delete_uploaded(attachment_id):
              try:
                  return bool(server.wp.deleteFile(0, username, app_password, int(attachment_id)))
              except Exception:
                  return False

          for request_path in requests:
              request = json.loads(pathlib.Path(request_path).read_text(encoding="utf-8"))
              if str(request.get("action")) != "product.webp_migrate":
                  raise SystemExit("Unsupported local WebP action")
              quality = max(75, min(95, int(request.get("quality", 88))))
              min_psnr = max(32.0, min(50.0, float(request.get("min_psnr", 36.0))))
              min_saving = max(0.0, min(90.0, float(request.get("min_saving_pct", 20.0))))
              replace = request.get("replace") is True
              items = request.get("items") or []
              if not (1 <= len(items) <= 10):
                  raise SystemExit("product.webp_migrate requires 1..10 items")

              result = {
                  "action":"product.webp_migrate",
                  "executed_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
                  "quality":quality,
                  "min_psnr":min_psnr,
                  "min_saving_pct":min_saving,
                  "replace":replace,
                  "items":[],
              }

              for spec in items:
                  product_id = int(spec.get("product_id", 0))
                  old_id = int(spec.get("attachment_id", 0))
                  row = {"product_id":product_id, "old_attachment_id":old_id, "success":False}
                  result["items"].append(row)
                  new_id = None
                  original_images = None
                  try:
                      if product_id <= 0 or old_id <= 0:
                          raise RuntimeError("positive product_id and attachment_id are required")
                      code, inspected = bridge_inspect(old_id)
                      before = inspected.get("before") if isinstance(inspected, dict) else None
                      if not (200 <= code < 300 and inspected.get("ok") is True and isinstance(before, dict)):
                          raise RuntimeError(f"attachment inspect failed: http={code} code={inspected.get('code') if isinstance(inspected,dict) else ''}")
                      mime = str(before.get("mime_type") or "").lower()
                      if mime not in ("image/jpeg", "image/png"):
                          raise RuntimeError(f"unsupported source mime: {mime}")
                      source_url = str(before.get("url") or "")
                      if not source_url:
                          raise RuntimeError("source URL missing")

                      pcode, product = api_json("GET", f"{base}/wp-json/wc/v3/products/{product_id}")
                      if not (200 <= pcode < 300):
                          raise RuntimeError(f"product read failed: http={pcode}")
                      original_images = list(product.get("images") or [])
                      matches = [i for i, image in enumerate(original_images) if int(image.get("id") or 0) == old_id]
                      if len(matches) != 1:
                          raise RuntimeError(f"source attachment must occur exactly once in product images; found={len(matches)}")
                      target_index = matches[0]

                      original_bytes, _ = fetch_bytes(source_url)
                      webp_bytes, width, height, score, encoder_mode, attempts = encode_webp(original_bytes, mime, quality, min_psnr)
                      saving = round((1.0 - len(webp_bytes) / float(len(original_bytes))) * 100.0, 2)
                      row.update({
                          "source_url":source_url,
                          "source_mime":mime,
                          "width":width,
                          "height":height,
                          "original_bytes":len(original_bytes),
                          "webp_bytes_local":len(webp_bytes),
                          "saving_pct":saving,
                          "psnr_db":score,
                          "encoder_mode":encoder_mode,
                          "encoder_attempts":attempts,
                          "product_image_index":target_index,
                      })
                      if saving < min_saving:
                          row["stage"] = "saving_guard"
                          row["message"] = f"Saving {saving}% is below minimum {min_saving}%"
                          continue

                      slug = str(product.get("slug") or f"product-{product_id}").strip() or f"product-{product_id}"
                      filename = f"{slug}-{old_id}.webp"
                      upload = server.wp.uploadFile(0, username, app_password, {
                          "name":filename,
                          "type":"image/webp",
                          "bits":xmlrpc.client.Binary(webp_bytes),
                          "overwrite":False,
                          "post_id":product_id,
                      })
                      new_id = int(upload.get("id") or 0)
                      new_url = str(upload.get("url") or "")
                      if new_id <= 0 or not new_url:
                          raise RuntimeError("XML-RPC upload did not return a valid attachment")
                      row["new_attachment_id"] = new_id
                      row["new_url"] = new_url

                      ncode, ninspect = bridge_inspect(new_id)
                      nbefore = ninspect.get("before") if isinstance(ninspect, dict) else None
                      if not (200 <= ncode < 300 and ninspect.get("ok") is True and isinstance(nbefore, dict)):
                          raise RuntimeError(f"new attachment inspect failed: http={ncode}")
                      if str(nbefore.get("mime_type") or "").lower() != "image/webp":
                          raise RuntimeError("new attachment is not image/webp")
                      if int(nbefore.get("width") or 0) != width or int(nbefore.get("height") or 0) != height:
                          raise RuntimeError("new WebP dimensions differ from original")
                      h = head_url(new_url)
                      row["new_head"] = h
                      if not (200 <= h["status"] < 400 and "image/webp" in h["content_type"].lower()):
                          raise RuntimeError("new WebP URL verification failed")

                      if replace:
                          replacement = []
                          for idx, image in enumerate(original_images):
                              if idx == target_index:
                                  alt = str(image.get("alt") or product.get("name") or "")
                                  replacement.append({"id":new_id, "alt":alt})
                              else:
                                  replacement.append({"id":int(image.get("id") or 0)})
                          ucode, updated = api_json("PUT", f"{base}/wp-json/wc/v3/products/{product_id}", {"images":replacement})
                          if not (200 <= ucode < 300):
                              raise RuntimeError(f"product image update failed: http={ucode}")
                          rcode, readback = api_json("GET", f"{base}/wp-json/wc/v3/products/{product_id}")
                          if not (200 <= rcode < 300):
                              raise RuntimeError(f"product readback failed: http={rcode}")
                          rb_images = list(readback.get("images") or [])
                          if target_index >= len(rb_images) or int(rb_images[target_index].get("id") or 0) != new_id:
                              raise RuntimeError("product readback did not confirm new WebP attachment")
                          row["readback_image_id"] = int(rb_images[target_index].get("id") or 0)
                          row["readback_src"] = str(rb_images[target_index].get("src") or "")
                          row["replaced"] = True
                      else:
                          row["replaced"] = False

                      row["success"] = True
                      row["stage"] = "verified"

                  except Exception as exc:
                      row["stage"] = row.get("stage") or "error"
                      row["error"] = str(exc)
                      if new_id and replace and original_images:
                          try:
                              rollback = [{"id":int(image.get("id") or 0)} for image in original_images]
                              rcode, _ = api_json("PUT", f"{base}/wp-json/wc/v3/products/{product_id}", {"images":rollback})
                              row["rollback_product_http"] = rcode
                          except Exception as rb_exc:
                              row["rollback_product_error"] = str(rb_exc)
                      if new_id:
                          row["cleanup_uploaded_webp"] = delete_uploaded(new_id)

              result["success_count"] = sum(1 for x in result["items"] if x.get("success"))
              result["all_success"] = result["success_count"] == len(result["items"])
              out = results_dir / (pathlib.Path(request_path).stem + ".json")
              out.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
              print(f"Recorded {out}")
              if not result["all_success"]:
                  print("One or more migrations did not complete; see sanitized result.")

      - name: Commit sanitized migration results
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add local-webp-results/*.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record local WebP migration result"
          git pull --rebase origin main
          git push origin HEAD:main
