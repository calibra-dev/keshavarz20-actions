name: K20 Phase 12 Post Cache Public Verify

on:
  push:
    branches: [main]
    paths:
      - 'phase12-ops/verify-*.json'
      - 'scripts/k20_phase12_postcache_verify.py'
      - '.github/workflows/k20-phase12-postcache-verify.yml'

permissions:
  contents: write

concurrency:
  group: k20-phase12-postcache-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/k20_phase12_postcache_verify.py
      - name: Commit verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase12-results/post-cache-public-verify-20261001.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase12: record post-cache public verification"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
