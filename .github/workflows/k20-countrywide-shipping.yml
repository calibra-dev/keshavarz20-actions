name: K20 Countrywide Shipping Configuration

on:
  push:
    branches: [main]
    paths:
      - 'shipping-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-countrywide-shipping
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Apply changed shipping requests
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          current='${{ github.sha }}'
          zero='0000000000000000000000000000000000000000'
          if [ -n "$before" ] && [ "$before" != "$zero" ]; then
            mapfile -t files < <(git diff --name-only "$before" "$current" -- 'shipping-ops/*.json')
          else
            mapfile -t files < <(git show --pretty='' --name-only "$current" -- 'shipping-ops/*.json')
          fi
          test "${#files[@]}" -gt 0
          mkdir -p shipping-results
          for f in "${files[@]}"; do
            name="$(basename "$f" .json)"
            python scripts/k20_countrywide_shipping.py "$f" "shipping-results/$name.json"
          done
      - name: Record verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f shipping-results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'shipping: record countrywide carrier configuration'
          git pull --rebase origin main
          git push origin main