name: K20 Phase 17 Evidence Expert Case Gate

on:
  push:
    branches: [main]
    paths:
      - 'phase17-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase17-evidence-content-write
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Phase 17 evidence, QA and case gates
        run: python scripts/k20_phase17_evidence_gate.py phase17-results/evidence-expert-case-latest.json
      - name: Commit evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase17-results/evidence-expert-case-latest.json
          if git diff --cached --quiet; then
            echo "Phase 17 evidence unchanged; validation passed."
            exit 0
          fi
          git commit -m "phase17: record evidence expert case gate"
          git pull --rebase origin main
          git push origin HEAD:main
