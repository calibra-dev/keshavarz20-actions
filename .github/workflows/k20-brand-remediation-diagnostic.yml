name: K20 Brand Remediation Diagnostic
on:
  push:
    branches: [main]
    paths: ['brand-remediation-ops/diagnostic-*.json']
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python scripts/k20_brand_remediation_diagnostic.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f brand-remediation-results/diagnostic-latest.json
          git commit -m "brand remediation: record read-only diagnostic" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
