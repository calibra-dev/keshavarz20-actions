name: Phase 24 Remaining Direct Surface Queue
on:
  push:
    branches: [main]
    paths:
      - 'phase24/direct-observations-v2.json'
      - 'phase24/prompt-bank-200-fa.json'
      - 'phase24/build_remaining_queue.py'
      - '.github/workflows/k20-phase24-remaining-queue.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python phase24/build_remaining_queue.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase24-results/remaining-direct-surface-queue.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase24: record remaining direct surface queue"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
