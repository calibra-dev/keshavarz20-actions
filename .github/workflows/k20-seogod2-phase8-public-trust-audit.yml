name: SEO God2 Phase 8 Public Trust Audit

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'seo-god2-phase8-public-audit-ops/*.json'

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check requests beautifulsoup4
      - name: Audit public trust and social proof
        shell: python
        run: |
          import json, os, pathlib, time, requests
          from bs4 import BeautifulSoup

          ids=[140856,140718,135339,135349,140853,140406,140760,140816,140407,135337,135353,140454,135381,135361,140674,135235,140014,135309,135359,135667]
          physical={140674,140454,140407,140406,140014,135235,135381,135361,135359,135353,135349,135339,135337,135309,135667}
          base=os.environ['WP_BASE_URL'].rstrip('/')
          auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          api=requests.Session(); api.auth=auth
          public=requests.Session()

          def get_retry(session,url,**kwargs):
            last=None
            for attempt in range(4):
              try:
                return session.get(url,**kwargs)
              except requests.RequestException as e:
                last=e
                time.sleep(1.5*(attempt+1))
            raise last

          products=[]
          for pid in ids:
            r=get_retry(api,base+f'/wp-json/wc/v3/products/{pid}',timeout=60,params={'_fields':'id,name,permalink,average_rating,rating_count,reviews_allowed'})
            r.raise_for_status()
            products.append(r.json())

          reviews=[]
          page=1
          while True:
            r=get_retry(api,base+'/wp-json/wc/v3/products/reviews',timeout=60,params={
              'status':'approved','per_page':100,'page':page,'_fields':'id,product_id,rating,verified'
            })
            if r.status_code==400 and page>1:
              break
            r.raise_for_status()
            batch=r.json()
            if not batch:
              break
            reviews.extend(batch)
            if len(batch)<100:
              break
            page+=1

          by_product={}
          for x in reviews:
            pid=int(x.get('product_id') or 0)
            b=by_product.setdefault(pid,{'approved':0,'verified':0,'unverified':0})
            b['approved']+=1
            if x.get('verified'): b['verified']+=1
            else: b['unverified']+=1

          banned=['رضایت ۱۰۰','رضایت 100','صدها مشتری','هزاران مشتری','تضمین رضایت','تجربه موفق مشتری']
          rows=[]
          for p in products:
            pid=int(p['id'])
            rr=get_retry(public,p['permalink'],timeout=60,allow_redirects=True,headers={
              'User-Agent':'K20Phase8PublicAudit/1.0','Cache-Control':'no-cache','Pragma':'no-cache'
            })
            soup=BeautifulSoup(rr.text,'html.parser')
            trust=soup.select_one('.k20-trust-proof')
            text=' '.join(trust.stripped_strings) if trust else ''
            links=[a.get('href') or '' for a in trust.select('a[href]')] if trust else []
            rows.append({
              'product_id':pid,
              'name':p.get('name'),
              'public_status':rr.status_code,
              'public_final_url':rr.url,
              'rest_permalink':p.get('permalink'),
              'trust_card_present':trust is not None,
              'trust_heading_present':'اعتماد و شواهد این محصول' in text,
              'ugc_policy_link_present':any(x.rstrip('/').endswith('/reviews-qa-ugc-policy') for x in links),
              'anti_fake_review_policy_present':'هیچ نظر یا امتیاز ساختگی اضافه نمی‌شود' in text,
              'phase7_shipping_present':soup.select_one('.k20-shipping-clarity') is not None,
              'phase6_basket_present':'چک‌لیست تکمیل خرید' in rr.text,
              'expected_phase6_basket':pid in physical,
              'banned_social_claims':[x for x in banned if x in text],
              'woocommerce_reviews_allowed':bool(p.get('reviews_allowed')),
              'woocommerce_average_rating':p.get('average_rating'),
              'woocommerce_rating_count':p.get('rating_count'),
              'approved_reviews':by_product.get(pid,{}).get('approved',0),
              'verified_reviews':by_product.get(pid,{}).get('verified',0),
              'unverified_reviews':by_product.get(pid,{}).get('unverified',0),
            })

          policy=get_retry(public,base+'/reviews-qa-ugc-policy/',timeout=60,allow_redirects=True,headers={
            'User-Agent':'K20Phase8PublicAudit/1.0','Cache-Control':'no-cache','Pragma':'no-cache'
          })
          policy_text=' '.join(BeautifulSoup(policy.text,'html.parser').stripped_strings)

          failures={
            'public_non_200':[r['product_id'] for r in rows if r['public_status']!=200],
            'redirected_away':[r['product_id'] for r in rows if r['public_final_url'].rstrip('/').lower()!=r['rest_permalink'].rstrip('/').lower()],
            'trust_card_missing':[r['product_id'] for r in rows if not r['trust_card_present']],
            'trust_heading_missing':[r['product_id'] for r in rows if not r['trust_heading_present']],
            'ugc_policy_link_missing':[r['product_id'] for r in rows if not r['ugc_policy_link_present']],
            'anti_fake_policy_missing':[r['product_id'] for r in rows if not r['anti_fake_review_policy_present']],
            'phase7_shipping_missing':[r['product_id'] for r in rows if not r['phase7_shipping_present']],
            'phase6_basket_missing':[r['product_id'] for r in rows if r['expected_phase6_basket'] and not r['phase6_basket_present']],
            'banned_social_claims':[r['product_id'] for r in rows if r['banned_social_claims']],
          }
          metrics={k:len(v) for k,v in failures.items()}
          metrics.update({
            'tier_a_products':len(rows),
            'ugc_policy_page_ok':policy.status_code==200 and 'نظر' in policy_text and 'پرسش' in policy_text,
            'approved_reviews':len(reviews),
            'verified_reviews':sum(1 for x in reviews if x.get('verified')),
            'unverified_reviews':sum(1 for x in reviews if not x.get('verified')),
            'products_with_verified_reviews':sum(1 for x in by_product.values() if x.get('verified',0)>0),
          })
          zero_keys=['public_non_200','redirected_away','trust_card_missing','trust_heading_missing','ugc_policy_link_missing','anti_fake_policy_missing','phase7_shipping_missing','phase6_basket_missing','banned_social_claims']
          status='PASS' if all(metrics[k]==0 for k in zero_keys) and metrics['tier_a_products']==20 and metrics['ugc_policy_page_ok'] else 'FAIL'
          out={
            'schema_version':'seo-god2-phase8-public-trust-audit-v1',
            'status':status,
            'policy':'Never synthesize reviews, ratings, testimonials, customer projects, manufacturer confirmation, or reviewer identity.',
            'metrics':metrics,
            'failures':failures,
            'ugc_policy_page':{'status':policy.status_code,'final_url':policy.url},
            'rows':rows
          }
          pathlib.Path('seo-god2').mkdir(exist_ok=True)
          pathlib.Path('seo-god2/phase8-public-trust-audit-20260930.json').write_text(json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps({'status':status,'metrics':metrics},ensure_ascii=False))
          if status!='PASS':
            raise SystemExit(1)
      - name: Commit audit
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          test -f seo-god2/phase8-public-trust-audit-20260930.json || exit 0
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seo-god2/phase8-public-trust-audit-20260930.json
          git diff --cached --quiet && exit 0
          git commit -m "seo god2 phase8: record public trust acceptance"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
