name: Keshavarz20 Content Media Inventory

on:
  push:
    branches: [main]
    paths:
      - 'content-media-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-content-media-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build read-only content/render media inventory
        run: python scripts/k20_content_media_inventory.py

      - name: Commit sanitized inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-media-results/inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record content and rendered reference inventory"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          echo 'Failed to push sanitized content inventory after 5 attempts.' >&2
          exit 1
