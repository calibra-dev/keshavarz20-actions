name: Keshavarz20 Gallery Meta Rescue Prepare

on:
  push:
    branches: [main]
    paths:
      - 'gallery-meta-rescue-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-gallery-meta-rescue-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: python -m py_compile scripts/k20_gallery_meta_rescue_prepare.py
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Prepare verified gallery replacement WebPs
        run: python scripts/k20_gallery_meta_rescue_prepare.py
      - name: Commit sanitized preparation evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f gallery-meta-rescue/prepared.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record gallery meta rescue preparation"
          git pull --rebase origin main
          git push origin HEAD:main
