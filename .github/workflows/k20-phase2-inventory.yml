name: K20 Phase 2 Live Inventory

on:
  push:
    branches: [main]
    paths:
      - 'phase2-ops/*.json'
      - 'scripts/k20_phase2_inventory.py'
      - '.github/workflows/k20-phase2-inventory.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase2-live-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Build sanitized Phase 2 inventory
        run: python scripts/k20_phase2_inventory.py phase2-results/live-inventory.json
      - name: Commit inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add phase2-results/live-inventory.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase2: record live inventory"
          git pull --rebase origin main
          git push origin main
