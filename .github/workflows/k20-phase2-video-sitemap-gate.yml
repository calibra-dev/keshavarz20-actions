name: K20 Phase 2 Video Sitemap Gate

on:
  push:
    branches: [main]
    paths:
      - 'phase2/video-program/assets.json'
      - 'scripts/k20_video_sitemap_gate.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase2-video-sitemap-gate
  cancel-in-progress: true

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/k20_video_sitemap_gate.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase2-results/video-sitemap-gate.json
          if [ -f phase2-results/video-sitemap.xml ]; then git add -f phase2-results/video-sitemap.xml; fi
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase2: record video sitemap gate"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
