name: K20 GrowthOS JSON-LD Source Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'growthos-jsonld-source-ops/*.json'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile scripts/k20_growthos_jsonld_source.py
      - run: python scripts/k20_growthos_jsonld_source.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/jsonld-source-sample.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record JSON-LD source sample"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
