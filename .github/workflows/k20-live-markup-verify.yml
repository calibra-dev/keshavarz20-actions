name: K20 Live Markup Verify

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/live-markup/*.json'

permissions:
  contents: write

concurrency:
  group: k20-live-markup-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Verify live markup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $before='${{ github.event.before }}';$current='${{ github.sha }}';$zero='0000000000000000000000000000000000000000'
          if($before -and $before-ne$zero){$changed=@(git diff --name-only $before $current -- 'diagnostics/live-markup/*.json')}else{$changed=@(git show --pretty='' --name-only $current -- 'diagnostics/live-markup/*.json')}
          $changed=@($changed|Where-Object{$_ -match '^diagnostics/live-markup/.+\.json$'}|Sort-Object -Unique)
          if($changed.Count-eq0){throw 'No live markup request found.'}
          foreach($path in $changed){
            $req=Get-Content -Raw -LiteralPath $path|ConvertFrom-Json -Depth 20
            $phrase=[string]$req.phrase;$rows=@()
            foreach($url in @($req.urls)){
              $resp=Invoke-WebRequest -Uri ([string]$url) -Method GET -Headers @{'User-Agent'='K20-Live-Markup-Verify/2026-09-16';'Accept'='text/html'} -MaximumRedirection 5 -TimeoutSec 90 -SkipHttpErrorCheck
              $html=[string]$resp.Content
              $h1=@([regex]::Matches($html,'(?is)<h1\b[^>]*>(.*?)</h1>')|ForEach-Object{[regex]::Replace([Net.WebUtility]::HtmlDecode([regex]::Replace($_.Groups[1].Value,'<[^>]+>',' ')),'\s+',' ').Trim()})
              $h2=@([regex]::Matches($html,'(?is)<h2\b[^>]*>(.*?)</h2>')|ForEach-Object{[regex]::Replace([Net.WebUtility]::HtmlDecode([regex]::Replace($_.Groups[1].Value,'<[^>]+>',' ')),'\s+',' ').Trim()})
              $sha=[Security.Cryptography.SHA256]::Create();try{$hash=([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($html))).Replace('-','').ToLowerInvariant())}finally{$sha.Dispose()}
              $rows+=,[pscustomobject][ordered]@{url=[string]$url;status=[int]$resp.StatusCode;body_bytes=[Text.Encoding]::UTF8.GetByteCount($html);sha256=$hash;h1_count=$h1.Count;h1s=$h1;phrase_in_h1=($h1 -contains $phrase);phrase_in_h2=($h2 -contains $phrase)}
            }
            New-Item -ItemType Directory -Force results|Out-Null
            $name=[IO.Path]::GetFileNameWithoutExtension($path)
            [ordered]@{ok=$true;executed_at_utc=[DateTime]::UtcNow.ToString('o');phrase=$phrase;pages=$rows}|ConvertTo-Json -Depth 20|Set-Content -LiteralPath "results/live-markup-$name.json" -Encoding utf8
          }
      - name: Commit verification result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/live-markup-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record live markup verification"
          git pull --rebase origin main
          git push origin main
