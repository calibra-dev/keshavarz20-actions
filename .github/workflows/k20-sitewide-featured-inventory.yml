name: Keshavarz20 Featured and Category Media Inventory

on:
  push:
    branches: [main]
    paths:
      - 'sitewide-featured-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-sitewide-featured-inventory
  cancel-in-progress: false

jobs:
  inventory:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Build fast featured/category inventory
        run: python scripts/k20_sitewide_featured_inventory.py
      - name: Commit sanitized inventory
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sitewide-media-results/inventory-phase1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record featured/category image inventory"
          git pull --rebase origin main
          git push origin HEAD:main
