name: K20 Product Gallery Premium Slides

on:
  push:
    branches: [main]
    paths:
      - 'gallery-slide-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-product-gallery-premium-slides
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      PYTHONUTF8: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-noto-core
          python -m pip install requests Pillow arabic-reshaper python-bidi

      - name: Build corrected premium slides and append to gallery
        run: python scripts/k20_asayesh_gallery_slides.py

      - name: Commit sanitized evidence
        shell: bash
        run: |
          set -euo pipefail
          cp gallery-slide-results/20260923-p140014-gallery-slides.json /tmp/gallery-result.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p gallery-slide-results
          cp /tmp/gallery-result.json gallery-slide-results/20260923-p140014-gallery-slides.json
          git add -f gallery-slide-results/20260923-p140014-gallery-slides.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "gallery: record Asayesh 2-inch premium slides"
          git push origin HEAD:main
