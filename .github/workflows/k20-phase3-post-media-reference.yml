name: K20 Phase 3 Post Media Reference Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/phase3-post-media-reference/*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase3-post-media-reference
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Inspect one public post for media references
        shell: python
        run: |
          import os,json,base64,urllib.request,datetime,re,hashlib,subprocess
          before='${{ github.event.before }}'
          current='${{ github.sha }}'
          zero='0'*40
          if before and before!=zero:
              cmd=['git','diff','--name-only',before,current,'--','diagnostics/phase3-post-media-reference/*.json']
          else:
              cmd=['git','show','--pretty=','--name-only',current,'--','diagnostics/phase3-post-media-reference/*.json']
          changed=[x.strip() for x in subprocess.check_output(cmd,text=True).splitlines() if x.strip().endswith('.json')]
          if len(changed)!=1: raise SystemExit(f'Expected one request, got {len(changed)}')
          req=json.load(open(changed[0],encoding='utf-8'))
          post_id=int(req.get('post_id',0))
          if post_id<=0: raise SystemExit('post_id required')
          patterns=[str(x) for x in req.get('patterns',[]) if str(x)]
          if not patterns or len(patterns)>20: raise SystemExit('1-20 patterns required')
          base=os.environ['WP_BASE_URL'].rstrip('/')
          token=base64.b64encode((os.environ['WP_USERNAME']+':'+os.environ['WP_APP_PASSWORD']).encode()).decode()
          headers={'Authorization':'Basic '+token,'Accept':'application/json','User-Agent':'K20-Phase3-MediaRef/1.0'}
          url=f"{base}/wp-json/wp/v2/posts/{post_id}?context=edit&_fields=id,slug,status,link,modified_gmt,featured_media,content,meta"
          with urllib.request.urlopen(urllib.request.Request(url,headers=headers),timeout=120) as r:
              p=json.load(r)
          raw=((p.get('content') or {}).get('raw') or '')
          rendered=((p.get('content') or {}).get('rendered') or '')
          def clip(txt,needle):
              hits=[]; low=txt.lower(); n=needle.lower(); pos=0
              while len(hits)<8:
                  i=low.find(n,pos)
                  if i<0: break
                  s=max(0,i-260); e=min(len(txt),i+len(needle)+420)
                  snippet=re.sub(r'\s+',' ',txt[s:e]).strip()
                  hits.append({'offset':i,'snippet':snippet[:900]})
                  pos=i+len(needle)
              return hits
          matches=[]
          for pat in patterns:
              rh=clip(raw,pat); eh=clip(rendered,pat)
              if rh or eh:
                  matches.append({'pattern':pat,'raw_hits':rh,'rendered_hits':eh})
          meta=p.get('meta') or {}
          meta_keys=sorted(list(meta.keys())) if isinstance(meta,dict) else []
          elementor_data=''
          if isinstance(meta,dict):
              value=meta.get('_elementor_data')
              if isinstance(value,str): elementor_data=value
              elif value is not None: elementor_data=json.dumps(value,ensure_ascii=False,separators=(',',':'))
          meta_matches=[]
          for pat in patterns:
              mh=clip(elementor_data,pat) if elementor_data else []
              if mh: meta_matches.append({'pattern':pat,'elementor_hits':mh})
          out={
            'mode':'read-only',
            'generated_at_utc':datetime.datetime.now(datetime.timezone.utc).isoformat(),
            'post':{'id':p.get('id'),'slug':p.get('slug'),'status':p.get('status'),'link':p.get('link'),'modified_gmt':p.get('modified_gmt'),'featured_media':p.get('featured_media')},
            'content':{'raw_length':len(raw),'rendered_length':len(rendered),'raw_sha256':hashlib.sha256(raw.encode()).hexdigest(),'rendered_sha256':hashlib.sha256(rendered.encode()).hexdigest()},
            'matches':matches,
            'elementor_meta':{
              'present':bool(elementor_data),
              'length':len(elementor_data),
              'sha256':hashlib.sha256(elementor_data.encode()).hexdigest() if elementor_data else '',
              'matches':meta_matches
            },
            'meta_keys':meta_keys,
            'site_mutations':0
          }
          os.makedirs('phase3-results',exist_ok=True)
          name=os.path.splitext(os.path.basename(changed[0]))[0]
          json.dump(out,open(f'phase3-results/post-media-reference-{name}.json','w',encoding='utf-8'),ensure_ascii=False,indent=2)
      - name: Persist sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase3-results/post-media-reference-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase3: record sanitized post media reference diagnostic"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
