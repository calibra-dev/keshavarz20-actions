name: K20 Calculator Handle Map
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-handle-map.yml']
  workflow_dispatch:
permissions:
  contents: read
jobs:
  map:
    runs-on: ubuntu-latest
    steps:
      - shell: bash
        run: |
          set -euo pipefail
          URL='https://keshavarz20.com/drip-tape-length-fittings-calculator/'
          curl -fsSL -A 'Mozilla/5.0' "$URL" -o /tmp/p.html
          python3 - <<'PY'
          import re,json
          h=open('/tmp/p.html',encoding='utf8',errors='replace').read()
          out=[]
          for m in re.finditer(r'<link\b[^>]+(?:rel=["\'][^"\']*stylesheet[^"\']*["\']|as=["\']style["\'])[^>]*>',h,re.I):
            t=m.group(0)
            def a(n):
              x=re.search(r'\b'+n+r'=["\']([^"\']+)',t,re.I); return x.group(1) if x else None
            out.append({'id':a('id'),'href':a('href')})
          print(json.dumps(out,indent=2,ensure_ascii=False))
          PY
