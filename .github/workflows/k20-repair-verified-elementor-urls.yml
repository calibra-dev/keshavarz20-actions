name: K20 Repair Verified Elementor URLs
on:
  push:
    branches: [main]
    paths:
      - 'media-reconciliation/20260916-content-webp75/repair-request.json'
permissions:
  contents: write
concurrency:
  group: k20-content-direct-reuse
  cancel-in-progress: false
jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - run: python scripts/k20_repair_verified_elementor_urls.py
      - name: Record guarded repair result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media-reconciliation/20260916-content-webp75/repair-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record hash-guarded Elementor URL repair"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
