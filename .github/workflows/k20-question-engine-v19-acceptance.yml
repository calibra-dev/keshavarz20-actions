name: K20 Question Engine v19 Production Acceptance
on:
  push:
    branches: [main]
    paths:
      - 'question-engine-v19-acceptance-ops/*.json'
      - '.github/workflows/k20-question-engine-v19-acceptance.yml'
  workflow_dispatch:
permissions:
  contents: write
  issues: read
concurrency:
  group: k20-question-engine-v19-acceptance
  cancel-in-progress: true
jobs:
  accept:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Static regression
        run: |
          python -m py_compile question-engine/engine_v19.py
          python question-engine/test_engine_v19.py
      - name: Live status and dry-run
        run: |
          python question-engine/engine_v19.py --action status --result /tmp/v19-status.json
          python question-engine/engine_v19.py --action dry_run --result /tmp/v19-dry.json
      - name: Build acceptance
        run: |
          python - <<'PY'
          import json, pathlib
          cfg=json.load(open('question-engine/config.json',encoding='utf-8'))
          qa=json.load(open('question-engine-results/v19-catalog-qa.json',encoding='utf-8'))
          status=json.load(open('/tmp/v19-status.json',encoding='utf-8'))
          dry=json.load(open('/tmp/v19-dry.json',encoding='utf-8'))
          checks={
            'config_engine_v19': cfg.get('engine_version')=='v19',
            'runtime_enabled': status.get('ok') is True and status.get('enabled') is True,
            'dry_run_ok': dry.get('ok') is True and dry.get('action')=='dry_run',
            'dry_run_engine_v19': dry.get('engine_version')==19,
            'qa_catalog_652': qa.get('catalog_products')==652 and qa.get('products_covered')==652,
            'qa_uncovered_zero': qa.get('uncovered_count')==0,
            'qa_blockers_zero': qa.get('blocker_count')==0,
            'qa_duplicate_below_0_10': float(qa.get('semantic_duplicate_rate_last_200') or 1)<0.10,
            'synthetic_evidence_preserved': qa.get('acceptance',{}).get('synthetic_evidence_label_preserved') is True,
            'dry_run_synthetic_evidence': dry.get('evidence_classification')=='synthetic_editorial_question_generator_not_customer_evidence',
          }
          out={
            'phase':17,
            'engine_version':19,
            'status':'PASS_V19_PRODUCTION' if all(checks.values()) else 'FAIL_V19_ACCEPTANCE',
            'checks':checks,
            'qa':{
              'catalog_products':qa.get('catalog_products'),
              'products_covered':qa.get('products_covered'),
              'approved_candidates':qa.get('approved_candidates'),
              'semantic_duplicate_rate_last_200':qa.get('semantic_duplicate_rate_last_200'),
              'blocker_count':qa.get('blocker_count'),
              'uncovered_count':qa.get('uncovered_count'),
            },
            'runtime_status':{
              'enabled':status.get('enabled'),
              'state_sequence':status.get('state_sequence'),
              'questions_total':status.get('questions_total'),
              'products_touched':status.get('products_touched'),
              'pending_generated':(status.get('watchdog') or {}).get('pending_generated'),
              'consecutive_failures':(status.get('watchdog') or {}).get('consecutive_failures'),
            },
            'dry_run':{
              'product_id':dry.get('product_id'),
              'family':dry.get('family'),
              'intent':dry.get('intent_v19'),
              'quality_score':dry.get('quality_score'),
              'canonical_intent_id':dry.get('canonical_intent_id'),
              'evidence_classification':dry.get('evidence_classification'),
            },
            'site_writes':0
          }
          pathlib.Path('question-engine-results/v19-production-acceptance.json').write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
          PY
      - name: Persist acceptance
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f question-engine-results/v19-production-acceptance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "questions v19: record production acceptance"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

      - name: Enforce acceptance
        run: |
          python - <<'PY'
          import json
          x=json.load(open('question-engine-results/v19-production-acceptance.json',encoding='utf-8'))
          assert x['status']=='PASS_V19_PRODUCTION', x
          PY
