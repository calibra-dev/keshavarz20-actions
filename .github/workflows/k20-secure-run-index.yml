name: K20 Secure Relay Run Index
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-secure-run-index.yml']
  workflow_dispatch:
permissions:
  actions: read
  contents: write
jobs:
  index:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          python3 - <<'PY'
          import json, os, urllib.request
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          url=f'https://api.github.com/repos/{repo}/actions/workflows/k20-bridge-v3-secure-relay.yml/runs?branch=main&per_page=30'
          req=urllib.request.Request(url,headers={
            'Authorization':f'Bearer {token}',
            'Accept':'application/vnd.github+json',
            'X-GitHub-Api-Version':'2022-11-28',
            'User-Agent':'k20-secure-run-index'
          })
          with urllib.request.urlopen(req,timeout=60) as r:
            d=json.load(r)
          rows=[{
            'id':x.get('id'),'head_sha':x.get('head_sha'),'status':x.get('status'),
            'conclusion':x.get('conclusion'),'created_at':x.get('created_at'),
            'updated_at':x.get('updated_at'),'run_number':x.get('run_number')
          } for x in d.get('workflow_runs',[])]
          open('diagnostics/secure-relay-runs.json','w').write(json.dumps(rows,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/secure-relay-runs.json
          git commit -m "diag: index secure relay runs" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
