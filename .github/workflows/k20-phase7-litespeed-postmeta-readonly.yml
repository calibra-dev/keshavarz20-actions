name: K20 Phase 7 LiteSpeed Post Meta Readonly

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/phase7-litespeed-postmeta/*.json'

permissions:
  contents: write

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Read litespeed_no_cache post meta only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $before='${{ github.event.before }}'; $current='${{ github.sha }}'; $zero='0000000000000000000000000000000000000000'
          if($before -and $before -ne $zero){ $files=@(git diff --name-only $before $current -- 'diagnostics/phase7-litespeed-postmeta/*.json') }
          else { $files=@(git show --pretty='' --name-only $current -- 'diagnostics/phase7-litespeed-postmeta/*.json') }
          $reqPath=@($files | Where-Object { $_ -match '^diagnostics/phase7-litespeed-postmeta/.+\.json$' } | Sort-Object -Unique | Select-Object -First 1)
          if(-not $reqPath){ throw 'No request file found.' }
          $req=Get-Content -Raw -LiteralPath $reqPath | ConvertFrom-Json -Depth 10
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json';'Content-Type'='application/json'}
          $rows=@()
          foreach($item in @($req.targets)){
            $id=[int]$item.id
            if($id -le 0){ throw "Invalid id: $id" }
            $command="post meta get $id litespeed_no_cache"
            $payload=[ordered]@{command=$command;confirm_write=$false}|ConvertTo-Json -Compress
            try{
              $r=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/cli/run" -Headers $headers -Method POST -Body $payload -TimeoutSec 120
              $rows+=,[pscustomobject]@{
                name=[string]$item.name
                id=$id
                exit_code=$r.exit_code
                stdout=[string]$r.stdout
                stderr=[string]$r.stderr
              }
            }catch{
              $rows+=,[pscustomobject]@{
                name=[string]$item.name
                id=$id
                error=$_.Exception.Message
              }
            }
          }
          New-Item -ItemType Directory -Force 'phase7-results' | Out-Null
          [ordered]@{mode='read-only';meta_key='litespeed_no_cache';targets=$rows}|ConvertTo-Json -Depth 10|Set-Content -LiteralPath 'phase7-results/litespeed-no-cache-postmeta.json' -Encoding utf8
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/litespeed-no-cache-postmeta.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record LiteSpeed no-cache post meta"
          git pull --rebase origin main
          git push origin HEAD:main
