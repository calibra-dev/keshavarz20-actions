name: K20 Phase 11 Public Verify
on:
  push:
    branches: [main]
    paths:
      - 'phase11-ops/verify-*.json'
      - 'scripts/k20_phase11_verify.py'
      - '.github/workflows/k20-phase11-public-verify.yml'
permissions:
  contents: write
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - run: python scripts/k20_phase11_verify.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase11-results/public-live-verify.json
          git commit -m "phase11: record public live verification" || exit 0
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
