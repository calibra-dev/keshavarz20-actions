name: K20 Product Sitemap Hygiene Check

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/sitemap-hygiene/*.json'

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Fetch live product sitemap and check stale product slugs
        shell: bash
        run: |
          set -euo pipefail
          out="$RUNNER_TEMP/k20-sitemap-hygiene"
          mkdir -p "$out"
          body="$out/product-sitemap.xml"
          headers="$out/headers.txt"
          code=$(curl -L -sS --compressed --max-time 90 -A 'K20-Sitemap-Hygiene/2026-09-17' -D "$headers" -o "$body" -w '%{http_code}' 'https://keshavarz20.com/product-sitemap.xml')
          content_type=$(awk 'BEGIN{IGNORECASE=1} /^content-type:/ {sub(/\r$/,""); v=$0} END{sub(/^[^:]+:[[:space:]]*/,"",v); print v}' "$headers")
          bytes=$(wc -c < "$body" | tr -d ' ')
          python3 - "$body" "$code" "$content_type" "$bytes" "$out/result.json" <<'PY'
          import json, sys, xml.etree.ElementTree as ET
          from datetime import datetime, timezone

          path, code, content_type, bytes_s, result_path = sys.argv[1:6]
          root = ET.parse(path).getroot()

          def local(tag):
              return tag.rsplit('}', 1)[-1]

          product_locs = []
          image_locs = []
          for url_el in root.iter():
              if local(url_el.tag) != 'url':
                  continue
              for child in list(url_el):
                  if local(child.tag) == 'loc' and (child.text or '').strip():
                      product_locs.append((child.text or '').strip())
                  elif local(child.tag) == 'image':
                      for image_child in list(child):
                          if local(image_child.tag) == 'loc' and (image_child.text or '').strip():
                              image_locs.append((image_child.text or '').strip())

          bad_products = [u for u in product_locs if '__trashed' in u]
          bad_images = [u for u in image_locs if '__trashed' in u]
          result = {
              'checked_utc': datetime.now(timezone.utc).isoformat(),
              'url': 'https://keshavarz20.com/product-sitemap.xml',
              'http_code': code,
              'content_type': content_type,
              'bytes': int(bytes_s),
              'product_loc_count': len(product_locs),
              'product_trashed_count': len(bad_products),
              'product_trashed_sample': bad_products[:20],
              'image_loc_count': len(image_locs),
              'image_trashed_count': len(bad_images),
              'image_trashed_sample': bad_images[:20],
          }
          print(json.dumps(result, ensure_ascii=False, indent=2))
          with open(result_path, 'w', encoding='utf-8') as f:
              json.dump(result, f, ensure_ascii=False, indent=2)
          if code != '200' or bad_products:
              raise SystemExit(1)
          PY
      - name: Upload evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-product-sitemap-hygiene
          path: ${{ runner.temp }}/k20-sitemap-hygiene/
          retention-days: 14
