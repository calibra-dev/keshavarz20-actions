name: Keshavarz20 Guarded Media XML-RPC

on:
  push:
    branches: [main]
    paths:
      - 'media-xmlrpc-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-media-xmlrpc
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Execute guarded media operation
        shell: python
        run: |
          import base64
          import json
          import os
          import pathlib
          import subprocess
          import time
          import urllib.error
          import urllib.request
          import xmlrpc.client

          for key in ("WP_BASE_URL", "WP_USERNAME", "WP_APP_PASSWORD"):
              if not os.environ.get(key, "").strip():
                  raise SystemExit(f"Missing required repository secret: {key}")

          def changed_requests():
              commands = [
                  ["git", "diff", "--name-only", "HEAD^", "HEAD", "--", "media-xmlrpc-ops/*.json"],
                  ["git", "show", "--pretty=", "--name-only", "HEAD", "--", "media-xmlrpc-ops/*.json"],
              ]
              for cmd in commands:
                  out = subprocess.check_output(cmd, text=True).splitlines()
                  paths = sorted({p.strip() for p in out if p.strip().startswith("media-xmlrpc-ops/") and p.strip().endswith(".json")})
                  if paths:
                      return paths
              return []

          requests = changed_requests()
          if not requests:
              raise SystemExit("No media XML-RPC request JSON found")

          base = os.environ["WP_BASE_URL"].rstrip("/")
          username = os.environ["WP_USERNAME"]
          app_password = os.environ["WP_APP_PASSWORD"]
          bridge_url = base + "/wp-json/keshavarz20-ops/v2/execute"
          xmlrpc_url = base + "/xmlrpc.php"
          auth = base64.b64encode(f"{username}:{app_password}".encode()).decode()
          results_dir = pathlib.Path("media-maintenance-results")
          results_dir.mkdir(parents=True, exist_ok=True)

          server = xmlrpc.client.ServerProxy(xmlrpc_url, allow_none=True, use_builtin_types=True)

          def bridge_inspect(attachment_id):
              payload = json.dumps({"mode":"inspect","resource":"attachment","id":int(attachment_id),"changes":{}}, separators=(",", ":")).encode()
              req = urllib.request.Request(
                  bridge_url,
                  data=payload,
                  method="POST",
                  headers={"Authorization": "Basic " + auth, "Content-Type":"application/json; charset=utf-8", "Accept":"application/json"},
              )
              try:
                  with urllib.request.urlopen(req, timeout=90) as r:
                      body = r.read().decode("utf-8", "replace")
                      try:
                          parsed = json.loads(body)
                      except Exception:
                          parsed = {"raw": body[:500]}
                      return {"http_code": int(r.status), "body": parsed}
              except urllib.error.HTTPError as e:
                  body = e.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(body)
                  except Exception:
                      parsed = {"raw": body[:500]}
                  return {"http_code": int(e.code), "body": parsed}
              except Exception as e:
                  return {"http_code": 0, "body": {"code":"transport_error", "message": str(e)}}

          def head_url(url):
              if not url:
                  return {"status":0, "bytes":0}
              req = urllib.request.Request(url, method="HEAD", headers={"User-Agent":"K20-Media-Maintenance/1.0"})
              try:
                  with urllib.request.urlopen(req, timeout=45) as r:
                      return {"status":int(r.status), "bytes":int(r.headers.get("Content-Length") or 0)}
              except urllib.error.HTTPError as e:
                  return {"status":int(e.code), "bytes":0}
              except Exception:
                  return {"status":0, "bytes":0}

          for request_path in requests:
              request = json.loads(pathlib.Path(request_path).read_text(encoding="utf-8"))
              action = str(request.get("action", ""))
              result = {"action": action, "executed_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime())}

              if action == "xmlrpc.probe":
                  attachment_id = int(request.get("id", 0))
                  if attachment_id <= 0:
                      raise SystemExit("xmlrpc.probe requires a positive id")
                  item = server.wp.getMediaItem(0, username, app_password, attachment_id)
                  result.update({
                      "ok": True,
                      "attachment": {
                          "id": int(item.get("attachment_id") or item.get("id") or attachment_id),
                          "link": str(item.get("link") or item.get("url") or ""),
                          "type": str(item.get("type") or ""),
                          "parent": int(item.get("parent") or 0),
                          "title": str(item.get("title") or ""),
                      },
                  })

              elif action == "attachment.delete_batch":
                  if request.get("confirm_zero_ref") is not True:
                      raise SystemExit("delete_batch requires confirm_zero_ref=true")
                  manifest_path = str(request.get("manifest", ""))
                  if not manifest_path.startswith("ops/media/unused-media-zero-ref-") or not manifest_path.endswith(".json"):
                      raise SystemExit("delete_batch requires an approved zero-ref manifest path")
                  manifest_file = pathlib.Path(manifest_path)
                  if not manifest_file.is_file():
                      raise SystemExit("zero-ref manifest not found")
                  manifest = json.loads(manifest_file.read_text(encoding="utf-8"))
                  approved = {int(x) for x in manifest.get("zero_ref_ids", [])}
                  ids = []
                  for raw in request.get("ids", []):
                      value = int(raw)
                      if value > 0 and value not in ids:
                          ids.append(value)
                  if not ids or len(ids) > 25:
                      raise SystemExit("delete_batch requires 1..25 unique positive ids")
                  if any(x not in approved for x in ids):
                      raise SystemExit("delete_batch contains an id not present in the zero-ref manifest")

                  rows = []
                  for attachment_id in ids:
                      before = bridge_inspect(attachment_id)
                      b = before.get("body") or {}
                      before_obj = b.get("before") if isinstance(b, dict) else None
                      if not (200 <= int(before.get("http_code", 0)) < 300 and isinstance(before_obj, dict) and b.get("ok") is True):
                          rows.append({"id":attachment_id,"deleted":False,"stage":"preinspect","http_code":before.get("http_code",0),"code":b.get("code") if isinstance(b,dict) else ""})
                          continue
                      mime = str(before_obj.get("mime_type") or "")
                      parent = int(before_obj.get("parent") or 0)
                      source_url = str(before_obj.get("url") or "")
                      if not mime.startswith("image/") or parent != 0:
                          rows.append({"id":attachment_id,"deleted":False,"stage":"guard","mime_type":mime,"parent":parent})
                          continue

                      item = server.wp.getMediaItem(0, username, app_password, attachment_id)
                      xml_id = int(item.get("attachment_id") or item.get("id") or 0)
                      xml_parent = int(item.get("parent") or 0)
                      xml_type = str(item.get("type") or "")
                      xml_link = str(item.get("link") or item.get("url") or "")
                      if xml_id != attachment_id or xml_parent != 0 or not xml_type.startswith("image/") or (source_url and xml_link and source_url != xml_link):
                          rows.append({"id":attachment_id,"deleted":False,"stage":"xmlrpc_guard","xml_id":xml_id,"xml_parent":xml_parent,"xml_type":xml_type})
                          continue

                      original_head = head_url(source_url)
                      calls = 0
                      delete_return = False
                      try:
                          delete_return = bool(server.wp.deleteFile(0, username, app_password, attachment_id))
                          calls += 1
                      except xmlrpc.client.Fault as fault:
                          rows.append({"id":attachment_id,"deleted":False,"stage":"delete","fault_code":fault.faultCode,"fault":fault.faultString})
                          continue

                      time.sleep(0.5)
                      after = bridge_inspect(attachment_id)
                      ab = after.get("body") or {}
                      still_exists = bool(200 <= int(after.get("http_code",0)) < 300 and isinstance(ab,dict) and ab.get("ok") is True and isinstance(ab.get("before"),dict))

                      # If MEDIA_TRASH is enabled, first call only trashes the attachment.
                      if still_exists and calls == 1:
                          try:
                              delete_return = bool(server.wp.deleteFile(0, username, app_password, attachment_id)) and delete_return
                              calls += 1
                          except xmlrpc.client.Fault as fault:
                              rows.append({"id":attachment_id,"deleted":False,"stage":"delete_second","fault_code":fault.faultCode,"fault":fault.faultString})
                              continue
                          time.sleep(0.5)
                          after = bridge_inspect(attachment_id)
                          ab = after.get("body") or {}
                          still_exists = bool(200 <= int(after.get("http_code",0)) < 300 and isinstance(ab,dict) and ab.get("ok") is True and isinstance(ab.get("before"),dict))

                      final_head = head_url(source_url)
                      rows.append({
                          "id": attachment_id,
                          "deleted": bool(delete_return and not still_exists),
                          "delete_calls": calls,
                          "title": str(before_obj.get("title") or ""),
                          "mime_type": mime,
                          "source_url": source_url,
                          "original_status_before": original_head.get("status",0),
                          "original_bytes_before": original_head.get("bytes",0),
                          "inspect_http_after": after.get("http_code",0),
                          "inspect_code_after": ab.get("code") if isinstance(ab,dict) else "",
                          "source_status_after": final_head.get("status",0),
                      })

                  result["manifest"] = manifest_path
                  result["requested_count"] = len(ids)
                  result["deleted_count"] = sum(1 for r in rows if r.get("deleted"))
                  result["all_deleted"] = all(r.get("deleted") for r in rows)
                  result["items"] = rows

              else:
                  raise SystemExit(f"Unsupported guarded media XML-RPC action: {action}")

              out = results_dir / (pathlib.Path(request_path).stem + ".json")
              out.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")
              print(f"Recorded {out}")

      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add media-maintenance-results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record guarded XML-RPC result"
          git pull --rebase origin main
          git push origin HEAD:main
