name: Keshavarz20 Product REST Rescue Autopilot

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'media-rest-rescue/config.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: k20-product-rest-rescue
  cancel-in-progress: false

jobs:
  rescue:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 1
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Validate Python
        run: python -m py_compile scripts/k20_product_rest_rescue_autopilot.py
      - name: Install Pillow
        run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Process REST rescue batch
        run: python scripts/k20_product_rest_rescue_autopilot.py
      - name: Commit checkpoint and evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media-rest-rescue/state.json media-rest-rescue-results/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: checkpoint product REST rescue ${GITHUB_RUN_ID}"
          git pull --rebase origin main
          git push origin HEAD:main
      - name: Queue next rescue cycle
        if: always()
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f media-rest-rescue/config.json ] || [ ! -f media-rest-rescue/state.json ]; then exit 0; fi
          enabled=$(python -c "import json; print(str(json.load(open('media-rest-rescue/config.json')).get('enabled',False)).lower())")
          chain=$(python -c "import json; print(str(json.load(open('media-rest-rescue/config.json')).get('self_chain',False)).lower())")
          status=$(python -c "import json; print(json.load(open('media-rest-rescue/state.json')).get('status',''))")
          if [ "$enabled" != "true" ] || [ "$chain" != "true" ] || [ "$status" != "running" ]; then exit 0; fi
          code=$(curl -sS -o /tmp/k20-rest-rescue-dispatch.txt -w "%{http_code}" -X POST -H "Accept: application/vnd.github+json" -H "Authorization: Bearer ${GH_TOKEN}" -H "X-GitHub-Api-Version: 2022-11-28" "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/k20-product-rest-rescue-autopilot.yml/dispatches" -d '{"ref":"main"}')
          if [ "$code" != "204" ]; then cat /tmp/k20-rest-rescue-dispatch.txt || true; exit 1; fi
      - name: Fail visibly on safety halt
        if: always()
        shell: bash
        run: |
          if [ -f media-rest-rescue/state.json ]; then
            status=$(python -c "import json; print(json.load(open('media-rest-rescue/state.json')).get('status',''))")
            if [ "$status" = "halted" ]; then exit 1; fi
          fi
