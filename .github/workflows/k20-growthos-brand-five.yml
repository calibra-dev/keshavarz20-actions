name: K20 GrowthOS Remaining Brand Five Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'growthos-brand-five-ops/*.json'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Compare Woo brands and live Product JSON-LD for five
        shell: python
        run: |
          import json, os, pathlib, requests
          from html import unescape
          from html.parser import HTMLParser

          ids=[135383,139231,139232,140406,140407]
          base=os.environ['WP_BASE_URL'].rstrip('/')
          s=requests.Session(); s.auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])

          class P(HTMLParser):
              def __init__(self):
                  super().__init__(); self.on=False; self.buf=[]; self.blocks=[]
              def handle_starttag(self,tag,attrs):
                  if tag.lower()=='script' and (dict(attrs).get('type') or '').lower()=='application/ld+json':
                      self.on=True; self.buf=[]
              def handle_endtag(self,tag):
                  if tag.lower()=='script' and self.on:
                      self.blocks.append(''.join(self.buf)); self.on=False; self.buf=[]
              def handle_data(self,d):
                  if self.on:self.buf.append(d)
          def walk(x):
              if isinstance(x,dict):
                  yield x
                  for v in x.values(): yield from walk(v)
              elif isinstance(x,list):
                  for v in x: yield from walk(v)
          def brandval(v):
              if isinstance(v,dict): return v.get('name')
              if isinstance(v,list): return [brandval(x) for x in v]
              return v

          rows=[]
          for pid in ids:
              wr=s.get(f"{base}/wp-json/wc/v3/products/{pid}",timeout=90); wr.raise_for_status()
              w=wr.json()
              url=w.get('permalink')
              pr=requests.get(url,timeout=90,headers={'User-Agent':'K20-BrandFive-Diag/1.0','Cache-Control':'no-cache'})
              p=P(); p.feed(pr.text)
              prod=[]
              for raw in p.blocks:
                  try:data=json.loads(unescape(raw))
                  except Exception:continue
                  for n in walk(data):
                      if not isinstance(n,dict):continue
                      t=n.get('@type'); ts=t if isinstance(t,list) else [t]
                      if 'Product' in ts: prod.append(n)
              selected=None
              sku=str(w.get('sku') or '').strip()
              for n in prod:
                  if sku and str(n.get('sku') or '').strip()==sku:
                      selected=n; break
              if selected is None and prod:selected=prod[0]
              rows.append({
                'product_id':pid,'name':w.get('name'),'sku':sku,
                'woo_brands':[{'id':x.get('id'),'name':x.get('name'),'slug':x.get('slug')} for x in (w.get('brands') or [])],
                'live_http':pr.status_code,'schema_brand':brandval((selected or {}).get('brand')),
                'schema_sku':(selected or {}).get('sku'),'product_schema_present':bool(selected)
              })
          out={'rows':rows}
          pathlib.Path('growthos-phase3-results').mkdir(exist_ok=True)
          pathlib.Path('growthos-phase3-results/remaining-brand-five.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(out,ensure_ascii=False))
      - name: Commit sanitized five-product diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/remaining-brand-five.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record remaining five brand diagnostic"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
