name: K20 Phase 7 Home WebP Apply V2

on:
  push:
    branches: [main]
    paths:
      - 'phase7-home-webp-apply-v2-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase7-home-webp-apply-v2
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Apply exact homepage WebP replacements with rollback
        run: python scripts/k20_phase7_home_webp_apply_v2.py
      - name: Persist sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/home-heavy-webp-apply-v2-20260922.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record homepage WebP apply v2"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
