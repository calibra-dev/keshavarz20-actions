name: Phase 24 Direct Observation Ingest
on:
  push:
    branches: [main]
    paths:
      - 'phase24/import/*.b64'
      - 'phase24/ingest_direct_observations.py'
      - '.github/workflows/k20-phase24-direct-ingest.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  ingest:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - name: Decode validate and merge direct observations
        run: |
          python -m py_compile phase24/measurement_v2.py phase24/ingest_direct_observations.py
          python phase24/ingest_direct_observations.py
          python phase24/measurement_v2.py --output phase24-results/measurement-v2-latest.json
      - name: Verify expected imported surface counts
        run: |
          python - <<'PY'
          import json
          x=json.load(open('phase24-results/direct-observation-ingest-2026-09-27.json',encoding='utf-8'))
          assert x['canonical_observations'] >= 70
          assert x['surface_counts']['ChatGPT Search'] >= 20
          assert x['surface_counts']['Google AI Mode / AI Overviews'] >= 50
          assert x['readback_verified_count'] >= 70
          m=json.load(open('phase24-results/measurement-v2-latest.json',encoding='utf-8'))
          assert m['direct_surface_kpis']['direct_observation_count'] >= 70
          assert m['status'] == 'CONTROL_PLANE_COMPLETE_EXTERNAL_SURFACE_PENDING'
          PY
      - name: Persist canonical evidence and KPI report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase24/direct-observations-v2.json phase24-results/direct-observation-ingest-2026-09-27.json phase24-results/measurement-v2-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase24: ingest 70 validated direct surface observations"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
