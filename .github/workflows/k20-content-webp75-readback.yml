name: K20 Frozen Content WebP75 Readback
on:
  push:
    branches: [main]
    paths:
      - 'media-reconciliation/20260916-content-webp75/request.json'
permissions:
  contents: write
concurrency:
  group: k20-content-webp75-readback
  cancel-in-progress: false
jobs:
  readback:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pillow
      - name: Read frozen media and content references using GET only
        run: python scripts/k20_content_webp75_readback.py
      - name: Record sanitized readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media-reconciliation/20260916-content-webp75/live-readback.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record frozen WebP75 readback"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
