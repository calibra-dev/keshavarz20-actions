name: K20 Product Queue Promoter

on:
  push:
    branches:
      - 'automation/product-*'
    paths:
      - 'product-engine/queue/*.json'

permissions:
  contents: write
  actions: write

concurrency:
  group: k20-product-queue-promoter
  cancel-in-progress: false

jobs:
  promote:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Checkout producer branch
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Resolve exactly one new immutable queue
        id: queue
        shell: bash
        run: |
          set -euo pipefail
          git diff-tree --no-commit-id --name-only --diff-filter=A -r "$GITHUB_SHA" -- 'product-engine/queue/*.json' > /tmp/product-queues.txt
          count=$(grep -c . /tmp/product-queues.txt || true)
          if [ "$count" -ne 1 ]; then
            echo "::error::Expected exactly one newly added product queue; found $count"
            cat /tmp/product-queues.txt || true
            exit 2
          fi
          file=$(cat /tmp/product-queues.txt)
          case "$file" in
            product-engine/queue/*.json) ;;
            *) echo "::error::Unexpected queue path: $file"; exit 3 ;;
          esac
          product_id=$(python - "$file" <<'PY'
          import json, sys
          from pathlib import Path
          p=Path(sys.argv[1])
          d=json.loads(p.read_text(encoding='utf-8'))
          if d.get('content_type')!='product':
              raise SystemExit('content_type must be product')
          if d.get('producer')!='connected_chatgpt_deep_research':
              raise SystemExit('producer must be connected_chatgpt_deep_research')
          pid=int(d.get('product_id') or 0)
          if pid<=0:
              raise SystemExit('product_id missing')
          if str(pid) not in p.name:
              raise SystemExit('queue filename must contain product_id')
          print(pid)
          PY
          )
          cp "$file" /tmp/product-queue.json
          echo "file=$file" >> "$GITHUB_OUTPUT"
          echo "product_id=$product_id" >> "$GITHUB_OUTPUT"

      - name: Promote queue onto current main
        shell: bash
        env:
          QUEUE_FILE: ${{ steps.queue.outputs.file }}
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          if git cat-file -e "origin/main:${QUEUE_FILE}" 2>/dev/null; then
            echo "Queue already exists on main; promotion is idempotently complete."
            exit 0
          fi
          source_branch="$GITHUB_REF_NAME"
          source_sha="$GITHUB_SHA"
          git checkout -B main origin/main
          mkdir -p "$(dirname "$QUEUE_FILE")"
          cp /tmp/product-queue.json "$QUEUE_FILE"
          python scripts/check_product_engine_primary_route.py
          git add "$QUEUE_FILE"
          base_name=$(basename "$QUEUE_FILE")
          git commit -m "product-engine: promote ${base_name} from ${source_branch} (${source_sha:0:12})"
          for attempt in 1 2 3 4 5; do
            if git pull --rebase origin main && git push origin HEAD:main; then
              exit 0
            fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt * 2))
          done
          exit 1

      - name: Dispatch queue publisher explicitly
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          QUEUE_FILE: ${{ steps.queue.outputs.file }}
          PRODUCT_ID: ${{ steps.queue.outputs.product_id }}
        run: |
          set -euo pipefail
          git fetch origin main
          git cat-file -e "origin/main:${QUEUE_FILE}" || { echo "::error::Promoted queue is missing from main"; exit 5; }

          result_path="product-engine/results/${PRODUCT_ID}.json"
          if git cat-file -e "origin/main:${result_path}" 2>/dev/null; then
            echo "Result already exists on main for product ${PRODUCT_ID}; publisher dispatch is idempotently skipped."
            exit 0
          fi

          python - <<'PY' > /tmp/product-publisher-dispatch.json
          import json, os
          print(json.dumps({
              "ref": "main",
              "inputs": {
                  "queue_file": os.environ["QUEUE_FILE"],
                  "validate_only": "false"
              }
          }))
          PY

          code=$(curl -sS -o /tmp/product-publisher-dispatch-response.txt -w "%{http_code}" \
            -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${GH_TOKEN}" \
            -H "X-GitHub-Api-Version: 2022-11-28" \
            "https://api.github.com/repos/${GITHUB_REPOSITORY}/actions/workflows/k20-product-queue-publisher.yml/dispatches" \
            --data-binary @/tmp/product-publisher-dispatch.json)

          if [ "$code" != "204" ]; then
            echo "::error::Publisher workflow_dispatch failed with HTTP $code"
            cat /tmp/product-publisher-dispatch-response.txt || true
            exit 6
          fi
          echo "PRODUCT_PUBLISHER_DISPATCHED queue=${QUEUE_FILE} product_id=${PRODUCT_ID}"
