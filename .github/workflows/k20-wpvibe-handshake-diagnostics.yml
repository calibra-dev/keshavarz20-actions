name: K20 WPVibe Handshake Diagnostics Readonly

on:
  push:
    branches: [main]
    paths:
      - 'wpvibe-handshake-ops/*.json'

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Inspect WPVibe handshake surface safely
        shell: python
        run: |
          import json, os, requests
          from pathlib import Path

          base=os.environ["WP_BASE_URL"].rstrip("/")
          s=requests.Session()
          s.auth=(os.environ["WP_USERNAME"],os.environ["WP_APP_PASSWORD"])
          s.headers.update({
              "Accept":"application/json",
              "Cache-Control":"no-cache, no-store, max-age=0",
              "Pragma":"no-cache",
              "User-Agent":"k20-wpvibe-handshake-diag/1.0",
          })

          out={"read_only":True,"site":base,"routes":{},"probes":{}}
          idx=s.get(base+"/wp-json/",timeout=60)
          out["rest_index_http"]=idx.status_code
          data=idx.json() if idx.ok else {}
          allroutes=data.get("routes",{}) if isinstance(data,dict) else {}
          wanted=[
              "/wpvibe/v1/connection-check-challenge",
              "/wpvibe/v1/authorize/preflight",
              "/wpvibe/v1/authorize",
              "/wpvibe/v1/connection-status",
              "/wpvibe/v1/site-info",
              "/wpvibe/v1/health",
              "/wpvibe/v1/ping",
              "/wpvibe/v1/cli/status",
              "/wpvibe/v1/audit-log",
          ]
          for path in wanted:
              meta=allroutes.get(path,{})
              eps=[]
              for ep in meta.get("endpoints",[]) if isinstance(meta,dict) else []:
                  args={}
                  for k,v in (ep.get("args") or {}).items():
                      args[k]={
                          "required":bool(v.get("required")),
                          "type":v.get("type"),
                          "enum":v.get("enum"),
                      }
                  eps.append({"methods":ep.get("methods"),"args":args})
              out["routes"][path]={
                  "methods":meta.get("methods") if isinstance(meta,dict) else None,
                  "endpoints":eps,
              }

          def safe_get(name,path,params=None):
              try:
                  r=s.get(base+path,params=params,timeout=60)
                  row={"http":r.status_code,"content_type":r.headers.get("Content-Type")}
                  try: body=r.json()
                  except Exception: body=None
                  if isinstance(body,dict):
                      row["keys"]=sorted(body.keys())[:40]
                      row["code"]=body.get("code")
                      msg=body.get("message")
                      if isinstance(msg,(str,int,float,bool)) or msg is None:
                          row["message"]=str(msg or "")[:240]
                      safe={}
                      for k,v in body.items():
                          lk=str(k).lower()
                          if any(x in lk for x in ["password","token","secret","nonce","credential","authorization","api_key","key"]):
                              continue
                          if isinstance(v,(str,int,float,bool)) or v is None:
                              safe[k]=v
                      row["safe_scalars"]=safe
                      if isinstance(body.get("data"),dict):
                          ds={}
                          for k,v in body["data"].items():
                              lk=str(k).lower()
                              if any(x in lk for x in ["password","token","secret","nonce","credential","authorization","api_key","key"]):
                                  continue
                              if isinstance(v,(str,int,float,bool)) or v is None:
                                  ds[k]=v
                          row["safe_data_scalars"]=ds
                      if isinstance(body.get("entries"),list):
                          row["entries_count"]=len(body["entries"])
                      if isinstance(body.get("items"),list):
                          row["items_count"]=len(body["items"])
                  elif isinstance(body,list):
                      row["json_list_count"]=len(body)
                  out["probes"][name]=row
              except Exception as exc:
                  out["probes"][name]={"http":0,"error":f"{type(exc).__name__}: {exc}"}

          safe_get("health","/wp-json/wpvibe/v1/health")
          safe_get("ping","/wp-json/wpvibe/v1/ping")
          safe_get("site_info","/wp-json/wpvibe/v1/site-info")
          safe_get("cli_status","/wp-json/wpvibe/v1/cli/status")
          safe_get("audit_log","/wp-json/wpvibe/v1/audit-log",{"limit":20})

          Path("wpvibe-connectivity-results").mkdir(exist_ok=True)
          Path("wpvibe-connectivity-results/handshake-diagnostics.json").write_text(
              json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8"
          )
          print(json.dumps({
              "rest_index_http":out.get("rest_index_http"),
              "probe_http":{k:v.get("http") for k,v in out["probes"].items()},
              "probe_codes":{k:v.get("code") for k,v in out["probes"].items()},
              "probe_messages":{k:v.get("message") for k,v in out["probes"].items()},
          },ensure_ascii=False))
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f wpvibe-connectivity-results/handshake-diagnostics.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record WPVibe handshake diagnostics"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
