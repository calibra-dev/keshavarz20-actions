name: K20 Reusable Docker QA Lab

on:
  push:
    branches:
      - main
      - feat/reusable-docker-qa-lab-20261026
    paths:
      - 'qa/docker/**'
      - '.github/workflows/k20-reusable-docker-qa.yml'

  workflow_dispatch:
    inputs:
      php_version:
        description: PHP version for the disposable WordPress and WP-CLI containers
        required: true
        type: choice
        options:
          - '8.1'
          - '8.3'
          - '8.4'
        default: '8.3'
      browser:
        description: Run Playwright Chromium desktop and mobile smoke tests
        required: true
        type: boolean
        default: true
      plugin_artifact_id:
        description: Optional same-repository GitHub Actions artifact ID containing exactly one plugin ZIP
        required: false
        type: string
      plugin_sha256:
        description: Required original plugin ZIP SHA-256 if artifact ID is supplied
        required: false
        type: string
      previous_plugin_artifact_id:
        description: Optional original older version artifact ID for a genuine upgrade test
        required: false
        type: string
      previous_plugin_sha256:
        description: Required older plugin ZIP SHA-256 if previous artifact ID is supplied
        required: false
        type: string

  workflow_call:
    inputs:
      php_version:
        type: string
        default: '8.3'
      browser:
        type: boolean
        default: true
      plugin_artifact_id:
        type: string
        default: ''
      plugin_sha256:
        type: string
        default: ''
      previous_plugin_artifact_id:
        type: string
        default: ''
      previous_plugin_sha256:
        type: string
        default: ''

permissions:
  contents: read

concurrency:
  group: k20-reusable-docker-qa-${{ github.ref }}-${{ github.run_id }}
  cancel-in-progress: false

jobs:
  disposable-wordpress-qa:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    permissions:
      contents: read
      actions: read
    env:
      QA_PHP_VERSION: ${{ inputs.php_version || '8.3' }}
      QA_ENABLE_BROWSER: ${{ github.event_name == 'push' && '1' || (inputs.browser && '1' || '0') }}
      QA_KEEP_VOLUMES: '0'
    steps:
      - name: Checkout QA environment definitions
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Check configuration and prepare isolated folders
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p qa/docker/fixtures qa/docker/artifacts
          bash -n qa/docker/scripts/run.sh
          docker compose -f qa/docker/compose.yml config --quiet
          echo QA_COMPOSE_CONFIG_VALID
          docker version
          docker compose version

      - name: Import optional version-pinned plugin artifacts
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
          PLUGIN_ARTIFACT_ID: ${{ inputs.plugin_artifact_id || '' }}
          PLUGIN_SHA256: ${{ inputs.plugin_sha256 || '' }}
          PREVIOUS_ARTIFACT_ID: ${{ inputs.previous_plugin_artifact_id || '' }}
          PREVIOUS_SHA256: ${{ inputs.previous_plugin_sha256 || '' }}
        run: |
          set -euo pipefail
          import_artifact() {
            local artifact_id="$1" expected_sha="$2" destination="$3"
            if [ -z "$artifact_id" ]; then
              if [ -n "$expected_sha" ]; then
                echo "SHA provided without artifact ID" >&2
                return 1
              fi
              return 0
            fi
            if ! [[ "$artifact_id" =~ ^[0-9]+$ && "$expected_sha" =~ ^[0-9a-fA-F]{64}$ ]]; then
              echo "Invalid artifact ID or missing SHA-256" >&2
              return 1
            fi
            local temporary
            temporary="$(mktemp -d)"
            gh api "/repos/$GITHUB_REPOSITORY/actions/artifacts/$artifact_id/zip" > "$temporary/artifact.zip"
            mkdir -p "$temporary/unwrapped"
            unzip -q "$temporary/artifact.zip" -d "$temporary/unwrapped"
            mapfile -d '' candidates < <(find "$temporary/unwrapped" -type f -name '*.zip' -print0)
            if [ "${#candidates[@]}" -ne 1 ]; then
              echo "Artifact must contain exactly one installable plugin ZIP" >&2
              return 1
            fi
            cp "${candidates[0]}" "$destination"
            printf '%s  %s\n' "$expected_sha" "$destination" | sha256sum -c -
            unzip -t "$destination" > /dev/null
            rm -rf "$temporary"
            echo "QA_PLUGIN_ZIP_IMPORT_HASH_VERIFIED"
          }
          import_artifact "$PLUGIN_ARTIFACT_ID" "$PLUGIN_SHA256" "qa/docker/fixtures/plugin-under-test.zip"
          import_artifact "$PREVIOUS_ARTIFACT_ID" "$PREVIOUS_SHA256" "qa/docker/fixtures/previous-plugin.zip"
          if [ -n "$PREVIOUS_ARTIFACT_ID" ] && [ -z "$PLUGIN_ARTIFACT_ID" ]; then
            echo "Upgrade requires both previous and new version ZIPs" >&2
            exit 1
          fi

      - name: Build pinned PHP-Node-Chromium toolbox
        uses: docker/build-push-action@v6
        with:
          context: ./qa/docker
          file: ./qa/docker/Dockerfile.toolbox
          load: true
          push: false
          tags: ghcr.io/calibra-dev/k20-qa-toolbox:stable
          cache-from: type=gha,scope=k20-qa-toolbox
          cache-to: type=gha,mode=max,scope=k20-qa-toolbox

      - name: Check toolbox binaries and lint test scripts
        shell: bash
        run: |
          set -euo pipefail
          docker run --rm \
            -v "$PWD/qa/docker/scripts:/qa/scripts:ro" \
            ghcr.io/calibra-dev/k20-qa-toolbox:stable \
            bash -lc 'shellcheck /qa/scripts/run.sh && php -l /qa/scripts/verify-environment.php && node --check /qa/scripts/browser-smoke.cjs && node -v && php -v && composer --version'
          echo QA_TOOLBOX_RUNTIME_OK

      - name: Install WordPress WooCommerce and test Legacy
        shell: bash
        run: bash qa/docker/scripts/run.sh legacy

      - name: Install WordPress WooCommerce and test HPOS
        shell: bash
        run: bash qa/docker/scripts/run.sh hpos

      - name: Upload disposable UI evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-qa-ui-${{ github.run_id }}
          path: qa/docker/artifacts/*/*.png
          if-no-files-found: ignore
          retention-days: 7

      - name: Record coverage boundaries
        if: always()
        shell: bash
        run: |
          {
            echo '## K20 Docker QA Environment'
            echo '- Stack: disposable MariaDB, WordPress, WP-CLI, WooCommerce, PHP, Node 22, Composer, Playwright Chromium.'
            echo '- Storage modes: Legacy and HPOS; isolated QA orders only.'
            echo '- No production WordPress secrets, orders, or database copied to Docker.'
            echo '- Optional plugin ZIPs must come from a same-repository Actions artifact and match an exact SHA-256.'
            echo '- Without a ZIP artifact this run verifies the persistent test LAB, not a specific plugin release.'
            echo '- GitHub-hosted runners are ephemeral; the environment definitions, Buildx cache and published toolbox image are retained.'
          } >> "$GITHUB_STEP_SUMMARY"

  publish-reusable-toolbox:
    needs: disposable-wordpress-qa
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    permissions:
      contents: read
      packages: write
    steps:
      - uses: actions/checkout@v4

      - uses: docker/setup-buildx-action@v3

      - name: Authenticate with GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Publish immutable SHA tag and reusable stable image
        uses: docker/build-push-action@v6
        with:
          context: ./qa/docker
          file: ./qa/docker/Dockerfile.toolbox
          push: true
          tags: |
            ghcr.io/calibra-dev/k20-qa-toolbox:stable
            ghcr.io/calibra-dev/k20-qa-toolbox:sha-${{ github.sha }}
          cache-from: type=gha,scope=k20-qa-toolbox
          cache-to: type=gha,mode=max,scope=k20-qa-toolbox
