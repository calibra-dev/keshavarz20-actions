name: K20 Refund Elementor Root Repair

on:
  push:
    branches: [main]
    paths:
      - 'elementor-root-repair-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-refund-elementor-root-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate repair script
        run: python -m py_compile scripts/k20_refund_elementor_root_repair.py
      - name: Apply guarded Page 13 root repair and verify live
        run: python scripts/k20_refund_elementor_root_repair.py
      - name: Commit sanitized repair evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/elementor-root-repair-*.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record guarded refund Elementor root repair evidence"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0 || sleep 2; done
          exit 1
