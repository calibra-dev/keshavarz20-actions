name: Keshavarz20 Content Direct Media Scope

on:
  push:
    branches: [main]
    paths:
      - 'content-direct-scope-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-content-direct-scope
  cancel-in-progress: false

jobs:
  scope:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_content_direct_scope.py scripts/k20_content_direct_plan.py
      - name: Build compact direct JPEG PNG scope
        run: python scripts/k20_content_direct_scope.py
      - name: Build guarded direct migration plan
        run: python scripts/k20_content_direct_plan.py
      - name: Commit scope and plan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-media-results/direct-scope.json content-media-results/direct-plan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record direct content JPEG PNG scope and plan"
          git pull --rebase origin main
          git push origin HEAD:main
