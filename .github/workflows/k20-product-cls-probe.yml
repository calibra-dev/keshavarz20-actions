name: K20 Product CLS Probe

on:
  push:
    branches: [main]
    paths:
      - 'product-engine/probe-queue/**'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - uses: browser-actions/setup-chrome@v1

      - name: Install probe dependencies
        run: python -m pip install --quiet requests selenium

      - name: Resolve request
        shell: bash
        run: |
          set -euo pipefail
          REQ="$(git diff --name-only HEAD^ HEAD | grep '^product-engine/probe-queue/.*\.json$' | tail -n 1)"
          test -n "$REQ"
          echo "K20_PROBE_REQUEST=$REQ" >> "$GITHUB_ENV"

      - name: Run HTTP and CLS probe
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p product-engine/probe-output
          python - <<'PY'
          import json, os, pathlib, time
          import requests
          from selenium import webdriver
          from selenium.webdriver.chrome.options import Options

          req_path=pathlib.Path(os.environ["K20_PROBE_REQUEST"])
          req=json.loads(req_path.read_text(encoding="utf-8"))
          url=str(req["url"])

          selected=[
              "x-litespeed-cache","x-litespeed-cache-control","x-k20-canary-guard",
              "x-k20-wc-cache-compat","x-k20-wc-prevent-hook","x-k20-donotcache",
              "x-k20-ls-cacheable","x-k20-ls-nocache-reason","x-k20-wc-notices",
              "x-k20-esi","x-k20-preheader-cache","x-k20-late-ls-nocache",
              "x-k20-late-donotcache","x-k20-late-filtered-donotcache","x-k20-late-ls-control",
              "x-k20-late-ls-cacheable","x-k20-late-ls-notcacheable",
              "x-k20-late-ls-forced","x-k20-late-ls-publicforced","x-k20-late-ls-private",
              "set-cookie","cache-control","age","server","vary"
          ]
          session=requests.Session()
          session.headers.update({"User-Agent":"Mozilla/5.0 K20-CLS-Probe/1.0","Accept":"text/html,application/xhtml+xml"})
          http=[]
          for i in range(3):
              started=time.perf_counter()
              r=session.get(url,timeout=30,allow_redirects=True)
              h={k.lower():v for k,v in r.headers.items()}
              http.append({
                  "run":i+1,"status":r.status_code,
                  "elapsed_ms":round((time.perf_counter()-started)*1000,1),
                  "bytes":len(r.content),
                  "headers":{k:h.get(k) for k in selected if h.get(k) is not None}
              })

          opts=Options()
          opts.add_argument("--headless=new")
          opts.add_argument("--no-sandbox")
          opts.add_argument("--disable-dev-shm-usage")
          opts.add_argument("--disable-background-networking")
          opts.add_argument("--window-size=412,915")
          driver=webdriver.Chrome(options=opts)
          if req.get("lighthouse_like"):
              driver.execute_cdp_cmd("Network.enable",{})
              driver.execute_cdp_cmd("Network.emulateNetworkConditions",{
                  "offline":False,
                  "latency":150,
                  "downloadThroughput":200000,
                  "uploadThroughput":100000,
                  "connectionType":"cellular4g"
              })
              driver.execute_cdp_cmd("Emulation.setCPUThrottlingRate",{"rate":4})
          driver.execute_cdp_cmd("Emulation.setDeviceMetricsOverride",{
              "width":412,"height":915,"deviceScaleFactor":1,"mobile":True,
              "screenWidth":412,"screenHeight":915
          })
          driver.execute_cdp_cmd("Network.setUserAgentOverride",{
              "userAgent":"Mozilla/5.0 (Linux; Android 13; K20Probe) AppleWebKit/537.36 (KHTML, like Gecko) Chrome/140.0 Mobile Safari/537.36"
          })
          script=r"""
          (function(){
            window.__k20Shifts=[];
            window.__k20Lcp=[];
            const rect=r=>r?({x:r.x,y:r.y,width:r.width,height:r.height,top:r.top,right:r.right,bottom:r.bottom,left:r.left}):null;
            const selector=n=>{
              if(!n || !n.tagName) return null;
              if(n.id) return '#'+n.id;
              const c=n.classList?Array.from(n.classList).slice(0,4):[];
              return n.tagName.toLowerCase()+(c.length?'.'+c.join('.'):'');
            };
            new PerformanceObserver(list=>{
              for(const e of list.getEntries()){
                if(e.hadRecentInput) continue;
                window.__k20Shifts.push({
                  value:e.value,startTime:e.startTime,
                  sources:(e.sources||[]).map(s=>{
                    const n=s.node;
                    return {
                      selector:selector(n),
                      previousRect:rect(s.previousRect),
                      currentRect:rect(s.currentRect),
                      text:n&&n.innerText?String(n.innerText).trim().slice(0,160):null,
                      html:n&&n.outerHTML?String(n.outerHTML).slice(0,320):null
                    };
                  })
                });
              }
            }).observe({type:'layout-shift',buffered:true});
            try {
              new PerformanceObserver(list=>{
                for(const e of list.getEntries()){
                  const n=e.element;
                  const r=n&&n.getBoundingClientRect?n.getBoundingClientRect():null;
                  window.__k20Lcp.push({
                    startTime:e.startTime,renderTime:e.renderTime,loadTime:e.loadTime,size:e.size,
                    url:e.url||null,
                    tag:n&&n.tagName?n.tagName:null,
                    id:n&&n.id?n.id:null,
                    className:n&&n.className?String(n.className):null,
                    src:n&&n.currentSrc?n.currentSrc:(n&&n.src?n.src:null),
                    loading:n&&n.getAttribute?n.getAttribute('loading'):null,
                    fetchpriority:n&&n.getAttribute?n.getAttribute('fetchpriority'):null,
                    rect:r?{top:r.top,left:r.left,width:r.width,height:r.height}:null,
                    text:n&&n.innerText?String(n.innerText).trim().slice(0,200):null
                  });
                }
              }).observe({type:'largest-contentful-paint',buffered:true});
            } catch(e) {}
          })();
          """
          driver.execute_cdp_cmd("Page.addScriptToEvaluateOnNewDocument",{"source":script})
          driver.get(url)
          time.sleep(10)
          shifts=driver.execute_script("return window.__k20Shifts || []")
          lcp=driver.execute_script("return window.__k20Lcp || []")
          resources=driver.execute_script("""
            return performance.getEntriesByType('resource').map(e=>({
              name:e.name,initiatorType:e.initiatorType,startTime:e.startTime,
              requestStart:e.requestStart,responseStart:e.responseStart,responseEnd:e.responseEnd,
              duration:e.duration,transferSize:e.transferSize,decodedBodySize:e.decodedBodySize
            })).sort((a,b)=>b.duration-a.duration).slice(0,40);
          """)
          images=driver.execute_script("""
            return Array.from(document.images).map((img,i)=>{
              const r=img.getBoundingClientRect();
              return {
                i,src:img.currentSrc||img.src||null,alt:img.alt||null,
                className:img.className?String(img.className):null,
                loading:img.getAttribute('loading'),
                fetchpriority:img.getAttribute('fetchpriority'),
                top:r.top,left:r.left,width:r.width,height:r.height,
                inViewport:r.bottom>0 && r.top<innerHeight
              };
            }).sort((a,b)=>a.top-b.top);
          """)
          metrics=driver.execute_script("""
            return {
              href:location.href,
              readyState:document.readyState,
              scrollHeight:document.documentElement.scrollHeight,
              viewport:{w:innerWidth,h:innerHeight,dpr:devicePixelRatio},
              product:(()=>{const e=document.querySelector('#product-134980');if(!e)return null;const r=e.getBoundingClientRect();return {top:r.top,left:r.left,width:r.width,height:r.height,style:e.getAttribute('style'),className:e.className};})()
            };
          """)
          css_targets=req.get("css_targets") or []
          css_coverage=driver.execute_script("""
            const targets=arguments[0]||[];
            const out=[];
            const visit=(rules,acc)=>{
              if(!rules) return;
              for(const rule of rules){
                try{
                  if(rule.cssRules){ visit(rule.cssRules,acc); continue; }
                  const text=String(rule.cssText||'');
                  acc.totalRules++;
                  acc.totalBytes+=text.length;
                  if(!rule.selectorText) continue;
                  let used=false;
                  try{ used=!!document.querySelector(rule.selectorText); }catch(e){}
                  if(used){
                    acc.usedRules++;
                    acc.usedBytes+=text.length;
                    if(acc.usedSelectors.length<80) acc.usedSelectors.push(String(rule.selectorText).slice(0,240));
                  }
                }catch(e){}
              }
            };
            for(const target of targets){
              const acc={target,totalRules:0,usedRules:0,totalBytes:0,usedBytes:0,usedSelectors:[]};
              for(const sheet of Array.from(document.styleSheets||[])){
                const href=String(sheet.href||'');
                if(!href.includes(target)) continue;
                acc.href=href;
                try{ visit(sheet.cssRules,acc); }catch(e){ acc.error=String(e); }
              }
              acc.usedRulePct=acc.totalRules?Math.round(acc.usedRules*10000/acc.totalRules)/100:0;
              acc.usedBytePct=acc.totalBytes?Math.round(acc.usedBytes*10000/acc.totalBytes)/100:0;
              out.push(acc);
            }
            return out;
          """, css_targets)
          driver.quit()

          total=sum(float(x.get("value") or 0) for x in shifts)
          lcp_urls={str(x.get("url") or x.get("src") or "") for x in lcp if (x.get("url") or x.get("src"))}
          lcp_resources=[x for x in resources if str(x.get("name") or "") in lcp_urls]
          out={"url":url,"http":http,"cls_total":total,"shifts":shifts,"lcp":lcp,"lcp_resources":lcp_resources,"resources":resources,"images":images,"css_coverage":css_coverage,"page":metrics}
          path=pathlib.Path("product-engine/probe-output/134980-cls.json")
          path.write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps({
              "url":url,"http":http,"cls_total":total,
              "shift_count":len(shifts),
              "top_shifts":sorted(shifts,key=lambda x:x.get("value",0),reverse=True)[:5],
              "lcp":lcp[-5:],
              "lcp_resources":lcp_resources,
              "slow_resources":resources[:15],
              "viewport_images":[x for x in images if x.get("inViewport")][:20],
              "early_images":[x for x in images if x.get("top",99999)<1800][:30],
              "css_coverage":css_coverage,
              "page":metrics
          },ensure_ascii=False))
          PY

      - uses: actions/upload-artifact@v4
        with:
          name: k20-product-134980-cls-probe
          path: product-engine/probe-output/134980-cls.json
          if-no-files-found: error
