name: K20 Phase 3 Apply Decision Links

on:
  push:
    branches: [main]
    paths:
      - 'phase3-apply-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase3-apply-decision-links
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Apply guarded Top30 decision links
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $files=@(Get-ChildItem -LiteralPath requests -Filter '20260918-phase3-decision-links-*-v1.json' | Sort-Object Name)
          if($files.Count -ne 30){ throw "Expected 30 decision-link requests, found $($files.Count)" }
          New-Item -ItemType Directory -Force results | Out-Null
          foreach($f in $files){
            $name=[IO.Path]::GetFileNameWithoutExtension($f.Name)
            $out=Join-Path $env:RUNNER_TEMP "$name.result.json"
            & ./scripts/Invoke-K20SiteGateway.ps1 -RequestPath $f.FullName -OutputPath $out
            if($LASTEXITCODE -ne 0){ throw "Gateway failed for $($f.Name)" }
            Copy-Item $out "results/$name.json" -Force
          }
      - name: Persist results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/20260918-phase3-decision-links-*-v1.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase3: record Top30 decision-link live writes"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
