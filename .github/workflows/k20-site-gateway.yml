name: Keshavarz20 Guarded Site Gateway

on:
  push:
    branches: [main]
    paths:
      - 'requests/*.json'

permissions:
  contents: write

concurrency:
  group: k20-site-gateway
  cancel-in-progress: false

jobs:
  execute:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Execute guarded requests
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'

          if ([string]::IsNullOrWhiteSpace($env:WP_BASE_URL) -or
              [string]::IsNullOrWhiteSpace($env:WP_USERNAME) -or
              [string]::IsNullOrWhiteSpace($env:WP_APP_PASSWORD)) {
            throw 'WordPress repository secrets are missing.'
          }

          $before = '${{ github.event.before }}'
          $current = '${{ github.sha }}'
          $zero = '0000000000000000000000000000000000000000'

          if ($before -and $before -ne $zero) {
            $changed = @(git diff --name-only $before $current -- 'requests/*.json')
          } else {
            $changed = @(git show --pretty='' --name-only $current -- 'requests/*.json')
          }

          $changed = @($changed | Where-Object { $_ -match '^requests/.+\.json$' } | Sort-Object -Unique)
          if ($changed.Count -eq 0) { throw 'No request JSON found in triggering commit.' }

          foreach ($requestPath in $changed) {
            $name = [IO.Path]::GetFileNameWithoutExtension($requestPath)
            $localOutput = Join-Path $env:RUNNER_TEMP "$name.result.json"

            & ./scripts/Invoke-K20SiteGateway.ps1 -RequestPath $requestPath -OutputPath $localOutput
            if ($LASTEXITCODE -ne 0) { throw "Gateway failed for $requestPath" }

            $resultText = Get-Content -Raw -LiteralPath $localOutput
            $encoded = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($resultText))
            $resultPath = "results/$name.json"
            $encodedPath = (($resultPath -split '/') | ForEach-Object { [Uri]::EscapeDataString($_) }) -join '/'
            $api = "https://api.github.com/repos/${{ github.repository }}/contents/$encodedPath"
            $headers = @{
              Authorization = "Bearer $env:GH_TOKEN"
              Accept = 'application/vnd.github+json'
              'X-GitHub-Api-Version' = '2022-11-28'
              'User-Agent' = 'k20-guarded-site-gateway'
            }

            $existingSha = $null
            try {
              $existing = Invoke-RestMethod -Method Get -Uri "$api?ref=main" -Headers $headers -TimeoutSec 60
              $existingSha = $existing.sha
            } catch {
              if (-not ($_.Exception.Response -and [int]$_.Exception.Response.StatusCode -eq 404)) { throw }
            }

            $put = [ordered]@{
              message = "gateway: record result for $name"
              content = $encoded
              branch = 'main'
            }
            if ($existingSha) { $put.sha = $existingSha }

            Invoke-RestMethod -Method Put -Uri $api -Headers $headers -ContentType 'application/json' -Body ($put | ConvertTo-Json -Depth 10) -TimeoutSec 60 | Out-Null
            Write-Host "Recorded $resultPath"
          }
