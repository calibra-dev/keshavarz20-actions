name: K20 Elementor Cache Refresh

on:
  push:
    branches: [main]
    paths:
      - 'elementor-cache-ops/*.json'

permissions:
  contents: write

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Clear Elementor cache and verify live refund markup
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $before='${{ github.event.before }}';$current='${{ github.sha }}';$zero='0000000000000000000000000000000000000000'
          if($before -and $before-ne$zero){$changed=@(git diff --name-only $before $current -- 'elementor-cache-ops/*.json')}else{$changed=@(git show --pretty='' --name-only $current -- 'elementor-cache-ops/*.json')}
          $changed=@($changed|Where-Object{$_ -match '^elementor-cache-ops/.+\.json$'}|Sort-Object -Unique)
          if($changed.Count-eq0){throw 'No Elementor cache request found.'}
          foreach($path in $changed){$name=[IO.Path]::GetFileNameWithoutExtension($path);& ./scripts/Invoke-K20ElementorCacheRefresh.ps1 -RequestPath $path -OutputPath "results/elementor-cache-$name.json"}
      - name: Commit verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/elementor-cache-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record Elementor cache refresh evidence"
          for i in 1 2 3; do git pull --rebase origin main && git push origin main && exit 0 || sleep 2; done
          exit 1
