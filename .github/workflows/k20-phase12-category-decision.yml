name: K20 Phase 12 Category Decision Pages

on:
  push:
    branches: [main]
    paths:
      - 'phase12-ops/apply-*.json'
      - 'scripts/k20_phase12_category_decision.py'
      - 'phase12-input/category-decision-modules-20261001.json'
      - '.github/workflows/k20-phase12-category-decision.yml'

permissions:
  contents: write

concurrency:
  group: k20-phase12-category-decision
  cancel-in-progress: false

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/k20_phase12_category_decision.py
      - name: Commit verified result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase12-results/category-decision-execution-20261001.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase12: record category decision execution"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
