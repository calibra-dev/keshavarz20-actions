name: K20 Page13 REST Meta Probe

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/page13-rest-meta/*.json'

permissions:
  contents: write

concurrency:
  group: k20-page13-rest-meta-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Probe Page 13 REST meta read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($name in 'WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'){
            if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))){throw "Missing required secret: $name"}
          }
          $event=Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH|ConvertFrom-Json
          $requests=@()
          if($event.commits){
            $requests=@($event.commits|ForEach-Object{@($_.added)+@($_.modified)}|Where-Object{$_ -and $_.StartsWith('diagnostics/page13-rest-meta/') -and $_.EndsWith('.json')}|Sort-Object -Unique)
          }
          if($requests.Count -eq 0){$requests=@(& git diff --name-only HEAD^ HEAD -- 'diagnostics/page13-rest-meta/*.json'|Where-Object{$_})}
          if($requests.Count -ne 1){throw "Expected exactly one request, found $($requests.Count)."}
          $req=Get-Content -Raw -LiteralPath $requests[0]|ConvertFrom-Json
          if([string]$req.action -ne 'probe' -or [int]$req.id -ne 13){throw 'Probe is hard-limited to action=probe and page ID 13.'}

          function HashText([string]$text){$sha=[Security.Cryptography.SHA256]::Create();try{return([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($text))).Replace('-','').ToLowerInvariant()}finally{$sha.Dispose()}}
          function CountLiteral([string]$text,[string]$needle){if([string]::IsNullOrEmpty($text)-or[string]::IsNullOrEmpty($needle)){return 0};$c=0;$o=0;while(($i=$text.IndexOf($needle,$o,[StringComparison]::Ordinal))-ge0){$c++;$o=$i+$needle.Length};return $c}

          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json';'Cache-Control'='no-cache'}
          $uri="$base/wp-json/wp/v2/pages/13?context=edit&_fields=id,slug,status,modified_gmt,meta"

          $status=0
          try{
            $r=Invoke-WebRequest -Uri $uri -Headers $headers -Method GET -TimeoutSec 180 -SkipHttpErrorCheck
            $status=[int]$r.StatusCode
            if($status -lt 200 -or$status -ge 300){throw "Selective REST meta GET returned HTTP $status"}
            $page=$r.Content|ConvertFrom-Json -Depth 100
          }catch{throw}

          $meta=$page.meta
          $keys=@()
          if($meta){$keys=@($meta.PSObject.Properties.Name|Sort-Object -Unique)}
          $present=$false;$value='';$info=[ordered]@{found=$false;length=0;sha256='';json_valid=$false;root_type='';root_length=0;target_h1=0;target_h2=0;css_h1=0;css_h2=0}
          if($meta -and $meta.PSObject.Properties['_elementor_data']){
            $present=$true
            $value=[string]$meta._elementor_data
            $info.found=$true
            $info.length=$value.Length
            $info.sha256=HashText $value
            $phrase='شرایط مرجوعی، مغایرت کالا و پیگیری بار در کشاورز بیست'
            $info.target_h1=CountLiteral $value "<h1>$phrase</h1>"
            $info.target_h2=CountLiteral $value "<h2>$phrase</h2>"
            $info.css_h1=CountLiteral $value '.k20-hero h1'
            $info.css_h2=CountLiteral $value '.k20-hero h2'
            $trim=$value.TrimStart()
            try{
              $decoded=ConvertFrom-Json -InputObject $value -Depth 100 -NoEnumerate
              $info.json_valid=$true
              if($trim.StartsWith('[')){$info.root_type='array';$info.root_length=@($decoded).Count}
              elseif($trim.StartsWith('{')){$info.root_type='object';$info.root_length=1}
              else{$info.root_type='other'}
            }catch{$info.json_valid=$false}
          }

          $result=[ordered]@{
            ok=$true;page_id=13;http_status=$status;slug=[string]$page.slug;status=[string]$page.status;modified_gmt=[string]$page.modified_gmt;
            meta_key_count=$keys.Count;meta_has_elementor=$present;elementor=$info;probed_at_utc=[DateTime]::UtcNow.ToString('o')
          }
          New-Item -ItemType Directory -Force 'results'|Out-Null
          $name=[IO.Path]::GetFileNameWithoutExtension($requests[0])
          $result|ConvertTo-Json -Depth 12|Set-Content -LiteralPath "results/$name.json" -Encoding utf8
          Write-Host "PAGE13_REST_META_PROBE_OK http=$status elementor=$present root=$($info.root_type) sha=$($info.sha256)"

      - name: Commit sanitized probe result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record Page 13 selective REST meta probe"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1
