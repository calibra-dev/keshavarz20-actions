name: K20 llms.txt XML-RPC Fallback

on:
  push:
    branches: [main]
    paths:
      - 'llms-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-llms-txt-fallback
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Publish exact /llms.txt fallback through XML-RPC
        shell: python
        run: |
          import html, json, os, pathlib, subprocess, time, urllib.request, urllib.error, xmlrpc.client

          for key in ("WP_BASE_URL","WP_USERNAME","WP_APP_PASSWORD"):
              if not os.environ.get(key,"").strip():
                  raise SystemExit("Missing required repository secret: "+key)

          changed=subprocess.check_output(
              ["git","show","--pretty=","--name-only","HEAD","--","llms-ops/*.json"],text=True
          ).splitlines()
          changed=[p.strip() for p in changed if p.strip().startswith("llms-ops/") and p.strip().endswith(".json")]
          if len(changed)!=1:
              raise SystemExit(f"Expected one llms request, got {len(changed)}")
          req=json.loads(pathlib.Path(changed[0]).read_text(encoding="utf-8"))
          if req.get("action")!="publish_llms_fallback":
              raise SystemExit("Unsupported action")
          md=str(req.get("content") or "").strip()+"\n"
          if not md.startswith("# Keshavarz20"):
              raise SystemExit("Unexpected llms content")

          base=os.environ["WP_BASE_URL"].rstrip("/")
          user=os.environ["WP_USERNAME"]
          password=os.environ["WP_APP_PASSWORD"]
          server=xmlrpc.client.ServerProxy(base+"/xmlrpc.php",allow_none=True,use_builtin_types=True)

          # Reuse an existing dedicated page if one exists; otherwise create one.
          pages=server.wp.getPosts(0,user,password,{"post_type":"page","post_status":"any","number":100},["post_id","post_title","post_name","post_status","link"])
          existing=next((p for p in pages if str(p.get("post_title") or "").strip()=="llms.txt"),None)
          post={
              "post_type":"page",
              "post_status":"publish",
              "post_title":"llms.txt",
              "post_name":"llms.txt",
              "post_content":"<pre class=\"k20-llms-txt\" style=\"white-space:pre-wrap;word-break:break-word\">"+html.escape(md)+"</pre>",
              "post_excerpt":"AI-readable site summary for Keshavarz20."
          }
          created=False
          if existing:
              post_id=int(existing["post_id"])
              ok=server.wp.editPost(0,user,password,post_id,post)
              if not ok: raise SystemExit("XML-RPC editPost returned false")
          else:
              post_id=int(server.wp.newPost(0,user,password,post))
              created=True

          read=server.wp.getPost(0,user,password,post_id,["post_id","post_status","post_name","post_title","link"])
          target=base+"/llms.txt"
          status=0; ctype=""; final_url=""; prefix=""
          try:
              request=urllib.request.Request(target,headers={"User-Agent":"K20-llms-verify/1.0","Accept":"text/plain,text/html;q=0.9,*/*;q=0.1"})
              with urllib.request.urlopen(request,timeout=45) as resp:
                  status=int(resp.status); ctype=str(resp.headers.get("Content-Type") or ""); final_url=str(resp.geturl())
                  prefix=resp.read(700).decode("utf-8","replace")
          except urllib.error.HTTPError as e:
              status=int(e.code); final_url=str(e.geturl())
          exact=(status==200 and final_url.rstrip("/")==target)

          if not exact and created:
              try: server.wp.deletePost(0,user,password,post_id)
              except Exception: pass

          out={
              "ok":bool(exact),
              "post_id":post_id,
              "created":created,
              "post_name":str(read.get("post_name") or ""),
              "post_status":str(read.get("post_status") or ""),
              "link":str(read.get("link") or ""),
              "target":target,
              "http_status":status,
              "content_type":ctype,
              "final_url":final_url,
              "body_has_keshavarz20":("Keshavarz20" in prefix),
              "verified_at_utc":time.strftime("%Y-%m-%dT%H:%M:%SZ",time.gmtime())
          }
          pathlib.Path("llms-results").mkdir(exist_ok=True)
          outpath=pathlib.Path("llms-results")/(pathlib.Path(changed[0]).stem+".json")
          outpath.write_text(json.dumps(out,ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
          if not exact:
              raise SystemExit("WordPress did not expose an exact 200 response at /llms.txt")
      - name: Commit sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -d llms-results ]; then exit 0; fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f llms-results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "llms: record XML-RPC fallback result"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
