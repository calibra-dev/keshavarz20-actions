name: K20 GrowthOS Phase 18 Recommendation Basket Guard
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase18-ops/*.json'
      - 'growthos-phase4-results/compatibility-summary.json'
      - 'scripts/k20_growthos_phase18_recommendation_guard.py'
      - 'tests/test_growthos_phase18_recommendation_guard.py'
      - '.github/workflows/k20-growthos-phase18-recommendation.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase18-recommendation
  cancel-in-progress: true
jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m py_compile scripts/k20_growthos_phase18_recommendation_guard.py
      - run: python -m unittest tests.test_growthos_phase18_recommendation_guard -v
      - run: python scripts/k20_growthos_phase18_recommendation_guard.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase18-results/recommendation-basket-guard.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase18: record guarded recommendation state"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
