name: K20 Calculator Final Lighthouse

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-calculator-final-lighthouse.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run mobile Lighthouse
        shell: bash
        run: |
          set -euo pipefail
          URL='https://keshavarz20.com/drip-tape-length-fittings-calculator/'
          npx --yes lighthouse "$URL" \
            --only-categories=performance,accessibility,best-practices,seo \
            --form-factor=mobile \
            --screenEmulation.mobile=true \
            --throttling-method=simulate \
            --chrome-flags="--headless --no-sandbox --disable-dev-shm-usage" \
            --output=json \
            --output-path="$RUNNER_TEMP/k20-calculator-final.json" \
            --quiet
          node - <<'NODE'
          const fs=require('fs');
          const j=JSON.parse(fs.readFileSync(process.env.RUNNER_TEMP+'/k20-calculator-final.json','utf8'));
          const c=j.categories,a=j.audits;
          const out={
            performance:Math.round(c.performance.score*100),
            accessibility:Math.round(c.accessibility.score*100),
            best_practices:Math.round(c['best-practices'].score*100),
            seo:Math.round(c.seo.score*100),
            FCP:a['first-contentful-paint']?.numericValue||null,
            LCP:a['largest-contentful-paint']?.numericValue||null,
            CLS:a['cumulative-layout-shift']?.numericValue||null,
            TBT:a['total-blocking-time']?.numericValue||null,
            speed_index:a['speed-index']?.numericValue||null,
            FCP_display:a['first-contentful-paint']?.displayValue||null,
            LCP_display:a['largest-contentful-paint']?.displayValue||null,
            CLS_display:a['cumulative-layout-shift']?.displayValue||null,
            TBT_display:a['total-blocking-time']?.displayValue||null,
            speed_index_display:a['speed-index']?.displayValue||null,
            unused_js:a['unused-javascript']?.displayValue||null,
            unused_css:a['unused-css-rules']?.displayValue||null,
            console_errors:a['errors-in-console']?.score===1,
            image_responsive:a['image-size-responsive']?.score===1
          };
          console.log(JSON.stringify(out,null,2));
          fs.writeFileSync(process.env.RUNNER_TEMP+'/k20-calculator-final-summary.json',JSON.stringify(out,null,2));

          const auditIds=[
            'largest-contentful-paint-element','lcp-lazy-loaded','lcp-discovery-insight','lcp-breakdown-insight',
            'render-blocking-resources','render-blocking-insight','server-response-time','uses-responsive-images',
            'image-size-responsive','modern-image-formats','uses-optimized-images','unsized-images','uses-rel-preload',
            'font-display','unused-javascript','unused-css-rules','total-byte-weight','mainthread-work-breakdown',
            'bootup-time','third-party-summary','critical-request-chains','network-dependency-tree-insight',
            'dom-size','legacy-javascript','long-tasks','diagnostics'
          ];
          const deep={};
          for(const id of auditIds){
            const x=a[id];
            if(x) deep[id]={score:x.score,displayValue:x.displayValue,numericValue:x.numericValue,details:x.details||null};
          }
          const net=(a['network-requests']?.details?.items||[]).map(x=>({
            url:x.url,resourceType:x.resourceType,transferSize:x.transferSize,resourceSize:x.resourceSize,
            startTime:x.startTime,endTime:x.endTime,statusCode:x.statusCode,protocol:x.protocol,
            priority:x.priority,mimeType:x.mimeType
          })).sort((x,y)=>(y.transferSize||0)-(x.transferSize||0)).slice(0,100);
          const deepOut={
            generated_at:new Date().toISOString(),
            finalUrl:j.finalUrl,
            lighthouseVersion:j.lighthouseVersion,
            summary:out,
            audits:deep,
            top_network_requests:net
          };
          fs.writeFileSync(process.env.RUNNER_TEMP+'/k20-calculator-deep-summary.json',JSON.stringify(deepOut,null,2));
          NODE
      - name: Record current Lighthouse summary
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p diagnostics
          cp "$RUNNER_TEMP/k20-calculator-final-summary.json" diagnostics/calculator-current-lighthouse.json
          cp "$RUNNER_TEMP/k20-calculator-deep-summary.json" diagnostics/calculator-deep-performance.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-current-lighthouse.json diagnostics/calculator-deep-performance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record current calculator Lighthouse"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

      - name: Upload final evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-calculator-final-lighthouse-${{ github.run_id }}
          path: |
            ${{ runner.temp }}/k20-calculator-final.json
            ${{ runner.temp }}/k20-calculator-final-summary.json
            ${{ runner.temp }}/k20-calculator-deep-summary.json
          if-no-files-found: warn
          retention-days: 14

