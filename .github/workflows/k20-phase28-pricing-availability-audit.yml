name: K20 Phase 28 Pricing Availability Audit

on:
  push:
    branches: [main]
    paths:
      - 'phase28-ops/run-*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase28-pricing-availability
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check 'requests==2.34.2'
      - run: python -m py_compile scripts/k20_phase28_pricing_availability_audit.py
      - run: python scripts/k20_phase28_pricing_availability_audit.py
      - name: Commit verified audit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase28-results/pricing-availability-audit-20261010.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase28: record pricing and availability audit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
