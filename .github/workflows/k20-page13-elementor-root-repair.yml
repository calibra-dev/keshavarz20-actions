name: K20 Page13 Elementor Root Repair

on:
  push:
    branches: [main]
    paths:
      - 'page13-repair-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-page13-elementor-root-repair
  cancel-in-progress: false

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Apply SHA-locked root-only repair and verify
        shell: python
        run: |
          import base64
          import hashlib
          import html
          import json
          import os
          import pathlib
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request

          for key in ("WP_BASE_URL", "WP_USERNAME", "WP_APP_PASSWORD"):
              if not os.environ.get(key, "").strip():
                  raise SystemExit(f"Missing required repository secret: {key}")

          def changed_requests():
              for cmd in (
                  ["git", "diff", "--name-only", "HEAD^", "HEAD", "--", "page13-repair-ops/*.json"],
                  ["git", "show", "--pretty=", "--name-only", "HEAD", "--", "page13-repair-ops/*.json"],
              ):
                  out = subprocess.check_output(cmd, text=True).splitlines()
                  paths = sorted({p.strip() for p in out if p.strip().startswith("page13-repair-ops/") and p.strip().endswith(".json")})
                  if paths:
                      return paths
              return []

          def sha256_text(value):
              return hashlib.sha256(value.encode("utf-8")).hexdigest()

          def count_literal(text, needle):
              return text.count(needle)

          def http_json(url, method="GET", body=None, headers=None, timeout=180):
              h = dict(headers or {})
              data = None
              if body is not None:
                  data = json.dumps(body, ensure_ascii=False, separators=(",", ":")).encode("utf-8")
                  h["Content-Type"] = "application/json; charset=utf-8"
              req = urllib.request.Request(url, data=data, method=method, headers=h)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      raw = r.read().decode("utf-8", "replace")
                      parsed = json.loads(raw) if raw.strip() else None
                      return int(r.status), parsed
              except urllib.error.HTTPError as e:
                  raw = e.read().decode("utf-8", "replace")
                  try:
                      parsed = json.loads(raw) if raw.strip() else None
                  except Exception:
                      parsed = None
                  return int(e.code), parsed

          def http_text(url, headers=None, timeout=180):
              req = urllib.request.Request(url, method="GET", headers=dict(headers or {}))
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as r:
                      return int(r.status), r.read().decode("utf-8", "replace")
              except urllib.error.HTTPError as e:
                  return int(e.code), e.read().decode("utf-8", "replace")

          requests = changed_requests()
          if len(requests) != 1:
              raise SystemExit(f"Expected exactly one repair request, found {len(requests)}")
          request_path = requests[0]
          request = json.loads(pathlib.Path(request_path).read_text(encoding="utf-8"))

          if request.get("action") != "repair_elementor_root_array":
              raise SystemExit("Unexpected repair action")
          if int(request.get("id", 0)) != 13:
              raise SystemExit("Repair is hard-limited to page ID 13")
          if request.get("confirm_root_only") is not True:
              raise SystemExit("confirm_root_only=true is required")

          expected_sha = str(request.get("expected_sha256") or "").lower()
          expected_length = int(request.get("expected_length") or 0)
          if len(expected_sha) != 64 or expected_length <= 0:
              raise SystemExit("Expected SHA-256 and length are required")

          phrase = "شرایط مرجوعی، مغایرت کالا و پیگیری بار در کشاورز بیست"
          expected_product_path = "/product/%d8%b4%db%8c%d8%b1-%d9%be%d8%b1%d9%88%d8%a7%d9%86%d9%87-%d8%a7%db%8c-%d9%be%d9%84%db%8c%d9%85%d8%b1%db%8c-%d8%a8%d8%a7-%d8%af%d8%b3%d8%aa%d9%87-%d9%81%d9%84%d8%b2%db%8c-%d9%88%db%8c%d8%b3%d9%be-3/"

          base = os.environ["WP_BASE_URL"].rstrip("/")
          auth = base64.b64encode(f"{os.environ['WP_USERNAME']}:{os.environ['WP_APP_PASSWORD']}".encode("utf-8")).decode("ascii")
          auth_headers = {"Authorization": "Basic " + auth, "Accept": "application/json", "Cache-Control": "no-cache"}
          selective = base + "/wp-json/wp/v2/pages/13?context=edit&_fields=id,slug,status,modified_gmt,meta"

          result = {
              "ok": False,
              "action": "repair_elementor_root_array",
              "page_id": 13,
              "request_file": request_path,
              "prewrite_guard": {},
              "write": {},
              "readback": {},
              "cache": {},
              "live": {},
              "product_regression": {},
              "executed_at_utc": time.strftime("%Y-%m-%dT%H:%M:%SZ", time.gmtime()),
          }
          outdir = pathlib.Path("results")
          outdir.mkdir(parents=True, exist_ok=True)
          outfile = outdir / (pathlib.Path(request_path).stem + ".json")

          def save_result():
              outfile.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding="utf-8")

          # PRE-WRITE: selective meta-only read, no content rendering.
          status, page = http_json(selective, headers=auth_headers)
          if status != 200 or not isinstance(page, dict):
              result["prewrite_guard"] = {"passed": False, "http_status": status, "reason": "selective_meta_read_failed"}
              save_result()
              raise SystemExit(0)

          meta = page.get("meta") or {}
          before = meta.get("_elementor_data")
          if not isinstance(before, str):
              result["prewrite_guard"] = {"passed": False, "http_status": status, "reason": "elementor_meta_missing"}
              save_result()
              raise SystemExit(0)

          before_sha = sha256_text(before)
          before_trim = before.lstrip()
          try:
              before_decoded = json.loads(before)
              before_valid = True
          except Exception:
              before_decoded = None
              before_valid = False

          target_h1 = count_literal(before, f"<h1>{phrase}</h1>")
          target_h2 = count_literal(before, f"<h2>{phrase}</h2>")
          css_h1 = count_literal(before, ".k20-hero h1")
          css_h2 = count_literal(before, ".k20-hero h2")

          guard_pass = all([
              before_sha == expected_sha,
              len(before) == expected_length,
              before_valid,
              isinstance(before_decoded, dict),
              before_trim.startswith("{"),
              target_h1 == 0,
              target_h2 == 1,
              css_h1 == 0,
              css_h2 == 2,
          ])
          result["prewrite_guard"] = {
              "passed": guard_pass,
              "http_status": status,
              "slug": str(page.get("slug") or ""),
              "page_status": str(page.get("status") or ""),
              "elementor_length": len(before),
              "elementor_sha256": before_sha,
              "json_valid": before_valid,
              "root_type": "object" if isinstance(before_decoded, dict) else "other",
              "target_h1": target_h1,
              "target_h2": target_h2,
              "css_h1": css_h1,
              "css_h2": css_h2,
          }
          if not guard_pass:
              save_result()
              raise SystemExit(0)

          # ROOT-ONLY REPAIR: preserve every byte inside the current object.
          after = "[" + before + "]"
          after_sha = sha256_text(after)
          try:
              after_decoded = json.loads(after)
          except Exception:
              after_decoded = None
          construction_pass = (
              isinstance(after_decoded, list)
              and len(after_decoded) == 1
              and after[1:-1] == before
              and sha256_text(after[1:-1]) == before_sha
              and after_decoded[0] == before_decoded
          )
          if not construction_pass:
              result["write"] = {"attempted": False, "reason": "root_wrapper_integrity_guard_failed"}
              save_result()
              raise SystemExit(0)

          # WRITE ONLY meta._elementor_data. Query _fields avoids content render in response.
          post_status, _ = http_json(selective, method="POST", body={"meta": {"_elementor_data": after}}, headers=auth_headers)
          result["write"] = {
              "attempted": True,
              "http_status": post_status,
              "before_sha256": before_sha,
              "after_sha256": after_sha,
              "before_length": len(before),
              "after_length": len(after),
              "internal_bytes_preserved": True,
          }

          # Exact selective readback is authoritative even if write response was non-2xx.
          check_status, check = http_json(selective, headers=auth_headers)
          stored = None
          if check_status == 200 and isinstance(check, dict):
              stored = (check.get("meta") or {}).get("_elementor_data")
          stored_sha = sha256_text(stored) if isinstance(stored, str) else ""
          readback_pass = False
          root_type = ""
          root_length = 0
          inner_sha = ""
          rb_h1 = rb_h2 = rb_css_h1 = rb_css_h2 = 0
          if isinstance(stored, str):
              try:
                  decoded = json.loads(stored)
                  root_type = "array" if isinstance(decoded, list) else "object" if isinstance(decoded, dict) else "other"
                  root_length = len(decoded) if isinstance(decoded, list) else 1 if isinstance(decoded, dict) else 0
              except Exception:
                  decoded = None
              if stored.startswith("[") and stored.endswith("]"):
                  inner = stored[1:-1]
                  inner_sha = sha256_text(inner)
              rb_h1 = count_literal(stored, f"<h1>{phrase}</h1>")
              rb_h2 = count_literal(stored, f"<h2>{phrase}</h2>")
              rb_css_h1 = count_literal(stored, ".k20-hero h1")
              rb_css_h2 = count_literal(stored, ".k20-hero h2")
              readback_pass = all([
                  stored == after,
                  stored_sha == after_sha,
                  root_type == "array",
                  root_length == 1,
                  inner_sha == before_sha,
                  rb_h1 == 0,
                  rb_h2 == 1,
                  rb_css_h1 == 0,
                  rb_css_h2 == 2,
              ])
          result["readback"] = {
              "passed": readback_pass,
              "http_status": check_status,
              "stored_sha256": stored_sha,
              "expected_sha256": after_sha,
              "root_type": root_type,
              "root_length": root_length,
              "inner_sha256": inner_sha,
              "expected_inner_sha256": before_sha,
              "target_h1": rb_h1,
              "target_h2": rb_h2,
              "css_h1": rb_css_h1,
              "css_h2": rb_css_h2,
          }
          if not readback_pass:
              save_result()
              raise SystemExit(0)

          # Clear Elementor generated cache using the existing authenticated route.
          cache_url = base + "/wp-json/elementor/v1/cache"
          cache_req = urllib.request.Request(cache_url, method="DELETE", headers=auth_headers)
          try:
              with urllib.request.urlopen(cache_req, timeout=180) as r:
                  cache_status = int(r.status)
          except urllib.error.HTTPError as e:
              cache_status = int(e.code)
          result["cache"] = {"http_status": cache_status, "ok": 200 <= cache_status < 300}

          # Live verification.
          stamp = str(int(time.time()))
          live_headers = {"Cache-Control": "no-cache", "Pragma": "no-cache", "User-Agent": "K20-Page13-Repair-Verify/1.0"}
          live_status, live_html = http_text(base + "/refund_returns/?k20verify=" + stamp, headers=live_headers)
          total_h1 = len(re.findall(r"<h1\b[^>]*>", live_html, flags=re.I | re.S))
          phrase_h1 = len(re.findall(r"<h1\b[^>]*>\s*" + re.escape(phrase) + r"\s*</h1>", live_html, flags=re.I | re.S))
          phrase_h2 = len(re.findall(r"<h2\b[^>]*>\s*" + re.escape(phrase) + r"\s*</h2>", live_html, flags=re.I | re.S))
          live_pass = live_status == 200 and total_h1 == 1 and phrase_h1 == 0 and phrase_h2 == 1
          result["live"] = {
              "http_status": live_status,
              "total_h1": total_h1,
              "target_h1": phrase_h1,
              "target_h2": phrase_h2,
              "passed": live_pass,
          }

          product_status, product_html = http_text(base + expected_product_path + "?k20verify=" + stamp, headers=live_headers)
          product_h1 = len(re.findall(r"<h1\b[^>]*>", product_html, flags=re.I | re.S))
          product_pass = product_status == 200 and product_h1 == 1
          result["product_regression"] = {
              "http_status": product_status,
              "total_h1": product_h1,
              "passed": product_pass,
          }

          result["ok"] = bool(readback_pass and live_pass and product_pass)
          result["p0"] = "CLOSED/PASS" if result["ok"] else "OPEN/VERIFY_FAILED"
          save_result()
          print("PAGE13_ROOT_REPAIR_RESULT " + result["p0"] + f" write_http={post_status} live_http={live_status} live_h1={total_h1} target_h2={phrase_h2} product_http={product_status} product_h1={product_h1}")

      - name: Commit sanitized repair evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record guarded Page 13 root repair"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Enforce P0 closure criteria
        shell: python
        run: |
          import json, pathlib, subprocess
          paths = subprocess.check_output(["git", "show", "--pretty=", "--name-only", "HEAD", "--", "results/*.json"], text=True).splitlines()
          candidates = [p for p in paths if p.startswith("results/20260916-page13-elementor-root-repair-") and p.endswith(".json")]
          if not candidates:
              # Result commit can be rebased; use newest matching result in workspace.
              candidates = sorted(str(p) for p in pathlib.Path("results").glob("20260916-page13-elementor-root-repair-*.json"))
          if not candidates:
              raise SystemExit("Repair result file not found")
          data = json.loads(pathlib.Path(candidates[-1]).read_text(encoding="utf-8-sig"))
          if data.get("ok") is not True or data.get("p0") != "CLOSED/PASS":
              raise SystemExit("P0 closure criteria not met; see committed sanitized result")
          print("P0_CLOSED_PASS")
