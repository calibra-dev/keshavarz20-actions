name: K20 GrowthOS Phase 16 Deep Completion
on:
  push:
    branches: [main]
    paths:
      - 'scripts/k20_growthos_phase16_deep_completion.py'
      - '.github/workflows/k20-growthos-phase16-deep-completion.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase16-deep-completion
  cancel-in-progress: true
jobs:
  deep-completion:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_growthos_phase16_deep_completion.py scripts/k20_growthos_phase16_editorial_trust.py
      - run: python scripts/k20_growthos_phase16_deep_completion.py
      - run: python scripts/k20_growthos_phase16_editorial_trust.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase16-results/deep-completion.json growthos-phase16-results/summary.json growthos-phase16-results/editorial-contract-audit.json growthos-phase16-results/post-trust-audit.json growthos-phase16-results/legacy-backlog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase16: record deep completion and final audit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
