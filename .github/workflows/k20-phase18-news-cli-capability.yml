name: K20 Phase 18 News CLI Capability

on:
  push:
    branches: [main]
    paths:
      - 'phase18-news-capability-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase18-news-cli-capability
  cancel-in-progress: false

jobs:
  capability:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests Pillow
      - run: python scripts/k20_phase18_news_cli_capability.py phase18-results/news-cli-capability-latest.json
      - name: Persist sanitized capability evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git pull --rebase origin main
          git add -f phase18-results/news-cli-capability-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase18: record news CLI capability"
          git push origin HEAD:main
