name: K20 Export Next 10 Published Posts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-export-next10-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Export posts 11-20
        shell: bash
        run: |
          set -euo pipefail
          curl -fsS --retry 2 --connect-timeout 20 --max-time 90 \
            -u "$WP_USERNAME:$WP_APP_PASSWORD" \
            --get "$WP_BASE_URL/wp-json/wp/v2/posts" \
            --data-urlencode "per_page=10" \
            --data-urlencode "offset=10" \
            --data-urlencode "status=publish" \
            --data-urlencode "orderby=date" \
            --data-urlencode "order=desc" \
            --data-urlencode "context=edit" \
            -o /tmp/next10.json
          python - <<'PY'
          import json, pathlib
          posts=json.loads(pathlib.Path("/tmp/next10.json").read_text(encoding="utf-8"))
          rows=[]
          for p in posts:
            def val(x):
              if isinstance(x,dict):
                return x.get("raw") if x.get("raw") is not None else x.get("rendered","")
              return x or ""
            rows.append({
              "id":p["id"],"date":p.get("date"),"modified":p.get("modified"),
              "slug":p.get("slug"),"status":p.get("status"),"link":p.get("link"),
              "title":val(p.get("title")),"excerpt":val(p.get("excerpt")),
              "content":val(p.get("content")),"featured_media":p.get("featured_media"),
              "categories":p.get("categories"),"tags":p.get("tags"),"author":p.get("author"),
              "meta":p.get("meta") or {}
            })
          pathlib.Path("content-growth").mkdir(exist_ok=True)
          pathlib.Path("content-growth/next10-source.json").write_text(
            json.dumps({"posts":rows},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Persist snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-growth/next10-source.json
          git commit -m "content-growth: snapshot posts 11-20" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
