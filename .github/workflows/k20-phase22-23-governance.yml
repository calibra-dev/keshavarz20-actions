name: K20 Phase 22 23 Decision Freshness Gate

on:
  push:
    branches: [main]
    paths:
      - 'phase22-23-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-wave05-phase22-23
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile and unit test
        run: |
          python -m py_compile scripts/k20_phase22_farmer_decision.py scripts/k20_phase23_freshness_governance.py
          python -m unittest -v tests/test_phase22_23.py
      - name: Validate Phase 22 explainable farmer decision model
        run: |
          python scripts/k20_phase22_farmer_decision.py \
            --cases phase22/validation-cases.json \
            --output phase22-results/decision-model-latest.json
      - name: Audit Phase 23 live lifecycle and freshness state
        run: |
          python scripts/k20_phase23_freshness_governance.py \
            --policy phase23/lifecycle-governance-policy.json \
            --phase20 phase20-results/ux-a11y-live-latest.json \
            --output phase23-results/lifecycle-freshness-latest.json
      - name: Build Phase 22 dependency-aware acceptance
        shell: python
        run: |
          import datetime as dt, json, os
          p20=json.load(open('phase20-results/ux-a11y-live-latest.json',encoding='utf-8'))
          p22=json.load(open('phase22-results/decision-model-latest.json',encoding='utf-8'))
          dep=str(p20.get('status') or 'UNKNOWN')
          functional=p22.get('status')=='PASS_MODEL_VALIDATION'
          final='PASS' if functional and dep=='PASS' else ('READY_BLOCKED_BY_PHASE20' if functional else 'FAIL')
          out={
            'phase':22,
            'title':'Farmer Decision Personalization',
            'generated_at_utc':dt.datetime.now(dt.timezone.utc).isoformat(),
            'run_id':os.getenv('GITHUB_RUN_ID'),
            'commit_sha':os.getenv('GITHUB_SHA'),
            'status':final,
            'functional_validation':p22.get('status'),
            'dependency_gate':{'phase20':dep,'required_for_final_pass':True},
            'acceptance':{
              'no_agronomic_hydraulic_certainty_beyond_data':True,
              'missing_inputs_stop_or_soften_answer':True,
              'expert_escalation':True
            },
            'site_mutations':0,
            'commerce_mutations':0
          }
          os.makedirs('phase22-results',exist_ok=True)
          json.dump(out,open('phase22-results/acceptance-latest.json','w'),ensure_ascii=False,indent=2)
      - name: Persist Phase 22 and 23 evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase22-results/decision-model-latest.json phase22-results/acceptance-latest.json phase23-results/lifecycle-freshness-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase22-23: record decision and freshness governance evidence"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
