name: K20 Phase 7 Digits Cache Source Scan Readonly
on:
  push:
    branches: [main]
    paths:
      - 'phase7-digits-scan-ops/*.json'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Scan Digits PHP source for session and cache signatures
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json';'Content-Type'='application/json'}
          $dir='plugins/digits'
          $enc=[Uri]::EscapeDataString($dir)
          $list=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/file/list?scope=wp-content&directory=$enc" -Headers $headers -Method GET -TimeoutSec 180
          $patterns=@('d_user_session','DONOTCACHEPAGE','nocache_headers','litespeed_control','session_start','setcookie','wp_setcookie','Cache-Control','no-cache')
          $findings=@(); $scanned=0
          foreach($f in @($list.files)){
            $path=[string]$f.path
            if($path -notmatch '\.php$'){continue}
            $scanned++
            $body=[ordered]@{scope='wp-content';path=$path}|ConvertTo-Json -Compress
            try{$r=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/file/read" -Headers $headers -Method POST -Body $body -TimeoutSec 180}catch{continue}
            $content=if($r.PSObject.Properties.Name -contains 'content'){[string]$r.content}elseif($r.data){[string]$r.data.content}else{''}
            if([string]::IsNullOrEmpty($content)){continue}
            $lines=$content -split "\r?\n"
            foreach($pat in $patterns){
              $hits=0
              for($i=0;$i -lt $lines.Count;$i++){
                if($lines[$i].IndexOf($pat,[StringComparison]::OrdinalIgnoreCase)-ge0){
                  $s=$lines[$i].Trim(); if($s.Length-gt360){$s=$s.Substring(0,360)}
                  $start=[Math]::Max(0,$i-5);$end=[Math]::Min($lines.Count-1,$i+5);$ctx=@()
                  for($j=$start;$j -le $end;$j++){ $cs=$lines[$j].Trim(); if($cs.Length-gt220){$cs=$cs.Substring(0,220)}; $ctx+=("{0}:{1}" -f ($j+1),$cs) }
                  $findings+=,[pscustomobject]@{path=$path;pattern=$pat;line=$i+1;snippet=$s;context=$ctx}
                  $hits++; if($hits-ge6){break}
                }
              }
            }
          }
          New-Item -ItemType Directory -Force phase7-results|Out-Null
          [ordered]@{mode='read-only';directory=$dir;php_files_scanned=$scanned;matches=$findings}|ConvertTo-Json -Depth 30|Set-Content phase7-results/digits-cache-source-scan.json -Encoding utf8
      - name: Commit sanitized scan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/digits-cache-source-scan.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record Digits cache source scan"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
