name: K20 Phase 9 Canonical PIM

on:
  push:
    branches: [main]
    paths:
      - 'phase9-ops/*.json'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase9-pim
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - run: python scripts/k20_phase9_canonical_pim.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase9-results/canonical-pim.json phase9-results/acceptance.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase9: record canonical PIM foundation"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
