name: K20 Calculator Source Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-source-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' 'https://keshavarz20.com/drip-tape-length-fittings-calculator/' -o /tmp/p.html
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request,os
          h=open('/tmp/p.html',encoding='utf8',errors='replace').read()

          urls=sorted(set(re.findall(r'https://keshavarz20\.com/wp-content/uploads/[^"\' ]+',h)))
          featured=[u for u in urls if 'k20-calculator-featured' in u]

          probes=[]
          for q in [
              '/wp-json/wp/v2/media?slug=k20-calculator-featured-optimized-1200&per_page=20',
              '/wp-json/wp/v2/media?search=k20-calculator-featured&per_page=20',
              '/wp-json/wp/v2/media?search=calculator&per_page=50'
          ]:
              url='https://keshavarz20.com'+q
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode('utf-8','replace')
                      probes.append({'url':url,'status':r.status,'body':body[:50000]})
              except Exception as e:
                  probes.append({'url':url,'error':repr(e)})

          post_probe={}
          media_probe={}
          try:
              req=urllib.request.Request('https://keshavarz20.com/wp-json/wp/v2/posts/143698?_fields=id,featured_media',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  post_probe=json.loads(r.read().decode('utf-8','replace'))
              mid=post_probe.get('featured_media')
              if mid:
                  req=urllib.request.Request(f'https://keshavarz20.com/wp-json/wp/v2/media/{mid}?_fields=id,source_url,media_details',headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      media_probe=json.loads(r.read().decode('utf-8','replace'))
          except Exception as e:
              media_probe={'error':repr(e)}
          tags=re.findall(r'<img\b[^>]*>',h,re.I)
          featured_img_tag=next((t for t in tags if 'k20-calculator-featured-optimized-1200' in t),None)
          out={'featured_urls':featured,'featured_img_tag':featured_img_tag,'post_probe':post_probe,'media_probe':media_probe,'probes':probes}
          os.makedirs('diagnostics',exist_ok=True)
          open('diagnostics/calculator-media-lookup.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))

          # Resolve original WordPress handles before LiteSpeed optimization.
          before_url='https://keshavarz20.com/drip-tape-length-fittings-calculator/?LSCWP_CTRL=before_optm'
          req=urllib.request.Request(before_url,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36'})
          with urllib.request.urlopen(req,timeout=45) as r:
              bh=r.read().decode('utf-8','replace')

          links=[]
          for tag in re.findall(r'<link\b[^>]*>',bh,re.I):
              href_m=re.search(r'href=["\']([^"\']+)["\']',tag,re.I)
              rel_m=re.search(r'rel=["\']([^"\']+)["\']',tag,re.I)
              id_m=re.search(r'id=["\']([^"\']+)["\']',tag,re.I)
              if href_m and ('stylesheet' in (rel_m.group(1).lower() if rel_m else '') or '.css' in href_m.group(1)):
                  links.append({'id':id_m.group(1) if id_m else None,'href':href_m.group(1),'tag':tag[:1200]})

          scripts=[]
          for tag in re.findall(r'<script\b[^>]*>',bh,re.I):
              src_m=re.search(r'src=["\']([^"\']+)["\']',tag,re.I)
              id_m=re.search(r'id=["\']([^"\']+)["\']',tag,re.I)
              if src_m:
                  scripts.append({'id':id_m.group(1) if id_m else None,'src':src_m.group(1),'tag':tag[:1200]})

          def probe_size(url):
              try:
                  if url.startswith('//'): url='https:'+url
                  if url.startswith('/'): url='https://keshavarz20.com'+url
                  rq=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(rq,timeout=25) as rr:
                      b=rr.read()
                      return {'bytes':len(b),'content_type':rr.headers.get('content-type'),'final_url':rr.geturl()}
              except Exception as e:
                  return {'error':repr(e)}

          for x in links:
              x['probe']=probe_size(x['href'])
          for x in scripts:
              x['probe']=probe_size(x['src'])

          asset_out={'before_optm_url':before_url,'stylesheets':links,'scripts':scripts}
          open('diagnostics/calculator-before-optm-assets.json','w',encoding='utf8').write(json.dumps(asset_out,ensure_ascii=False,indent=2))
          PY

      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-media-lookup.json diagnostics/calculator-before-optm-assets.json
          git commit -m "diag: resolve calculator featured media" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

# direct post/media resolver 2026-09-29

# post-bind readback trigger 2026-09-29

# post-rollback featured tag probe 2026-09-29

# before-optm asset-handle mapping trigger 2026-09-29

# post-LCP-image verification trigger 2026-09-29 07:40 IRST
