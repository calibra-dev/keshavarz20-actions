name: K20 Calculator Source Diagnostic
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-source-diagnostic.yml']
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' 'https://keshavarz20.com/drip-tape-length-fittings-calculator/' -o /tmp/p.html
          python3 - <<'PY'
          import json,re,urllib.parse,urllib.request,os
          h=open('/tmp/p.html',encoding='utf8',errors='replace').read()

          urls=sorted(set(re.findall(r'https://keshavarz20\.com/wp-content/uploads/[^"\' ]+',h)))
          featured=[u for u in urls if 'k20-calculator-featured' in u]

          probes=[]
          for q in [
              '/wp-json/wp/v2/media?slug=k20-calculator-featured-optimized-1200&per_page=20',
              '/wp-json/wp/v2/media?search=k20-calculator-featured&per_page=20',
              '/wp-json/wp/v2/media?search=calculator&per_page=50'
          ]:
              url='https://keshavarz20.com'+q
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      body=r.read().decode('utf-8','replace')
                      probes.append({'url':url,'status':r.status,'body':body[:50000]})
              except Exception as e:
                  probes.append({'url':url,'error':repr(e)})

          post_probe={}
          media_probe={}
          try:
              req=urllib.request.Request('https://keshavarz20.com/wp-json/wp/v2/posts/143698?_fields=id,featured_media',headers={'User-Agent':'Mozilla/5.0'})
              with urllib.request.urlopen(req,timeout=30) as r:
                  post_probe=json.loads(r.read().decode('utf-8','replace'))
              mid=post_probe.get('featured_media')
              if mid:
                  req=urllib.request.Request(f'https://keshavarz20.com/wp-json/wp/v2/media/{mid}?_fields=id,source_url,media_details',headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=30) as r:
                      media_probe=json.loads(r.read().decode('utf-8','replace'))
          except Exception as e:
              media_probe={'error':repr(e)}
          out={'featured_urls':featured,'post_probe':post_probe,'media_probe':media_probe,'probes':probes}
          os.makedirs('diagnostics',exist_ok=True)
          open('diagnostics/calculator-media-lookup.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-media-lookup.json
          git commit -m "diag: resolve calculator featured media" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

# direct post/media resolver 2026-09-29
