name: Keshavarz20 Question Scheduler

on:
  # Hourly tertiary safety net. Normal rearming is handled by the separate
  # workflow_run heartbeat after this workflow has fully completed.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write

concurrency:
  # v2 intentionally leaves the old concurrency lock behind. The previous
  # self-dispatch-before-completion design could strand a successor in queued.
  group: k20-customer-question-engine-v2
  cancel-in-progress: false

jobs:
  scheduled-question:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Run scheduled v17 engine
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/k20-question-scheduled.json"
          python question-engine/engine_v17.py --action scheduled --result "$out"
          cat "$out"
