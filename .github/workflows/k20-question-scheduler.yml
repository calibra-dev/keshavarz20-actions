name: Keshavarz20 Question Scheduler

on:
  schedule:
    - cron: '7,17,27,37,47,57 * * * *'

permissions:
  contents: read
  issues: write

concurrency:
  group: k20-customer-question-engine
  cancel-in-progress: false

jobs:
  scheduled-question:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4
      - name: Run scheduled v15 engine
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/k20-question-scheduled.json"
          python question-engine/engine_v15.py --action scheduled --result "$out"
          cat "$out"
