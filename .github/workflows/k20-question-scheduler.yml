name: Keshavarz20 Question Scheduler

on:
  # Hourly tertiary safety net. The normal path is the self-rearming chain below;
  # the separate control workflow is a 10-minute watchdog.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: read
  issues: write
  actions: write

concurrency:
  group: k20-customer-question-engine
  cancel-in-progress: false

jobs:
  scheduled-question:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Run scheduled v17 engine
        id: engine
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/k20-question-scheduled.json"
          python question-engine/engine_v17.py --action scheduled --result "$out"
          cat "$out"

      - name: Rearm continuous question heartbeat
        if: always()
        shell: bash
        env:
          ENGINE_OUTCOME: ${{ steps.engine.outcome }}
        run: |
          set -u
          repo="${GITHUB_REPOSITORY}"
          wf="k20-question-scheduler.yml"

          # If checkout succeeded, honor the explicit engine switch/end guard.
          # If checkout itself failed, default to a retry heartbeat so a transient
          # checkout/network failure cannot permanently kill the chain.
          active=1
          if [[ -f question-engine/config.json ]]; then
            active="$(python - <<'PY'
          import datetime as dt, json
          cfg=json.load(open('question-engine/config.json',encoding='utf-8'))
          if not cfg.get('enabled'):
              print('0'); raise SystemExit
          end=cfg.get('campaign_end_utc')
          if end:
              end_dt=dt.datetime.fromisoformat(str(end).replace('Z','+00:00'))
              if dt.datetime.now(dt.timezone.utc) >= end_dt:
                  print('0'); raise SystemExit
          print('1')
          PY
            )"
          else
            echo "config-read=unavailable-retry-enabled"
          fi
          if [[ "$active" != "1" ]]; then
            echo "continuous-chain=stopped-by-config"
            exit 0
          fi

          # Failure recovery defaults to 10 minutes. On success, ask the engine
          # for its exact randomized next due time and wake inside the lookahead
          # window; the engine itself still enforces the exact post timestamp.
          delay=600
          if [[ "${ENGINE_OUTCOME}" == "success" && -f question-engine/engine_v17.py ]]; then
            status_file="${RUNNER_TEMP}/k20-question-status.json"
            if python question-engine/engine_v17.py --action status --result "$status_file" >/dev/null 2>&1; then
              computed="$(python - "$status_file" <<'PY'
          import datetime as dt, json, sys
          status=json.load(open(sys.argv[1],encoding='utf-8'))
          cfg=json.load(open('question-engine/config.json',encoding='utf-8'))
          raw=status.get('next_due_utc')
          if not raw:
              print(600); raise SystemExit
          due=dt.datetime.fromisoformat(str(raw).replace('Z','+00:00'))
          now=dt.datetime.now(dt.timezone.utc)
          look=max(0,int(cfg.get('scheduler_lookahead_seconds',900)))
          seconds=int((due-now).total_seconds())-look
          print(max(30,min(720,seconds)))
          PY
              )"
              if [[ "$computed" =~ ^[0-9]+$ ]]; then delay="$computed"; fi
            fi
          fi

          echo "engine_outcome=${ENGINE_OUTCOME}"
          echo "next-heartbeat-delay-seconds=${delay}"
          sleep "$delay"

          # Do not fork the heartbeat if an hourly safety run or watchdog run is
          # already queued/in progress. Concurrency prevents double posting too,
          # but this check prevents an unnecessary queue from accumulating.
          others="$(gh api "repos/$repo/actions/workflows/$wf/runs?per_page=20" --jq "[.workflow_runs[] | select((.status != \"completed\") and (.id != ${GITHUB_RUN_ID}))] | length")"
          if [[ "$others" =~ ^[0-9]+$ ]] && (( others > 0 )); then
            echo "self-dispatch=skipped-other-active-run count=$others"
            exit 0
          fi

          gh api --method POST "repos/$repo/actions/workflows/$wf/dispatches" -f ref=main
          echo "self-dispatch=requested"
