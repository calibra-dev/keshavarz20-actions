name: Keshavarz20 Question Scheduler

on:
  # Hourly tertiary safety net. Normal rearming is handled by the separate
  # workflow_run heartbeat after this workflow has fully completed.
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:

permissions:
  contents: write
  issues: write

concurrency:
  group: k20-customer-question-engine-v2
  cancel-in-progress: false

jobs:
  scheduled-question:
    runs-on: ubuntu-latest
    timeout-minutes: 35
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@v4

      - name: Run scheduled SEO God v19 engine
        shell: bash
        run: |
          set -euo pipefail
          out="${RUNNER_TEMP}/k20-question-scheduled.json"
          python question-engine/engine_v19.py --action scheduled --result "$out"
          cat "$out"


      - name: Persist v19 sanitized intent signal
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growth-os/backlog/question-signals/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "questions v19: record scheduled intent signal"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
