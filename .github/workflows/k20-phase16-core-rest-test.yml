name: K20 Phase16 Core REST Render Test
on:
  push:
    branches: [main]
    paths:
      - 'scripts/k20_phase16_core_rest_test.py'
      - '.github/workflows/k20-phase16-core-rest-test.yml'
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_phase16_core_rest_test.py
      - run: python scripts/k20_phase16_core_rest_test.py
