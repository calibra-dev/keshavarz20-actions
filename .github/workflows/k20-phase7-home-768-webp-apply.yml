name: K20 Phase 7 Home 768 WebP Apply
on:
  push:
    branches: [main]
    paths:
      - 'phase7-home-apply-ops/*.json'
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - run: python -m pip install --disable-pip-version-check --quiet pillow
      - run: python -m py_compile scripts/k20_phase7_home_768_webp_apply.py
      - run: python scripts/k20_phase7_home_768_webp_apply.py
      - name: Commit sanitized result
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/home-heavy-webp-apply.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record homepage 768 WebP apply"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
