name: K20 Phase 7 Home Meta Owner Scan

on:
  push:
    branches: [main]
    paths:
      - 'phase7-home-meta-owner-ops/*.json'

permissions:
  contents: write

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Scan page meta keys without persisting values
        run: python scripts/k20_phase7_home_meta_owner_scan.py
      - name: Persist sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/home-meta-owner-scan-20260922.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record homepage meta owner scan"
          git pull --rebase origin main
          git push origin HEAD:main
