name: K21 Top30 Decision Media

on:
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k21-top30-media-batch
  cancel-in-progress: false

jobs:
  build-upload:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - name: Install media dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install requests Pillow arabic-reshaper python-bidi
      - name: Build and upload decision-support cards
        run: python scripts/k21_top30_media_batch.py
      - name: Commit sanitized manifest
        shell: bash
        run: |
          set -euo pipefail
          cp k21-top30-results/top30-media-batch.json /tmp/top30-media-batch.json
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          mkdir -p k21-top30-results
          cp /tmp/top30-media-batch.json k21-top30-results/top30-media-batch.json
          git add -f k21-top30-results/top30-media-batch.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k21: record Top30 media batch evidence"
          git push origin HEAD:main
