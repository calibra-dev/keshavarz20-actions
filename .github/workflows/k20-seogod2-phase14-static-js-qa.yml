name: K20 SEO God2 Phase14 Static JS QA

on:
  push:
    branches: [main]
    paths:
      - 'scripts/k20_seogod2_phase14_static_js_qa.py'
      - '.github/workflows/k20-seogod2-phase14-static-js-qa.yml'
      - 'seo-god2-phase14-static-ops/*.json'

permissions:
  contents: write

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - uses: actions/setup-node@v4
        with: { node-version: '22' }
      - run: python -m pip install requests
      - run: python scripts/k20_seogod2_phase14_static_js_qa.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f seo-god2-results/phase14-static-js-parse.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'seo god2: record phase14 static JS QA'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep 2
          done
          exit 1
