name: K20 Calculator Asset Fingerprint

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-calculator-asset-fingerprint.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Inspect HTML assets
        shell: bash
        run: |
          set -euo pipefail
          URL='https://keshavarz20.com/drip-tape-length-fittings-calculator/'
          curl -fsSL --compressed -A 'Mozilla/5.0 (Linux; Android 14; Mobile) AppleWebKit/537.36 Chrome/153 Safari/537.36' "$URL" -o /tmp/page.html
          python3 - <<'PY'
          import re,json,html,urllib.parse,subprocess,pathlib
          s=pathlib.Path('/tmp/page.html').read_text(errors='replace')
          tags=re.findall(r'<(?:link|script)\b[^>]*>',s,re.I)
          rows=[]
          for t in tags:
              if re.search(r'(stylesheet|preload|preconnect|dns-prefetch|script)',t,re.I):
                  rows.append(html.unescape(t)[:1200])
          imgs=re.findall(r'<img\b[^>]*>',s,re.I)[:30]
          out={'html_bytes':len(s.encode()),'head_assets':rows,'first_images':[html.unescape(x)[:1500] for x in imgs]}
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path('diagnostics/calculator-assets.json').write_text(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - name: Persist
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-assets.json
          git commit -m "diag: record calculator asset manifest" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
