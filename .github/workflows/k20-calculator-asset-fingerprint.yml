name: K20 Calculator Asset Fingerprint
on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-calculator-asset-fingerprint.yml'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          import re,json,urllib.request,html,os,collections
          ua={'User-Agent':'Mozilla/5.0'}
          def get(url):
              req=urllib.request.Request(url,headers=ua)
              with urllib.request.urlopen(req,timeout=60) as r:
                  return r.read().decode('utf-8','replace')
          page=get('https://keshavarz20.com/drip-tape-length-fittings-calculator/')
          tags=[]
          for tag in re.findall(r'<(?:link|script)\\b[^>]*>',page,re.I):
              um=re.search(r'\\b(?:href|src)="([^"]+)"',tag,re.I)
              if not um: continue
              url=html.unescape(um.group(1))
              if not url.startswith('http'): continue
              im=re.search(r'\\bid="([^"]+)"',tag,re.I)
              tags.append({'id':im.group(1) if im else None,'url':url,'tag':tag[:1200]})
          fingerprints=[]
          keys=['woocommerce','elementor','digits','help','irankala','bootstrap','swiper','owl','select2','whatsapp','cart','product','archive','fontawesome','yith','compare','wishlist','login','menu','header','footer']
          for row in tags:
              u=row['url']
              if '/litespeed/css/' not in u and '/litespeed/js/' not in u and 'jquery.min.js' not in u and 'googletagmanager' not in u:
                  continue
              try:
                  body=get(u)
              except Exception as e:
                  body=''; row['fetch_error']=str(e)
              low=body.lower()
              row['bytes']=len(body.encode())
              row['keyword_hits']={k:low.count(k) for k in keys if low.count(k)}
              row['prefix']=body[:2500]
              fingerprints.append(row)
          out={'asset_count':len(tags),'assets':fingerprints}
          os.makedirs('diagnostics',exist_ok=True)
          open('diagnostics/calculator-asset-fingerprint.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-asset-fingerprint.json
          git commit -m "diag: fingerprint calculator assets" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

# rerun
