name: K20 Export Latest 10 Source

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-export-latest10-source.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Export exact source
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          import json, os, requests, pathlib
          base=os.environ["WP_BASE_URL"].rstrip("/")
          auth=(os.environ["WP_USERNAME"],os.environ["WP_APP_PASSWORD"])
          r=requests.get(base+"/wp-json/wp/v2/posts",params={
            "per_page":10,"status":"publish","orderby":"date","order":"desc","context":"edit"
          },auth=auth,timeout=60)
          r.raise_for_status()
          rows=[]
          for p in r.json():
            def val(x):
              if isinstance(x,dict):
                return x.get("raw") if x.get("raw") is not None else x.get("rendered","")
              return x or ""
            rows.append({
              "id":p["id"],"date":p.get("date"),"modified":p.get("modified"),
              "slug":p.get("slug"),"status":p.get("status"),"link":p.get("link"),
              "title":val(p.get("title")),"excerpt":val(p.get("excerpt")),
              "content":val(p.get("content")),"featured_media":p.get("featured_media"),
              "categories":p.get("categories"),"tags":p.get("tags"),"author":p.get("author"),
              "meta":p.get("meta") or {}
            })
          pathlib.Path("content-growth").mkdir(exist_ok=True)
          pathlib.Path("content-growth/latest10-source.json").write_text(
            json.dumps({"posts":rows},ensure_ascii=False,indent=2)+"\n",encoding="utf-8")
          PY
      - name: Persist source snapshot
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-growth/latest10-source.json
          git commit -m "content-growth: snapshot latest 10 source" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main
