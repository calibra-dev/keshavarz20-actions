name: K20 Chat Gallery Publisher

on:
  push:
    branches: [main]
    paths:
      - 'gallery-chat-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-chat-gallery-publisher
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Publish changed gallery requests
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          current="${{ github.sha }}"
          zero="0000000000000000000000000000000000000000"
          if [[ -n "$before" && "$before" != "$zero" ]]; then
            mapfile -t changed < <(git diff --name-only "$before" "$current" -- 'gallery-chat-ops/*.json' | sort -u)
          else
            mapfile -t changed < <(git show --pretty='' --name-only "$current" -- 'gallery-chat-ops/*.json' | sort -u)
          fi
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo "No gallery-chat request JSON found."
            exit 1
          fi
          failed=0
          for req in "${changed[@]}"; do
            if ! python scripts/k20_publish_gallery_payload.py "$req"; then
              failed=1
            fi
          done
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add gallery-chat-results/
          if ! git diff --cached --quiet; then
            git commit -m "gallery-chat: record publish results"
            git push
          fi
          exit "$failed"
