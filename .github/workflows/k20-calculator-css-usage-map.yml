name: K20 Calculator CSS Usage Map
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-css-usage-map.yml']
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 -A 'Mozilla/5.0' 'https://keshavarz20.com/drip-tape-length-fittings-calculator/?LSCWP_CTRL=before_optm' -o /tmp/page.html
          python3 - <<'PY'
          import json,re,urllib.request,os
          h=open('/tmp/page.html',encoding='utf8',errors='replace').read()
          page_classes=set()
          for val in re.findall(r'class=["\']([^"\']+)["\']',h,re.I):
              page_classes.update(x for x in re.split(r'\s+',val.strip()) if x)

          assets={
            'mega-theme-icon':'https://keshavarz20.com/wp-content/plugins/elementor-pro/megatheme/includes/icon/style.css?ver=7.1.2',
            'irk-common':'https://keshavarz20.com/wp-content/themes/irankala/assets/build/common.css?ver=10.10.0',
            'irk-woocommerce':'https://keshavarz20.com/wp-content/themes/irankala/assets/build/woocommerce.css?ver=10.10.0',
            'digits-main':'https://keshavarz20.com/wp-content/plugins/digits/assets/css/main.css?ver=9.2.1',
            'whatsapp':'https://keshavarz20.com/wp-content/plugins/whatsapp-for-wordpress/assets/dist/css/style-rtl.css?ver=3.8.1'
          }
          out={'page_class_count':len(page_classes),'assets':{}}
          for name,url in assets.items():
              try:
                  req=urllib.request.Request(url,headers={'User-Agent':'Mozilla/5.0'})
                  with urllib.request.urlopen(req,timeout=40) as r:
                      css=r.read().decode('utf8','replace')
                  css_classes=set(re.findall(r'\.([A-Za-z_][A-Za-z0-9_-]*)',css))
                  used=sorted(css_classes & page_classes)
                  out['assets'][name]={
                      'url':url,'bytes':len(css.encode('utf8')),
                      'css_class_count':len(css_classes),
                      'intersection_count':len(used),
                      'intersection_sample':used[:200]
                  }
              except Exception as e:
                  out['assets'][name]={'url':url,'error':repr(e)}
          os.makedirs('diagnostics',exist_ok=True)
          open('diagnostics/calculator-css-usage-map.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-css-usage-map.json
          git commit -m "diag: map calculator CSS class usage" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
