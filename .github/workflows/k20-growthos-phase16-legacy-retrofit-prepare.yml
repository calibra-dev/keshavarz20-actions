name: K20 GrowthOS Phase 16 Legacy Trust Retrofit Prepare
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase16-ops/*legacy-retrofit-prepare*.json'
      - 'scripts/k20_growthos_phase16_retrofit_prepare.py'
      - '.github/workflows/k20-growthos-phase16-legacy-retrofit-prepare.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase16-legacy-retrofit-prepare
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_growthos_phase16_retrofit_prepare.py
      - run: python scripts/k20_growthos_phase16_retrofit_prepare.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bridge-v3-ops/20260926-growthos-phase16-legacy-retrofit-job-create.json growthos-phase16-results/legacy-retrofit-prepare.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase16: prepare legacy provenance retrofit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
