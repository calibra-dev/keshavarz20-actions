name: K20 Bridge v3.3 Secure Relay

on:
  push:
    branches: [main]
    paths:
      - 'bridge-v3-secure-ops/*.json'

permissions:
  contents: read

concurrency:
  group: k20-bridge-v33-secure-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Execute changed secure requests
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          current="${{ github.sha }}"
          zero="0000000000000000000000000000000000000000"
          if [[ -n "$before" && "$before" != "$zero" ]]; then
            mapfile -t changed < <(git diff --name-only "$before" "$current" -- 'bridge-v3-secure-ops/*.json' | sort -u)
          else
            mapfile -t changed < <(git show --pretty='' --name-only "$current" -- 'bridge-v3-secure-ops/*.json' | sort -u)
          fi
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo 'No secure manifest found.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/k20-v33-secure-results"
          failed=0
          for req in "${changed[@]}"; do
            name="$(basename "$req" .json)"
            out="$RUNNER_TEMP/k20-v33-secure-results/${name}.json"
            if ! python scripts/k20_secure_bridge_relay.py "$req" "$out"; then
              failed=1
            fi
          done
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: Upload private secure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-v33-secure-${{ github.run_id }}
          path: ${{ runner.temp }}/k20-v33-secure-results/*.json
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when Bridge rejected a secure request
        if: env.failed == '1'
        run: exit 1
