name: K20 Bridge v3.3 Secure Relay

on:
  push:
    branches: [main]
    paths:
      - 'bridge-v3-secure-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-bridge-v33-secure-relay
  cancel-in-progress: false

jobs:
  relay:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Install dependencies
        run: python -m pip install --disable-pip-version-check requests

      - name: Execute changed secure requests
        shell: bash
        run: |
          set -euo pipefail
          before="${{ github.event.before }}"
          current="${{ github.sha }}"
          zero="0000000000000000000000000000000000000000"
          if [[ -n "$before" && "$before" != "$zero" ]]; then
            mapfile -t changed < <(git diff --name-only "$before" "$current" -- 'bridge-v3-secure-ops/*.json' | sort -u)
          else
            mapfile -t changed < <(git show --pretty='' --name-only "$current" -- 'bridge-v3-secure-ops/*.json' | sort -u)
          fi
          if [[ "${#changed[@]}" -eq 0 ]]; then
            echo 'No secure manifest found.'
            exit 0
          fi
          mkdir -p "$RUNNER_TEMP/k20-v33-secure-results"
          failed=0
          for req in "${changed[@]}"; do
            name="$(basename "$req" .json)"
            out="$RUNNER_TEMP/k20-v33-secure-results/${name}.json"
            if ! python scripts/k20_secure_bridge_relay.py "$req" "$out"; then
              failed=1
            fi
          done
          echo "failed=$failed" >> "$GITHUB_ENV"

      - name: Write sanitized secure receipts
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p bridge-v3-secure-receipts
          python - <<'PY'
          import json, pathlib
          src=pathlib.Path(r'''${{ runner.temp }}/k20-v33-secure-results''')
          dst=pathlib.Path('bridge-v3-secure-receipts')
          dst.mkdir(exist_ok=True)
          for p in src.glob('*.json'):
              try:
                  row=json.loads(p.read_text(encoding='utf-8'))
              except Exception:
                  continue
              body=row.get('bridge_response') if isinstance(row.get('bridge_response'),dict) else {}
              result=body.get('result') if isinstance(body.get('result'),dict) else {}
              receipt={
                  'http_code':row.get('http_code'),
                  'request_id':row.get('request_id'),
                  'action':row.get('action'),
                  'request_sha256':row.get('request_sha256'),
                  'ok':bool(body.get('ok')),
                  'code':body.get('code'),
                  'message':body.get('message'),
                  'approval_id':body.get('approval_id'),
                  'fingerprint':body.get('fingerprint'),
                  'expires_at_utc':body.get('expires_at_utc'),
                  'result':{k:result.get(k) for k in ('valid','bytes','sha256','snippet_id','name','active','scope','priority','forced_inactive','planned','code_bytes','code_sha256','locked','trashed') if k in result}
              }
              (dst/p.name).write_text(json.dumps(receipt,ensure_ascii=False,indent=2)+'\n',encoding='utf-8')
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add bridge-v3-secure-receipts/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "bridge-v3 secure: record sanitized receipt"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

      - name: Upload private secure results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-v33-secure-${{ github.run_id }}
          path: ${{ runner.temp }}/k20-v33-secure-results/*.json
          if-no-files-found: warn
          retention-days: 1

      - name: Fail when Bridge rejected a secure request
        if: env.failed == '1'
        run: exit 1
