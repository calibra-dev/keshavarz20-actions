name: Keshavarz20 Sitewide Reference Summary

on:
  push:
    branches: [main]
    paths:
      - 'sitewide-reference-summary-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-sitewide-reference-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Build read-only reference summary
        run: python scripts/k20_sitewide_reference_summary.py

      - name: Commit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sitewide-media-results/reference-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record sitewide reference summary"
          git pull --rebase origin main
          git push origin HEAD:main
