name: K20 GrowthOS Phase 3 Compact Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase3-diagnostic-ops/*.json'
  workflow_dispatch:
permissions:
  contents: write
jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m py_compile scripts/k20_growthos_phase3_compact.py
      - run: python scripts/k20_growthos_phase3_compact.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/html-schema-feed-parity-summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase3: record compact parity diagnostic"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || { git rebase --abort || true; sleep $((attempt*2)); continue; }
            git push origin HEAD:main && exit 0
            sleep $((attempt*2))
          done
          exit 1
