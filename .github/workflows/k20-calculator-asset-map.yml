name: K20 Calculator Asset Map

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-calculator-asset-map.yml'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Fetch optimized and original asset HTML
        shell: bash
        run: |
          set -euo pipefail
          base='https://keshavarz20.com/drip-tape-length-fittings-calculator/'
          curl -fsSL -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/153 Mobile Safari/537.36' "$base" -o "$RUNNER_TEMP/optimized.html"
          curl -fsSL -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/153 Mobile Safari/537.36' "${base}?LSCWP_CTRL=before_optm" -o "$RUNNER_TEMP/original.html"

          python3 - <<'PY'
          import json,re,html,os
          def parse(path):
              s=open(path,encoding='utf-8',errors='replace').read()
              styles=[]
              scripts=[]
              images=[]
              for m in re.finditer(r'<link\b[^>]*rel=["\']stylesheet["\'][^>]*>',s,re.I):
                  tag=m.group(0)
                  href=re.search(r'href=["\']([^"\']+)',tag,re.I)
                  iid=re.search(r'id=["\']([^"\']+)',tag,re.I)
                  styles.append({'id':iid.group(1) if iid else None,'href':html.unescape(href.group(1)) if href else None,'tag':tag[:500]})
              for m in re.finditer(r'<script\b[^>]*src=["\']([^"\']+)["\'][^>]*>',s,re.I):
                  tag=m.group(0)
                  iid=re.search(r'id=["\']([^"\']+)',tag,re.I)
                  scripts.append({'id':iid.group(1) if iid else None,'src':html.unescape(m.group(1)),'tag':tag[:500]})
              for m in re.finditer(r'<img\b[^>]*>',s,re.I):
                  tag=m.group(0)
                  src=re.search(r'src=["\']([^"\']+)',tag,re.I)
                  if src and ('hossini.jpg' in src.group(1) or 'calculator-featured' in src.group(1) or 'logo' in src.group(1).lower()):
                      images.append({'src':html.unescape(src.group(1)),'tag':tag[:900]})
              occ={}
              for term in ['hossini.jpg','googletagmanager.com/gtag/js','k20-calculator-featured']:
                  rows=[]
                  for mm in re.finditer(re.escape(term),s,re.I):
                      a=max(0,mm.start()-800); b=min(len(s),mm.end()+1200)
                      rows.append(s[a:b])
                  occ[term]=rows[:5]
              return {'bytes':len(s.encode()),'styles':styles,'scripts':scripts,'focus_images':images,'occurrences':occ}
          out={'optimized':parse(os.environ['RUNNER_TEMP']+'/optimized.html'),'before_optm':parse(os.environ['RUNNER_TEMP']+'/original.html')}
          os.makedirs('diagnostics',exist_ok=True)
          open('diagnostics/calculator-asset-map.json','w',encoding='utf-8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY

      - name: Persist asset map
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-asset-map.json
          git commit -m "diag: record calculator asset map" || exit 0
          git pull --rebase origin main || true
          git push origin HEAD:main

