name: K20 Phase 4-5 Complete Audit

on:
  push:
    branches: [main]
    paths:
      - 'phase45/input/*.json'
      - 'scripts/k20_phase45_complete.py'
      - '.github/workflows/k20-phase45-complete.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-phase45-complete
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Execute Phase 4 and 5 read-only audit
        run: python scripts/k20_phase45_complete.py

      - name: Validate required outputs
        shell: bash
        run: |
          set -euo pipefail
          test -s phase45/results/phase4-ai-visibility-baseline.json
          test -s phase45/results/phase4-prompt-bank-200.json
          test -s phase45/results/phase5-pim-catalog-audit.json
          test -s phase45/results/phase5-farmer-demand-map.json
          test -s phase45/results/PHASE-04-05-FINAL.md
          python - <<'PY'
          import json
          p=json.load(open("phase45/results/phase4-prompt-bank-200.json",encoding="utf-8"))
          a=json.load(open("phase45/results/phase4-ai-visibility-baseline.json",encoding="utf-8"))
          b=json.load(open("phase45/results/phase5-pim-catalog-audit.json",encoding="utf-8"))
          assert p["count"] == 200
          assert a["execution_complete"] is True
          assert b["execution_complete"] is True
          assert b["catalog"]["total_published"] > 0
          print("PHASE45_VALIDATION_OK", p["count"], b["catalog"]["total_published"])
          PY

      - name: Persist evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase45/results/
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase45: record complete audit evidence"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
