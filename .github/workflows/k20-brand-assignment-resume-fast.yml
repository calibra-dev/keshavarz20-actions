name: K20 Brand Assignment Resume Fast
on:
  push:
    branches: [main]
    paths: ['brand-assignment-ops/resume-fast-*.json']
permissions:
  contents: write
jobs:
  resume:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_brand_assignment_resume_fast.py
      - run: python scripts/k20_brand_assignment_resume_fast.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f brand-assignment-results/resume-fast-158.json
          git commit -m "brand assignment: record 158-product final readback" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
