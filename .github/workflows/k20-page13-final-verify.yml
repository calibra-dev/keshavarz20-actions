name: K20 Page13 Final P0 Verification

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/page13-final-verify/*.json'

permissions:
  contents: write

concurrency:
  group: k20-page13-final-p0-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Verify repaired meta, REST rendering, refund live page, and product sentinel
        shell: python
        run: |
          import base64
          import hashlib
          from html.parser import HTMLParser
          import json
          import os
          import pathlib
          import re
          import subprocess
          import time
          import urllib.error
          import urllib.request

          PAGE_ID = 13
          EXPECTED_SHA = 'ad88a9e43d4045e482939e0aa7c32ebc1c7285c5f7e0cc211754a757025e2592'
          EXPECTED_INNER_SHA = '411d1c0bb3ac6038a4effd4758984f99836c72b3864588cd539880d8ff1fb344'
          PHRASE = 'شرایط مرجوعی، مغایرت کالا و پیگیری بار در کشاورز بیست'
          PRODUCT_PATH = '/product/%d8%b4%db%8c%d8%b1-%d9%be%d8%b1%d9%88%d8%a7%d9%86%d9%87-%d8%a7%db%8c-%d9%be%d9%84%db%8c%d9%85%d8%b1%db%8c-%d8%a8%d8%a7-%d8%af%d8%b3%d8%aa%d9%87-%d9%81%d9%84%d8%b2%db%8c-%d9%88%db%8c%d8%b3%d9%be-3/'

          for key in ('WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'):
              if not os.environ.get(key,'').strip():
                  raise SystemExit(f'Missing required secret: {key}')

          changed = subprocess.check_output([
              'git','show','--pretty=','--name-only','HEAD','--','diagnostics/page13-final-verify/*.json'
          ], text=True).splitlines()
          requests = sorted({p.strip() for p in changed if p.strip().startswith('diagnostics/page13-final-verify/') and p.strip().endswith('.json')})
          if len(requests) != 1:
              raise SystemExit(f'Expected one verification request, found {len(requests)}')
          req = json.loads(pathlib.Path(requests[0]).read_text(encoding='utf-8'))
          if req.get('action') != 'verify_p0' or int(req.get('id',0)) != PAGE_ID:
              raise SystemExit('Verification is hard-limited to Page 13 P0.')

          def sha256_text(value):
              return hashlib.sha256(value.encode('utf-8')).hexdigest()

          def get_text(url, headers=None, timeout=180):
              request = urllib.request.Request(url, method='GET', headers=dict(headers or {}))
              try:
                  with urllib.request.urlopen(request, timeout=timeout) as response:
                      return int(response.status), response.read().decode('utf-8','replace')
              except urllib.error.HTTPError as exc:
                  return int(exc.code), exc.read().decode('utf-8','replace')

          def get_json(url, headers=None, timeout=180):
              code, raw = get_text(url, headers=headers, timeout=timeout)
              try:
                  obj = json.loads(raw) if raw.strip() else None
              except Exception:
                  obj = None
              return code, obj

          class HeadingParser(HTMLParser):
              def __init__(self, phrase):
                  super().__init__(convert_charrefs=True)
                  self.phrase = phrase
                  self.total_h1 = 0
                  self.target_h1 = 0
                  self.target_h2 = 0
                  self.current = None
                  self.buffer = []

              def handle_starttag(self, tag, attrs):
                  t = tag.lower()
                  if t == 'h1':
                      self.total_h1 += 1
                  if t in ('h1','h2') and self.current is None:
                      self.current = t
                      self.buffer = []

              def handle_data(self, data):
                  if self.current is not None:
                      self.buffer.append(data)

              def handle_endtag(self, tag):
                  t = tag.lower()
                  if self.current == t and t in ('h1','h2'):
                      text = re.sub(r'\s+', ' ', ''.join(self.buffer)).strip()
                      if text == self.phrase:
                          if t == 'h1':
                              self.target_h1 += 1
                          else:
                              self.target_h2 += 1
                      self.current = None
                      self.buffer = []

              def summary(self):
                  return {'total_h1':self.total_h1,'target_h1':self.target_h1,'target_h2':self.target_h2}

          def heading_counts(markup):
              parser = HeadingParser(PHRASE)
              parser.feed(markup or '')
              parser.close()
              return parser.summary()

          base = os.environ['WP_BASE_URL'].rstrip('/')
          auth = base64.b64encode(f"{os.environ['WP_USERNAME']}:{os.environ['WP_APP_PASSWORD']}".encode('utf-8')).decode('ascii')
          auth_headers = {'Authorization':'Basic '+auth,'Accept':'application/json','Cache-Control':'no-cache'}
          live_headers = {'Accept':'text/html,application/xhtml+xml','Cache-Control':'no-cache','Pragma':'no-cache','User-Agent':'K20-P0-Final-Verify/1.0'}
          stamp = str(int(time.time()))

          result = {
              'ok': False,
              'p0': 'OPEN/VERIFY_FAILED',
              'page_id': PAGE_ID,
              'meta': {},
              'rest_rendered': {},
              'refund_live': {},
              'product_live': {},
              'verified_at_utc': time.strftime('%Y-%m-%dT%H:%M:%SZ', time.gmtime()),
          }

          # 1) Exact private meta readback.
          selective = base + '/wp-json/wp/v2/pages/13?context=edit&_fields=id,slug,status,modified_gmt,meta'
          meta_code, page = get_json(selective, headers=auth_headers)
          raw = (page.get('meta') or {}).get('_elementor_data') if meta_code == 200 and isinstance(page,dict) else None
          root_type = ''
          root_length = 0
          inner_sha = ''
          meta_counts = {'target_h1':0,'target_h2':0,'css_h1':0,'css_h2':0}
          stored_sha = sha256_text(raw) if isinstance(raw,str) else ''
          if isinstance(raw,str):
              try:
                  decoded = json.loads(raw)
                  root_type = 'array' if isinstance(decoded,list) else 'object' if isinstance(decoded,dict) else 'other'
                  root_length = len(decoded) if isinstance(decoded,list) else 1 if isinstance(decoded,dict) else 0
              except Exception:
                  decoded = None
              if raw.startswith('[') and raw.endswith(']'):
                  inner_sha = sha256_text(raw[1:-1])
              meta_counts = {
                  'target_h1': raw.count(f'<h1>{PHRASE}</h1>'),
                  'target_h2': raw.count(f'<h2>{PHRASE}</h2>'),
                  'css_h1': raw.count('.k20-hero h1'),
                  'css_h2': raw.count('.k20-hero h2'),
              }
          meta_pass = all([
              meta_code == 200,
              stored_sha == EXPECTED_SHA,
              root_type == 'array',
              root_length == 1,
              inner_sha == EXPECTED_INNER_SHA,
              meta_counts == {'target_h1':0,'target_h2':1,'css_h1':0,'css_h2':2},
          ])
          result['meta'] = {'passed':meta_pass,'http_status':meta_code,'stored_sha256':stored_sha,'root_type':root_type,'root_length':root_length,'inner_sha256':inner_sha,**meta_counts}

          # 2) WordPress REST rendered content. This is the layer that previously fatally failed.
          rendered_url = base + '/wp-json/wp/v2/pages/13?_fields=id,slug,status,content'
          rendered_code, rendered_page = get_json(rendered_url, headers=auth_headers)
          rendered_html = ''
          if rendered_code == 200 and isinstance(rendered_page,dict):
              content = rendered_page.get('content') or {}
              if isinstance(content,dict):
                  rendered_html = str(content.get('rendered') or '')
          rendered_counts = heading_counts(rendered_html)
          rendered_pass = rendered_code == 200 and rendered_counts['target_h1'] == 0 and rendered_counts['target_h2'] == 1
          result['rest_rendered'] = {'passed':rendered_pass,'http_status':rendered_code,'body_chars':len(rendered_html),**rendered_counts}

          # 3) Public refund page.
          refund_code, refund_html = get_text(base + '/refund_returns/?k20verify=' + stamp, headers=live_headers)
          refund_counts = heading_counts(refund_html)
          refund_pass = refund_code == 200 and refund_counts == {'total_h1':1,'target_h1':0,'target_h2':1}
          result['refund_live'] = {'passed':refund_pass,'http_status':refund_code,'body_chars':len(refund_html),**refund_counts}

          # 4) Product sentinel regression guard.
          product_code, product_html = get_text(base + PRODUCT_PATH + '?k20verify=' + stamp, headers=live_headers)
          product_counts = heading_counts(product_html)
          product_pass = product_code == 200 and product_counts['total_h1'] == 1 and product_counts['target_h1'] == 0
          result['product_live'] = {'passed':product_pass,'http_status':product_code,'body_chars':len(product_html),**product_counts}

          result['ok'] = bool(meta_pass and rendered_pass and refund_pass and product_pass)
          result['p0'] = 'CLOSED/PASS' if result['ok'] else 'OPEN/VERIFY_FAILED'

          pathlib.Path('results').mkdir(exist_ok=True)
          out = pathlib.Path('results') / (pathlib.Path(requests[0]).stem + '.json')
          out.write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('PAGE13_FINAL_VERIFY', result['p0'])

      - name: Commit sanitized verification evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record Page 13 final P0 verification"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1

      - name: Enforce verified closure
        shell: python
        run: |
          import json, pathlib
          files = sorted(pathlib.Path('results').glob('20260916-page13-final-p0-verify-*.json'))
          if not files:
              raise SystemExit('Final verification result not found')
          data = json.loads(files[-1].read_text(encoding='utf-8-sig'))
          if data.get('ok') is not True or data.get('p0') != 'CLOSED/PASS':
              raise SystemExit('P0 closure criteria not met')
          print('P0_CLOSED_PASS')
