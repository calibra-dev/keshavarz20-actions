name: K20 GrowthOS Phase 4 Compatibility Graph

on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase4-ops/*.json'
      - 'scripts/k20_growthos_phase4_compatibility_graph.py'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-growthos-phase4-compatibility
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Validate
        run: python -m py_compile scripts/k20_growthos_phase4_compatibility_graph.py
      - name: Build Phase 4 evidence graph
        run: python scripts/k20_growthos_phase4_compatibility_graph.py
      - name: Commit sanitized results
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase4-results/compatibility-knowledge-graph.json growthos-phase4-results/compatibility-summary.json growthos-phase4-results/verification-backlog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase4: record compatibility knowledge graph"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
