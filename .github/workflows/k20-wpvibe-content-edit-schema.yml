name: K20 WPVibe Content Edit Route Schema

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/wpvibe-content-edit-schema/*.json'

permissions:
  contents: write

concurrency:
  group: k20-wpvibe-content-edit-schema
  cancel-in-progress: false

jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Inspect installed WPVibe content routes read-only
        shell: python
        run: |
          import base64, json, os, pathlib, subprocess, urllib.request

          for key in ('WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'):
              if not os.environ.get(key,'').strip():
                  raise SystemExit(f'Missing required secret: {key}')

          paths = subprocess.check_output([
              'git','show','--pretty=','--name-only','HEAD','--','diagnostics/wpvibe-content-edit-schema/*.json'
          ], text=True).splitlines()
          requests = sorted({p.strip() for p in paths if p.strip().startswith('diagnostics/wpvibe-content-edit-schema/') and p.strip().endswith('.json')})
          if len(requests) != 1:
              raise SystemExit(f'Expected one diagnostic request, found {len(requests)}')
          req = json.loads(pathlib.Path(requests[0]).read_text(encoding='utf-8'))
          if req.get('action') != 'inspect' or int(req.get('page_id',0)) != 13:
              raise SystemExit('Diagnostic is hard-limited to inspect Page 13 context.')

          base = os.environ['WP_BASE_URL'].rstrip('/')
          auth = base64.b64encode(f"{os.environ['WP_USERNAME']}:{os.environ['WP_APP_PASSWORD']}".encode()).decode()
          headers = {'Authorization':'Basic '+auth,'Accept':'application/json','Cache-Control':'no-cache'}
          request = urllib.request.Request(base + '/wp-json/', method='GET', headers=headers)
          with urllib.request.urlopen(request, timeout=120) as response:
              index = json.loads(response.read().decode('utf-8','replace'))

          wanted = ['/wpvibe/v1/content/edit','/wpvibe/v1/content/search']
          out_routes = {}
          routes = index.get('routes') or {}
          for name in wanted:
              route = routes.get(name)
              if not isinstance(route, dict):
                  out_routes[name] = {'found': False}
                  continue
              endpoints = []
              for ep in route.get('endpoints') or []:
                  args = {}
                  for arg_name, spec in (ep.get('args') or {}).items():
                      if not isinstance(spec, dict):
                          continue
                      args[str(arg_name)] = {
                          'required': bool(spec.get('required')),
                          'type': spec.get('type'),
                          'enum': spec.get('enum') if isinstance(spec.get('enum'), list) else [],
                          'default': spec.get('default') if isinstance(spec.get('default'), (str,int,float,bool,type(None))) else None,
                      }
                  endpoints.append({'methods': ep.get('methods') or [], 'args': args})
              out_routes[name] = {'found': True, 'namespace': route.get('namespace'), 'endpoints': endpoints}

          result = {'ok': True, 'page_id': 13, 'routes': out_routes}
          pathlib.Path('results').mkdir(exist_ok=True)
          name = pathlib.Path(requests[0]).stem
          pathlib.Path(f'results/{name}.json').write_text(json.dumps(result, ensure_ascii=False, indent=2), encoding='utf-8')
          print('WPVIBE_CONTENT_ROUTE_SCHEMA_OK')

      - name: Commit sanitized route schema
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record WPVibe content edit route schema"
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep 2
          done
          exit 1
