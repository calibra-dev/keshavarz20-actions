name: K20 Phase 16 Deep Diagnosis
on:
  push:
    branches: [main]
    paths:
      - 'scripts/k20_phase16_deep_diagnose.py'
      - '.github/workflows/k20-phase16-deep-diagnose.yml'
permissions:
  contents: write
jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_phase16_deep_diagnose.py
      - run: python scripts/k20_phase16_deep_diagnose.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase16-results/deep-diagnosis.json
          git commit -m "growthos phase16: record read-only deep diagnosis"
          git pull --rebase origin main || true
          git push origin HEAD:main
