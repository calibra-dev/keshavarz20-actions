name: K20 SEO God1 Remaining Gate

on:
  push:
    branches: [main]
    paths:
      - 'seo-god1/SEO-GOD1-REMAINING-MASTER-PLAN-20260921.json'
      - 'scripts/k20_seogod1_remaining_gate.py'
      - '.github/workflows/k20-seogod1-remaining-gate.yml'
      - 'seo-god1-remaining-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-seogod1-remaining-gate
  cancel-in-progress: false

jobs:
  gate:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python scripts/k20_seogod1_remaining_gate.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f seo-god1-results/remaining-gate-latest.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'seo-god1: record remaining gate'
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
