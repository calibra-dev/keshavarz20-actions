name: K21 Top30 Fast AI Readiness Final

on:
  push:
    branches: [main]
    paths:
      - 'k21-top30-fast-ai-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k21-top30-fast-ai-final
  cancel-in-progress: false

jobs:
  qa:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - name: Refresh Top30 PIM and compatibility
        run: python scripts/k20_phase3_top30_pim.py
      - name: Refresh technical indexability
        run: python scripts/k20_phase3_top30_indexability.py
      - name: Refresh page schema feed parity
        run: python scripts/k20_phase3_page_schema_feed_parity_fast.py
      - name: Refresh validated discovery feed
        run: python scripts/k21_openai_feed_draft.py
      - name: Recompute K21 AI readiness
        run: python scripts/k21_ai_product_readiness.py
      - name: Build final score report
        run: python scripts/k21_top30_final_report.py
      - name: Persist final AI-readiness evidence
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k21-ai-final
          mkdir -p /tmp/k21-ai-final/phase3-results /tmp/k21-ai-final/geo-aeo-results /tmp/k21-ai-final/k21-top30-results
          cp phase3-results/top30-pim.json phase3-results/compatibility-graph.json phase3-results/top30-remediation.json phase3-results/top30-indexability.json phase3-results/top30-product-feed.json phase3-results/page-schema-feed-parity.json /tmp/k21-ai-final/phase3-results/
          cp geo-aeo-results/k21-openai-discovery-feed-draft.json geo-aeo-results/k21-openai-discovery-valid.jsonl geo-aeo-results/k21-ai-product-readiness.json geo-aeo-results/k21-ai-product-backlog.json /tmp/k21-ai-final/geo-aeo-results/
          cp k21-top30-results/final-top30-scores.json k21-top30-results/final-top30-scores.md /tmp/k21-ai-final/k21-top30-results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/k21-ai-final/phase3-results/* phase3-results/
          cp -r /tmp/k21-ai-final/geo-aeo-results/* geo-aeo-results/
          cp -r /tmp/k21-ai-final/k21-top30-results/* k21-top30-results/
          git add -f phase3-results/top30-pim.json phase3-results/compatibility-graph.json phase3-results/top30-remediation.json phase3-results/top30-indexability.json phase3-results/top30-product-feed.json phase3-results/page-schema-feed-parity.json geo-aeo-results/k21-openai-discovery-feed-draft.json geo-aeo-results/k21-openai-discovery-valid.jsonl geo-aeo-results/k21-ai-product-readiness.json geo-aeo-results/k21-ai-product-backlog.json k21-top30-results/final-top30-scores.json k21-top30-results/final-top30-scores.md
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k21: record final Top30 AI readiness after non-video closure"
          git push origin HEAD:main
