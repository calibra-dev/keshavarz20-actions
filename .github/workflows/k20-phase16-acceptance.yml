name: K20 Phase 16 Acceptance Gate

on:
  push:
    branches: [main]
    paths:
      - 'phase16-acceptance-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase16-acceptance
  cancel-in-progress: false

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Resolve manifest evidence commit
        shell: bash
        run: |
          set -euo pipefail
          sha="$(git log -1 --format=%H -- phase16-results/internal-link-authority-manifest-latest.json)"
          test -n "$sha"
          echo "PHASE16_MANIFEST_COMMIT=$sha" >> "$GITHUB_ENV"
      - name: Validate official Phase 16 acceptance criteria
        run: python scripts/k20_phase16_acceptance.py phase16-results/acceptance-latest.json
      - name: Commit acceptance result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase16-results/acceptance-latest.json
          if git diff --cached --quiet; then
            echo "Acceptance result unchanged; validation passed."
            exit 0
          fi
          git commit -m "phase16: record official acceptance gate"
          git pull --rebase origin main
          git push origin HEAD:main
