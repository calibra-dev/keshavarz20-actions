name: K20 Phase 7 Digits File Index Readonly
on:
  push:
    branches: [main]
    paths:
      - 'phase7-digits-index-ops/*.json'
permissions:
  contents: read
jobs:
  index:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: List Digits paths only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json'}
          $enc=[Uri]::EscapeDataString('plugins/digits')
          $r=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/file/list?scope=wp-content&directory=$enc" -Headers $headers -Method GET -TimeoutSec 180
          $paths=@($r.files | ForEach-Object {[string]$_.path} | Where-Object {$_ -match '\.php$'} | Sort-Object)
          $core=@($paths | Where-Object {$_ -notmatch '/vendor/' -and $_ -notmatch '/libphonenumber/vendor/'})
          $interesting=@($core | Where-Object {$_ -match '(session|cookie|user|login|auth|cache|security|device|helper|function|hook)'})
          $out=[ordered]@{mode='read-only';php_file_count=$paths.Count;core_php_file_count=$core.Count;core_paths=$core;interesting_paths=$interesting}
          $dir=Join-Path $env:RUNNER_TEMP 'k20-digits-index';New-Item -ItemType Directory -Force $dir|Out-Null
          $out|ConvertTo-Json -Depth 10|Set-Content -LiteralPath (Join-Path $dir 'digits-index.json') -Encoding utf8
      - name: Upload private index
        uses: actions/upload-artifact@v4
        with:
          name: k20-digits-file-index
          path: ${{ runner.temp }}/k20-digits-index/digits-index.json
          retention-days: 3
