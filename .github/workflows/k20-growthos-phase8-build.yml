name: K20 GrowthOS Phase 8 Build
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase8-build-ops/*.json'
      - 'growthos-phase8-assets/*.html'
      - 'scripts/k20_growthos_phase8_build.py'
      - '.github/workflows/k20-growthos-phase8-build.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase8-build
  cancel-in-progress: false
jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_growthos_phase8_build.py
      - run: python scripts/k20_growthos_phase8_build.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase8-results/tool-registry.json growthos-phase8-results/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase8: record calculators selectors completion"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
