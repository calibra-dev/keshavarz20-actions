name: K20 Phase 3 LiteSpeed Root Cause Readonly

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/phase3-litespeed-rootcause/*.json'

permissions:
  contents: write

concurrency:
  group: k20-phase3-litespeed-rootcause
  cancel-in-progress: false

jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Scan LiteSpeed source read-only
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($n in 'WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'){
            if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){ throw "Missing required secret: $n" }
          }

          $before='${{ github.event.before }}'; $current='${{ github.sha }}'; $zero='0000000000000000000000000000000000000000'
          if($before -and $before -ne $zero){ $changed=@(git diff --name-only $before $current -- 'diagnostics/phase3-litespeed-rootcause/*.json') }
          else { $changed=@(git show --pretty='' --name-only $current -- 'diagnostics/phase3-litespeed-rootcause/*.json') }
          $reqPath=@($changed | Where-Object { $_ -match '^diagnostics/phase3-litespeed-rootcause/.+\.json$' } | Sort-Object -Unique | Select-Object -First 1)
          if(-not $reqPath){ throw 'No request file found.' }

          $req=Get-Content -Raw -LiteralPath $reqPath | ConvertFrom-Json -Depth 20
          $directory=[string]$req.directory
          if($directory -ne 'plugins/litespeed-cache'){ throw 'This diagnostic is restricted to plugins/litespeed-cache.' }

          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json';'Content-Type'='application/json'}

          $enc=[uri]::EscapeDataString($directory)
          $list=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/file/list?scope=wp-content&directory=$enc" -Headers $headers -Method GET -TimeoutSec 180
          $php=@($list.files | Where-Object { $_.type -eq 'file' -and $_.extension -eq 'php' } | Select-Object -ExpandProperty path)
          $patterns=@($req.patterns)
          $rows=@()

          foreach($p in $php){
            $body=[ordered]@{scope='wp-content';path=[string]$p}|ConvertTo-Json -Compress
            $r=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/file/read" -Headers $headers -Method POST -Body $body -TimeoutSec 180
            $content=$null
            if($r.PSObject.Properties.Name -contains 'content'){ $content=[string]$r.content }
            elseif(($r.PSObject.Properties.Name -contains 'data') -and $r.data -and ($r.data.PSObject.Properties.Name -contains 'content')){ $content=[string]$r.data.content }
            if($null -eq $content){ continue }

            $lines=$content -split "\r?\n"
            $hits=@()
            foreach($pattern in $patterns){
              $pat=[string]$pattern
              for($i=0;$i -lt $lines.Count;$i++){
                if($lines[$i].IndexOf($pat,[System.StringComparison]::OrdinalIgnoreCase) -ge 0){
                  $snippet=$lines[$i].Trim()
                  if($snippet.Length -gt 420){ $snippet=$snippet.Substring(0,420) }
                  $hits+=,[pscustomobject]@{pattern=$pat;line=($i+1);snippet=$snippet}
                  if((@($hits | Where-Object pattern -eq $pat)).Count -ge 12){ break }
                }
              }
            }
            if($hits.Count -gt 0){
              $rows+=,[pscustomobject]@{path=[string]$p;matches=$hits}
            }
          }

          New-Item -ItemType Directory -Force 'results' | Out-Null
          $name=[IO.Path]::GetFileNameWithoutExtension($reqPath)
          [ordered]@{
            mode='read-only'
            directory=$directory
            scanned_php_files=$php.Count
            matched_files=$rows.Count
            matches=$rows
          } | ConvertTo-Json -Depth 30 | Set-Content -LiteralPath "results/phase3-litespeed-rootcause-$name.json" -Encoding utf8

      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/phase3-litespeed-rootcause-*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase3: record LiteSpeed cache root cause scan"
          git pull --rebase origin main
          git push origin HEAD:main
