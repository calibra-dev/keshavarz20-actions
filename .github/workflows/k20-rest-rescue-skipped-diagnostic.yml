name: Keshavarz20 REST Rescue Skipped Diagnostic

on:
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'media-rest-rescue-diagnostic-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-rest-rescue-skipped-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_rest_rescue_skipped_diagnostic.py
      - name: Inspect skipped products read-only
        run: python scripts/k20_rest_rescue_skipped_diagnostic.py
      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media-rest-rescue/skipped-diagnostic.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record REST rescue skipped diagnostic"
          git pull --rebase origin main
          git push origin HEAD:main
