name: K20 Basket DOM Focus
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-basket-dom-focus.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - shell: bash
        run: |
          set -euo pipefail
          python3 -m pip install --quiet requests beautifulsoup4
          python3 - <<'PY'
          import json, requests
          from bs4 import BeautifulSoup
          from pathlib import Path
          url='https://keshavarz20.com/drip-tape-length-fittings-calculator/'
          h=requests.get(url,headers={'User-Agent':'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36','Cache-Control':'no-cache'},timeout=60).text
          s=BeautifulSoup(h,'html.parser')
          out={'url':url,'ids':{},'ancestors':[]}
          for ident in ['k20-basket-refresh','k20-basket-copy','k20-basket-whatsapp']:
              el=s.find(id=ident)
              out['ids'][ident]=str(el) if el else None
          el=s.find(id='k20-basket-refresh')
          cur=el
          for depth in range(7):
              if not cur: break
              children=[]
              for ch in cur.find_all(recursive=False):
                  children.append({
                    'tag':ch.name,'id':ch.get('id'),'class':ch.get('class'),
                    'text':ch.get_text(' ',strip=True)[:800],
                    'html':str(ch)[:5000],
                    'empty':not bool(ch.get_text(' ',strip=True)) and not bool(ch.find(['img','svg','input','button','a']))
                  })
              out['ancestors'].append({
                'depth':depth,'tag':getattr(cur,'name',None),
                'id':cur.get('id') if hasattr(cur,'get') else None,
                'class':cur.get('class') if hasattr(cur,'get') else None,
                'text':cur.get_text(' ',strip=True)[:1600] if hasattr(cur,'get_text') else '',
                'html':str(cur)[:12000],
                'children':children
              })
              cur=cur.parent
          Path('diagnostics').mkdir(exist_ok=True)
          Path('diagnostics/k20-basket-dom-focus.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/k20-basket-dom-focus.json
          git commit -m 'diag: capture basket DOM focus' || exit 0
          git pull --rebase origin main
          git push
