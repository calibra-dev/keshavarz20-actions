name: Keshavarz20 Question Catalog Audit

on:
  push:
    branches: [main]
    paths:
      - 'question-engine-audits/*.json'

permissions:
  contents: write

concurrency:
  group: k20-question-catalog-audit
  cancel-in-progress: false

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run read-only catalog audit
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p question-engine-audit-results
          stamp="$(date -u +%Y%m%dT%H%M%SZ)"
          out="question-engine-audit-results/${stamp}-catalog-family-audit.json"
          python question-engine/catalog_audit.py --result "$out"
          echo "RESULT_PATH=$out" >> "$GITHUB_ENV"

      - name: Commit audit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f "$RESULT_PATH"
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "questions: record catalog family audit"
          git pull --rebase origin main
          git push origin HEAD:main
