name: K20 Phase 2 Content Catalog

on:
  push:
    branches: [main]
    paths:
      - 'phase2-content-catalog-ops/*.json'

permissions:
  contents: write

jobs:
  catalog:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - run: python scripts/k20_phase2_content_catalog.py phase2-results/content-catalog.json
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase2-results/content-catalog.json
          git commit -m "phase2: record content catalog"
          git pull --rebase origin main
          git push origin main
