name: K20 Upgrade Latest 10 Published Posts

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-upgrade-latest10-posts.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-upgrade-latest10-posts
  cancel-in-progress: false

jobs:
  upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6' }}
      K20_UPGRADE_LIMIT: '10'
      K20_WATERMARK_SCRIPTS: ${{ runner.temp }}/watermarks-remover/service/scripts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: content-growth/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r content-growth/requirements.txt
          pip install -r daily-agri-articles/requirements.txt
          pip install -r daily-agri-news/requirements.txt

      - name: Install watermark-remover v0.7.0
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 --branch v0.7.0 https://github.com/guillaumemeyer/watermarks-remover.git "$RUNNER_TEMP/watermarks-remover"
          test -f "$RUNNER_TEMP/watermarks-remover/service/scripts/clean_text.py"

      - name: Static validation before live writes
        shell: bash
        run: |
          set -euo pipefail
          python -m py_compile content_growth_runtime.py
          python -m py_compile content-growth/upgrade_latest_posts.py
          python -m py_compile daily-agri-articles/publish_queue_v6.py
          python -m py_compile daily-agri-news/main.py
          python - <<'PY'
          from pathlib import Path
          p=Path('content-growth/K20_CONTENT_GROWTH_MASTER_PROMPT_V2.md')
          assert p.exists() and len(p.read_text(encoding='utf-8')) > 4000
          PY

      - name: Upgrade latest 10 published posts
        id: upgrade
        shell: bash
        run: |
          set +e
          python content-growth/upgrade_latest_posts.py
          code=$?
          echo "exit_code=$code" >> "$GITHUB_OUTPUT"
          exit 0

      - name: Persist sanitized report
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          if [ ! -f content-growth/latest10-upgrade-report.json ]; then
            echo "No report produced."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content-growth/latest10-upgrade-report.json
          git commit -m "content-growth: record latest 10 upgrade readback" || exit 0
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

      - name: Upload rollback evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: k20-latest10-upgrade-${{ github.run_id }}
          path: |
            content-growth/output/backups/*.json
            content-growth/output/latest10-upgrade-report.json
          if-no-files-found: warn
          retention-days: 14

      - name: Fail if any live post failed
        if: steps.upgrade.outputs.exit_code != '0'
        run: exit 1
