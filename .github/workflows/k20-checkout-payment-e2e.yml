name: K20 Checkout To Payment Gateway E2E

on:
  push:
    branches: [main]
    paths:
      - 'checkout-e2e-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-checkout-payment-e2e
  cancel-in-progress: false

jobs:
  checkout-e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install test dependencies
        run: python -m pip install requests playwright
      - name: Run checkout E2E
        shell: bash
        run: |
          set -euo pipefail
          before='${{ github.event.before }}'
          current='${{ github.sha }}'
          mapfile -t files < <(git diff --name-only "$before" "$current" -- 'checkout-e2e-ops/*.json')
          test "${#files[@]}" -gt 0
          mkdir -p checkout-e2e-results
          for f in "${files[@]}"; do
            name="$(basename "$f" .json)"
            python scripts/k20_checkout_payment_e2e.py "$f" "checkout-e2e-results/$name.json" || true
          done
      - name: Record test evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f checkout-e2e-results/*.json
          git commit -m 'checkout: record payment gateway e2e evidence' || exit 0
          git pull --rebase origin main
          git push origin main