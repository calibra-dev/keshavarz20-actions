name: K20 GrowthOS Brand Schema Apply

on:
  push:
    branches: [main]
    paths:
      - 'growthos-brand-schema-apply-ops/*.json'

permissions:
  contents: write

jobs:
  apply:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Create or update guarded inactive snippet, then activate
        shell: python
        run: |
          import json, os, pathlib, requests

          base=os.environ['WP_BASE_URL'].rstrip('/')
          s=requests.Session()
          s.auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          s.headers.update({'Accept':'application/json','Content-Type':'application/json'})

          name='K20 GrowthOS Product Brand Schema v1'
          code=r"""add_filter( 'woocommerce_structured_data_product', function ( $markup, $product ) {
              if ( ! is_array( $markup ) || ! ( $product instanceof WC_Product ) ) {
                  return $markup;
              }

              if ( ! empty( $markup['brand'] ) ) {
                  return $markup;
              }

              $brands = get_the_terms( $product->get_id(), 'product_brand' );

              if ( is_wp_error( $brands ) || empty( $brands ) || ! is_array( $brands ) ) {
                  return $markup;
              }

              $brand = reset( $brands );

              if ( ! $brand || empty( $brand->name ) ) {
                  return $markup;
              }

              $markup['brand'] = array(
                  '@type' => 'Brand',
                  'name'  => wp_strip_all_tags( $brand->name ),
              );

              return $markup;
          }, 9999, 2 );"""

          listed=s.get(base+'/wp-json/code-snippets/v1/snippets',params={'per_page':100},timeout=90)
          listed.raise_for_status()
          payload=listed.json()
          items=payload if isinstance(payload,list) else (payload.get('snippets') or payload.get('data') or [])
          if not isinstance(items,list):
              items=[]

          exact=None
          for item in items:
              if str(item.get('name') or '').strip()==name:
                  exact=item
                  break

          body={
              'name':name,
              'desc':'GrowthOS Phase 3: add Product.brand only from the product\'s existing WooCommerce product_brand term when brand is absent. No inference and no price/stock changes.',
              'code':code,
              'tags':['k20','growthos','schema','brand','woocommerce'],
              'scope':'global',
              'active':False,
              'priority':10,
              'network':False,
              'shared_network':False,
              'trashed':False,
              'locked':False,
          }

          if exact:
              sid=int(exact['id'])
              wr=s.post(f"{base}/wp-json/code-snippets/v1/snippets/{sid}",data=json.dumps(body),timeout=90)
              operation='updated'
          else:
              wr=s.post(base+'/wp-json/code-snippets/v1/snippets',data=json.dumps(body),timeout=90)
              operation='created'
          wr.raise_for_status()
          created=wr.json()
          sid=int(created.get('id') or (exact or {}).get('id') or 0)
          if not sid:
              raise SystemExit('Snippet ID missing after create/update')

          before=s.get(f"{base}/wp-json/code-snippets/v1/snippets/{sid}",timeout=90)
          before.raise_for_status()
          b=before.json()
          if b.get('active') is True:
              raise SystemExit('Pre-activation guard failed: snippet unexpectedly active')
          if str(b.get('code') or '').strip()!=code.strip():
              raise SystemExit('Readback code mismatch before activation')
          if b.get('code_error'):
              raise SystemExit('Code Snippets parser reports an error before activation')

          act=s.post(f"{base}/wp-json/code-snippets/v1/snippets/{sid}/activate",data='{}',timeout=90)
          act.raise_for_status()

          after=s.get(f"{base}/wp-json/code-snippets/v1/snippets/{sid}",timeout=90)
          after.raise_for_status()
          a=after.json()
          if a.get('active') is not True:
              raise SystemExit('Snippet did not become active')
          if a.get('code_error'):
              raise SystemExit('Active snippet reports code_error')

          result={
              'ok':True,
              'operation':operation,
              'snippet_id':sid,
              'name':a.get('name'),
              'active':a.get('active'),
              'scope':a.get('scope'),
              'priority':a.get('priority'),
              'tags':a.get('tags'),
              'code_error':a.get('code_error'),
              'guardrails':{
                  'uses_existing_product_brand_only':True,
                  'does_not_write_product_data':True,
                  'does_not_touch_price_or_stock':True,
                  'does_not_create_schema_when_no_brand_term':True,
                  'leaves_existing_brand_untouched':True,
              }
          }
          pathlib.Path('growthos-phase3-results').mkdir(exist_ok=True)
          pathlib.Path('growthos-phase3-results/brand-schema-apply.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
      - name: Commit sanitized apply evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/brand-schema-apply.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record brand schema apply"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
