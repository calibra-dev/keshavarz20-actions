name: Keshavarz20 Gallery REST Bridge Meta Probe

on:
  push:
    branches: [main]
    paths:
      - 'gallery-rest-bridge-probe-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-gallery-rest-bridge-meta-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_gallery_rest_bridge_meta_probe.py
      - name: Probe gallery metadata read-only
        run: python scripts/k20_gallery_rest_bridge_meta_probe.py
      - name: Commit sanitized probe
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f media-rest-rescue/gallery-rest-bridge-probe.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record gallery REST Bridge meta probe"
          git pull --rebase origin main
          git push origin HEAD:main
