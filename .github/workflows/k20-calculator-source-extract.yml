name: K20 Calculator Stored Content Extract
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-source-extract.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          curl -fsS -u "$WP_USERNAME:$WP_APP_PASSWORD" \
            "$WP_BASE_URL/wp-json/wp/v2/pages/143698?context=edit" \
            -H 'Accept: application/json' -o /tmp/page.json
          python3 - <<'PY'
          import json,re,os
          row=json.load(open('/tmp/page.json',encoding='utf8'))
          raw=((row.get('content') or {}).get('raw') or '')
          markers=['growthos-decision-flow','FAQPage','GrowthOSMeasurement','k20-basket-items','k20-calculator-ui-repair']
          out={'length':len(raw),'status':row.get('status'),'slug':row.get('slug'),'markers':{}}
          for term in markers:
              ms=list(re.finditer(re.escape(term),raw,re.I))
              arr=[]
              for m in ms[:20]:
                  s=max(0,m.start()-1600); e=min(len(raw),m.end()+2600)
                  arr.append({'pos':m.start(),'snippet':raw[s:e]})
              out['markers'][term]=arr
          blocks=[]
          for kind in ('style','script'):
              pat=re.compile(r'<'+kind+r'\b[^>]*>.*?</'+kind+r'\s*>',re.I|re.S)
              for m in pat.finditer(raw):
                  block=m.group(0)
                  if any(t.lower() in block.lower() for t in markers):
                      blocks.append({'kind':kind,'start':m.start(),'end':m.end(),'text':block})
          out['matched_blocks']=blocks
          os.makedirs('diagnostics',exist_ok=True)
          open('diagnostics/calculator-stored-content-extract.json','w',encoding='utf8').write(json.dumps(out,ensure_ascii=False,indent=2))
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/calculator-stored-content-extract.json
          git commit -m 'diag: persist calculator stored content extract' || exit 0
          git push
