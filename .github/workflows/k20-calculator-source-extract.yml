name: K20 Calculator WebMCP Syntax QA
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-source-extract.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          curl -fsSL -A 'Mozilla/5.0 (Linux; Android 14) AppleWebKit/537.36 Chrome/140 Mobile Safari/537.36' \
            'https://keshavarz20.com/drip-tape-length-fittings-calculator/' -o /tmp/page.html
          python3 - <<'PY'
          import re,json,pathlib
          h=pathlib.Path('/tmp/page.html').read_text(encoding='utf8',errors='replace')
          scripts=re.findall(r'<script\b[^>]*>(.*?)</script\s*>',h,re.I|re.S)
          target=''
          for s in scripts:
              if '__k20WebMCPPhase13' in s:
                  target=s
                  break
          if not target:
              raise SystemExit('WebMCP script not found')
          pathlib.Path('/tmp/webmcp.js').write_text(target,encoding='utf8')
          pathlib.Path('/tmp/webmcp-meta.json').write_text(json.dumps({
              'length':len(target),
              'amp_entity_count':target.count('&amp;'),
              'lt_entity_count':target.count('&lt;'),
              'gt_entity_count':target.count('&gt;'),
              'repair_marker':'__k20BasketRuntimeRepairV1' in target
          },indent=2),encoding='utf8')
          PY
          set +e
          node --check /tmp/webmcp.js >/tmp/node.out 2>/tmp/node.err
          STATUS=$?
          set -e
          python3 - <<'PY'
          import json,pathlib,re
          meta=json.loads(pathlib.Path('/tmp/webmcp-meta.json').read_text())
          err=pathlib.Path('/tmp/node.err').read_text(encoding='utf8',errors='replace')
          js=pathlib.Path('/tmp/webmcp.js').read_text(encoding='utf8',errors='replace')
          line=None
          m=re.search(r'/tmp/webmcp\.js:(\d+)',err)
          if m: line=int(m.group(1))
          ctx=''
          if line:
              lines=js.splitlines()
              a=max(0,line-4); b=min(len(lines),line+3)
              ctx='\n'.join(f'{i+1}: {lines[i]}' for i in range(a,b))
          entity_lines=[]
          for i,line_text in enumerate(js.splitlines(),1):
              if '&#038;' in line_text or '&amp;' in line_text or '&#039;' in line_text or '&quot;' in line_text:
                  entity_lines.append({'line':i,'text':line_text[:2000]})
          meta.update({'syntax_ok':not bool(err.strip()),'error':err[:4000],'error_line':line,'context':ctx[:5000],'entity_lines':entity_lines[:100],'entity_line_count':len(entity_lines),'num038_count':js.count('&#038;')})
          pathlib.Path('diagnostics').mkdir(exist_ok=True)
          pathlib.Path('diagnostics/k20-webmcp-syntax-qa.json').write_text(json.dumps(meta,ensure_ascii=False,indent=2),encoding='utf8')
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/k20-webmcp-syntax-qa.json
          git commit -m 'qa: check calculator WebMCP script syntax'
          git pull --rebase origin main
          git push

# rerun entity scan

# final rerun after WebMCP entity repairs
