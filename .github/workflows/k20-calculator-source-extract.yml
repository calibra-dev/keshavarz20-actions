name: K20 Calculator Runtime Analyze
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-source-extract.yml']
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - shell: bash
        run: |
          set -euo pipefail
          npm install --no-save puppeteer-core@24 >/dev/null 2>&1
          CHROME="$(command -v google-chrome || command -v chromium || command -v chromium-browser)"
          if [ -z "$CHROME" ]; then echo "Chrome not found"; exit 1; fi
          export CHROME
          cat > /tmp/analyze.mjs <<'JS'
          import puppeteer from 'puppeteer-core';
          import fs from 'fs';
          const browser=await puppeteer.launch({headless:true,executablePath:process.env.CHROME,args:['--no-sandbox','--disable-dev-shm-usage']});
          const page=await browser.newPage();
          await page.setViewport({width:390,height:844,deviceScaleFactor:1});
          const errors=[];
          page.on('console',msg=>{ if(msg.type()==='error') errors.push('console: '+msg.text()); });
          page.on('pageerror',err=>errors.push('pageerror: '+String(err)));
          await page.goto('https://keshavarz20.com/drip-tape-length-fittings-calculator/',{waitUntil:'networkidle2',timeout:120000});
          await new Promise(r=>setTimeout(r,4000));
          const data=await page.evaluate(()=>{
            const bodyText=document.body.innerText||'';
            const markers=['growthos-decision-flow','FAQPage','GrowthOSMeasurement','use strict'];
            const markerHits={};
            for(const m of markers){ markerHits[m]=bodyText.toLowerCase().includes(m.toLowerCase()); }
            const basket=document.getElementById('k20-basket-items');
            const nav=[...document.querySelectorAll('.bottom-nav .nav-item')].map(a=>{
              const svg=a.querySelector('svg');
              const r=a.getBoundingClientRect();
              const sr=svg?svg.getBoundingClientRect():null;
              const cs=svg?getComputedStyle(svg):null;
              return {text:(a.innerText||'').trim(),href:a.href,box:{x:r.x,y:r.y,w:r.width,h:r.height},svg:svg?{display:cs.display,visibility:cs.visibility,opacity:cs.opacity,w:sr.width,h:sr.height,inlineStyle:svg.getAttribute('style')}:null};
            });
            return {
              markerHits,
              bodyTextExcerpt: bodyText.slice(0,3000),
              basket:{exists:!!basket,childCount:basket?basket.children.length:null,text:basket?(basket.innerText||'').slice(0,3000):null,html:basket?basket.innerHTML.slice(0,5000):null},
              nav
            };
          });
          data.errors=errors.slice(0,50);
          fs.mkdirSync('diagnostics',{recursive:true});
          fs.writeFileSync('diagnostics/calculator-runtime-analysis.json',JSON.stringify(data,null,2));
          await browser.close();
          JS
          node /tmp/analyze.mjs
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add diagnostics/calculator-runtime-analysis.json
          git commit -m 'diag: capture calculator runtime state' || exit 0
          git push
