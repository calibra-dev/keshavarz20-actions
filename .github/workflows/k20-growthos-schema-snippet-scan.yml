name: K20 GrowthOS Schema Snippet Conflict Scan
on:
  push:
    branches: [main]
    paths:
      - 'growthos-schema-snippet-scan-ops/*.json'
permissions:
  contents: write
jobs:
  scan:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Scan active snippets for product schema filters
        shell: python
        run: |
          import json, os, pathlib, requests
          base=os.environ['WP_BASE_URL'].rstrip('/')
          s=requests.Session(); s.auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          r=s.get(base+'/wp-json/code-snippets/v1/snippets',params={'per_page':100,'status':'active'},timeout=90)
          r.raise_for_status()
          payload=r.json()
          items=payload if isinstance(payload,list) else (payload.get('snippets') or payload.get('data') or [])
          if not isinstance(items,list): items=[]
          needles=['woocommerce_structured_data_product','structured_data_product','product_brand',"['brand']",'"brand"','unset']
          hits=[]
          for x in items:
              if not x.get('active'): continue
              sid=x.get('id')
              d=s.get(f"{base}/wp-json/code-snippets/v1/snippets/{sid}",timeout=90); d.raise_for_status()
              y=d.json(); code=str(y.get('code') or '')
              matched=[n for n in needles if n.lower() in code.lower()]
              if matched:
                  lines=code.splitlines()
                  excerpts=[]
                  for i,line in enumerate(lines):
                      if any(n.lower() in line.lower() for n in matched):
                          excerpts.append({'line':i+1,'text':line[:500]})
                  hits.append({'id':sid,'name':y.get('name'),'priority':y.get('priority'),'scope':y.get('scope'),'matched':matched,'excerpts':excerpts[:30]})
          result={'active_snippets_scanned':sum(1 for x in items if x.get('active')),'hits':hits}
          pathlib.Path('growthos-phase3-results').mkdir(exist_ok=True)
          pathlib.Path('growthos-phase3-results/schema-snippet-conflict-scan.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
      - name: Commit sanitized conflict scan
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/schema-snippet-conflict-scan.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record schema snippet conflict scan"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
