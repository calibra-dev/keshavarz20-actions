name: K21 GEO AEO AI Product Readiness

on:
  push:
    branches: [main]
    paths:
      - 'geo-aeo-ops/*.json'
      - 'scripts/k21_ai_product_readiness.py'
  workflow_dispatch:
  schedule:
    - cron: '15 2 * * 1'

permissions:
  contents: write

concurrency:
  group: k21-geo-aeo-ai-product-readiness
  cancel-in-progress: false

jobs:
  score:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python scripts/k21_ai_product_readiness.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f geo-aeo-results/k21-ai-product-readiness.json geo-aeo-results/k21-ai-product-backlog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k21: record AI product readiness and GEO backlog"
          for attempt in 1 2 3 4; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
