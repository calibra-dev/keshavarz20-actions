name: K20 Bridge v3.3 Direct Asset E2E Test

on:
  push:
    branches: [main]
    paths:
      - 'bridge-v3-test-ops/*.json'

permissions:
  contents: write

jobs:
  test:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      GH_TOKEN: ${{ github.token }}
      GITHUB_REPOSITORY: ${{ github.repository }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - run: python -m pip install --disable-pip-version-check requests

      - name: Run direct asset relay test and cleanup
        shell: python
        run: |
          import base64, hashlib, json, os, pathlib, requests, sys, time

          before=os.environ.get('GITHUB_EVENT_BEFORE','')
          repo=os.environ['GITHUB_REPOSITORY']
          token=os.environ['GH_TOKEN']
          base=os.environ['WP_BASE_URL'].rstrip('/')
          auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])

          ops=sorted(pathlib.Path('bridge-v3-test-ops').glob('*.json'), key=lambda p:p.stat().st_mtime, reverse=True)
          if not ops:
              raise SystemExit('No test manifest found')
          req_path=ops[0]
          cfg=json.loads(req_path.read_text(encoding='utf-8'))
          blob_sha=str(cfg['blob_sha'])
          request_id=str(cfg.get('request_id') or req_path.stem)

          gh=requests.Session()
          gh.headers.update({
              'Authorization':f'Bearer {token}',
              'Accept':'application/vnd.github+json',
              'X-GitHub-Api-Version':'2022-11-28',
              'User-Agent':'k20-v33-e2e-test'
          })
          wp=requests.Session()
          wp.auth=auth
          wp.headers.update({'Accept':'application/json'})

          product_id=None
          attachment_id=None
          result={
              'ok':False,
              'request_id':request_id,
              'source_blob_sha':blob_sha,
              'bridge_version':None,
              'contract':None,
              'product_id':None,
              'attachment_id':None,
              'uploaded':False,
              'bound':False,
              'readback_verified':False,
              'attachment_deleted':False,
              'product_deleted':False,
              'errors':[]
          }

          try:
              br=gh.get(f'https://api.github.com/repos/{repo}/git/blobs/{blob_sha}',timeout=60)
              br.raise_for_status()
              bp=br.json()
              if bp.get('encoding')!='base64':
                  raise RuntimeError('blob_not_base64')
              raw=base64.b64decode((bp.get('content') or '').replace('\n',''), validate=True)
              if not raw:
                  raise RuntimeError('blob_empty')
              result['source_sha256']=hashlib.sha256(raw).hexdigest()
              result['source_bytes']=len(raw)

              pr=wp.post(
                  base+'/wp-json/wc/v3/products',
                  json={
                      'name':'K20 Bridge v3.3 Direct Asset Test '+str(int(time.time())),
                      'status':'draft',
                      'catalog_visibility':'hidden'
                  },
                  timeout=90
              )
              pdata=pr.json() if pr.content else {}
              if pr.status_code not in range(200,300):
                  raise RuntimeError(f'product_create_http_{pr.status_code}:{pdata}')
              product_id=int(pdata['id'])
              result['product_id']=product_id

              files={'file':('k20-v33-chat-generated-test.webp',raw,'image/webp')}
              form={
                  'filename':'k20-v33-chat-generated-test.webp',
                  'title':'K20 Bridge v3.3 Chat Asset Test',
                  'alt_text':'K20 Bridge v3.3 Chat Asset Test',
                  'post_id':str(product_id),
                  'output_mime':'image/webp',
                  'quality':'82',
                  'max_dimension':'256'
              }
              ur=wp.post(base+'/wp-json/keshavarz20-ops/v3/asset',data=form,files=files,timeout=120)
              udata=ur.json() if ur.content else {}
              if ur.status_code not in range(200,300) or not udata.get('ok'):
                  raise RuntimeError(f'asset_upload_failed:{ur.status_code}:{udata}')
              result['uploaded']=True
              result['bridge_version']=udata.get('version')
              result['contract']=udata.get('contract')
              attachment_id=int((udata.get('result') or {}).get('attachment_id') or 0)
              result['attachment_id']=attachment_id
              if attachment_id<=0:
                  raise RuntimeError('missing_attachment_id')

              bind_body={
                  'action':'asset.featured.set',
                  'request_id':request_id+'-bind',
                  'payload':{'target_id':product_id,'attachment_id':attachment_id}
              }
              rr=wp.post(base+'/wp-json/keshavarz20-ops/v3/execute',json=bind_body,timeout=90)
              rdata=rr.json() if rr.content else {}
              if rr.status_code not in range(200,300) or not rdata.get('ok'):
                  raise RuntimeError(f'bind_failed:{rr.status_code}:{rdata}')
              result['bound']=True

              rb=wp.get(base+f'/wp-json/wc/v3/products/{product_id}',timeout=90)
              rbdata=rb.json() if rb.content else {}
              if rb.status_code not in range(200,300):
                  raise RuntimeError(f'readback_failed:{rb.status_code}:{rbdata}')
              images=rbdata.get('images') or []
              first_id=int(images[0].get('id') or 0) if images else 0
              result['readback_featured_id']=first_id
              result['readback_verified']=(first_id==attachment_id)
              if not result['readback_verified']:
                  raise RuntimeError(f'featured_mismatch:{first_id}!={attachment_id}')

              result['ok']=True
          except Exception as e:
              result['errors'].append(str(e))
          finally:
              if attachment_id:
                  try:
                      dr=wp.delete(base+f'/wp-json/wp/v2/media/{attachment_id}',params={'force':'true'},timeout=90)
                      result['attachment_deleted']=dr.status_code in range(200,300)
                      if not result['attachment_deleted']:
                          result['errors'].append('attachment_cleanup_http_'+str(dr.status_code))
                  except Exception as e:
                      result['errors'].append('attachment_cleanup:'+str(e))
              if product_id:
                  try:
                      dr=wp.delete(base+f'/wp-json/wc/v3/products/{product_id}',params={'force':'true'},timeout=90)
                      result['product_deleted']=dr.status_code in range(200,300)
                      if not result['product_deleted']:
                          result['errors'].append('product_cleanup_http_'+str(dr.status_code))
                  except Exception as e:
                      result['errors'].append('product_cleanup:'+str(e))

          outdir=pathlib.Path('bridge-v3-test-results')
          outdir.mkdir(exist_ok=True)
          out=outdir/(req_path.stem+'.json')
          out.write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False,indent=2))
          if not (result['ok'] and result['attachment_deleted'] and result['product_deleted']):
              raise SystemExit(2)

      - name: Commit sanitized test evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bridge-v3-test-results/
          git diff --cached --quiet && exit 0
          git commit -m "bridge-v3.3: record direct asset E2E test"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
