name: Keshavarz20 Content Direct WebP Reuse

on:
  push:
    branches: [main]
    paths:
      - 'content-direct-reuse-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-content-direct-reuse
  cancel-in-progress: false

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_content_direct_reuse.py
      - name: Reuse verified WebP mappings in direct content
        run: python scripts/k20_content_direct_reuse.py
      - name: Commit sanitized migration evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-direct-reuse-results/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record direct WebP reuse migration"
          git pull --rebase origin main
          git push origin HEAD:main
