name: K21 Permanent Generated Media Cleanup

on:
  push:
    branches: [main]
    paths:
      - 'media-cleanup-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k21-permanent-generated-media-cleanup
  cancel-in-progress: false

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Install dependency
        run: python -m pip install requests

      - name: Permanently delete only verified K21 generated media
        run: python scripts/delete_k21_generated_media.py

      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f k21-top30-results/permanent-generated-media-delete-result.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k21: record permanent generated-media cleanup"
          git pull --rebase origin main
          git push origin HEAD:main
