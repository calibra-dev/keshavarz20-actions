name: K20 GrowthOS Woo Version Diagnostic
on:
  push:
    branches: [main]
    paths:
      - 'growthos-woo-version-ops/*.json'
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Read WooCommerce system version only
        shell: python
        run: |
          import json, os, pathlib, requests
          base=os.environ['WP_BASE_URL'].rstrip('/')
          r=requests.get(base+'/wp-json/wc/v3/system_status',auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD']),timeout=90)
          r.raise_for_status()
          j=r.json()
          env=j.get('environment') or {}
          result={
            'http':r.status_code,
            'woocommerce_version':env.get('version'),
            'wordpress_version':env.get('wp_version'),
            'php_version':env.get('php_version'),
          }
          pathlib.Path('growthos-phase3-results').mkdir(exist_ok=True)
          pathlib.Path('growthos-phase3-results/woocommerce-version.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
      - name: Commit sanitized version evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/woocommerce-version.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record WooCommerce version"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
