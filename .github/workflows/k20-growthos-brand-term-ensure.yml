name: K20 GrowthOS Product Brand Term Ensure

on:
  push:
    branches: [main]
    paths:
      - 'growthos-brand-term-create-ops/*.json'

permissions:
  contents: write

jobs:
  ensure:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Ensure exact product_brand term
        shell: python
        run: |
          import json, os, pathlib, requests
          base=os.environ["WP_BASE_URL"].rstrip("/")
          auth=(os.environ["WP_USERNAME"],os.environ["WP_APP_PASSWORD"])
          name="اتصال گستر"
          route=base+"/wp-json/wp/v2/product_brand"
          probe=requests.get(route,params={"search":name,"per_page":100,"context":"edit"},auth=auth,timeout=90)
          if probe.status_code != 200:
              raise SystemExit(f"product_brand REST route unavailable: HTTP {probe.status_code}")
          rows=probe.json()
          exact=[x for x in rows if str(x.get("name") or "").strip()==name]
          created=False
          if exact:
              term=exact[0]
          else:
              create=requests.post(route,json={"name":name},auth=auth,timeout=90)
              if create.status_code not in (200,201):
                  raise SystemExit(f"term create failed HTTP {create.status_code}: {create.text[:300]}")
              term=create.json()
              created=True
          out={
            "ok":True,
            "taxonomy":"product_brand",
            "name":name,
            "term_id":term.get("id"),
            "slug":term.get("slug"),
            "created":created
          }
          pathlib.Path("growthos-phase3-results").mkdir(exist_ok=True)
          pathlib.Path("growthos-phase3-results/brand-term-ensure.json").write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding="utf-8")
          print(json.dumps(out,ensure_ascii=False))
      - name: Commit sanitized term evidence
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/brand-term-ensure.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record product brand term ensure"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
