name: K20 GrowthOS Code Snippets Preflight
on:
  push:
    branches: [main]
    paths:
      - 'growthos-code-snippets-preflight-ops/*.json'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Read schema and existing matching snippets
        shell: python
        run: |
          import json, os, pathlib, requests
          base=os.environ['WP_BASE_URL'].rstrip('/')
          auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          s=requests.Session(); s.auth=auth
          schema=s.get(base+'/wp-json/code-snippets/v1/snippets/schema',timeout=90); schema.raise_for_status()
          existing=s.get(base+'/wp-json/code-snippets/v1/snippets',params={'search':'K20 GrowthOS','per_page':100},timeout=90); existing.raise_for_status()
          e=existing.json()
          items=e if isinstance(e,list) else (e.get('snippets') or e.get('data') or [])
          safe=[]
          for x in items if isinstance(items,list) else []:
              safe.append({
                'id':x.get('id'),'name':x.get('name'),'active':x.get('active'),
                'scope':x.get('scope'),'priority':x.get('priority'),'tags':x.get('tags')
              })
          result={'schema':schema.json(),'matching_snippets':safe}
          pathlib.Path('growthos-phase3-results').mkdir(exist_ok=True)
          pathlib.Path('growthos-phase3-results/code-snippets-preflight.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'matching_snippets':safe,'schema_keys':list(schema.json().keys()) if isinstance(schema.json(),dict) else None},ensure_ascii=False))
      - name: Commit sanitized preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/code-snippets-preflight.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record Code Snippets preflight"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
