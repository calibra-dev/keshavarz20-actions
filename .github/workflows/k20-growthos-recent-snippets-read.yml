name: K20 GrowthOS Recent Snippets Read
on:
  push:
    branches: [main]
    paths:
      - 'growthos-recent-snippets-ops/*.json'
permissions:
  contents: write
jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Read snippet IDs above baseline
        shell: python
        run: |
          import json, os, pathlib, requests
          base=os.environ['WP_BASE_URL'].rstrip('/')
          s=requests.Session(); s.auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          r=s.get(base+'/wp-json/code-snippets/v1/snippets',params={'per_page':100},timeout=90); r.raise_for_status()
          p=r.json(); items=p if isinstance(p,list) else (p.get('snippets') or p.get('data') or [])
          out=[]
          for x in items if isinstance(items,list) else []:
              try:sid=int(x.get('id') or 0)
              except:sid=0
              if sid<=31: continue
              d=s.get(f"{base}/wp-json/code-snippets/v1/snippets/{sid}",timeout=90); d.raise_for_status()
              y=d.json()
              out.append({
                'id':sid,'name':y.get('name'),'active':y.get('active'),'scope':y.get('scope'),
                'priority':y.get('priority'),'tags':y.get('tags'),'code_error':y.get('code_error'),
                'last_active':y.get('last_active'),'trashed':y.get('trashed')
              })
          result={'recent_snippets':out}
          pathlib.Path('growthos-phase3-results').mkdir(exist_ok=True)
          pathlib.Path('growthos-phase3-results/recent-snippets-after-brand-attempt.json').write_text(json.dumps(result,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps(result,ensure_ascii=False))
      - name: Commit sanitized readback
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/recent-snippets-after-brand-attempt.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record recent snippet readback"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
