name: K20 Frontend Root-Cause Diagnostic

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/frontend-rootcause/*.json'

permissions:
  contents: write

concurrency:
  group: k20-frontend-rootcause-diagnostic
  cancel-in-progress: false

jobs:
  diagnose:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Run read-only diagnostic
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach($n in 'WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'){
            if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){ throw "Missing required repository secret: $n" }
          }
          $before='${{ github.event.before }}'; $current='${{ github.sha }}'; $zero='0000000000000000000000000000000000000000'
          if($before -and $before -ne $zero){ $changed=@(git diff --name-only $before $current -- 'diagnostics/frontend-rootcause/*.json') }
          else { $changed=@(git show --pretty='' --name-only $current -- 'diagnostics/frontend-rootcause/*.json') }
          $changed=@($changed | Where-Object { $_ -match '^diagnostics/frontend-rootcause/.+\.json$' } | Sort-Object -Unique)
          if($changed.Count -eq 0){ throw 'No frontend root-cause request JSON found.' }
          foreach($requestPath in $changed){
            $name=[IO.Path]::GetFileNameWithoutExtension($requestPath)
            $out=Join-Path $env:RUNNER_TEMP "$name.result.json"
            & ./scripts/Invoke-K20FrontendRootCauseDiagnostic.ps1 -RequestPath $requestPath -OutputPath $out
            if(-not(Test-Path $out)){ throw "Result missing: $requestPath" }
            New-Item -ItemType Directory -Force 'results' | Out-Null
            Copy-Item $out "results/frontend-rootcause-$name.json" -Force
          }

      - name: Commit sanitized diagnostic result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add results/frontend-rootcause-*.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "ops: record frontend root-cause diagnostic"
          git pull --rebase origin main
          git push origin main
