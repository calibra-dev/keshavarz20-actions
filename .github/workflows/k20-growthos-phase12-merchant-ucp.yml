name: K20 GrowthOS Phase 12 Merchant UCP
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase12-ops/*.json'
      - 'scripts/k20_growthos_phase12_merchant_ucp.py'
      - '.github/workflows/k20-growthos-phase12-merchant-ucp.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase12-merchant-ucp
  cancel-in-progress: true
jobs:
  readiness:
    runs-on: ubuntu-latest
    timeout-minutes: 18
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_growthos_phase12_merchant_ucp.py
      - run: python scripts/k20_growthos_phase12_merchant_ucp.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase12-results/merchant-field-map.json growthos-phase12-results/ucp-readiness-contract.json growthos-phase12-results/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase12: record Merchant and UCP readiness"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
