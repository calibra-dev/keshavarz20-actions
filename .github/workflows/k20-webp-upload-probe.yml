name: Keshavarz20 WebP Upload Probe
on:
  push:
    branches: [main]
    paths:
      - 'content-webp-probe-ops/*.json'
permissions:
  contents: write
concurrency:
  group: k20-webp-upload-probe
  cancel-in-progress: false
jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install --disable-pip-version-check --quiet pillow
      - run: python -m py_compile scripts/k20_webp_upload_probe.py
      - name: Probe upload metadata and always clean up
        run: python scripts/k20_webp_upload_probe.py
      - name: Commit sanitized probe evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-webp-probe-results/*.json 2>/dev/null || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record WebP upload probe"
          git pull --rebase origin main
          git push origin HEAD:main
