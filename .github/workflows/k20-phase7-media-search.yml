name: K20 Phase 7 Media Search Readonly

on:
  push:
    branches: [main]
    paths:
      - 'phase7-media-ops/*.json'

permissions:
  contents: write

jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - name: Search media by filename text
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $req=(git show --pretty='' --name-only '${{ github.sha }}' -- 'phase7-media-ops/*.json' | Select-Object -First 1)
          if([string]::IsNullOrWhiteSpace($req)){throw 'request missing'}
          $cfg=Get-Content -Raw -LiteralPath $req|ConvertFrom-Json
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json'}
          $items=@()
          foreach($term in @($cfg.terms)){
            $q=[Uri]::EscapeDataString([string]$term)
            $rows=Invoke-RestMethod -Uri "$base/wp-json/wp/v2/media?context=edit&search=$q&per_page=100&_fields=id,slug,status,source_url,media_details,parent,title" -Headers $headers -Method GET -TimeoutSec 180
            foreach($m in @($rows)){
              $items+=,[pscustomobject][ordered]@{term=$term;id=[int]$m.id;slug=[string]$m.slug;source_url=[string]$m.source_url;parent=[int]$m.parent;width=$m.media_details.width;height=$m.media_details.height;filesize=$m.media_details.filesize;title=[string]$m.title.raw}
            }
          }
          $out=[ordered]@{mode='read-only';items=@($items|Sort-Object id -Unique)}
          New-Item -ItemType Directory -Force phase7-results|Out-Null
          $out|ConvertTo-Json -Depth 20|Set-Content -LiteralPath phase7-results/media-search.json -Encoding utf8
      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/media-search.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record media search"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
