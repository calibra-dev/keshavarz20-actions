name: Keshavarz20 Daily Agriculture News Draft (API mode)

on:
  # GitHub cron is UTC. Iran is UTC+03:30, so 04:30 UTC = 08:00 Tehran.
  schedule:
    - cron: '30 4 * * *'
  workflow_dispatch:
    inputs:
      lookback_hours:
        description: 'News lookback window in hours'
        required: false
        default: '24'
      dry_run:
        description: 'Research/generate only; do not create the WordPress draft'
        type: boolean
        required: false
        default: true
  pull_request:
    paths:
      - '.github/workflows/k20-daily-agri-news.yml'
      - 'daily-agri-news/main.py'
      - 'daily-agri-news/requirements.txt'

permissions:
  contents: read

concurrency:
  # Serialize scheduled and manual runs so two executions cannot race into
  # duplicate WordPress drafts around the 08:00 Tehran window.
  group: k20-daily-agri-news-api
  cancel-in-progress: false

jobs:
  static-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4
      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile Python
        run: python -m py_compile daily-agri-news/main.py

  build-news-draft:
    if: github.event_name != 'pull_request'
    needs: static-check
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      TZ: Asia/Tehran
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
      OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
      OPENAI_TEXT_MODEL: ${{ vars.OPENAI_TEXT_MODEL || 'gpt-5.6' }}
      OPENAI_IMAGE_MODEL: ${{ vars.OPENAI_IMAGE_MODEL || 'gpt-image-2' }}
      K20_LOOKBACK_HOURS: ${{ inputs.lookback_hours || '24' }}
      # Scheduled runs must create the review draft. Manual runs keep their
      # explicit dry_run input, whose default remains true for safety.
      K20_DRY_RUN: ${{ github.event_name == 'schedule' && 'false' || inputs.dry_run }}
      K20_NEWS_CATEGORY_ID: '839'
      K20_NEWS_CATEGORY_NAME: 'کشاورزی'

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: daily-agri-news/requirements.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r daily-agri-news/requirements.txt

      - name: Validate required secrets
        shell: bash
        run: |
          set -euo pipefail
          missing=0
          for name in WP_BASE_URL WP_USERNAME WP_APP_PASSWORD OPENAI_API_KEY; do
            if [ -z "${!name:-}" ]; then
              echo "::error title=Missing repository secret::$name is empty or unavailable"
              missing=1
            fi
          done
          if [ "$missing" -ne 0 ]; then
            exit 2
          fi

      - name: Build agriculture news draft
        run: python daily-agri-news/main.py

      - name: Publish run summary
        if: always()
        shell: bash
        run: |
          if [ -f daily-agri-news/output/summary.md ]; then
            cat daily-agri-news/output/summary.md >> "$GITHUB_STEP_SUMMARY"
          else
            echo '## Keshavarz20 Daily Agriculture News API mode' >> "$GITHUB_STEP_SUMMARY"
            echo 'No summary file was produced.' >> "$GITHUB_STEP_SUMMARY"
          fi
