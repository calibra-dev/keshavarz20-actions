name: K20 SEO God2 Phase15 Aggregate Recovery

on:
  push:
    branches: [main]
    paths:
      - 'phase15-aggregate-recovery-ops/*.json'

permissions:
  actions: read
  contents: write

concurrency:
  group: k20-seogod2-phase15-aggregate-recovery
  cancel-in-progress: false

jobs:
  aggregate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with: { fetch-depth: 2 }
      - uses: actions/setup-python@v5
        with: { python-version: '3.12' }
      - run: python -m pip install requests
      - uses: actions/download-artifact@v4
        with:
          pattern: phase15-shard-*
          path: /tmp/phase15-shards
          merge-multiple: true
          github-token: ${{ secrets.GITHUB_TOKEN }}
          run-id: 36842766992
      - name: Aggregate existing verified shard artifacts
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main
          git reset --hard origin/main
          python scripts/k20_phase15_aggregate_publication.py --artifacts /tmp/phase15-shards
          python scripts/k20_video_sitemap_gate.py
      - name: Commit recovered manifest and sitemap gate
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f             phase2/video-program/assets.json             phase2/video-program/manifest.json             phase2-results/video-sitemap-gate.json             phase2-results/video-sitemap.xml             phase15-publication-results/public-assets.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "seo god2 phase15: recover verified public asset aggregation"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
