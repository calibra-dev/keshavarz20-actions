name: K20 Phase 7 LiteSpeed Lazy Exclude Raw Read

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/phase7-litespeed-option-raw/*.json'

permissions:
  contents: read

jobs:
  read:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
      - name: Read exact LiteSpeed media-vpi option
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          foreach($n in 'WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD'){
            if([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($n))){ throw "Missing required secret: $n" }
          }
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json';'Content-Type'='application/json'}
          $cmd="db query SELECT option_name, option_value FROM {prefix}options WHERE option_name=0x6c69746573706565642e6d656469612d767069 --limit=5"
          $payload=[ordered]@{command=$cmd;confirm_write=$false}|ConvertTo-Json -Compress
          $r=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/cli/run" -Headers $headers -Method POST -Body $payload -TimeoutSec 180
          $dir=Join-Path $env:RUNNER_TEMP 'k20-phase7-litespeed-option-raw'; New-Item -ItemType Directory -Force $dir|Out-Null
          $r|ConvertTo-Json -Depth 20|Set-Content -LiteralPath (Join-Path $dir 'result.json') -Encoding utf8
      - uses: actions/upload-artifact@v4
        with:
          name: k20-phase7-litespeed-option-raw
          path: ${{ runner.temp }}/k20-phase7-litespeed-option-raw/result.json
          retention-days: 3
