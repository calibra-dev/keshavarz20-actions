name: K20 Schema Organization Probe

on:
  push:
    branches: [main]
    paths:
      - 'diagnostics/schema-organization/*.json'

permissions:
  contents: write

concurrency:
  group: k20-schema-organization-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate probe
        run: python -m py_compile scripts/k20_schema_organization_probe.py
      - name: Inspect live Organization JSON-LD read-only
        run: python scripts/k20_schema_organization_probe.py
      - name: Commit sanitized diagnostic
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/schema-organization-live.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record live Organization schema"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
