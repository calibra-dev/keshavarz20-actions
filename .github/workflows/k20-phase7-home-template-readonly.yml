name: K20 Phase 7 Home Template Readonly
on:
  push:
    branches: [main]
    paths:
      - 'phase7-theme-ops/*.json'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - name: Read exact home template and match slider lines
        shell: pwsh
        run: |
          $ErrorActionPreference='Stop'
          $base=$env:WP_BASE_URL.TrimEnd('/')
          $auth=[Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes("$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"))
          $headers=@{Authorization="Basic $auth";Accept='application/json';'Content-Type'='application/json'}
          $paths=@('themes/irankala/partials/fullwidth-slider.php','themes/irankala-wpvibe-draft/partials/fullwidth-slider.php')
          $patterns=@('thumbnail','image','slider','get_option','get_theme_mod','attachment','wp_get','the_post','lazy','owl')
          $out=@()
          foreach($p in $paths){
            try{
              $body=[ordered]@{scope='wp-content';path=$p}|ConvertTo-Json -Compress
              $r=Invoke-RestMethod -Uri "$base/wp-json/wpvibe/v1/file/read" -Headers $headers -Method POST -Body $body -TimeoutSec 180
              $content=if($r.PSObject.Properties.Name -contains 'content'){[string]$r.content}elseif($r.data){[string]$r.data.content}else{''}
              $lines=$content -split "\r?\n";$matches=@()
              foreach($pat in $patterns){
                for($i=0;$i -lt $lines.Count;$i++){
                  if($lines[$i].IndexOf($pat,[StringComparison]::OrdinalIgnoreCase)-ge0){
                    $s=$lines[$i].Trim();if($s.Length-gt500){$s=$s.Substring(0,500)}
                    $matches+=,[pscustomobject]@{pattern=$pat;line=$i+1;snippet=$s}
                    if((@($matches|Where-Object pattern -eq $pat)).Count-ge12){break}
                  }
                }
              }
              $out+=,[pscustomobject]@{path=$p;ok=$true;line_count=$lines.Count;matches=$matches}
            }catch{$out+=,[pscustomobject]@{path=$p;ok=$false;error=$_.Exception.Message}}
          }
          New-Item -ItemType Directory -Force phase7-results|Out-Null
          [ordered]@{mode='read-only';files=$out}|ConvertTo-Json -Depth 20|Set-Content phase7-results/home-template-source.json -Encoding utf8
      - name: Commit result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase7-results/home-template-source.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase7: record homepage template source evidence"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
