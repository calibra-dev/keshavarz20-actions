name: K20 Vispar SKU Fix
on:
  push:
    branches: [main]
    paths:
      - 'sku-fix-ops/*.json'
      - 'scripts/k20_vispar_sku_fix.py'
      - '.github/workflows/k20-vispar-sku-fix.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-vispar-sku-fix
  cancel-in-progress: true
jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_vispar_sku_fix.py
      - run: python scripts/k20_vispar_sku_fix.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f sku-fix-results/20260926-vispar-sku-fix.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k20: record verified Vispar SKU fix"
          git pull --rebase origin main
          git push origin main
