name: K21 Top30 Final Rescore

on:
  push:
    branches: [main]
    paths:
      - 'k21-top30-finalize-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k21-top30-final-rescore
  cancel-in-progress: false

jobs:
  rescore:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - name: Rebuild score sources in dependency order
        shell: bash
        run: |
          set -euo pipefail
          python scripts/k20_product_quality_score.py
          python scripts/k20_phase3_top30_pim.py
          python scripts/k21_openai_feed_draft.py
          python scripts/k20_phase3_page_schema_feed_parity.py
          python scripts/k20_phase3_top30_indexability.py
          python scripts/k21_ai_product_readiness.py
      - name: Persist final K21 evidence
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/k21-final/phase2-results /tmp/k21-final/phase3-results /tmp/k21-final/geo-aeo-results
          cp phase2-results/product-quality-score.json /tmp/k21-final/phase2-results/
          cp phase3-results/top30-pim.json phase3-results/compatibility-graph.json phase3-results/top30-remediation.json /tmp/k21-final/phase3-results/
          cp phase3-results/top30-product-feed.json phase3-results/page-schema-feed-parity.json phase3-results/top30-indexability.json /tmp/k21-final/phase3-results/
          cp geo-aeo-results/k21-openai-discovery-feed-draft.json geo-aeo-results/k21-openai-discovery-valid.jsonl /tmp/k21-final/geo-aeo-results/
          cp geo-aeo-results/k21-ai-product-readiness.json geo-aeo-results/k21-ai-product-backlog.json /tmp/k21-final/geo-aeo-results/
          git fetch origin main
          git reset --hard origin/main
          cp -r /tmp/k21-final/phase2-results/* phase2-results/
          cp -r /tmp/k21-final/phase3-results/* phase3-results/
          cp -r /tmp/k21-final/geo-aeo-results/* geo-aeo-results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase2-results/product-quality-score.json
          git add -f phase3-results/top30-pim.json phase3-results/compatibility-graph.json phase3-results/top30-remediation.json
          git add -f phase3-results/top30-product-feed.json phase3-results/page-schema-feed-parity.json phase3-results/top30-indexability.json
          git add -f geo-aeo-results/k21-openai-discovery-feed-draft.json geo-aeo-results/k21-openai-discovery-valid.jsonl
          git add -f geo-aeo-results/k21-ai-product-readiness.json geo-aeo-results/k21-ai-product-backlog.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k21: record final Top30 AI readiness after remediation"
          git push origin HEAD:main
