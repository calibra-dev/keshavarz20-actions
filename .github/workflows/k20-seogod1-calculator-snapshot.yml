name: K20 SEO God1 Calculator Snapshot
on:
  push:
    branches: [main]
    paths:
      - 'seo-god1-ops/calculator-snapshot-*.json'
      - 'scripts/k20_seogod1_calculator_snapshot.py'
      - '.github/workflows/k20-seogod1-calculator-snapshot.yml'
permissions:
  contents: write
jobs:
  snapshot:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python scripts/k20_seogod1_calculator_snapshot.py
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -f seo-god1-results/calculator-current-snapshot.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'seo-god1: record calculator current snapshot'
          git pull --rebase origin main
          git push origin main
