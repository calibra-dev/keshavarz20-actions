name: SEO God2 Phase 6 Basket Intelligence

on:
  push:
    branches: [main]
    paths:
      - 'seo-god2-phase6-ops/*.json'
      - 'seo-god2/phase5-tier-a-compatibility-graph-v2-20260930.json'
      - 'scripts/k20_seogod2_phase6_basket.py'
      - 'tests/test_seogod2_phase6_basket.py'
      - '.github/workflows/k20-seogod2-phase6-basket.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-seogod2-phase6-basket
  cancel-in-progress: true

jobs:
  verify-and-build:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/k20_seogod2_phase6_basket.py
      - name: Safety tests
        run: python -m unittest tests.test_seogod2_phase6_basket -v
      - name: Build basket intelligence
        run: python scripts/k20_seogod2_phase6_basket.py
      - name: Acceptance gate
        shell: python
        run: |
          import json
          from pathlib import Path
          p=Path("seo-god2/phase6-basket-intelligence-20260930.json")
          r=json.loads(p.read_text(encoding="utf-8"))
          m=r["metrics"]
          assert m["tier_a_products"] == 20
          assert m["random_recommendations"] == 0
          assert m["same_size_only_recommendations"] == 0
          assert m["verified_exact_recommendations"] == 0
          assert m["incompatible_pairs_blocked"] == 5
          assert m["expert_review_pairs"] == 8
          assert r["runtime"]["exact_sku_cards_enabled"] is False
          assert r["runtime"]["legacy_same_size_writer_must_remain_disabled"] is True
          print("PHASE6_ACCEPTANCE_OK", m)
      - name: Commit Phase 6 result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seo-god2/phase6-basket-intelligence-20260930.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "seo god2 phase6: record guarded basket intelligence"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
