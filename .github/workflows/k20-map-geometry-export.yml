name: K20 Map Geometry Export

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-map-geometry-export.yml'

permissions:
  contents: read

jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Clone public geometry sources
        shell: bash
        run: |
          set -euo pipefail
          git clone --depth 1 https://github.com/simamojtahedi/react-iran-provinces-map.git provinces
          git clone --depth 1 https://github.com/simamojtahedi/react-iran-map.git country

      - name: Build browser geometry bundle
        shell: bash
        run: |
          set -euo pipefail
          cat > /tmp/export.py <<'PY'
          import json, re
          from pathlib import Path

          code_to_file = {
              "IR-01":"Markazi","IR-02":"Gilan","IR-03":"Mazandaran","IR-04":"EastAzerbaijan",
              "IR-05":"WestAzerbaijan","IR-06":"Kermanshah","IR-07":"Khuzestan","IR-08":"Fars",
              "IR-09":"Kerman","IR-10":"RazaviKhorasan","IR-11":"Isfahan","IR-12":"SistanAndBaluchestan",
              "IR-13":"Kurdistan","IR-14":"Hamadan","IR-15":"ChaharmahalandBakhtiari","IR-16":"Lorestan",
              "IR-17":"Ilam","IR-18":"KohgiluyehAndBoyerAhmad","IR-19":"Bushehr","IR-20":"Zanjan",
              "IR-21":"Semnan","IR-22":"Yazd","IR-23":"Hormozgan","IR-24":"Tehran",
              "IR-25":"Ardabil","IR-26":"Qom","IR-27":"Qazvin","IR-28":"Golestan",
              "IR-29":"NorthKhorasan","IR-30":"SouthKhorasan","IR-31":"Alborz",
          }

          def clean(s):
              return re.sub(r"\s+", " ", s).strip()

          def extract_shapes(path):
              text = Path(path).read_text(encoding="utf-8")
              vm = re.search(r"viewBox=['\"]([^'\"]+)['\"]", text)
              viewbox = vm.group(1) if vm else "0 0 1200 1200"
              shapes = []
              for tag in re.findall(r"<(?:path|polygon)\b.*?/>", text, re.S):
                  nm = re.search(r"data-name=['\"]([^'\"]+)['\"]", tag)
                  if not nm:
                      continue
                  name = clean(nm.group(1))
                  dm = re.search(r"\bd=['\"]([^'\"]+)['\"]", tag, re.S)
                  pm = re.search(r"\bpoints=['\"]([^'\"]+)['\"]", tag, re.S)
                  if dm:
                      shapes.append({"name":name,"type":"path","data":clean(dm.group(1))})
                  elif pm:
                      shapes.append({"name":name,"type":"polygon","data":clean(pm.group(1))})
              return {"viewBox":viewbox,"areas":shapes}

          out = {}
          base = Path("provinces/src/components/provinces")
          for code, stem in code_to_file.items():
              f = base / f"{stem}.tsx"
              if not f.exists():
                  raise SystemExit(f"missing {f}")
              out[code] = extract_shapes(f)

          # Country water: the Calibra vendored paths originate from react-iran-map.
          # Extract non-province path/polygon geometry that has no data-name.
          cands = list(Path("country/src").rglob("*.tsx"))
          water_paths = []
          for f in cands:
              text = f.read_text(encoding="utf-8")
              for tag in re.findall(r"<path\b.*?/>", text, re.S):
                  if "data-name=" in tag:
                      continue
                  dm = re.search(r"\bd=['\"]([^'\"]{80,})['\"]", tag, re.S)
                  if dm:
                      d = clean(dm.group(1))
                      # Country-water paths are the very large background coastline shapes.
                      if len(d) > 1200:
                          water_paths.append(d)
          # Deduplicate, keep largest candidates only.
          water_paths = sorted(set(water_paths), key=len, reverse=True)[:4]

          Path("artifact").mkdir()
          bundle = "window.K20ProvinceGeometry=" + json.dumps(out, ensure_ascii=False, separators=(',',':')) + ";\n"
          Path("artifact/province-geometry.js").write_text(bundle, encoding="utf-8")
          Path("artifact/country-water.json").write_text(json.dumps(water_paths, ensure_ascii=False), encoding="utf-8")
          Path("artifact/summary.json").write_text(json.dumps({
              "province_count": len(out),
              "area_count": sum(len(v["areas"]) for v in out.values()),
              "water_candidates": len(water_paths)
          }), encoding="utf-8")
          PY
          python /tmp/export.py
          du -h artifact/*
          cat artifact/summary.json

      - name: Upload geometry artifact
        uses: actions/upload-artifact@v4
        with:
          name: k20-map-geometry
          path: artifact/
          retention-days: 1
