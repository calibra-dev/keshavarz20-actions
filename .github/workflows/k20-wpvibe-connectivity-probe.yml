name: K20 WPVibe Connectivity Probe

on:
  push:
    branches: [main]
    paths:
      - 'wpvibe-connectivity-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-wpvibe-connectivity-probe
  cancel-in-progress: false

jobs:
  probe:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2

      - name: Probe public WPVibe challenge routes
        shell: python
        run: |
          import hashlib, json, time, urllib.parse, urllib.request
          from pathlib import Path

          base = "https://keshavarz20.com"
          stamp = str(int(time.time()))
          routes = [
              "/wp-json/wpvibe/v1/connection-check-challenge",
              "/?rest_route=/wpvibe/v1/connection-check-challenge",
          ]
          rows = []
          for route in routes:
              sep = "&" if "?" in route else "?"
              url = base + route + sep + "k20_probe=" + stamp
              req = urllib.request.Request(
                  url,
                  headers={
                      "User-Agent": "k20-github-wpvibe-connectivity-probe/1.0",
                      "Accept": "application/json",
                      "Cache-Control": "no-cache, no-store, max-age=0",
                      "Pragma": "no-cache",
                  },
              )
              row = {"route": route}
              try:
                  with urllib.request.urlopen(req, timeout=60) as resp:
                      raw = resp.read()
                      text = raw.decode("utf-8", "replace")
                      ctype = resp.headers.get("Content-Type", "")
                      row.update({
                          "http": int(resp.status),
                          "content_type": ctype,
                          "server": resp.headers.get("Server"),
                          "cf_cache_status": resp.headers.get("CF-Cache-Status"),
                          "x_litespeed_cache": resp.headers.get("X-LiteSpeed-Cache"),
                          "cache_control": resp.headers.get("Cache-Control"),
                          "body_bytes": len(raw),
                          "body_sha256": hashlib.sha256(raw).hexdigest(),
                          "looks_json": text.lstrip().startswith(("{", "[")),
                          "looks_html": "<html" in text[:500].lower() or "<!doctype html" in text[:500].lower(),
                      })
                      try:
                          parsed = json.loads(text)
                          row["json_type"] = type(parsed).__name__
                          row["json_keys"] = sorted(parsed.keys())[:20] if isinstance(parsed, dict) else []
                      except Exception:
                          row["json_type"] = None
                          row["json_keys"] = []
              except urllib.error.HTTPError as exc:
                  raw = exc.read()
                  text = raw.decode("utf-8", "replace")
                  row.update({
                      "http": int(exc.code),
                      "error": f"HTTPError: HTTP {exc.code}",
                      "content_type": exc.headers.get("Content-Type"),
                      "server": exc.headers.get("Server"),
                      "cf_ray": exc.headers.get("CF-Ray"),
                      "cf_cache_status": exc.headers.get("CF-Cache-Status"),
                      "x_litespeed_cache": exc.headers.get("X-LiteSpeed-Cache"),
                      "cache_control": exc.headers.get("Cache-Control"),
                      "body_bytes": len(raw),
                      "body_sha256": hashlib.sha256(raw).hexdigest(),
                      "looks_json": text.lstrip().startswith(("{", "[")),
                      "looks_html": "<html" in text[:500].lower() or "<!doctype html" in text[:500].lower(),
                  })
                  try:
                      parsed = json.loads(text)
                      row["json_type"] = type(parsed).__name__
                      row["json_keys"] = sorted(parsed.keys())[:20] if isinstance(parsed, dict) else []
                      if isinstance(parsed, dict):
                          row["json_code"] = parsed.get("code")
                          row["json_message"] = str(parsed.get("message") or "")[:160]
                  except Exception:
                      row["json_type"] = None
                      row["json_keys"] = []
              except Exception as exc:
                  row.update({"http": 0, "error": f"{type(exc).__name__}: {exc}"})
              rows.append(row)

          out = {
              "checked_at_utc": __import__("datetime").datetime.now(__import__("datetime").timezone.utc).isoformat(),
              "site": base,
              "read_only": True,
              "rows": rows,
          }
          Path("wpvibe-connectivity-results").mkdir(exist_ok=True)
          Path("wpvibe-connectivity-results/public-challenge.json").write_text(
              json.dumps(out, ensure_ascii=False, indent=2) + "\n",
              encoding="utf-8",
          )
          print(json.dumps(out, ensure_ascii=False))

      - name: Commit sanitized result
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f wpvibe-connectivity-results/public-challenge.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "diag: record WPVibe public challenge probe"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
