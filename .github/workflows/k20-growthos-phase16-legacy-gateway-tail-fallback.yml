name: K20 GrowthOS Phase 16 Legacy Gateway Tail Fallback
on:
  push:
    branches: [main]
    paths:
      - 'growthos-phase16-ops/*legacy-gateway-tail-fallback*.json'
      - 'scripts/k20_growthos_phase16_legacy_gateway_tail_fallback.py'
      - '.github/workflows/k20-growthos-phase16-legacy-gateway-tail-fallback.yml'
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: k20-growthos-phase16-legacy-gateway-tail-fallback
  cancel-in-progress: false
jobs:
  repair-audit:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - run: python -m py_compile scripts/k20_growthos_phase16_legacy_gateway_tail_fallback.py scripts/k20_growthos_phase16_editorial_trust.py
      - run: python scripts/k20_growthos_phase16_legacy_gateway_tail_fallback.py
      - run: python scripts/k20_growthos_phase16_editorial_trust.py
      - if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase16-results/legacy-gateway-tail-fallback.json growthos-phase16-results/summary.json growthos-phase16-results/editorial-contract-audit.json growthos-phase16-results/post-trust-audit.json growthos-phase16-results/legacy-backlog.json || true
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "growthos phase16: record legacy gateway tail fallback and audit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
