name: K20 Calculator Handle Map Lite
on:
  push:
    branches: [main]
    paths: ['.github/workflows/k20-calculator-handle-map-lite.yml']
permissions:
  contents: write
jobs:
  map:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - shell: bash
        run: |
          set -euo pipefail
          curl -fsSL --max-time 45 -A 'Mozilla/5.0' 'https://keshavarz20.com/drip-tape-length-fittings-calculator/?LSCWP_CTRL=before_optm' -o /tmp/before.html
          python3 - <<'PY'
          import json,re,os
          h=open('/tmp/before.html',encoding='utf8',errors='replace').read()
          normal_url='https://keshavarz20.com/drip-tape-length-fittings-calculator/'
          import urllib.request
          rq=urllib.request.Request(normal_url,headers={'User-Agent':'Mozilla/5.0'})
          with urllib.request.urlopen(rq,timeout=45) as rr:
              normal=rr.read().decode('utf8','replace')
          preloads=[]
          for tag in re.findall(r'<link\b[^>]*>',normal,re.I):
              rel_m=re.search(r'rel=["\']([^"\']+)["\']',tag,re.I)
              if rel_m and 'preload' in rel_m.group(1).lower():
                  preloads.append(tag)
          css=[]
          for tag in re.findall(r'<link\b[^>]*>',h,re.I):
              href=re.search(r'href=["\']([^"\']+)["\']',tag,re.I)
              rel=re.search(r'rel=["\']([^"\']+)["\']',tag,re.I)
              if not href or not (('stylesheet' in ((rel.group(1) if rel else '').lower())) or '.css' in href.group(1)): continue
              tid=re.search(r'id=["\']([^"\']+)["\']',tag,re.I)
              css.append({'id':tid.group(1) if tid else None,'href':href.group(1),'tag':tag})
          js=[]
          for tag in re.findall(r'<script\b[^>]*>',h,re.I):
              src=re.search(r'src=["\']([^"\']+)["\']',tag,re.I)
              if not src: continue
              tid=re.search(r'id=["\']([^"\']+)["\']',tag,re.I)
              js.append({'id':tid.group(1) if tid else None,'src':src.group(1),'tag':tag})
          os.makedirs('diagnostics',exist_ok=True)
          open('diagnostics/calculator-before-optm-handles.json','w',encoding='utf8').write(json.dumps({'preloads':preloads,'stylesheets':css,'scripts':js},ensure_ascii=False,indent=2))
          PY
      - shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add diagnostics/calculator-before-optm-handles.json
          git commit -m "diag: record calculator original asset handles" || exit 0
          for attempt in 1 2 3; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1

# post-safe-patch verification trigger 2026-09-29
