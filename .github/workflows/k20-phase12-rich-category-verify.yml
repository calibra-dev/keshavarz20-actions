name: K20 Phase 12 Rich Category Verify

on:
  push:
    branches: [main]
    paths:
      - 'phase12-rich-verify-ops/*.json'
      - 'scripts/k20_phase12_rich_category_verify.py'
      - '.github/workflows/k20-phase12-rich-category-verify.yml'

permissions:
  contents: write

concurrency:
  group: k20-phase12-rich-category-verify
  cancel-in-progress: false

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: python -m pip install requests
      - run: python scripts/k20_phase12_rich_category_verify.py
      - name: Commit verification
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f phase12-results/rich-category-verify-20261001.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "phase12: record rich category verification"
          git pull --rebase origin main
          git push origin main
