name: Keshavarz20 Content Media Summary

on:
  push:
    branches: [main]
    paths:
      - 'content-media-summary-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-content-media-summary
  cancel-in-progress: false

jobs:
  summarize:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Validate Python
        run: python -m py_compile scripts/k20_content_media_summary.py
      - name: Build compact content reference summary
        run: python scripts/k20_content_media_summary.py
      - name: Commit summary
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f content-media-results/summary.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "media: record compact content reference summary"
          git pull --rebase origin main
          git push origin HEAD:main
