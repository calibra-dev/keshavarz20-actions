name: K20 Refund Yoast Meta Description Fix

on:
  push:
    branches: [main]
    paths:
      - 'refund-seo-fix-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k20-refund-yoast-metadesc-fix
  cancel-in-progress: false

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - name: Guarded bridge update and live verification
        shell: pwsh
        run: |
          $ErrorActionPreference = 'Stop'
          foreach ($name in 'WP_BASE_URL','WP_USERNAME','WP_APP_PASSWORD') {
            if ([string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($name))) { throw "Missing required secret: $name" }
          }
          $event = Get-Content -Raw -LiteralPath $env:GITHUB_EVENT_PATH | ConvertFrom-Json
          $requests = @($event.commits | ForEach-Object { @($_.added) + @($_.modified) } | Where-Object { $_ -and $_.StartsWith('refund-seo-fix-ops/') -and $_.EndsWith('.json') } | Sort-Object -Unique)
          if ($requests.Count -eq 0) { $requests = @(& git diff --name-only HEAD^ HEAD -- 'refund-seo-fix-ops/*.json' | Where-Object { $_ }) }
          if ($requests.Count -ne 1) { throw "Expected exactly one refund SEO fix request, found $($requests.Count)." }
          $req = Get-Content -Raw -LiteralPath $requests[0] | ConvertFrom-Json -Depth 20
          if ([string]$req.action -ne 'refund.yoast_metadesc_fix' -or [int]$req.id -ne 13) { throw 'Request is not the guarded Page 13 SEO action.' }
          $newDesc = [string]$req.new_description
          if ([string]::IsNullOrWhiteSpace($newDesc) -or $newDesc.Length -lt 80 -or $newDesc.Length -gt 180) { throw 'Meta description length guard failed.' }

          $base = $env:WP_BASE_URL.TrimEnd('/')
          $endpoint = "$base/wp-json/keshavarz20-ops/v2/execute"
          $authText = "$($env:WP_USERNAME):$($env:WP_APP_PASSWORD)"
          $auth = [Convert]::ToBase64String([Text.Encoding]::UTF8.GetBytes($authText))
          $headers = @{ Authorization = "Basic $auth"; Accept = 'application/json' }
          function Invoke-Bridge([hashtable]$Payload) {
            $body = $Payload | ConvertTo-Json -Depth 20 -Compress
            $r = Invoke-WebRequest -Uri $endpoint -Method Post -Headers $headers -ContentType 'application/json; charset=utf-8' -Body ([Text.Encoding]::UTF8.GetBytes($body)) -TimeoutSec 180 -SkipHttpErrorCheck
            $parsed = $null
            try { $parsed = $r.Content | ConvertFrom-Json -Depth 50 } catch { $parsed = [pscustomobject]@{} }
            return [pscustomobject]@{ status=[int]$r.StatusCode; body=$parsed }
          }
          function HashText([string]$Text) {
            if ($null -eq $Text) { $Text = '' }
            $sha=[Security.Cryptography.SHA256]::Create()
            try { return ([BitConverter]::ToString($sha.ComputeHash([Text.Encoding]::UTF8.GetBytes($Text)))).Replace('-','').ToLowerInvariant() }
            finally { $sha.Dispose() }
          }
          function LiveDescription() {
            $stamp=[DateTimeOffset]::UtcNow.ToUnixTimeMilliseconds()
            $r=Invoke-WebRequest -Uri "$base/refund_returns/?k20_metadesc=$stamp" -Headers @{'Cache-Control'='no-cache';'Pragma'='no-cache';'User-Agent'='K20-Refund-Meta-Fix/1.0'} -Method Get -TimeoutSec 180 -SkipHttpErrorCheck
            $text=[string]$r.Content
            $m=[regex]::Match($text,'(?is)<meta\b[^>]*name=["'']description["''][^>]*content=["'']([^"'']*)["''][^>]*>|<meta\b[^>]*content=["'']([^"'']*)["''][^>]*name=["'']description["''][^>]*>')
            $value=''
            if ($m.Success) { $value = if ($m.Groups[1].Success) { $m.Groups[1].Value } else { $m.Groups[2].Value }; $value=[Net.WebUtility]::HtmlDecode($value).Trim() }
            return [pscustomobject]@{ status=[int]$r.StatusCode; value=$value }
          }

          New-Item -ItemType Directory -Force results | Out-Null
          $result=[ordered]@{ok=$false;action='refund.yoast_metadesc_fix';page_id=13;request_file=$requests[0];started_at_utc=[DateTime]::UtcNow.ToString('o');write_attempted=$false;rollback_attempted=$false}
          $oldDesc=''
          try {
            $pre=Invoke-Bridge @{mode='inspect';resource='page';id=13;changes=@{}}
            if ($pre.status -lt 200 -or $pre.status -ge 300 -or -not $pre.body.ok -or -not $pre.body.before) { throw "Pre-inspect failed HTTP $($pre.status)" }
            $b=$pre.body.before
            if ([string]$b.status -ne 'publish') { throw 'Page 13 is not published.' }
            $oldDesc=[string]$b.yoast_metadesc
            if (-not [string]::IsNullOrWhiteSpace($oldDesc)) { throw 'Guard failed: current Yoast metadesc is no longer empty.' }
            $guards=[ordered]@{title=HashText([string]$b.title);content=HashText([string]$b.content);excerpt=HashText([string]$b.excerpt);slug=[string]$b.slug;status=[string]$b.status}
            $result.prewrite=[ordered]@{http=$pre.status;old_metadesc_empty=$true;slug=$guards.slug;status=$guards.status;title_sha256=$guards.title;content_sha256=$guards.content;excerpt_sha256=$guards.excerpt}

            $write=Invoke-Bridge @{mode='update';resource='page';id=13;changes=@{yoast_metadesc=$newDesc}}
            $result.write_attempted=$true; $result.write_http=$write.status; $result.write_ok=[bool]$write.body.ok; $result.write_code=[string]$write.body.code; $result.write_message=([string]$write.body.message).Substring(0,[Math]::Min(300,([string]$write.body.message).Length))
            if ($write.status -lt 200 -or $write.status -ge 300 -or -not $write.body.ok) { throw "Bridge update failed HTTP $($write.status) code=$([string]$write.body.code)" }

            $rb=Invoke-Bridge @{mode='inspect';resource='page';id=13;changes=@{}}
            if ($rb.status -lt 200 -or $rb.status -ge 300 -or -not $rb.body.ok -or -not $rb.body.before) { throw 'Readback inspect failed.' }
            $a=$rb.body.before
            $otherSame=((HashText([string]$a.title) -eq $guards.title) -and (HashText([string]$a.content) -eq $guards.content) -and (HashText([string]$a.excerpt) -eq $guards.excerpt) -and ([string]$a.slug -eq $guards.slug) -and ([string]$a.status -eq $guards.status))
            $metaSame=([string]$a.yoast_metadesc -ceq $newDesc)
            $result.readback=[ordered]@{http=$rb.status;metadesc_exact=$metaSame;other_guarded_fields_unchanged=$otherSame;description_length=([string]$a.yoast_metadesc).Length}
            if (-not $metaSame -or -not $otherSame) { throw 'Bridge readback guard failed.' }

            Start-Sleep -Seconds 3
            $live=LiveDescription
            $liveExact=($live.status -eq 200 -and $live.value -ceq $newDesc)
            $result.live=[ordered]@{http=$live.status;description_exact=$liveExact;description_length=$live.value.Length}
            if (-not $liveExact) { throw 'Live HTML meta description verification failed.' }
            $result.ok=$true
          }
          catch {
            $result.error="$($_.Exception.GetType().Name): $($_.Exception.Message)"
            if ($result.write_attempted -and -not $result.ok) {
              try {
                $roll=Invoke-Bridge @{mode='update';resource='page';id=13;changes=@{yoast_metadesc=$oldDesc}}
                $result.rollback_attempted=$true; $result.rollback_http=$roll.status; $result.rollback_ok=($roll.status -ge 200 -and $roll.status -lt 300 -and [bool]$roll.body.ok)
              } catch { $result.rollback_attempted=$true; $result.rollback_ok=$false }
            }
          }
          finally {
            $result.finished_at_utc=[DateTime]::UtcNow.ToString('o')
            $out="results/$([IO.Path]::GetFileNameWithoutExtension($requests[0])).json"
            $result | ConvertTo-Json -Depth 20 | Set-Content -LiteralPath $out -Encoding utf8
            Write-Host "REFUND_META_FIX ok=$($result.ok) write_http=$($result.write_http) rollback=$($result.rollback_ok)"
          }
          if (-not $result.ok) { exit 2 }
      - name: Commit sanitized evidence
        if: always()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f results/*.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "seo: record guarded refund meta description fix"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt * 2))
          done
          exit 1
