name: K20 GrowthOS Remaining Brand Five Taxonomy Preflight
on:
  push:
    branches: [main]
    paths:
      - 'growthos-brand-five-taxonomy-ops/*.json'
permissions:
  contents: write
jobs:
  inspect:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with: {fetch-depth: 2}
      - uses: actions/setup-python@v5
        with: {python-version: '3.12'}
      - run: python -m pip install requests
      - name: Read five product brand attributes and brand terms
        shell: python
        run: |
          import json, os, pathlib, requests
          ids=[135383,139231,139232,140406,140407]
          base=os.environ['WP_BASE_URL'].rstrip('/')
          s=requests.Session(); s.auth=(os.environ['WP_USERNAME'],os.environ['WP_APP_PASSWORD'])
          products=[]
          for pid in ids:
              r=s.get(f"{base}/wp-json/wc/v3/products/{pid}",timeout=90); r.raise_for_status()
              p=r.json()
              attrs=[]
              for a in p.get('attributes') or []:
                  attrs.append({'id':a.get('id'),'name':a.get('name'),'options':a.get('options'),'visible':a.get('visible'),'variation':a.get('variation')})
              products.append({'id':pid,'name':p.get('name'),'sku':p.get('sku'),'brands':p.get('brands') or [],'attributes':attrs})
          terms=[]
          for page in range(1,10):
              r=s.get(base+'/wp-json/wc/v3/products/brands',params={'per_page':100,'page':page},timeout=90)
              if r.status_code==404:
                  break
              if r.status_code==400 and page>1: break
              r.raise_for_status()
              rows=r.json()
              if not isinstance(rows,list) or not rows: break
              terms += [{'id':x.get('id'),'name':x.get('name'),'slug':x.get('slug'),'count':x.get('count')} for x in rows]
              if len(rows)<100: break
          out={'products':products,'brand_terms':terms}
          pathlib.Path('growthos-phase3-results').mkdir(exist_ok=True)
          pathlib.Path('growthos-phase3-results/remaining-brand-five-taxonomy-preflight.json').write_text(json.dumps(out,ensure_ascii=False,indent=2),encoding='utf-8')
          print(json.dumps({'products':products,'brand_terms':terms},ensure_ascii=False))
      - name: Commit sanitized preflight
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f growthos-phase3-results/remaining-brand-five-taxonomy-preflight.json
          git diff --cached --quiet && exit 0
          git commit -m "growthos phase3: record remaining five brand taxonomy preflight"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main && git push origin HEAD:main && exit 0
            git rebase --abort >/dev/null 2>&1 || true
            sleep $((attempt*2))
          done
          exit 1
