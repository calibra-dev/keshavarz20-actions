name: K21 Top30 Remediation Prepare

on:
  push:
    branches: [main]
    paths:
      - 'k21-top30-ops/*.json'

permissions:
  contents: write

concurrency:
  group: k21-top30-remediation-prepare
  cancel-in-progress: false

jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install dependencies
        shell: bash
        run: |
          set -euo pipefail
          sudo apt-get update -qq
          sudo apt-get install -y fonts-dejavu-core
          python -m pip install requests pillow arabic-reshaper python-bidi
      - name: Require family video evidence
        shell: bash
        run: test -s phase15-video-results/k21-top30-family-videos.json
      - name: Prepare human-first Top30 wave
        shell: bash
        run: python scripts/k21_top30_prepare_wave.py
      - name: Commit Bridge dry-runs and provenance
        shell: bash
        run: |
          set -euo pipefail
          rm -rf /tmp/k21-wave
          mkdir -p /tmp/k21-wave/bridge-v3-ops /tmp/k21-wave/geo-aeo-results
          cp bridge-v3-ops/20260923-k21-top30-*-dryrun.json /tmp/k21-wave/bridge-v3-ops/
          cp geo-aeo-results/k21-top30-wave-evidence.json /tmp/k21-wave/geo-aeo-results/
          git fetch origin main
          git reset --hard origin/main
          cp /tmp/k21-wave/bridge-v3-ops/*.json bridge-v3-ops/
          cp /tmp/k21-wave/geo-aeo-results/*.json geo-aeo-results/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f bridge-v3-ops/20260923-k21-top30-*-dryrun.json geo-aeo-results/k21-top30-wave-evidence.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "k21: prepare Top30 human-first remediation dry-runs"
          git push origin HEAD:main
