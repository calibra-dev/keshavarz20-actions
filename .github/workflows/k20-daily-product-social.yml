name: K20 Approved Product Social Pipeline

on:
  pull_request:
    paths:
      - '.github/workflows/k20-daily-product-social.yml'
      - 'product-social-engine/**'
  schedule:
    # Tehran is UTC+03:30 year-round.
    # Prepare 15 minutes before the 23:00 ChatGPT preview.
    - cron: '15 19 * * *'
    # Approved morning publication windows.
    - cron: '15 5 * * *'
    - cron: '20 5 * * *'
    - cron: '25 5 * * *'
  workflow_dispatch:
    inputs:
      action:
        description: prepare | status | whatsapp | telegram | instagram
        required: true
        default: status
        type: choice
        options:
          - status
          - prepare
          - whatsapp
          - telegram
          - instagram
      publish_date:
        description: Optional Tehran publish date YYYY-MM-DD
        required: false
        default: ''

permissions:
  contents: write

concurrency:
  group: k20-approved-product-social-${{ github.ref }}
  cancel-in-progress: false

env:
  SITE_BASE_URL: https://keshavarz20.com
  TZ: Asia/Tehran
  PYTHONUNBUFFERED: '1'
  TELEGRAM_CHAT_ID: '@keshavarz_20'
  META_GRAPH_VERSION: v25.0

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: product-social-engine/requirements.txt

      - run: python -m pip install -r product-social-engine/requirements.txt

      - name: Compile and test
        working-directory: product-social-engine
        run: |
          python -m py_compile main.py approval_pipeline.py
          pytest -q

  operate:
    if: github.event_name != 'pull_request'
    needs: validate
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      WHATSAPP_ACCESS_TOKEN: ${{ secrets.WHATSAPP_ACCESS_TOKEN }}
      WHATSAPP_PHONE_NUMBER_ID: ${{ secrets.WHATSAPP_PHONE_NUMBER_ID }}
      WHATSAPP_GROUP_ID: ${{ secrets.WHATSAPP_GROUP_ID }}
      INSTAGRAM_ACCESS_TOKEN: ${{ secrets.INSTAGRAM_ACCESS_TOKEN }}
      INSTAGRAM_USER_ID: ${{ secrets.INSTAGRAM_USER_ID }}
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: product-social-engine/requirements.txt

      - run: python -m pip install -r product-social-engine/requirements.txt

      - name: Resolve requested action
        id: resolve
        shell: bash
        env:
          MANUAL_ACTION: ${{ inputs.action }}
          MANUAL_DATE: ${{ inputs.publish_date }}
        run: |
          set -euo pipefail
          action=""
          publish_date="${MANUAL_DATE:-}"

          if [[ "${GITHUB_EVENT_NAME}" == "workflow_dispatch" ]]; then
            action="${MANUAL_ACTION:-status}"
          else
            case "${{ github.event.schedule }}" in
              '15 19 * * *') action='prepare' ;;
              '15 5 * * *') action='whatsapp' ;;
              '20 5 * * *') action='telegram' ;;
              '25 5 * * *') action='instagram' ;;
              *) echo 'Unknown schedule'; exit 3 ;;
            esac
          fi

          echo "action=$action" >> "$GITHUB_OUTPUT"
          echo "publish_date=$publish_date" >> "$GITHUB_OUTPUT"
          echo "Resolved action: $action date=${publish_date:-auto}"

      - name: Run approved social engine
        shell: bash
        run: |
          set -euo pipefail
          args=("${{ steps.resolve.outputs.action }}")
          if [[ -n "${{ steps.resolve.outputs.publish_date }}" ]]; then
            args+=(--publish-date "${{ steps.resolve.outputs.publish_date }}")
          fi
          python product-social-engine/approval_pipeline.py "${args[@]}"

      - name: Upload preview/result package
        if: always() && hashFiles('product-social-engine/out/latest.json') != ''
        uses: actions/upload-artifact@v4
        with:
          name: k20-approved-social-${{ steps.resolve.outputs.action }}-${{ github.run_id }}
          if-no-files-found: ignore
          retention-days: 14
          path: |
            product-social-engine/out/latest.json
            product-social-engine/out/caption.txt
            product-social-engine/out/daily-product-ad.png
            product-social-engine/out/daily-product-story.jpg

      - name: Persist prepared candidate
        if: steps.resolve.outputs.action == 'prepare' && success()
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "k20-product-social-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-social-engine/pending/*.json
          if git diff --cached --quiet; then
            echo 'Candidate already identical; nothing to commit.'
            exit 0
          fi
          git commit -m "social: prepare approved product candidate"
          git pull --rebase origin main
          git push origin HEAD:main

      - name: Persist successful channel state
        if: contains(fromJSON('["whatsapp","telegram","instagram"]'), steps.resolve.outputs.action) && success()
        shell: bash
        run: |
          set -euo pipefail
          if git diff --quiet -- product-social-engine/state.json; then
            echo 'No state change to persist.'
            exit 0
          fi
          git config user.name "k20-product-social-bot"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add product-social-engine/state.json
          git commit -m "social: record approved channel publication"
          git pull --rebase origin main
          git push origin HEAD:main
