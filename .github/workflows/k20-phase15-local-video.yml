name: K20 Phase15 Local Video Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-phase15-local-video.yml'
      - 'phase15-video-engine/**'
  pull_request:
    paths:
      - '.github/workflows/k20-phase15-local-video.yml'
      - 'phase15-video-engine/**'
      - 'phase2/video-program/**'
  workflow_dispatch:
    inputs:
      action:
        description: health | episode | batch | package
        required: true
        default: health
        type: choice
        options:
          - health
          - episode
          - batch
          - package
      episode:
        description: Episode number for action=episode
        required: false
        default: '1'
      start:
        description: First episode for batch/package
        required: false
        default: '1'
      end:
        description: Last episode for batch/package
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: k20-phase15-video-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  K20_SITE_BASE_URL: https://keshavarz20.com

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: phase15-video-engine/requirements.txt
      - run: python -m pip install -r phase15-video-engine/requirements.txt
      - name: Compile and unit test
        run: |
          python -m py_compile phase15-video-engine/k20_video_engine.py
          python -m pytest -q phase15-video-engine/test_engine.py

  render:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: [self-hosted, Windows, X64, k20-video, gpu]
    timeout-minutes: 240
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap Python 3.12
        run: |
          python --version >nul 2>&1
          if errorlevel 1 (
            echo Python missing; installing private portable runtime...
            curl.exe -L --fail --retry 3 -o "%RUNNER_TEMP%\python-3.12.10-amd64.exe" "https://www.python.org/ftp/python/3.12.10/python-3.12.10-amd64.exe"
            "%RUNNER_TEMP%\python-3.12.10-amd64.exe" /quiet InstallAllUsers=0 TargetDir="%RUNNER_TEMP%\k20-python" Include_pip=1 Include_test=0 Include_launcher=0 PrependPath=0 Shortcuts=0
            if errorlevel 1 exit /b 1
            echo %RUNNER_TEMP%\k20-python>>"%GITHUB_PATH%"
            echo %RUNNER_TEMP%\k20-python\Scripts>>"%GITHUB_PATH%"
            "%RUNNER_TEMP%\k20-python\python.exe" --version
          ) else (
            python --version
          )

      - name: Bootstrap FFmpeg
        run: |
          ffmpeg -version >nul 2>&1
          if errorlevel 1 (
            echo FFmpeg missing; installing private portable runtime...
            curl.exe -L --fail --retry 3 -o "%RUNNER_TEMP%\ffmpeg.zip" "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
            if exist "%RUNNER_TEMP%\k20-ffmpeg" rmdir /s /q "%RUNNER_TEMP%\k20-ffmpeg"
            mkdir "%RUNNER_TEMP%\k20-ffmpeg"
            tar.exe -xf "%RUNNER_TEMP%\ffmpeg.zip" -C "%RUNNER_TEMP%\k20-ffmpeg"
            if errorlevel 1 exit /b 1
            for /d %%D in ("%RUNNER_TEMP%\k20-ffmpeg\ffmpeg-*") do echo %%D\bin>>"%GITHUB_PATH%"
          ) else (
            ffmpeg -version
          )

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r phase15-video-engine/requirements.txt

      - name: Health
        if: github.event_name == 'push' || inputs.action == 'health'
        run: python phase15-video-engine/k20_video_engine.py health

      - name: Render one episode
        if: inputs.action == 'episode'
        run: python phase15-video-engine/k20_video_engine.py render --episode ${{ inputs.episode }}

      - name: Render batch
        if: inputs.action == 'batch'
        run: python phase15-video-engine/k20_video_engine.py batch --start ${{ inputs.start }} --end ${{ inputs.end }}

      - name: Package validation
        if: inputs.action == 'package'
        run: python phase15-video-engine/k20_video_engine.py package --start ${{ inputs.start }} --end ${{ inputs.end }}

      - name: Upload render artifacts
        if: always() && github.event_name == 'workflow_dispatch'
        uses: actions/upload-artifact@v4
        with:
          name: k20-phase15-video-${{ inputs.action }}-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            phase15-video-engine/out/**/*.mp4
            phase15-video-engine/out/**/*.jpg
            phase15-video-engine/out/**/*.srt
            phase15-video-engine/out/**/*.txt
            phase15-video-engine/out/**/*.json
