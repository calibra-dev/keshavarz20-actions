name: K20 Phase15 Local Video Engine

on:
  push:
    branches: [main]
    paths:
      - '.github/workflows/k20-phase15-local-video.yml'
      - 'phase15-video-engine/**'
  pull_request:
    paths:
      - '.github/workflows/k20-phase15-local-video.yml'
      - 'phase15-video-engine/**'
      - 'phase2/video-program/**'
  workflow_dispatch:
    inputs:
      action:
        description: health | episode | batch | package
        required: true
        default: health
        type: choice
        options:
          - health
          - episode
          - batch
          - package
      episode:
        description: Episode number for action=episode
        required: false
        default: '1'
      start:
        description: First episode for batch/package
        required: false
        default: '1'
      end:
        description: Last episode for batch/package
        required: false
        default: '20'

permissions:
  contents: read

concurrency:
  group: k20-phase15-video-${{ github.ref }}
  cancel-in-progress: false

env:
  PYTHONUNBUFFERED: '1'
  PYTHONUTF8: '1'
  PYTHONIOENCODING: utf-8
  K20_SITE_BASE_URL: https://keshavarz20.com

jobs:
  validate:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: pip
          cache-dependency-path: phase15-video-engine/requirements.txt
      - run: python -m pip install -r phase15-video-engine/requirements.txt
      - name: Compile and unit test
        run: |
          python -m py_compile phase15-video-engine/k20_video_engine.py
          python -m pytest -q phase15-video-engine/test_engine.py

  render:
    if: github.event_name == 'workflow_dispatch' || github.event_name == 'push'
    needs: validate
    runs-on: [self-hosted, Windows, X64, k20-video, gpu]
    timeout-minutes: 240
    defaults:
      run:
        shell: cmd
    steps:
      - uses: actions/checkout@v4

      - name: Bootstrap persistent Python 3.12
        run: |
          set "K20_PY=C:\actions-runner\k20-runtime\python"
          if not exist "%K20_PY%\python.exe" (
            echo Python runtime missing; installing portable embedded runtime...
            if not exist "C:\actions-runner\k20-runtime" mkdir "C:\actions-runner\k20-runtime"
            if exist "%K20_PY%" rmdir /s /q "%K20_PY%"
            mkdir "%K20_PY%"
            curl.exe -L --fail --retry 3 -o "%RUNNER_TEMP%\python-embed.zip" "https://www.python.org/ftp/python/3.12.10/python-3.12.10-embed-amd64.zip"
            tar.exe -xf "%RUNNER_TEMP%\python-embed.zip" -C "%K20_PY%"
            if errorlevel 1 exit /b 1
            powershell.exe -NoProfile -ExecutionPolicy Bypass -Command "(Get-Content '%K20_PY%\python312._pth') -replace '#import site','import site' | Set-Content -Encoding ASCII '%K20_PY%\python312._pth'"
            curl.exe -L --fail --retry 3 -o "%RUNNER_TEMP%\get-pip.py" "https://bootstrap.pypa.io/get-pip.py"
            "%K20_PY%\python.exe" "%RUNNER_TEMP%\get-pip.py"
            if errorlevel 1 exit /b 1
          )
          echo %K20_PY%>>"%GITHUB_PATH%"
          echo %K20_PY%\Scripts>>"%GITHUB_PATH%"
          "%K20_PY%\python.exe" --version
          "%K20_PY%\python.exe" -m pip --version

      - name: Bootstrap persistent FFmpeg
        run: |
          set "K20_FFROOT=C:\actions-runner\k20-runtime\ffmpeg"
          if not exist "%K20_FFROOT%\bin\ffmpeg.exe" (
            echo FFmpeg runtime missing; installing portable runtime...
            if not exist "C:\actions-runner\k20-runtime" mkdir "C:\actions-runner\k20-runtime"
            if exist "%K20_FFROOT%" rmdir /s /q "%K20_FFROOT%"
            mkdir "%K20_FFROOT%"
            curl.exe -L --fail --retry 3 -o "%RUNNER_TEMP%\ffmpeg.zip" "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip"
            if exist "%RUNNER_TEMP%\k20-ffmpeg-extract" rmdir /s /q "%RUNNER_TEMP%\k20-ffmpeg-extract"
            mkdir "%RUNNER_TEMP%\k20-ffmpeg-extract"
            tar.exe -xf "%RUNNER_TEMP%\ffmpeg.zip" -C "%RUNNER_TEMP%\k20-ffmpeg-extract"
            if errorlevel 1 exit /b 1
            for /d %%D in ("%RUNNER_TEMP%\k20-ffmpeg-extract\ffmpeg-*") do xcopy /E /I /Y "%%D\*" "%K20_FFROOT%\" >nul
          )
          echo %K20_FFROOT%\bin>>"%GITHUB_PATH%"
          "%K20_FFROOT%\bin\ffmpeg.exe" -version

      - name: Install Python dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r phase15-video-engine/requirements.txt

      - name: Health
        if: github.event_name == 'push' || inputs.action == 'health'
        run: python phase15-video-engine/k20_video_engine.py health

      - name: Render full Phase15 batch
        if: github.event_name == 'push'
        run: python phase15-video-engine/k20_video_engine.py batch --start 1 --end 20

      - name: Validate full Phase15 package
        if: github.event_name == 'push'
        run: python phase15-video-engine/k20_video_engine.py package --start 1 --end 20

      - name: Render one episode
        if: github.event_name == 'workflow_dispatch' && inputs.action == 'episode'
        run: python phase15-video-engine/k20_video_engine.py render --episode ${{ inputs.episode }}

      - name: Render batch
        if: inputs.action == 'batch'
        run: python phase15-video-engine/k20_video_engine.py batch --start ${{ inputs.start }} --end ${{ inputs.end }}

      - name: Package validation
        if: inputs.action == 'package'
        run: python phase15-video-engine/k20_video_engine.py package --start ${{ inputs.start }} --end ${{ inputs.end }}

      - name: Persist render output on Windows host
        if: always()
        run: |
          if exist phase15-video-engine\out (
            if not exist "C:\actions-runner\k20-output\run-${{ github.run_id }}" mkdir "C:\actions-runner\k20-output\run-${{ github.run_id }}"
            xcopy /E /I /Y "phase15-video-engine\out\*" "C:\actions-runner\k20-output\run-${{ github.run_id }}\" >nul
            echo Persistent output: C:\actions-runner\k20-output\run-${{ github.run_id }}
          )

      - name: Upload render artifacts
        if: always()
        continue-on-error: true
        uses: actions/upload-artifact@v4
        with:
          name: k20-phase15-video-${{ github.run_id }}
          if-no-files-found: warn
          retention-days: 14
          path: |
            phase15-video-engine/out/**/*.mp4
            phase15-video-engine/out/**/*.jpg
            phase15-video-engine/out/**/*.srt
            phase15-video-engine/out/**/*.txt
            phase15-video-engine/out/**/*.json
