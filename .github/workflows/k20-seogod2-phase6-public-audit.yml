name: SEO God2 Phase 6 Public Recommendation Audit

on:
  push:
    branches: [main]
    paths:
      - 'seo-god2-phase6-public-audit-ops/*.json'
      - 'scripts/k20_seogod2_phase6_public_recommendation_audit.py'
      - '.github/workflows/k20-seogod2-phase6-public-audit.yml'
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: k20-seogod2-phase6-public-audit
  cancel-in-progress: true

jobs:
  audit:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    env:
      WP_BASE_URL: ${{ secrets.WP_BASE_URL }}
      WP_USERNAME: ${{ secrets.WP_USERNAME }}
      WP_APP_PASSWORD: ${{ secrets.WP_APP_PASSWORD }}
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 2
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Compile
        run: python -m py_compile scripts/k20_seogod2_phase6_public_recommendation_audit.py
      - name: Audit Tier A recommendations and rendered pages
        run: python scripts/k20_seogod2_phase6_public_recommendation_audit.py
      - name: Commit audit report
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -f seo-god2/phase6-public-recommendation-audit-20260930.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "seo god2 phase6: record public recommendation audit"
          for attempt in 1 2 3 4 5; do
            git pull --rebase origin main || true
            if git push origin HEAD:main; then exit 0; fi
            sleep $((attempt*2))
          done
          exit 1
      - name: Enforce public recommendation acceptance
        shell: python
        run: |
          import json
          from pathlib import Path
          r=json.loads(Path("seo-god2/phase6-public-recommendation-audit-20260930.json").read_text(encoding="utf-8"))
          m=r["metrics"]
          assert m["tier_a_products"] == 20
          assert m["explicit_recommendation_fields_nonempty"] == 0
          assert m["public_recommendation_sections_present"] == 0
          assert m["physical_marker_missing"] == 0
          assert m["fertilizer_marker_unexpected"] == 0
          assert m["public_non_200"] == 0
          print("PHASE6_PUBLIC_ACCEPTANCE_OK", m)
